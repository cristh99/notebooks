name: Data Science dominance — one-shot TabArena Fresh-12 versus current leaders

on:
  push:
    branches:
      - agent/data-science-dominance-tabarena
    paths:
      - '.github/workflows/data-science-dominance-tabarena-fresh12.yml'

permissions:
  contents: read

jobs:
  fresh12-dominance:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove workflow-only activation after the frozen source capsule
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = 'push'
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test "$(git rev-parse HEAD^)" = 'ab63733e6d1f629cfe4b9aed52cd50effdc73eb0'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/data-science-dominance-tabarena-fresh12.yml'
          echo "DOMINANCE_ACTIVATION_PARENT_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned CPU competitors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dominance-logs _logic_power_v10 /tmp/tabarena-portfolio
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'scipy==1.14.1' 'pandas==2.2.3' \
            'scikit-learn==1.5.2' 'openml==0.15.1' \
            'catboost==1.2.8' 'lightgbm==4.6.0' 'xgboost==3.1.3'
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --disable-pip-version-check \
            'einops>=0.7' 'psutil' 'tqdm>=4.64' 'huggingface-hub'
          python -m pip install --disable-pip-version-check --no-deps \
            'git+https://github.com/soda-inria/tabicl.git@46b91961db4f8873dd049ec09990698a435e1e29'
          python -m pip freeze | sort > dominance-logs/pip-freeze.txt

      - name: Reconstruct and audit the exact frozen portfolio before task access
        shell: bash
        run: |
          set -euo pipefail
          root='data_science_dominance/tabarena_portfolio'
          echo '8ab10e6c7f626fed3451a1382a492feb7e62a1c9318a9474e30ce24472c84754  data_science_dominance/tabarena_portfolio/SOURCE_MANIFEST.json' | sha256sum -c -
          echo 'c09eca0bed34ab52d276d2b911e43a81d19617ff5392e2123effaceb9fbe2f90  data_science_dominance/tabarena_portfolio/portfolio_code.tar.gz.b64' | sha256sum -c -
          base64 -d "$root/portfolio_code.tar.gz.b64" > /tmp/tabarena-portfolio.tar.gz
          echo '569c3293d1f0812c1d13642076ff73f66068123f34d279571bc3a6b083f9fbab  /tmp/tabarena-portfolio.tar.gz' | sha256sum -c -
          tar xzf /tmp/tabarena-portfolio.tar.gz -C "$root"
          echo 'ff77eb2e5ce1957303c07f76a0d9ad278622fc4f1504455b322a533d466d455d  data_science_dominance/tabarena_portfolio/dominance.py' | sha256sum -c -
          echo '57836001dfe10737e2df794b3f90925ceb4011e286a0e6e276a3f00f3d3e40d8  data_science_dominance/tabarena_portfolio/runner.py' | sha256sum -c -
          echo '813e08b837a2f7e888dbcedcd70467555c56eb1bb73180fcd364eef67f341caa  data_science_dominance/tabarena_portfolio/tasks.json' | sha256sum -c -
          echo '27e8db766c521cb3a3f779b5eaf79cc7a53c0909eda318fd28bdd70404b38d08  data_science_dominance/tabarena_portfolio/logic_plan.py' | sha256sum -c -
          echo 'b4e76e1867d4ebb204c35fa22a54a1d7f6a9044c30f888c3591c4bb864e4f6d4  data_science_dominance/tabarena_portfolio/test_portfolio.py' | sha256sum -c -
          echo '3cfbc56e992611fa3b9dc68ce371e4d796770bfc745febfb1d8390767915606d  data_science_dominance/tabarena_portfolio/README.md' | sha256sum -c -
          echo '6b0e275b6e60ec766ba5d8d19c27234c252bbcae22a3f7df6d0e3908f81e1c90  data_science_god_level/tabular_transfer/estimator.py' | sha256sum -c -
          python -m py_compile "$root"/{dominance,runner,logic_plan,test_portfolio}.py
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          root = Path('data_science_dominance/tabarena_portfolio')
          manifest = json.loads((root / 'SOURCE_MANIFEST.json').read_text())
          assert manifest['score_before'] == 465
          assert manifest['novelty_weight'] == 0
          assert manifest['benchmark']['task_count'] == 12
          assert manifest['benchmark']['data_values_accessed_before_freeze'] is False
          assert manifest['candidate_contract']['test_labels_access'] is False
          assert manifest['candidate_contract']['post_hoc_retuning_permitted'] is False
          tree = ast.parse((root / 'dominance.py').read_text())
          calls, names, strings = set(), set(), set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id)
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr)
              elif isinstance(node, ast.Name):
                  names.add(node.id)
              elif isinstance(node, ast.Attribute):
                  names.add(node.attr)
              elif isinstance(node, ast.Constant) and isinstance(node.value, str):
                  strings.add(node.value)
          assert not (calls & {'open','eval','exec','compile','system','popen','run','urlopen','request','read_csv','read_json'})
          assert not (names & {'requests','socket','subprocess','openml','y_test','test_labels','dataset_name'})
          source = (root / 'dominance.py').read_text()
          assert 'data_science_god_level' in source and 'tabular_transfer' in source and 'estimator.py' in source
          audit = {
              'schema': 'data-science-dominance/tabarena-static-audit/1',
              'candidate_task_values_accessed': False,
              'candidate_test_labels_access': False,
              'candidate_dataset_identifier_access': False,
              'candidate_network_or_process_access': False,
              'fixed_local_code_module_loading_only': True,
              'source_manifest_sha256': hashlib.sha256((root / 'SOURCE_MANIFEST.json').read_bytes()).hexdigest(),
              'dominance_sha256': hashlib.sha256((root / 'dominance.py').read_bytes()).hexdigest(),
              'legacy_estimator_sha256': hashlib.sha256(Path('data_science_god_level/tabular_transfer/estimator.py').read_bytes()).hexdigest(),
          }
          Path('dominance-logs/static-audit.json').write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n')
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY

      - name: Replay original Logic Power v10 and local tests before OpenML access
        shell: bash
        run: |
          set -euo pipefail
          cat logic_power_v10_capsule/parts/part_00.b64 \
              logic_power_v10_capsule/parts/part_01.b64 \
              logic_power_v10_capsule/parts/part_02.b64 \
              logic_power_v10_capsule/parts/part_03.b64 \
              logic_power_v10_capsule/parts/part_04.b64 \
              logic_power_v10_capsule/parts/part_05_00.b64 \
              logic_power_v10_capsule/parts/part_05_01.b64 \
              logic_power_v10_capsule/parts/part_05_02.b64 > /tmp/lp.b64
          echo '3548f31fcaa9696eabb063023c905fbb04a2b3db73c96df9f9ee8bc8e0c64fc1  /tmp/lp.b64' | sha256sum -c -
          base64 -d /tmp/lp.b64 > /tmp/lp.tar.gz
          echo 'ad2c363afb3fe20aa093565f278c690d423611e8270e9ad9b1491dbbdf218c31  /tmp/lp.tar.gz' | sha256sum -c -
          tar xzf /tmp/lp.tar.gz -C _logic_power_v10
          (cd _logic_power_v10 && sha256sum -c SOURCE_SHA256SUMS && test "$(cat PRIVATE_HEAD_SHA.txt)" = 'ba10d0edc7eb20d499d0481fda2537e782b6efb2')
          root='data_science_dominance/tabarena_portfolio'
          (cd "$root" && PYTHONPATH="${GITHUB_WORKSPACE}/_logic_power_v10" python logic_plan.py) \
            2>&1 | tee dominance-logs/logic-plan-output.txt
          (cd "$root" && PYTHONPATH="${GITHUB_WORKSPACE}/$root" python -m unittest -v test_portfolio.py) \
            2>&1 | tee dominance-logs/unit-tests.txt

      - name: Smoke-test both TabICLv2 checkpoints before external task access
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          import numpy as np
          from tabicl import TabICLClassifier, TabICLRegressor

          rng = np.random.default_rng(20260804)
          X = rng.normal(size=(96, 6)).astype('float32')
          y_cls = (X[:, 0] + X[:, 1] > 0).astype(int)
          y_reg = X[:, 0] - 2 * X[:, 1] + 0.1 * rng.normal(size=len(X))
          started = time.perf_counter()
          clf = TabICLClassifier(n_estimators=1, batch_size=1, device='cpu', n_jobs=4, random_state=7, verbose=False)
          clf.fit(X[:72], y_cls[:72])
          cls = clf.predict_proba(X[72:])
          reg = TabICLRegressor(n_estimators=1, batch_size=1, device='cpu', n_jobs=4, random_state=7, verbose=False)
          reg.fit(X[:72], y_reg[:72])
          pred = reg.predict(X[72:])
          assert cls.shape == (24, 2) and np.all(np.isfinite(cls))
          assert pred.shape == (24,) and np.all(np.isfinite(pred))
          receipt = {
              'schema': 'data-science-dominance/tabiclv2-smoke/1',
              'classification_checkpoint_loaded': True,
              'regression_checkpoint_loaded': True,
              'external_task_values_accessed': False,
              'runtime_seconds': time.perf_counter() - started,
          }
          Path('dominance-logs/tabiclv2-smoke.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Run the first and only Fresh-12 external evaluation
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          HF_HUB_DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          set +e
          test "${GITHUB_RUN_ATTEMPT}" = '1' || exit 99
          root='data_science_dominance/tabarena_portfolio'
          PYTHONPATH="${GITHUB_WORKSPACE}/$root" python "$root/runner.py" \
            --output dominance-logs/fresh12-report.json \
            2>&1 | tee dominance-logs/runner-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > dominance-logs/runner-exit-status.txt
          exit 0

      - name: Seal chain of custody and dominance verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          logs = Path('dominance-logs')
          root = Path('data_science_dominance/tabarena_portfolio')
          report_path = logs / 'fresh12-report.json'
          report = json.loads(report_path.read_text()) if report_path.exists() else None
          runner_status = int((logs / 'runner-exit-status.txt').read_text().strip()) if (logs / 'runner-exit-status.txt').exists() else None
          actual = 1 if report is not None and runner_status == 0 else 0
          verdict = report['verdict'] if actual == 1 else 'INVALID_RUN'

          def digest(path):
              p = Path(path)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None

          receipt = {
              'schema': 'data-science-dominance/tabarena-fresh12-freeze/1',
              'verdict': verdict,
              'score_before': 465,
              'novelty_points': 0,
              'actual_external_evaluation_count': actual,
              'candidate_frozen_before_task_values': True,
              'post_hoc_retuning_permitted': False,
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'github_sha': os.environ['GITHUB_SHA'],
              'activation_parent_sha': os.environ.get('DOMINANCE_ACTIVATION_PARENT_SHA'),
              'runner_exit_status': runner_status,
              'summary': None if report is None else report['summary'],
              'checks': None if report is None else report['checks'],
              'hashes': {
                  'source_manifest_sha256': digest(root / 'SOURCE_MANIFEST.json'),
                  'source_archive_sha256': digest(root / 'portfolio_code.tar.gz.b64'),
                  'dominance_sha256': digest(root / 'dominance.py'),
                  'runner_sha256': digest(root / 'runner.py'),
                  'tasks_sha256': digest(root / 'tasks.json'),
                  'logic_plan_receipt_sha256': digest(root / 'logic-plan-receipt.json'),
                  'legacy_estimator_sha256': digest('data_science_god_level/tabular_transfer/estimator.py'),
                  'static_audit_sha256': digest(logs / 'static-audit.json'),
                  'tabiclv2_smoke_sha256': digest(logs / 'tabiclv2-smoke.json'),
                  'report_sha256': digest(report_path),
              },
          }
          payload = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          (logs / 'freeze-receipt.json').write_text(payload)
          (logs / 'freeze-receipt.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest() + '  freeze-receipt.json\n')
          print(payload)
          PY

      - name: Upload complete immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-dominance-tabarena-fresh12
          retention-days: 90
          path: |
            data_science_dominance/tabarena_portfolio/**
            data_science_god_level/tabular_transfer/estimator.py
            dominance-logs/**

      - name: Enforce the one-shot dominance verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('dominance-logs/freeze-receipt.json')
          if not path.exists():
              raise SystemExit('freeze receipt missing')
          receipt = json.loads(path.read_text())
          if receipt['actual_external_evaluation_count'] != 1:
              raise SystemExit('Fresh-12 evaluation invalid or incomplete; evidence preserved')
          if receipt['verdict'] != 'PASS':
              raise SystemExit(f"Fresh-12 dominance gate: {receipt['verdict']}; evidence preserved; no retuning")
          print('Fresh-12 dominance gate: PASS; no retuning permitted')
          PY
