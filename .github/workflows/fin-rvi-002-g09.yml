name: FIN-RVI-002 G09 — prior art and claim boundary

on:
  pull_request:
    branches:
      - agent/fin-rvi-002-stage1-public-data
      - main
    paths:
      - 'fin_rvi_002_g09/**'
      - 'G09_PRIOR_ART_MATRIX.md'
      - '.github/workflows/fin-rvi-002-g09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify bounded claim
        run: |
          python -m compileall -q fin_rvi_002_g09
          python -m unittest -v fin_rvi_002_g09.test_claim
          rm -rf reports/fin_rvi_002_g09
          python -m fin_rvi_002_g09.verify_claim
      - name: Reject premature promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('fin_rvi_002_g09/claim_contract.json')
          value = json.loads(source.read_text())
          value['status'] = 'PASS'
          Path('/tmp/premature.json').write_text(json.dumps(value))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          from fin_rvi_002_g09.verify_claim import verify
          value = json.loads(Path('/tmp/premature.json').read_text())
          errors = verify(value)
          if 'premature-pass' not in errors:
              raise SystemExit(f'premature pass accepted: {errors}')
          print(errors)
          PY
      - name: Upload receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-rvi-002-g09-claim-boundary
          path: reports/fin_rvi_002_g09/
          if-no-files-found: error
          retention-days: 90
