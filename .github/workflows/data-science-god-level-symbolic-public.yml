name: Data Science God-Level — prospective symbolic discovery public gate

on:
  push:
    branches:
      - agent/data-science-god-level-symbolic-discovery
    paths:
      - '.github/workflows/data-science-god-level-symbolic-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-symbolic-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned CPU environment
        run: |
          mkdir -p symbolic-public-logs _logic_power_v10
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'scikit-learn==1.5.2'
          python -m pip freeze | sort > symbolic-public-logs/pip-freeze.txt

      - name: Reconstruct and verify the frozen symbolic source capsule
        shell: bash
        run: |
          set -euo pipefail
          root='data_science_god_level/symbolic_discovery'
          base64 -d "$root/symbolic_code.tar.gz.b64" > /tmp/symbolic_code.tar.gz
          echo '026919c635f6f04d082d3b2a74276fef150a331dcceeea461be1e3553ae9d027  /tmp/symbolic_code.tar.gz' | sha256sum -c -
          tar xzf /tmp/symbolic_code.tar.gz -C "$root"
          echo '97c9fd1a3f371ca30bd29b924ac0e6d1ea21d985e513df8b5de977f0a70be381  data_science_god_level/symbolic_discovery/estimator.py' | sha256sum -c -
          echo '6a0077eb961f2617182ed35cf1cf56e21999dfb5a93db24bec181b47af27d10d  data_science_god_level/symbolic_discovery/suite.py' | sha256sum -c -
          echo 'd070e71bd4900f9172a7432c14008a2de2aa88ea415d9d2b699cbad71eec3325  data_science_god_level/symbolic_discovery/benchmark.py' | sha256sum -c -
          echo 'e0b33d6a52145c9a6933d20fe320a12cc92660df982642743eaf1e8fed543e0a  data_science_god_level/symbolic_discovery/test_estimator.py' | sha256sum -c -
          echo '02b4f0ba2e847ae9f4837e2ae484f3049bb767834a729be69ff5a7d0e9557ae6  data_science_god_level/symbolic_discovery/logic_plan.py' | sha256sum -c -
          echo 'a68e7d6fc9a1f42b7c3b771bad0c7730c770a65c051e6651c0424e8a8c281c45  data_science_god_level/symbolic_discovery/public_runner.py' | sha256sum -c -
          echo 'a4ea808ac30dcb5af55d9392be6b5cb4eaeb860bc620ad9b58751bb08a5629cc  data_science_god_level/symbolic_discovery/official_runner.py' | sha256sum -c -

      - name: Replay original Logic Power v10 before evaluation
        shell: bash
        run: |
          set -euo pipefail
          cat logic_power_v10_capsule/parts/part_00.b64 \
              logic_power_v10_capsule/parts/part_01.b64 \
              logic_power_v10_capsule/parts/part_02.b64 \
              logic_power_v10_capsule/parts/part_03.b64 \
              logic_power_v10_capsule/parts/part_04.b64 \
              logic_power_v10_capsule/parts/part_05_00.b64 \
              logic_power_v10_capsule/parts/part_05_01.b64 \
              logic_power_v10_capsule/parts/part_05_02.b64 > /tmp/lp.b64
          echo '3548f31fcaa9696eabb063023c905fbb04a2b3db73c96df9f9ee8bc8e0c64fc1  /tmp/lp.b64' | sha256sum -c -
          base64 -d /tmp/lp.b64 > /tmp/lp.tar.gz
          echo 'ad2c363afb3fe20aa093565f278c690d423611e8270e9ad9b1491dbbdf218c31  /tmp/lp.tar.gz' | sha256sum -c -
          tar xzf /tmp/lp.tar.gz -C _logic_power_v10
          (cd _logic_power_v10 && sha256sum -c SOURCE_SHA256SUMS && test "$(cat PRIVATE_HEAD_SHA.txt)" = 'ba10d0edc7eb20d499d0481fda2537e782b6efb2')
          (cd data_science_god_level/symbolic_discovery && PYTHONPATH="${GITHUB_WORKSPACE}/_logic_power_v10" python logic_plan.py)

      - name: Prove the frozen candidate contract
        run: |
          cd data_science_god_level/symbolic_discovery
          python -m unittest -v test_estimator.py \
            2>&1 | tee "${GITHUB_WORKSPACE}/symbolic-public-logs/unit-tests.txt"

      - name: Execute and seal the public symbolic gate
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
        run: |
          cd data_science_god_level/symbolic_discovery
          python public_runner.py \
            2>&1 | tee "${GITHUB_WORKSPACE}/symbolic-public-logs/runner-output.txt"

      - name: Upload immutable public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-god-level-symbolic-public
          retention-days: 90
          path: |
            data_science_god_level/symbolic_discovery/SOURCE_MANIFEST.json
            data_science_god_level/symbolic_discovery/symbolic_code.tar.gz.b64
            data_science_god_level/symbolic_discovery/estimator.py
            data_science_god_level/symbolic_discovery/suite.py
            data_science_god_level/symbolic_discovery/benchmark.py
            data_science_god_level/symbolic_discovery/test_estimator.py
            data_science_god_level/symbolic_discovery/logic_plan.py
            data_science_god_level/symbolic_discovery/logic-plan-receipt.json
            data_science_god_level/symbolic_discovery/public_runner.py
            data_science_god_level/symbolic_discovery/official_runner.py
            symbolic-public-logs/**

      - name: Enforce the public verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('symbolic-public-logs/public-freeze-receipt.json')
          if not path.exists():
              raise SystemExit('public symbolic receipt missing')
          receipt = json.loads(path.read_text())
          if receipt['verdict'] != 'PASS':
              raise SystemExit(f"public symbolic gate: {receipt['verdict']}; evidence preserved")
          print('public symbolic gate: PASS; candidate frozen before official equations exist')
          PY
