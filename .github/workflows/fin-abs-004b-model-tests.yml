name: FIN-ABS-004B — model contract tests only

on:
  pull_request:
    branches:
      - agent/fin-abs-004b-fdic-rf-untouched
    paths:
      - 'README_FIN_ABS_004B_FDIC_RF.md'
      - 'fin_abs_004b_fdic/protocol.py'
      - 'fin_abs_004b_fdic/panel_cli.py'
      - 'fin_abs_004b_fdic/test_protocol.py'
      - 'fin_abs_004b_fdic/model.py'
      - 'fin_abs_004b_fdic/benchmark.py'
      - 'fin_abs_004b_fdic/verify_benchmark_v2.mjs'
      - 'fin_abs_004b_fdic/test_model.py'
      - 'fin_abs_004b_fdic/test_benchmark.py'
      - '.github/workflows/fin-abs-004b-model-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen model code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 scikit-learn==1.7.1

      - name: Compile and run synthetic contract tests
        run: |
          python -m compileall -q fin_abs_004_fdic fin_abs_004b_fdic
          python -m unittest -v fin_abs_004b_fdic.test_protocol
          python -m unittest -v fin_abs_004b_fdic.test_model
          python -m unittest -v fin_abs_004b_fdic.test_benchmark

      - name: Static verifier syntax check
        run: node --check fin_abs_004b_fdic/verify_benchmark_v2.mjs

      - name: Confirm no external test was opened
        run: |
          test ! -e reports/fin_abs_004b_fdic_benchmark/report.json
          echo 'Synthetic model-contract CI only; 2012-2014 remains unopened.'
