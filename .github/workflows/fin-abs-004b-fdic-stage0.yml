name: FIN-ABS-004B — untouched FDIC Stage 0

on:
  pull_request:
    branches:
      - agent/fin-abs-004-fdic-distress
    paths:
      - 'fin_abs_004b_fdic/**'
      - 'README_FIN_ABS_004B_FDIC_RF.md'
      - '.github/workflows/fin-abs-004b-fdic-stage0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin-abs-004b-fdic-stage0
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout preregistered capsule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore prior official FDIC acquisitions
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .cache/fin_abs_004_fdic
          key: fdic-panel-v2-${{ runner.os }}-20260804
          restore-keys: |
            fdic-panel-v1-${{ runner.os }}-20260803

      - name: Install deterministic Stage 0 dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.3.2 pandas==2.3.1

      - name: Compile and test frozen contracts
        run: |
          python -m compileall -q fin_abs_004_fdic fin_abs_004b_fdic
          python -m unittest -v fin_abs_004b_fdic.test_protocol
          python -m unittest -v fin_abs_004_fdic.test_panel
          python -m unittest -v fin_abs_004_fdic.test_entity_split
          python -m unittest -v fin_abs_004_fdic.test_preflight

      - name: Reconstruct untouched official temporal panel
        run: |
          rm -rf reports/fin_abs_004b_fdic_stage0
          mkdir -p reports/fin_abs_004b_fdic_stage0/panel
          python -m fin_abs_004b_fdic.panel_cli \
            --cache .cache/fin_abs_004_fdic \
            --output-dir reports/fin_abs_004b_fdic_stage0/panel

      - name: Freeze rare-event entity-disjoint cohort
        run: |
          python -m fin_abs_004b_fdic.entity_split_cli \
            --source-panel reports/fin_abs_004b_fdic_stage0/panel/panel_features.csv \
            --source-report reports/fin_abs_004b_fdic_stage0/panel/panel_report.json \
            --output-panel reports/fin_abs_004b_fdic_stage0/panel/panel_features_entity_disjoint.csv \
            --output-report reports/fin_abs_004b_fdic_stage0/panel/entity_panel_report.json

      - name: Fail-closed preflight before model construction
        run: |
          python -m fin_abs_004_fdic.preflight \
            --panel reports/fin_abs_004b_fdic_stage0/panel/panel_features_entity_disjoint.csv \
            --panel-report reports/fin_abs_004b_fdic_stage0/panel/entity_panel_report.json \
            --output reports/fin_abs_004b_fdic_stage0/panel/preflight_report.json

      - name: Independent Node reconstruction of Stage 0 gates
        run: |
          node fin_abs_004b_fdic/verify_stage0.mjs \
            reports/fin_abs_004b_fdic_stage0/panel/entity_panel_report.json \
            reports/fin_abs_004b_fdic_stage0/panel/preflight_report.json \
            reports/fin_abs_004b_fdic_stage0/panel/panel_features_entity_disjoint.csv \
            reports/fin_abs_004b_fdic_stage0/panel/node_stage0_receipt.json

      - name: Reject split and score forgeries
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, hashlib, json
          from pathlib import Path
          source = json.loads(Path('reports/fin_abs_004b_fdic_stage0/panel/entity_panel_report.json').read_text())
          for name, mutate in {
              'seed': lambda value: value['payload']['protocol'].update({'seed':'POST_RESULT_SEED'}),
              'score': lambda value: value['payload']['absolute_score'].update({'after':1000,'delta':577}),
          }.items():
              forged = copy.deepcopy(source)
              mutate(forged)
              canonical = json.dumps(forged['payload'], sort_keys=True, separators=(',', ':'), ensure_ascii=False)
              forged['payload_canonical'] = canonical
              forged['sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
              Path(f'/tmp/forged_{name}.json').write_text(json.dumps(forged, indent=2, sort_keys=True) + '\n')
          PY
          for forged in /tmp/forged_seed.json /tmp/forged_score.json; do
            if node fin_abs_004b_fdic/verify_stage0.mjs \
                "$forged" \
                reports/fin_abs_004b_fdic_stage0/panel/preflight_report.json \
                reports/fin_abs_004b_fdic_stage0/panel/panel_features_entity_disjoint.csv \
                /tmp/forged_receipt.json; then
              echo "forgery accepted: $forged" >&2
              exit 1
            fi
          done

      - name: Build bounded Stage 0 evidence
        run: |
          mkdir -p reports/fin_abs_004b_fdic_stage0/evidence
          cp reports/fin_abs_004b_fdic_stage0/panel/panel_report.json \
             reports/fin_abs_004b_fdic_stage0/panel/entity_panel_report.json \
             reports/fin_abs_004b_fdic_stage0/panel/preflight_report.json \
             reports/fin_abs_004b_fdic_stage0/panel/node_stage0_receipt.json \
             reports/fin_abs_004b_fdic_stage0/evidence/
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/fin_abs_004b_fdic_stage0')
          entity = json.loads((root/'panel/entity_panel_report.json').read_text())
          preflight = json.loads((root/'panel/preflight_report.json').read_text())
          receipt = json.loads((root/'panel/node_stage0_receipt.json').read_text())
          summary = {
              'schema':'fin-abs-004b/fdic-stage0-summary/1',
              'status':'PROCEED' if receipt['payload']['valid'] else 'STOP',
              'split_counts':preflight['payload']['split_counts'],
              'split_dates':preflight['payload']['split_dates'],
              'bucket_rule':entity['payload']['protocol']['bucket_rule'],
              'entity_overlap_counts':preflight['payload']['entity_overlap_counts'],
              'entity_report_sha256':entity['sha256'],
              'preflight_report_sha256':preflight['sha256'],
              'node_receipt_sha256':receipt['sha256'],
              'absolute_score':{'before':423,'after':423,'delta':0},
          }
          (root/'evidence/summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          PY
          sha256sum reports/fin_abs_004b_fdic_stage0/evidence/* \
            > reports/fin_abs_004b_fdic_stage0/evidence/manifest.sha256

      - name: Upload bounded Stage 0 reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-abs-004b-fdic-stage0
          path: reports/fin_abs_004b_fdic_stage0/evidence/
          if-no-files-found: error
          retention-days: 90
