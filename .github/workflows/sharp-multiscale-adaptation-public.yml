name: Public sharp multiscale adaptation verification

on:
  push:
    branches:
      - agent/sharp-multiscale-v20-public
    paths:
      - 'inference_power_compiler_v2/verify_sharp_multiscale_adaptation_public.py'
      - 'SharpMultiscaleAdaptationPublic.lean'
      - '.github/workflows/sharp-multiscale-adaptation-public.yml'
  pull_request:
    paths:
      - 'inference_power_compiler_v2/verify_sharp_multiscale_adaptation_public.py'
      - 'SharpMultiscaleAdaptationPublic.lean'
      - '.github/workflows/sharp-multiscale-adaptation-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sharp-multiscale-public:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Execute independent exact reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            inference_power_compiler_v2/verify_sharp_multiscale_adaptation_public.py
          python inference_power_compiler_v2/verify_sharp_multiscale_adaptation_public.py \
            | tee sharp-multiscale-public.log
          test -s inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_CERTIFICATE.json
          test -s inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_REPORT.json
          sha256sum \
            inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_CERTIFICATE.json \
            inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_REPORT.json \
            > /tmp/sharp-public-before.sha256
          python inference_power_compiler_v2/verify_sharp_multiscale_adaptation_public.py \
            > /tmp/sharp-public-rebuild.log
          sha256sum \
            inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_CERTIFICATE.json \
            inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_REPORT.json \
            > /tmp/sharp-public-after.sha256
          cmp /tmp/sharp-public-before.sha256 /tmp/sharp-public-after.sha256

      - name: Audit exact semantic outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_REPORT.json').read_text()
          )
          assert report['status'] == 'SOLVED'
          assert report['theorem']['statement'] == 'selected_error <= 5 * min_k(b_k+r_k)'
          assert [item['selected_level'] for item in report['controls']] == [1, 2, 3, 4, 5]
          assert [item['oracle_level'] for item in report['controls']] == [1, 2, 3, 4, 5]
          assert all(item['realized_oracle_ratio'] == [1, 1] for item in report['controls'])
          assert report['tightness_witness']['selected_level'] == 0
          assert report['tightness_witness']['oracle_level'] == 1
          assert report['tightness_witness']['realized_oracle_ratio'] == [5, 1]
          assert len(report['prefix_obstructions']) == 5
          assert report['monte_carlo']['trials'] == 4096
          assert report['monte_carlo']['violations'] == 0
          assert report['chaos_stress']['cases'] == 1280
          assert report['chaos_stress']['violations'] == 0
          assert report['resources']['total_stress_cases'] == 5376
          assert report['resource_negative']['status'] == 'UNKNOWN_RESOURCE_LIMIT'
          assert report['logic_power_v10']['hypotheses'] == 256
          assert report['logic_power_v10']['conflict_pairs'] == 255
          assert report['logic_power_v10']['fixed_basis_cost'] == [75, 1]
          assert len(report['logic_power_v10']['clean_path']) == 8
          assert len(report['negative_controls']) == 7
          assert report['semantic_replay'] == 'PASS'
          assert report['tampered_certificate'] == 'REJECTED:payload-hash'
          assert report['forged_certificate'] == 'REJECTED:semantic-replay'
          PY

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile public formal boundary without axioms
        shell: bash
        run: |
          set -euo pipefail
          elan run leanprover/lean4:v4.33.0-rc1 lean \
            -o SharpMultiscaleAdaptationPublic.olean \
            SharpMultiscaleAdaptationPublic.lean \
            2>&1 | tee sharp-multiscale-public-lean.log
          test -s SharpMultiscaleAdaptationPublic.olean
          if grep -Eq 'sorryAx|depends on axioms:' sharp-multiscale-public-lean.log; then
            echo 'Unexpected Lean axiom dependency' >&2
            exit 1
          fi

      - name: Build public verification receipt
        shell: bash
        env:
          PUBLIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = {
              'report': Path('inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_REPORT.json'),
              'certificate': Path('inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_CERTIFICATE.json'),
              'verifier': Path('inference_power_compiler_v2/verify_sharp_multiscale_adaptation_public.py'),
              'lean': Path('SharpMultiscaleAdaptationPublic.lean'),
          }
          receipt = {
              'schema': 'sharp-multiscale-adaptation-public-receipt/1',
              'repository': 'cristh99/notebooks',
              'head': os.environ['PUBLIC_HEAD_SHA'],
              'event_sha': os.environ['PUBLIC_EVENT_SHA'],
              'comparison_target': {
                  'repository': 'cristh99/my_first_repository',
                  'pull_request': 86,
                  'head': 'e64c82f8ab1fe8f15996ce2159267465d91f36e9',
              },
              'sha256': {
                  name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for name, path in files.items()
              },
              'independent_reconstruction': 'PASS',
              'sharp_factor_five': 'PASS',
              'factor_five_tightness': 'PASS',
              'control_oracle_matching': 'PASS',
              'prefix_obstructions': 'PASS',
              'monte_carlo_trials': 4096,
              'monte_carlo_violations': 0,
              'tent_map_cases': 1280,
              'tent_map_violations': 0,
              'logic_power_hypotheses': 256,
              'logic_power_conflict_pairs': 255,
              'negative_controls': 7,
              'resource_fail_closed': 'PASS',
              'semantic_replay': 'PASS',
              'deterministic_rebuild': 'PASS',
              'certificate_tamper_rejection': 'PASS',
              'semantic_forgery_rejection': 'PASS',
              'lean': 'PASS',
              'sorryAx': 'ABSENT',
              'axiom_dependencies': 'ABSENT',
          }
          path = Path('inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_RECEIPT.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_RECEIPT.sha256').write_text(
              f'{digest}  SHARP_MULTISCALE_ADAPTATION_PUBLIC_RECEIPT.json\n'
          )
          print(path.read_text())
          print(digest)
          PY

      - name: Upload public evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sharp-multiscale-adaptation-public-evidence
          path: |
            inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_*.json
            inference_power_compiler_v2/SHARP_MULTISCALE_ADAPTATION_PUBLIC_RECEIPT.sha256
            inference_power_compiler_v2/verify_sharp_multiscale_adaptation_public.py
            SharpMultiscaleAdaptationPublic.lean
            SharpMultiscaleAdaptationPublic.olean
            sharp-multiscale-public.log
            sharp-multiscale-public-lean.log
          if-no-files-found: error
          retention-days: 90
