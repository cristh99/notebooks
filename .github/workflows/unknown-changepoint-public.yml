name: Public corrected unknown changepoint verification

on:
  push:
    branches:
      - agent/inference-power-compiler-v2-public-ci
    paths:
      - 'inference_power_compiler_v2/verify_unknown_changepoint_public.py'
      - 'UnknownChangePointPublic.lean'
      - '.github/workflows/unknown-changepoint-public.yml'
  pull_request:
    paths:
      - 'inference_power_compiler_v2/verify_unknown_changepoint_public.py'
      - 'UnknownChangePointPublic.lean'
      - '.github/workflows/unknown-changepoint-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-unknown-changepoint-public:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PRIVATE_HEAD: c2d1f0ce1b6a94c56ce12412fcf1c19ad7ae0dff
      PRIVATE_RAW: https://raw.githubusercontent.com/cristh99/my_first_repository/c2d1f0ce1b6a94c56ce12412fcf1c19ad7ae0dff
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Fetch immutable private snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inference_power_compiler_v2 logic_power_v10
          files=(
            inference_power_compiler_v2/unknown_changepoint_compiler.py
            inference_power_compiler_v2/unknown_changepoint_compiler_source.py.xz.b64
            inference_power_compiler_v2/run_unknown_changepoint_compiler.py
            inference_power_compiler_v2/run_unknown_changepoint_compiler_source.py.xz.b64
            inference_power_compiler_v2/test_unknown_changepoint_compiler.py
            inference_power_compiler_v2/unknown_change_external_manifest_public.pem
            inference_power_compiler_v2/unknown_change_external_manifest_r0.sig.b64
            inference_power_compiler_v2/unknown_change_external_manifest_r1.sig.b64
            inference_power_compiler_v2/unknown_change_external_manifest_r2.sig.b64
            inference_power_compiler_v2/unknown_change_external_manifest_late.sig.b64
            logic_power_v10/__init__.py
            logic_power_v10/active_discovery.py
            logic_power_v10/certificate.py
          )
          for file in "${files[@]}"; do
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --location --retry 3 "$PRIVATE_RAW/$file" --output "$file"
            test -s "$file"
          done
          sha256sum "${files[@]}" > /tmp/private-snapshot.sha256
          cat /tmp/private-snapshot.sha256

      - name: Run private focused tests at immutable snapshot
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=".:inference_power_compiler_v2"
          python -m py_compile \
            inference_power_compiler_v2/unknown_changepoint_compiler.py \
            inference_power_compiler_v2/run_unknown_changepoint_compiler.py \
            inference_power_compiler_v2/test_unknown_changepoint_compiler.py
          python -m unittest -v \
            inference_power_compiler_v2/test_unknown_changepoint_compiler.py \
            | tee unknown-changepoint-private-tests.log

      - name: Execute private proof-carrying runner
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=".:inference_power_compiler_v2"
          python inference_power_compiler_v2/run_unknown_changepoint_compiler.py \
            | tee unknown-changepoint-private-run.log
          test -s inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_CERTIFICATE.json
          test -s inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_LOGIC_POWER_CERTIFICATE.json
          test -s inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_REPORT.json

      - name: Execute independent public audit
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=".:inference_power_compiler_v2"
          python -m py_compile \
            inference_power_compiler_v2/verify_unknown_changepoint_public.py
          python inference_power_compiler_v2/verify_unknown_changepoint_public.py \
            | tee unknown-changepoint-public.log
          test -s inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_PUBLIC_CERTIFICATE.json
          test -s inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_PUBLIC_REPORT.json
          sha256sum \
            inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_PUBLIC_CERTIFICATE.json \
            inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_PUBLIC_REPORT.json \
            > /tmp/public-before.sha256
          python inference_power_compiler_v2/verify_unknown_changepoint_public.py \
            > /tmp/public-rebuild.log
          sha256sum \
            inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_PUBLIC_CERTIFICATE.json \
            inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_PUBLIC_REPORT.json \
            > /tmp/public-after.sha256
          cmp /tmp/public-before.sha256 /tmp/public-after.sha256

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile public formal boundary without axioms
        shell: bash
        run: |
          set -euo pipefail
          elan run leanprover/lean4:v4.33.0-rc1 lean \
            -o UnknownChangePointPublic.olean UnknownChangePointPublic.lean \
            2>&1 | tee unknown-changepoint-public-lean.log
          test -s UnknownChangePointPublic.olean
          if grep -Eq 'sorryAx|depends on axioms:' unknown-changepoint-public-lean.log; then
            echo 'Unexpected Lean axiom dependency' >&2
            exit 1
          fi

      - name: Build public verification receipt
        shell: bash
        env:
          PUBLIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = {
              'public_report': Path('inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_PUBLIC_REPORT.json'),
              'public_certificate': Path('inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_PUBLIC_CERTIFICATE.json'),
              'private_report': Path('inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_REPORT.json'),
              'private_certificate': Path('inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_CERTIFICATE.json'),
              'logic_power_certificate': Path('inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_LOGIC_POWER_CERTIFICATE.json'),
              'public_verifier': Path('inference_power_compiler_v2/verify_unknown_changepoint_public.py'),
              'public_lean': Path('UnknownChangePointPublic.lean'),
              'snapshot_manifest': Path('/tmp/private-snapshot.sha256'),
          }
          receipt = {
              'schema': 'unknown-changepoint-public-verification-receipt/1',
              'repository': 'cristh99/notebooks',
              'head': os.environ['PUBLIC_HEAD_SHA'],
              'event_sha': os.environ['PUBLIC_EVENT_SHA'],
              'private_repository': 'cristh99/my_first_repository',
              'private_pull_request': 83,
              'private_head': os.environ['PRIVATE_HEAD'],
              'sha256': {
                  name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for name, path in files.items()
              },
              'unknown_breakpoint_detection': 'PASS',
              'no_change_false_alarm_control': 'PASS',
              'alternative_regime_selection': 'PASS',
              'hierarchical_alpha_wealth': 'PASS',
              'signed_availability_manifest': 'PASS',
              'row_merkle_proofs': 'PASS',
              'cluster_atomicity': 'PASS',
              'predictable_selection_and_retirement': 'PASS',
              'truth_anytime_inclusion': 'PASS',
              'former_resource_cap_rejected': 'PASS',
              'correct_resource_cap_solved': 'PASS',
              'correct_total_evaluations': 373888,
              'independent_resource_reconstruction': 'PASS',
              'negative_controls': 'PASS',
              'semantic_replay': 'PASS',
              'deterministic_rebuild': 'PASS',
              'certificate_tamper_rejection': 'PASS',
              'semantic_forgery_rejection': 'PASS',
              'lean': 'PASS',
              'sorryAx': 'ABSENT',
              'axiom_dependencies': 'ABSENT',
          }
          path = Path('inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_PUBLIC_RECEIPT.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_PUBLIC_RECEIPT.sha256').write_text(
              f'{digest}  UNKNOWN_CHANGEPOINT_PUBLIC_RECEIPT.json\n'
          )
          print(path.read_text())
          print(digest)
          PY

      - name: Upload public evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unknown-changepoint-public-evidence
          path: |
            inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_*.json
            inference_power_compiler_v2/UNKNOWN_CHANGEPOINT_PUBLIC_RECEIPT.sha256
            inference_power_compiler_v2/verify_unknown_changepoint_public.py
            UnknownChangePointPublic.lean
            UnknownChangePointPublic.olean
            unknown-changepoint-private-tests.log
            unknown-changepoint-private-run.log
            unknown-changepoint-public.log
            unknown-changepoint-public-lean.log
          if-no-files-found: error
          retention-days: 90
