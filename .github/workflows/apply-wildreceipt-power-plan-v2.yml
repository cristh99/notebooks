name: Apply WildReceipt finite-population power plan v2

on:
  push:
    branches:
      - agent/ocr-consensus-detector-v4
    paths:
      - '.github/workflows/apply-wildreceipt-power-plan-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-wildreceipt-power-plan-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Move to latest isolated branch head
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - name: Correct chronology text and impossible power projection
        run: |
          python - <<'PY'
          from pathlib import Path

          candidate = Path(
              'ocr_real_risk_v1/numeric_consensus_candidate_v4_wildreceipt.py'
          )
          test = Path(
              'ocr_real_risk_v1/test_numeric_consensus_candidate_v4_wildreceipt.py'
          )

          text = candidate.read_text(encoding='utf-8')
          old = '''"""Freeze numeric-consensus-v4 for untouched WildReceipt validation.

The source corpus was sealed before v4 development. This candidate binds the
selected detector, byte-frozen digit forest, crop guard, one-unit-per-receipt
adapter, exact gates, runtime, and source bytes before any Parquet row is read.
"""'''
          new = '''"""Freeze numeric-consensus-v4 after geometry discovery but before OCR.

The immutable WildReceipt objects were reserved before v4 development. A later
manifest-only attempt revealed that the mirror uses LayoutLM-normalized boxes;
no OCR binary or candidate inference ran. This candidate binds the corrected
projection, detector, byte-frozen forest, guard, risk unit, exact gates, and
runtime before any OCR outcome is generated.
"""'''
          if old not in text:
              raise SystemExit('candidate chronology docstring target not found')
          text = text.replace(old, new, 1)

          old = '''        "power_plan": {
            "published_receipt_rows_from_hub_metadata": 1739,
            "development_selected": 993,
            "development_accepted": 319,
            "development_baseline_errors": 46,
            "projected_selected_for_10x_if_rates_hold": 1889,
            "underpower_is_an_allowed_terminal_result": True,
            "planning_only_not_a_certificate": True,
        },'''
          new = '''        "power_plan": {
            "published_receipt_rows_from_hub_metadata": 1739,
            "maximum_possible_selected_unique_receipts": 1739,
            "minimum_selected_unique_receipts": 1200,
            "minimum_selection_yield_required": 0.6900517538815412,
            "development_selected": 993,
            "development_accepted": 319,
            "development_acceptance_rate": 0.32124874118831825,
            "minimum_selected_for_projected_400_accepts": 1246,
            "minimum_selection_yield_for_projected_400_accepts": (
                0.7165037377803335
            ),
            "finite_population_feasibility": True,
            "underpower_is_an_allowed_terminal_result": True,
            "planning_only_not_a_certificate": True,
        },'''
          if old not in text:
              raise SystemExit('candidate power plan target not found')
          candidate.write_text(text.replace(old, new, 1), encoding='utf-8')

          text = test.read_text(encoding='utf-8')
          old = '''        self.assertTrue(
            protocol["power_plan"]["underpower_is_an_allowed_terminal_result"]
        )'''
          new = '''        power = protocol["power_plan"]
        self.assertEqual(power["maximum_possible_selected_unique_receipts"], 1739)
        self.assertEqual(power["minimum_selected_unique_receipts"], 1200)
        self.assertEqual(power["minimum_selected_for_projected_400_accepts"], 1246)
        self.assertLessEqual(
            power["minimum_selected_for_projected_400_accepts"],
            power["maximum_possible_selected_unique_receipts"],
        )
        self.assertTrue(power["finite_population_feasibility"])
        self.assertTrue(power["underpower_is_an_allowed_terminal_result"])'''
          if old not in text:
              raise SystemExit('candidate test power target not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install pinned test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 \
            numpy==2.2.6 \
            opencv-python-headless==4.10.0.84 \
            scikit-learn==1.8.0 \
            joblib==1.5.3 \
            pyarrow==18.1.0 \
            pytesseract==0.3.13
      - name: Prove finite-population consistency
        run: |
          python -m unittest -v \
            ocr_real_risk_v1.test_wildreceipt_adapter \
            ocr_real_risk_v1.test_wildreceipt_external \
            ocr_real_risk_v1.test_numeric_consensus_candidate_v4_wildreceipt
          python -m compileall -q ocr_real_risk_v1
          python - <<'PY'
          import math
          from ocr_real_risk_v1.numeric_consensus_candidate_v4_wildreceipt import (
              external_protocol,
          )
          protocol = external_protocol()
          power = protocol['power_plan']
          assert power['minimum_selection_yield_required'] == 1200 / 1739
          expected = math.ceil(400 / (319 / 993))
          assert expected == 1246
          assert power['minimum_selected_for_projected_400_accepts'] == expected
          assert power['minimum_selection_yield_for_projected_400_accepts'] == (
              expected / 1739
          )
          assert expected <= power['maximum_possible_selected_unique_receipts']
          print(power)
          PY
      - name: Commit corrected power plan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ocr_real_risk_v1/numeric_consensus_candidate_v4_wildreceipt.py \
            ocr_real_risk_v1/test_numeric_consensus_candidate_v4_wildreceipt.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Correct WildReceipt finite-population power plan'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
