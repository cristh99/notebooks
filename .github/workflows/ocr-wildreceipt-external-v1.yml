name: OCR WildReceipt external numeric validation v1

on:
  push:
    branches:
      - agent/ocr-consensus-detector-v4
    paths:
      - '.github/workflows/ocr-wildreceipt-external-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ocr-wildreceipt-external-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_ARTIFACT_ID: '8924318798'
  CANDIDATE_ARTIFACT_DIGEST: a27fc748ee31f0cc2b4943a6f8350ba27e903e08d848902427c89bf21ba80cf1
  CANDIDATE_STABLE_SHA256: 4b09fce3fc03e8c33ffe06c06dbcb8ecfbec0b1b2199b82440780a180fba9153
  CANDIDATE_SOURCE_COMMIT: 56dbe782509155efa9ff74a059181b431d675f61
  WILDRECEIPT_REVISION: cedafaf3c8b0246c9fad68af29324d655715ad12
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONHASHSEED: '0'
  OMP_THREAD_LIMIT: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  seal-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      run-ocr: ${{ steps.power.outputs.run_ocr }}
      selected: ${{ steps.power.outputs.selected }}
      projected-accepted: ${{ steps.power.outputs.projected_accepted }}
      protocol-stable: ${{ steps.power.outputs.protocol_stable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Install pinned candidate dependencies without OCR binary
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core fonts-lato
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 \
            numpy==2.2.6 \
            opencv-python-headless==4.10.0.84 \
            scikit-learn==1.8.0 \
            joblib==1.5.3 \
            pyarrow==18.1.0 \
            pytesseract==0.3.13
      - name: Recover and verify complete byte-frozen candidate
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            --output candidate.zip
          echo "${CANDIDATE_ARTIFACT_DIGEST}  candidate.zip" | \
            sha256sum --check --strict
          mkdir candidate-artifact
          unzip -q candidate.zip -d candidate-artifact
          test -d candidate-artifact/frozen-wildreceipt-v4-complete-a
          (
            cd candidate-artifact/frozen-wildreceipt-v4-complete-a
            sha256sum --check --strict SHA256SUMS.txt
          )
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('candidate-artifact/frozen-wildreceipt-v4-complete-a')
          manifest = json.loads((root / 'frozen_candidate.json').read_text())
          assert manifest['candidate_id'] == 'numeric-consensus-v4-wildreceipt'
          assert manifest['stable_payload_sha256'] == \
              '4b09fce3fc03e8c33ffe06c06dbcb8ecfbec0b1b2199b82440780a180fba9153'
          assert manifest['source_commit'] == \
              '56dbe782509155efa9ff74a059181b431d675f61'
          assert manifest['decision'][
              'candidate_frozen_before_wildreceipt_outcomes'
          ] is True
          assert manifest['external_source_binding'][
              'outcomes_opened_before_freeze'
          ] is False
          assert manifest['external_source_binding']['resolved_revision'] == \
              'cedafaf3c8b0246c9fad68af29324d655715ad12'
          assert manifest['external_protocol']['selection'][
              'performed_before_ocr'
          ] is True
          assert manifest['external_protocol']['selection'][
              'uses_candidate_outcome'
          ] is False
          assert manifest['external_protocol']['selection'][
              'uses_ocr_output'
          ] is False
          assert manifest['external_protocol']['exact_gates'][
              'target_error_reduction'
          ] == 10.0
          assert manifest['external_protocol']['exact_gates'][
              'minimum_selected_unique_receipts'
          ] == 1200
          assert manifest['external_protocol']['exact_gates'][
              'minimum_accepted'
          ] == 400
          evaluator = next(
              row for row in manifest['source_files']
              if row['path'] == 'ocr_real_risk_v1/wildreceipt_external.py'
          )
          assert evaluator['sha256'] == \
              '1d682ebcce55a42ef890ef5a1d9ad8e347fab13ffd402256b75a622d5c85c712'
          assert manifest['decision']['production_ready'] is False
          assert manifest['decision']['honduras_production_ready'] is False
          print(json.dumps({
              'candidate_id': manifest['candidate_id'],
              'stable_payload_sha256': manifest['stable_payload_sha256'],
              'source_commit': manifest['source_commit'],
              'evaluator_sha256': evaluator['sha256'],
              'outcomes_opened_before_freeze': False,
          }, indent=2, sort_keys=True))
          PY
      - name: Download and verify three sealed Parquet objects sequentially
        run: |
          mkdir source-files
          cat > wildreceipt-shards.tsv <<'EOF'
          test-00000-of-00001	data/test-00000-of-00001.parquet	43254778a33b83ae65f9a152b2b559a043f4d4239c4d903b4aca315d129efca0	427468952
          train-00000-of-00002	data/train-00000-of-00002.parquet	f11bd09c7373df1726aa3fba02b6513c436809b3417c5b85a24cd0dd4226fc07	449790572
          train-00001-of-00002	data/train-00001-of-00002.parquet	e988eeff3ad994f77c1c0fed0a85675f5f132f7911cb5574e8439c2661b0cce7	490390793
          EOF
          while IFS=$'\t' read -r shard path digest bytes; do
            curl --fail --location --retry 12 --retry-all-errors \
              --retry-delay 20 \
              "https://huggingface.co/datasets/kaydee/wildreceipt/resolve/${WILDRECEIPT_REVISION}/${path}?download=true" \
              --output "source-files/${shard}.parquet"
            echo "${digest}  source-files/${shard}.parquet" | \
              sha256sum --check --strict
            test "$(stat -c %s "source-files/${shard}.parquet")" = "${bytes}"
            sleep 20
          done < wildreceipt-shards.tsv
      - name: Build all outcome-blind manifests before OCR
        env:
          PYTHONPATH: candidate-artifact/frozen-wildreceipt-v4-complete-a/source
        run: |
          rm -rf sealed-manifests wildreceipt-protocol-v1
          mkdir sealed-manifests
          while IFS=$'\t' read -r shard path digest bytes; do
            python -m ocr_real_risk_v1.wildreceipt_external seal \
              --parquet "source-files/${shard}.parquet" \
              --shard-id "${shard}" \
              --candidate-root \
                candidate-artifact/frozen-wildreceipt-v4-complete-a \
              --output "sealed-manifests/${shard}.json"
          done < wildreceipt-shards.tsv
          python -m ocr_real_risk_v1.wildreceipt_external bundle \
            sealed-manifests/*.json \
            --candidate-root \
              candidate-artifact/frozen-wildreceipt-v4-complete-a \
            --output-dir wildreceipt-protocol-v1 \
            | tee wildreceipt-protocol-stdout.json
      - name: Independent protocol, deduplication, and power gates
        id: power
        env:
          PYTHONPATH: candidate-artifact/frozen-wildreceipt-v4-complete-a/source
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from ocr_real_risk_v1.sroie_natural_holdout import verify_stable_payload
          from ocr_real_risk_v1.wildreceipt_external import verify_hash_manifest

          root = Path('wildreceipt-protocol-v1')
          verify_hash_manifest(root)
          protocol = json.loads((root / 'protocol.json').read_text())
          assert verify_stable_payload(protocol, 'stable_payload_sha256')
          assert protocol['status'] == 'SEALED_BEFORE_WILDRECEIPT_OCR'
          assert protocol['dataset']['revision'] == \
              'cedafaf3c8b0246c9fad68af29324d655715ad12'
          assert protocol['candidate_binding'][
              'candidate_stable_payload_sha256'
          ] == '4b09fce3fc03e8c33ffe06c06dbcb8ecfbec0b1b2199b82440780a180fba9153'
          assert protocol['candidate_binding']['source_commit'] == \
              '56dbe782509155efa9ff74a059181b431d675f61'
          assert protocol['candidate_protocol']['selection'][
              'performed_before_ocr'
          ] is True
          assert protocol['candidate_protocol']['selection'][
              'uses_candidate_outcome'
          ] is False
          assert protocol['candidate_protocol']['selection'][
              'uses_ocr_output'
          ] is False
          assert protocol['execution_plan'][
              'candidate_bytes_fixed_before_ocr'
          ] is True
          assert protocol['execution_plan'][
              'selection_completed_before_ocr'
          ] is True
          assert protocol['census'][
              'receipt_associated_selected_locations'
          ] >= protocol['census']['unique_physical_selected_receipts']
          assert protocol['power_gate']['selected_available'] == \
              protocol['census']['unique_physical_selected_receipts']
          assert protocol['power_gate']['minimum_selected_unique_receipts'] == 1200
          assert protocol['power_gate']['minimum_accepted'] == 400
          manifests = sorted((root / 'manifests').glob('*.json'))
          assert len(manifests) == 3
          active = 0
          images = set()
          for path in manifests:
              manifest = json.loads(path.read_text())
              assert verify_stable_payload(manifest, 'manifest_sha256')
              assert manifest['protocol'] == protocol['candidate_protocol']
              for record in manifest['records']:
                  if record['active_physical_unit']:
                      active += 1
                      assert record['image_sha256'] not in images
                      images.add(record['image_sha256'])
          assert active == protocol['census']['unique_physical_selected_receipts']
          run_ocr = bool(protocol['power_gate']['run_ocr'])
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f"run_ocr={'true' if run_ocr else 'false'}\n")
              handle.write(
                  f"selected={protocol['power_gate']['selected_available']}\n"
              )
              handle.write(
                  f"projected_accepted={protocol['power_gate']['projected_accepted']}\n"
              )
              handle.write(
                  f"protocol_stable={protocol['stable_payload_sha256']}\n"
              )
          print(json.dumps({
              'census': protocol['census'],
              'power_gate': protocol['power_gate'],
              'stable_payload_sha256': protocol['stable_payload_sha256'],
          }, indent=2, sort_keys=True))
          PY
          (
            cd wildreceipt-protocol-v1
            sha256sum --check --strict SHA256SUMS.txt
          )
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocr-wildreceipt-protocol-v1
          path: |
            wildreceipt-protocol-v1
            wildreceipt-protocol-stdout.json
          if-no-files-found: error
          retention-days: 90

  underpowered:
    needs: seal-protocol
    if: needs.seal-protocol.outputs.run-ocr == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Emit terminal no-OCR decision
        env:
          SELECTED: ${{ needs.seal-protocol.outputs.selected }}
          PROJECTED_ACCEPTED: ${{ needs.seal-protocol.outputs.projected-accepted }}
          PROTOCOL_STABLE: ${{ needs.seal-protocol.outputs.protocol-stable }}
        run: |
          mkdir terminal
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          report = {
              'schema': 'ocr-wildreceipt-underpowered-terminal/1',
              'candidate_artifact_id': 8924318798,
              'candidate_stable_payload_sha256':
                  '4b09fce3fc03e8c33ffe06c06dbcb8ecfbec0b1b2199b82440780a180fba9153',
              'protocol_stable_payload_sha256': os.environ['PROTOCOL_STABLE'],
              'selected_unique_receipts': int(os.environ['SELECTED']),
              'projected_accepted': float(os.environ['PROJECTED_ACCEPTED']),
              'minimum_selected_required': 1200,
              'minimum_accepted_required': 400,
              'ocr_executed': False,
              'tenfold_reduction_claimed': False,
              'production_ready': False,
              'automatic_production_change': False,
              'verdict': 'WILDRECEIPT_UNDERPOWERED_NO_OCR',
              'external_spend_usd': 0,
          }
          stable = dict(report)
          report['stable_payload_sha256'] = hashlib.sha256(
              json.dumps(stable, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          path = Path('terminal/wildreceipt_underpowered.json')
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          Path('terminal/SHA256SUMS.txt').write_text(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          (
            cd terminal
            sha256sum --check --strict SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocr-wildreceipt-underpowered-terminal-v1
          path: terminal
          if-no-files-found: error
          retention-days: 90

  evaluate-shards:
    needs: seal-protocol
    if: needs.seal-protocol.outputs.run-ocr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard_id: test-00000-of-00001
            path: data/test-00000-of-00001.parquet
            sha256: 43254778a33b83ae65f9a152b2b559a043f4d4239c4d903b4aca315d129efca0
            size_bytes: 427468952
          - shard_id: train-00000-of-00002
            path: data/train-00000-of-00002.parquet
            sha256: f11bd09c7373df1726aa3fba02b6513c436809b3417c5b85a24cd0dd4226fc07
            size_bytes: 449790572
          - shard_id: train-00001-of-00002
            path: data/train-00001-of-00002.parquet
            sha256: e988eeff3ad994f77c1c0fed0a85675f5f132f7911cb5574e8439c2661b0cce7
            size_bytes: 490390793
    steps:
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Install complete pinned OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng \
            fonts-dejavu-core fonts-lato
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 \
            numpy==2.2.6 \
            opencv-python-headless==4.10.0.84 \
            scikit-learn==1.8.0 \
            joblib==1.5.3 \
            pyarrow==18.1.0 \
            pytesseract==0.3.13
      - name: Recover and verify frozen candidate
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            --output candidate.zip
          echo "${CANDIDATE_ARTIFACT_DIGEST}  candidate.zip" | \
            sha256sum --check --strict
          mkdir candidate-artifact
          unzip -q candidate.zip -d candidate-artifact
          (
            cd candidate-artifact/frozen-wildreceipt-v4-complete-a
            sha256sum --check --strict SHA256SUMS.txt
          )
      - name: Recover and verify sealed protocol
        env:
          PROTOCOL_ARTIFACT_ID: ${{ needs.seal-protocol.outputs.artifact-id }}
          PROTOCOL_ARTIFACT_DIGEST: ${{ needs.seal-protocol.outputs.artifact-digest }}
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROTOCOL_ARTIFACT_ID}/zip" \
            --output protocol.zip
          echo "${PROTOCOL_ARTIFACT_DIGEST#sha256:}  protocol.zip" | \
            sha256sum --check --strict
          mkdir protocol-artifact
          unzip -q protocol.zip -d protocol-artifact
          (
            cd protocol-artifact/wildreceipt-protocol-v1
            sha256sum --check --strict SHA256SUMS.txt
          )
      - name: Download and verify one sealed Parquet shard
        run: |
          curl --fail --location --retry 12 --retry-all-errors \
            --retry-delay 20 \
            "https://huggingface.co/datasets/kaydee/wildreceipt/resolve/${WILDRECEIPT_REVISION}/${{ matrix.path }}?download=true" \
            --output source.parquet
          echo "${{ matrix.sha256 }}  source.parquet" | \
            sha256sum --check --strict
          test "$(stat -c %s source.parquet)" = "${{ matrix.size_bytes }}"
      - name: Execute frozen candidate on natural receipts
        env:
          PYTHONPATH: candidate-artifact/frozen-wildreceipt-v4-complete-a/source
        run: |
          rm -rf "wildreceipt-${{ matrix.shard_id }}"
          python -m ocr_real_risk_v1.wildreceipt_external evaluate \
            --parquet source.parquet \
            --manifest \
              "protocol-artifact/wildreceipt-protocol-v1/manifests/${{ matrix.shard_id }}.json" \
            --candidate-root \
              candidate-artifact/frozen-wildreceipt-v4-complete-a \
            --output-dir "wildreceipt-${{ matrix.shard_id }}" \
            | tee "wildreceipt-${{ matrix.shard_id }}-stdout.json"
      - name: Independent shard integrity gates
        env:
          PYTHONPATH: candidate-artifact/frozen-wildreceipt-v4-complete-a/source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ocr_real_risk_v1.sroie_natural_holdout import verify_stable_payload
          from ocr_real_risk_v1.wildreceipt_external import (
              REPORT_SCHEMA,
              verify_hash_manifest,
          )
          shard = '${{ matrix.shard_id }}'
          root = Path(f'wildreceipt-{shard}')
          verify_hash_manifest(root)
          report = json.loads((root / 'shard_report.json').read_text())
          manifest = json.loads((root / 'manifest.json').read_text())
          assert report['schema'] == REPORT_SCHEMA
          assert verify_stable_payload(report, 'stable_payload_sha256')
          assert verify_stable_payload(manifest, 'manifest_sha256')
          assert report['dataset']['shard_id'] == shard
          assert report['manifest_sha256'] == manifest['manifest_sha256']
          assert report['candidate_binding'][
              'candidate_stable_payload_sha256'
          ] == '4b09fce3fc03e8c33ffe06c06dbcb8ecfbec0b1b2199b82440780a180fba9153'
          assert report['execution']['selected_unique_receipts'] == \
              len(report['observations'])
          assert report['decision']['shard_execution_complete'] is True
          assert report['decision']['formal_10x_claimed_at_shard_level'] is False
          assert report['decision']['automatic_production_change'] is False
          for row in report['observations']:
              assert row['image_sha256']
              assert row['truth'].isdigit()
              if row['candidate']['accepted']:
                  assert row['candidate']['eligible'] is True
                  assert row['candidate']['prediction'] == row['candidate']['claim']
                  assert row['candidate']['crop_sha256']
                  assert row['candidate']['guard']
          print(json.dumps({
              'shard': shard,
              'execution': report['execution'],
              'descriptive': report['descriptive'],
              'stable_payload_sha256': report['stable_payload_sha256'],
          }, indent=2, sort_keys=True))
          PY
          (
            cd "wildreceipt-${{ matrix.shard_id }}"
            sha256sum --check --strict SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocr-wildreceipt-eval-${{ matrix.shard_id }}-v1
          path: wildreceipt-${{ matrix.shard_id }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs:
      - seal-protocol
      - evaluate-shards
    if: needs.seal-protocol.outputs.run-ocr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Install pinned aggregate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng \
            fonts-dejavu-core fonts-lato
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 \
            numpy==2.2.6 \
            opencv-python-headless==4.10.0.84 \
            scikit-learn==1.8.0 \
            joblib==1.5.3 \
            pyarrow==18.1.0 \
            pytesseract==0.3.13
      - name: Recover and verify frozen candidate
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            --output candidate.zip
          echo "${CANDIDATE_ARTIFACT_DIGEST}  candidate.zip" | \
            sha256sum --check --strict
          mkdir candidate-artifact
          unzip -q candidate.zip -d candidate-artifact
          (
            cd candidate-artifact/frozen-wildreceipt-v4-complete-a
            sha256sum --check --strict SHA256SUMS.txt
          )
      - name: Recover and verify sealed protocol
        env:
          PROTOCOL_ARTIFACT_ID: ${{ needs.seal-protocol.outputs.artifact-id }}
          PROTOCOL_ARTIFACT_DIGEST: ${{ needs.seal-protocol.outputs.artifact-digest }}
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROTOCOL_ARTIFACT_ID}/zip" \
            --output protocol.zip
          echo "${PROTOCOL_ARTIFACT_DIGEST#sha256:}  protocol.zip" | \
            sha256sum --check --strict
          mkdir protocol-artifact
          unzip -q protocol.zip -d protocol-artifact
          (
            cd protocol-artifact/wildreceipt-protocol-v1
            sha256sum --check --strict SHA256SUMS.txt
          )
      - name: Recover and verify all three shard artifacts
        run: |
          mkdir shard-roots
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          expected = {
              'ocr-wildreceipt-eval-test-00000-of-00001-v1':
                  'test-00000-of-00001',
              'ocr-wildreceipt-eval-train-00000-of-00002-v1':
                  'train-00000-of-00002',
              'ocr-wildreceipt-eval-train-00001-of-00002-v1':
                  'train-00001-of-00002',
          }
          request = urllib.request.Request(
              (
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100"
              ),
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.load(response)
          selected = [
              row for row in payload['artifacts'] if row['name'] in expected
          ]
          if {row['name'] for row in selected} != set(expected):
              raise SystemExit(
                  f"missing WildReceipt shard artifacts: {[row['name'] for row in selected]}"
              )
          with Path('shard-artifacts.tsv').open('w', encoding='utf-8') as output:
              for row in selected:
                  output.write(
                      f"{row['id']}\t{expected[row['name']]}\t{row['digest']}\n"
                  )
          Path('shard-artifacts.json').write_text(
              json.dumps(selected, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          while IFS=$'\t' read -r artifact_id shard digest; do
            curl --fail --location --retry 5 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "${shard}.zip"
            echo "${digest#sha256:}  ${shard}.zip" | \
              sha256sum --check --strict
            mkdir -p "shard-roots/${shard}"
            unzip -q "${shard}.zip" -d "shard-roots/${shard}"
            (
              cd "shard-roots/${shard}"
              sha256sum --check --strict SHA256SUMS.txt
            )
          done < shard-artifacts.tsv
