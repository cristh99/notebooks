name: Data Science dominance — robust one-shot TabArena Fresh-12 V2

on:
  push:
    branches:
      - agent/data-science-dominance-tabarena-v2
    paths:
      - '.github/workflows/data-science-dominance-tabarena-robust-fresh12.yml'

permissions:
  contents: read

jobs:
  robust-fresh12-dominance:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove workflow-only activation after complete source freeze
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = 'push'
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test "$(git rev-parse HEAD^)" = '27c8f8b52a782be1b2a7d1280378933c372ed214'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/data-science-dominance-tabarena-robust-fresh12.yml'
          echo "DOMINANCE_V2_ACTIVATION_PARENT_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned CPU competitors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dominance-v2-logs _logic_power_v10
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'scipy==1.14.1' 'pandas==2.2.3' \
            'scikit-learn==1.5.2' 'openml==0.15.1' \
            'catboost==1.2.8' 'lightgbm==4.6.0' 'xgboost==3.1.3'
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --disable-pip-version-check \
            'einops>=0.7' 'psutil' 'tqdm>=4.64' 'huggingface-hub'
          python -m pip install --disable-pip-version-check --no-deps \
            'git+https://github.com/soda-inria/tabicl.git@46b91961db4f8873dd049ec09990698a435e1e29'
          python -m pip freeze | sort > dominance-v2-logs/pip-freeze.txt

      - name: Reconstruct and audit the exact frozen selector before task access
        shell: bash
        run: |
          set -euo pipefail
          root='data_science_dominance/tabarena_portfolio_v2'
          echo '84c9b61a21cf1a54248c25db59afd707e3e23977c16da455d654fd47e49fe3df  data_science_dominance/tabarena_portfolio_v2/SOURCE_MANIFEST.json' | sha256sum -c -
          echo 'f3b3067f540a2c9b2569424cf203f9a7ad9b471acf0602e5d656d1db27ebab47  data_science_dominance/tabarena_portfolio_v2/portfolio_v2_code.tar.gz.b64' | sha256sum -c -
          base64 -d "$root/portfolio_v2_code.tar.gz.b64" > /tmp/tabarena-portfolio-v2.tar.gz
          echo 'd5c24947607d2401fdac3a5b5f936ac6f061990ac3e92dcd9b1f8844e48fe447  /tmp/tabarena-portfolio-v2.tar.gz' | sha256sum -c -
          tar xzf /tmp/tabarena-portfolio-v2.tar.gz -C "$root"
          echo '57cdade9e4b71250b36b50ae6aaeba3c786a939a8f66ebc2e2daf41f8414b78b  data_science_dominance/tabarena_portfolio_v2/README.md' | sha256sum -c -
          echo '5555b5ccbaa7ba538c872fb40eac8c7a8176f1a9f7ce3be229a5a3bc8a1ab1c4  data_science_dominance/tabarena_portfolio_v2/dominance_v2.py' | sha256sum -c -
          echo 'd6d10217da1642f68e269b7d36ce8cf801286ed4bb3f1be61851cdd126fe9dad  data_science_dominance/tabarena_portfolio_v2/logic_plan_v2.py' | sha256sum -c -
          echo '5ce2c48a6fbba72c2eb988bc208068af607f452090fdfd42a8b0d99cb1da1c60  data_science_dominance/tabarena_portfolio_v2/runner_v2.py' | sha256sum -c -
          echo '1499963d09fe1d38b19599601d017f4dbdd2875405d76a5cfe4da98d3e39bb84  data_science_dominance/tabarena_portfolio_v2/tasks_v2.json' | sha256sum -c -
          echo 'f2424271df9862f0ca940ac92bd938e1def90b6d9232968529e942b13c81362a  data_science_dominance/tabarena_portfolio_v2/test_portfolio_v2.py' | sha256sum -c -
          echo '69ed84f034352d93fb50b503e353040bbe5d9480057e93b53a6ea3200ee79207  data_science_dominance/tabarena_portfolio_v2/unit-tests.txt' | sha256sum -c -
          echo '6b0e275b6e60ec766ba5d8d19c27234c252bbcae22a3f7df6d0e3908f81e1c90  data_science_god_level/tabular_transfer/estimator.py' | sha256sum -c -
          python -m py_compile "$root"/{dominance_v2,logic_plan_v2,runner_v2,test_portfolio_v2}.py
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          root = Path('data_science_dominance/tabarena_portfolio_v2')
          manifest = json.loads((root / 'SOURCE_MANIFEST.json').read_text())
          contract = json.loads((root / 'tasks_v2.json').read_text())
          assert manifest['score_before'] == 465
          assert manifest['novelty_weight'] == 0
          assert manifest['benchmark']['selection_frozen_before_task_values'] is True
          assert manifest['candidate_contract']['test_label_access'] is False
          assert manifest['candidate_contract']['dataset_identifier_access'] is False
          assert manifest['candidate_contract']['post_hoc_retuning_permitted'] is False
          assert manifest['selector']['minimum_anchor_weight'] == 0.55
          assert len(contract['tasks']) == 12
          assert sum(row['problem_type'] == 'regression' for row in contract['tasks']) == 6
          assert len({row['task_id'] for row in contract['tasks']}) == 12
          exposed = {
              'credit_approval', 'phoneme', 'spambase', '197_cpu_act', 'wind', 'pollen',
              'breast_cancer_wisconsin_diagnostic', 'Hill_Valley_with_noise', 'magic',
              'houses', 'tecator', '522_pm10', 'anneal', 'blood-transfusion-service-center',
              'credit-g', 'diabetes', 'maternal_health_risk', 'qsar-biodeg',
              'airfoil_self_noise', 'Another-Dataset-on-used-Fiat-500',
              'concrete_compressive_strength', 'healthcare_insurance_expenses',
              'QSAR_fish_toxicity', 'miami_housing',
          }
          assert exposed.isdisjoint({row['dataset'] for row in contract['tasks']})

          source = (root / 'dominance_v2.py').read_text()
          tree = ast.parse(source)
          imports, calls, names = set(), set(), set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.level == 0:
                  imports.add((node.module or '').split('.')[0])
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id)
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr)
              elif isinstance(node, ast.Name):
                  names.add(node.id)
              elif isinstance(node, ast.Attribute):
                  names.add(node.attr)
          assert not imports.intersection({'openml', 'requests', 'socket', 'subprocess', 'urllib'})
          assert not calls.intersection({'open', 'eval', 'exec', 'compile', 'system', 'popen', 'run', 'urlopen', 'request', 'read_csv', 'read_json'})
          assert not names.intersection({'y_test', 'test_labels', 'dataset_name', 'task_id', 'openml'})
          assert 'ANCHOR_WEIGHT_FLOOR = 0.55' in source
          assert 'small = n_samples < 2_000' in source
          audit = {
              'schema': 'data-science-dominance/tabarena-robust-static-audit/1',
              'candidate_task_values_accessed': False,
              'candidate_test_labels_access': False,
              'candidate_dataset_identifier_access': False,
              'candidate_network_or_process_access': False,
              'fixed_local_legacy_module_loading_only': True,
              'fresh_task_contract_count': 12,
              'minimum_anchor_weight': 0.55,
              'source_manifest_sha256': hashlib.sha256((root / 'SOURCE_MANIFEST.json').read_bytes()).hexdigest(),
              'candidate_sha256': hashlib.sha256((root / 'dominance_v2.py').read_bytes()).hexdigest(),
              'legacy_estimator_sha256': hashlib.sha256(Path('data_science_god_level/tabular_transfer/estimator.py').read_bytes()).hexdigest(),
          }
          Path('dominance-v2-logs/static-audit.json').write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n')
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY

      - name: Replay original Logic Power v10 and frozen protocol tests
        shell: bash
        run: |
          set -euo pipefail
          cat logic_power_v10_capsule/parts/part_00.b64 \
              logic_power_v10_capsule/parts/part_01.b64 \
              logic_power_v10_capsule/parts/part_02.b64 \
              logic_power_v10_capsule/parts/part_03.b64 \
              logic_power_v10_capsule/parts/part_04.b64 \
              logic_power_v10_capsule/parts/part_05_00.b64 \
              logic_power_v10_capsule/parts/part_05_01.b64 \
              logic_power_v10_capsule/parts/part_05_02.b64 > /tmp/lp.b64
          echo '3548f31fcaa9696eabb063023c905fbb04a2b3db73c96df9f9ee8bc8e0c64fc1  /tmp/lp.b64' | sha256sum -c -
          base64 -d /tmp/lp.b64 > /tmp/lp.tar.gz
          echo 'ad2c363afb3fe20aa093565f278c690d423611e8270e9ad9b1491dbbdf218c31  /tmp/lp.tar.gz' | sha256sum -c -
          tar xzf /tmp/lp.tar.gz -C _logic_power_v10
          (cd _logic_power_v10 && sha256sum -c SOURCE_SHA256SUMS && test "$(cat PRIVATE_HEAD_SHA.txt)" = 'ba10d0edc7eb20d499d0481fda2537e782b6efb2')
          root='data_science_dominance/tabarena_portfolio_v2'
          (cd "$root" && PYTHONPATH="${GITHUB_WORKSPACE}/_logic_power_v10" python logic_plan_v2.py) \
            2>&1 | tee dominance-v2-logs/logic-plan-output.txt
          (cd "$root" && PYTHONPATH="${GITHUB_WORKSPACE}/$root" python -m unittest -v test_portfolio_v2.py) \
            2>&1 | tee dominance-v2-logs/unit-tests.txt

      - name: Smoke-test both TabICLv2 checkpoints before external task access
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          import numpy as np
          from tabicl import TabICLClassifier, TabICLRegressor

          rng = np.random.default_rng(20260805)
          X = rng.normal(size=(96, 6)).astype('float32')
          y_cls = (X[:, 0] + X[:, 1] > 0).astype(int)
          y_reg = X[:, 0] - 2 * X[:, 1] + 0.1 * rng.normal(size=len(X))
          started = time.perf_counter()
          clf = TabICLClassifier(n_estimators=1, batch_size=1, device='cpu', n_jobs=4, random_state=7, verbose=False)
          clf.fit(X[:72], y_cls[:72])
          cls = clf.predict_proba(X[72:])
          reg = TabICLRegressor(n_estimators=1, batch_size=1, device='cpu', n_jobs=4, random_state=7, verbose=False)
          reg.fit(X[:72], y_reg[:72])
          pred = reg.predict(X[72:])
          assert cls.shape == (24, 2) and np.all(np.isfinite(cls))
          assert pred.shape == (24,) and np.all(np.isfinite(pred))
          receipt = {
              'schema': 'data-science-dominance/tabiclv2-smoke/2',
              'classification_checkpoint_loaded': True,
              'regression_checkpoint_loaded': True,
              'external_task_values_accessed': False,
              'runtime_seconds': time.perf_counter() - started,
          }
          Path('dominance-v2-logs/tabiclv2-smoke.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Run the first and only robust Fresh-12 external evaluation
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          HF_HUB_DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          set +e
          test "${GITHUB_RUN_ATTEMPT}" = '1' || exit 99
          root='data_science_dominance/tabarena_portfolio_v2'
          PYTHONPATH="${GITHUB_WORKSPACE}/$root" python "$root/runner_v2.py" \
            --output dominance-v2-logs/robust-fresh12-report.json \
            2>&1 | tee dominance-v2-logs/runner-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > dominance-v2-logs/runner-exit-status.txt
          exit 0

      - name: Seal immutable custody and dominance verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          logs = Path('dominance-v2-logs')
          root = Path('data_science_dominance/tabarena_portfolio_v2')
          report_path = logs / 'robust-fresh12-report.json'
          status_path = logs / 'runner-exit-status.txt'
          report = json.loads(report_path.read_text()) if report_path.exists() else None
          runner_status = int(status_path.read_text().strip()) if status_path.exists() else None
          actual = int(report.get('actual_external_evaluation_count', 0)) if report is not None and runner_status == 0 else 0
          verdict = str(report.get('verdict', 'INVALID_RUN')) if actual == 1 else 'INVALID_RUN'

          def digest(path):
              p = Path(path)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None

          receipt = {
              'schema': 'data-science-dominance/tabarena-robust-fresh12-freeze/1',
              'verdict': verdict,
              'score_before': 465,
              'novelty_points': 0,
              'actual_external_evaluation_count': actual,
              'candidate_frozen_before_task_values': True,
              'task_selection_frozen_before_task_values': True,
              'post_hoc_retuning_permitted': False,
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'github_sha': os.environ['GITHUB_SHA'],
              'activation_parent_sha': os.environ.get('DOMINANCE_V2_ACTIVATION_PARENT_SHA'),
              'runner_exit_status': runner_status,
              'summary': None if report is None else report.get('summary'),
              'checks': None if report is None else report.get('checks'),
              'hashes': {
                  'source_manifest_sha256': digest(root / 'SOURCE_MANIFEST.json'),
                  'source_archive_base64_sha256': digest(root / 'portfolio_v2_code.tar.gz.b64'),
                  'candidate_sha256': digest(root / 'dominance_v2.py'),
                  'runner_sha256': digest(root / 'runner_v2.py'),
                  'tasks_sha256': digest(root / 'tasks_v2.json'),
                  'tests_sha256': digest(root / 'test_portfolio_v2.py'),
                  'logic_plan_receipt_sha256': digest(root / 'logic-plan-v2-receipt.json'),
                  'legacy_estimator_sha256': digest('data_science_god_level/tabular_transfer/estimator.py'),
                  'static_audit_sha256': digest(logs / 'static-audit.json'),
                  'tabiclv2_smoke_sha256': digest(logs / 'tabiclv2-smoke.json'),
                  'report_sha256': digest(report_path),
              },
          }
          payload = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          logs.mkdir(parents=True, exist_ok=True)
          (logs / 'freeze-receipt.json').write_text(payload)
          (logs / 'freeze-receipt.sha256').write_text(
              hashlib.sha256(payload.encode()).hexdigest() + '  freeze-receipt.json\n'
          )
          print(payload)
          PY

      - name: Upload complete immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-dominance-tabarena-robust-fresh12-v2
          retention-days: 90
          path: |
            data_science_dominance/tabarena_portfolio_v2/**
            data_science_god_level/tabular_transfer/estimator.py
            dominance-v2-logs/**

      - name: Enforce the one-shot dominance verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('dominance-v2-logs/freeze-receipt.json')
          if not path.exists():
              raise SystemExit('freeze receipt missing')
          receipt = json.loads(path.read_text())
          if receipt['actual_external_evaluation_count'] != 1:
              raise SystemExit('robust Fresh-12 evaluation invalid or incomplete; evidence preserved')
          if receipt['verdict'] != 'PASS':
              raise SystemExit(f"robust Fresh-12 dominance gate: {receipt['verdict']}; evidence preserved; no retuning")
          print('robust Fresh-12 dominance gate: PASS; no retuning permitted')
          PY
