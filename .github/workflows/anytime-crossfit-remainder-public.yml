name: Public anytime cross-fit nonzero-remainder verification

on:
  push:
    branches:
      - agent/inference-power-compiler-v2-public-ci
    paths:
      - 'inference_power_compiler_v2/verify_anytime_crossfit_public.py'
      - 'inference_power_compiler_v2/verify_anytime_crossfit_remainder_public.py'
      - 'AnytimeCrossFitRemainderPublic.lean'
      - '.github/workflows/anytime-crossfit-remainder-public.yml'
  pull_request:
    paths:
      - 'inference_power_compiler_v2/verify_anytime_crossfit_public.py'
      - 'inference_power_compiler_v2/verify_anytime_crossfit_remainder_public.py'
      - 'AnytimeCrossFitRemainderPublic.lean'
      - '.github/workflows/anytime-crossfit-remainder-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-nonzero-remainder-public:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind private sources and compile independent verifier
        shell: bash
        run: |
          set -euo pipefail
          verifier=inference_power_compiler_v2/verify_anytime_crossfit_remainder_public.py
          for digest in \
            cb103b068de777ba8117eb14986ae22e727ef2f2 \
            80831b1d9d3d554474928082ebfae7c1c204e371 \
            4d81eb613d3373514361be4e19b93aece45eb8f3 \
            84016bc6e040442b04b191f6c7343243f6b4cadb \
            948b66c661a4268f888ed42f1ba05f14a791c381 \
            991839d2294843dbce836b07369f7a026296b294 \
            b141c0b84de589f64474953bb71f5a6066735317 \
            641d161088e50dbce88c687ad6ca52aa307c8812
          do
            test "$(grep -c "$digest" "$verifier")" = "1"
          done
          python -m py_compile \
            inference_power_compiler_v2/verify_anytime_crossfit_public.py \
            "$verifier"

      - name: Execute independent nonzero-remainder replay
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="inference_power_compiler_v2"
          python inference_power_compiler_v2/verify_anytime_crossfit_remainder_public.py \
            | tee anytime-crossfit-remainder-public.log
          test -s inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_REPORT.json
          test -s inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_CERTIFICATE.json
          sha256sum \
            inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_REPORT.json \
            inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_CERTIFICATE.json \
            > /tmp/remainder-public-before.sha256
          python inference_power_compiler_v2/verify_anytime_crossfit_remainder_public.py \
            > /tmp/remainder-public-rebuild.log
          sha256sum \
            inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_REPORT.json \
            inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_CERTIFICATE.json \
            > /tmp/remainder-public-after.sha256
          cmp /tmp/remainder-public-before.sha256 /tmp/remainder-public-after.sha256

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile public nonzero-remainder boundary without axioms
        shell: bash
        run: |
          set -euo pipefail
          elan run leanprover/lean4:v4.33.0-rc1 lean \
            -o AnytimeCrossFitRemainderPublic.olean \
            AnytimeCrossFitRemainderPublic.lean \
            2>&1 | tee anytime-crossfit-remainder-public-lean.log
          test -s AnytimeCrossFitRemainderPublic.olean
          if grep -q 'sorryAx' anytime-crossfit-remainder-public-lean.log; then
            echo 'Unexpected sorryAx' >&2
            exit 1
          fi
          if grep -q 'depends on axioms:' anytime-crossfit-remainder-public-lean.log; then
            echo 'Unexpected Lean axiom dependency' >&2
            exit 1
          fi

      - name: Build public verification receipt
        shell: bash
        env:
          PUBLIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = {
              'report': Path('inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_REPORT.json'),
              'certificate': Path('inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_CERTIFICATE.json'),
              'verifier': Path('inference_power_compiler_v2/verify_anytime_crossfit_remainder_public.py'),
              'lean': Path('AnytimeCrossFitRemainderPublic.lean'),
          }
          receipt = {
              'schema': 'anytime-crossfit-remainder-public-verification-receipt/1',
              'repository': 'cristh99/notebooks',
              'head': os.environ['PUBLIC_HEAD_SHA'],
              'event_sha': os.environ['PUBLIC_EVENT_SHA'],
              'private_repository': 'cristh99/my_first_repository',
              'private_pull_request': 68,
              'private_head': 'cb103b068de777ba8117eb14986ae22e727ef2f2',
              'private_blobs': {
                  'base_compiler': '80831b1d9d3d554474928082ebfae7c1c204e371',
                  'base_runner': '4d81eb613d3373514361be4e19b93aece45eb8f3',
                  'remainder_runner': '84016bc6e040442b04b191f6c7343243f6b4cadb',
                  'remainder_tests': '948b66c661a4268f888ed42f1ba05f14a791c381',
                  'remainder_lean': '991839d2294843dbce836b07369f7a026296b294',
                  'remainder_workflow': 'b141c0b84de589f64474953bb71f5a6066735317',
                  'public_base_verifier': '641d161088e50dbce88c687ad6ca52aa307c8812',
              },
              'sha256': {
                  name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for name, path in files.items()
              },
              'imperfect_nuisance': 'PASS',
              'nonzero_remainder': 'PASS',
              'batch_biases': {'b1': '1/64', 'b2': '1/256'},
              'product_bounds': {'b1': '1/6272', 'b2': '1/115200'},
              'truth_anytime_inclusion': 'PASS',
              'too_small_remainder_rejection': 'PASS',
              'continuous_root_inversion': 'PASS',
              'semantic_replay': 'PASS',
              'deterministic_rebuild': 'PASS',
              'certificate_tamper_rejection': 'PASS',
              'semantic_forgery_rejection': 'PASS',
              'lean': 'PASS',
              'sorryAx': 'ABSENT',
              'axiom_dependencies': 'ABSENT',
          }
          path = Path('inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_RECEIPT.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_RECEIPT.sha256').write_text(
              f'{digest}  ANYTIME_CROSSFIT_REMAINDER_PUBLIC_RECEIPT.json\n'
          )
          print(path.read_text())
          print(digest)
          PY

      - name: Upload public nonzero-remainder evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytime-crossfit-remainder-public-evidence
          path: |
            inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_*.json
            inference_power_compiler_v2/ANYTIME_CROSSFIT_REMAINDER_PUBLIC_RECEIPT.sha256
            inference_power_compiler_v2/verify_anytime_crossfit_remainder_public.py
            AnytimeCrossFitRemainderPublic.lean
            AnytimeCrossFitRemainderPublic.olean
            anytime-crossfit-remainder-public.log
            anytime-crossfit-remainder-public-lean.log
          if-no-files-found: error
          retention-days: 90
