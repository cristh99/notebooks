name: Data Science God-Level — RealCause public causal gate

on:
  pull_request:
    paths:
      - 'data_science_god_level/causal_realcause/**'
      - '.github/workflows/data-science-god-level-causal-realcause-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-realcause-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned environment
        run: |
          mkdir -p public-data public-logs
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1' \
            'scikit-learn==1.5.2'
          python -m pip freeze | sort > public-logs/pip-freeze.txt

      - name: Reconstruct original hash-bound Logic Power v10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _logic_power_v10
          cat logic_power_v10_capsule/parts/part_00.b64 \
              logic_power_v10_capsule/parts/part_01.b64 \
              logic_power_v10_capsule/parts/part_02.b64 \
              logic_power_v10_capsule/parts/part_03.b64 \
              logic_power_v10_capsule/parts/part_04.b64 \
              logic_power_v10_capsule/parts/part_05_00.b64 \
              logic_power_v10_capsule/parts/part_05_01.b64 \
              logic_power_v10_capsule/parts/part_05_02.b64 \
              > /tmp/logic-power-v10-source.b64
          echo '3548f31fcaa9696eabb063023c905fbb04a2b3db73c96df9f9ee8bc8e0c64fc1  /tmp/logic-power-v10-source.b64' | sha256sum -c -
          base64 -d /tmp/logic-power-v10-source.b64 > /tmp/logic-power-v10-source.tar.gz
          echo 'ad2c363afb3fe20aa093565f278c690d423611e8270e9ad9b1491dbbdf218c31  /tmp/logic-power-v10-source.tar.gz' | sha256sum -c -
          tar xzf /tmp/logic-power-v10-source.tar.gz -C _logic_power_v10
          (cd _logic_power_v10 && sha256sum -c SOURCE_SHA256SUMS && test "$(cat PRIVATE_HEAD_SHA.txt)" = 'ba10d0edc7eb20d499d0481fda2537e782b6efb2')

      - name: Let original Logic Power select the gate
        working-directory: data_science_god_level/causal_realcause
        env:
          PYTHONPATH: ${{ github.workspace }}/_logic_power_v10
        run: python logic_plan.py

      - name: Audit candidate isolation
        run: |
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          path=Path('data_science_god_level/causal_realcause/estimator.py')
          tree=ast.parse(path.read_text())
          imports=set(); names=set(); calls=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Import): imports.update(a.name.split('.')[0] for a in node.names)
              elif isinstance(node,ast.ImportFrom) and node.level==0: imports.add((node.module or '').split('.')[0])
              elif isinstance(node,ast.Name): names.add(node.id)
              elif isinstance(node,ast.Attribute): names.add(node.attr)
              elif isinstance(node,ast.Call):
                  if isinstance(node.func,ast.Name): calls.append(node.func.id)
                  elif isinstance(node.func,ast.Attribute): calls.append(node.func.attr)
          bad_imports=imports-{'__future__','dataclasses','math','typing','numpy','sklearn'}
          bad_calls=sorted(set(calls)&{'open','eval','exec','compile','__import__','system','popen','run','urlopen','request','read_csv'})
          bad_names=sorted(names&{'Path','y0','y1','sample','dataset','requests','socket','subprocess'})
          if bad_imports or bad_calls or bad_names: raise SystemExit(f'{bad_imports=} {bad_calls=} {bad_names=}')
          receipt={'schema':'data-science-god-level/realcause-static-audit/2','estimator_sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'imports':sorted(imports),'candidate_ground_truth_access':False,'candidate_dataset_identifier_access':False,'candidate_filesystem_network_process_access':False}
          Path('public-logs/static-audit.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - name: Unit tests
        working-directory: data_science_god_level/causal_realcause
        run: python -m unittest -v test_estimator.py

      - name: Download only public LaLonde samples
        shell: bash
        run: |
          set -euo pipefail
          root='https://media.githubusercontent.com/media/bradyneal/realcause/master/realcause_datasets'
          for family in lalonde_psid lalonde_cps; do
            for sample in 0 1 2 3 4 5; do
              name="${family}_sample${sample}.csv"
              curl -fsSL --retry 4 --retry-all-errors "$root/$name" -o "public-data/$name"
              test "$(stat -c%s "public-data/$name")" -gt 1000
              head -n1 "public-data/$name" | grep -q 'y0'
              head -n1 "public-data/$name" | grep -q 'y1'
            done
          done
          test "$(find public-data -type f | wc -l)" -eq 12
          test "$(find public-data -type f -name 'twins*' | wc -l)" -eq 0

      - name: Seal public manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          files=sorted(Path('public-data').glob('*.csv'))
          manifest={'schema':'data-science-god-level/realcause-public-data/1','source_repository':'bradyneal/realcause','source_ref':'master','public_families':['lalonde_psid','lalonde_cps'],'public_samples':[0,1,2,3,4,5],'official_family_accessed':False,'official_files_read':[],'files':[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]}
          payload=json.dumps(manifest,indent=2,sort_keys=True)+'\n'; Path('public-logs/data-manifest.json').write_text(payload); print(payload)
          PY

      - name: Evaluate public families
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
        run: |
          cd data_science_god_level/causal_realcause
          python benchmark.py --files "${GITHUB_WORKSPACE}"/public-data/*.csv \
            --output "${GITHUB_WORKSPACE}/public-logs/public-report.json" \
            2>&1 | tee "${GITHUB_WORKSPACE}/public-logs/evaluation-output.txt"

      - name: Freeze and adjudicate public candidate
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          def dig(p):
              p=Path(p); return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          root=Path('data_science_god_level/causal_realcause'); report_path=Path('public-logs/public-report.json')
          report=json.loads(report_path.read_text()) if report_path.exists() else None
          receipt={'schema':'data-science-god-level/realcause-public-freeze/2','verdict':report['summary']['verdict'] if report else 'INVALID_RUN','estimator_sha256':dig(root/'estimator.py'),'benchmark_sha256':dig(root/'benchmark.py'),'logic_plan_sha256':dig(root/'logic-plan-receipt.json'),'static_audit_sha256':dig('public-logs/static-audit.json'),'data_manifest_sha256':dig('public-logs/data-manifest.json'),'report_sha256':dig(report_path),'public_families':['lalonde_psid','lalonde_cps'],'official_family':'twins','official_samples':[90,91,92,93,94,95,96,97,98,99],'official_truth_accessed':False,'post_hoc_retuning_permitted_after_official_evaluation':False,'summary':report['summary'] if report else None}
          payload=json.dumps(receipt,indent=2,sort_keys=True)+'\n'; Path('public-logs/public-freeze-receipt.json').write_text(payload); Path('public-logs/public-freeze-receipt.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'  public-freeze-receipt.json\n'); print(payload)
          PY

      - name: Upload immutable public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-god-level-realcause-public
          retention-days: 90
          path: |
            data_science_god_level/causal_realcause/estimator.py
            data_science_god_level/causal_realcause/benchmark.py
            data_science_god_level/causal_realcause/logic-plan-receipt.json
            public-logs/**

      - name: Enforce public verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public-logs/public-freeze-receipt.json')
          if not p.exists(): raise SystemExit('public receipt missing')
          v=json.loads(p.read_text())['verdict']
          if v!='PASS': raise SystemExit(f'RealCause public gate: {v}; evidence preserved')
          print('RealCause public gate: PASS; candidate frozen')
          PY
