name: FIN-ABS-004 — FDIC access and label audit

on:
  pull_request:
    branches:
      - agent/finance-absolute-423-public-replay
    paths:
      - 'fin_abs_004_fdic/**'
      - 'README_FIN_ABS_004_FDIC.md'
      - '.github/workflows/fin-abs-004-fdic-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin-abs-004-fdic-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout frozen capsule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic audit dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            pandas==2.3.1 PyYAML==6.0.2

      - name: Compile and test request contracts
        run: |
          python -m compileall -q fin_abs_004_fdic
          python -m unittest -v fin_abs_004_fdic.test_audit

      - name: Audit official taxonomy, failures and representative quarters
        run: |
          set -u
          rm -rf reports/fin_abs_004_fdic_audit
          set +e
          python -m fin_abs_004_fdic.audit \
            --output-dir reports/fin_abs_004_fdic_audit
          audit_exit=$?
          set -e
          test -s reports/fin_abs_004_fdic_audit/report.json
          if [ "$audit_exit" -ne 0 ] && [ "$audit_exit" -ne 2 ]; then
            exit "$audit_exit"
          fi

      - name: Independent Node replay including STOP state
        run: |
          node fin_abs_004_fdic/verify_audit_v2.mjs \
            reports/fin_abs_004_fdic_audit/report.json \
            reports/fin_abs_004_fdic_audit/node_audit_receipt.json

      - name: Reject premature score promotion
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          source = json.loads(Path('reports/fin_abs_004_fdic_audit/report.json').read_text())
          source['payload']['absolute_score']['after'] = 1000
          source['payload']['absolute_score']['delta'] = 577
          canonical = json.dumps(source['payload'], sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          source['payload_canonical'] = canonical
          source['sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('/tmp/forged_score.json').write_text(json.dumps(source, indent=2, sort_keys=True) + '\n')
          PY
          if node fin_abs_004_fdic/verify_audit_v2.mjs \
              /tmp/forged_score.json /tmp/forged_receipt.json; then
            echo 'forged FDIC score accepted' >&2
            exit 1
          fi

      - name: Build evidence manifest
        run: |
          sha256sum reports/fin_abs_004_fdic_audit/* \
            > reports/fin_abs_004_fdic_audit/manifest.sha256

      - name: Upload bounded Stage 0 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-abs-004-fdic-stage0-audit
          path: reports/fin_abs_004_fdic_audit/
          if-no-files-found: error
          retention-days: 90
