name: Data Science dominance — fresh USAspending synthetic freeze gate

on:
  push:
    branches:
      - agent/data-science-dominance-dab-fresh-usaspending-v1
    paths:
      - .github/workflows/data-science-dominance-dab-fresh-usaspending-v1-synthetic.yml

permissions:
  contents: read

env:
  ROOT: data_science_dominance/dab_fresh_usaspending_v1

jobs:
  synthetic-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove workflow-only activation after freeze
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$(git rev-parse HEAD^)" = c36c7739e88ad6a59b274bc7427b9656bae119b8
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/data-science-dominance-dab-fresh-usaspending-v1-synthetic.yml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reconstruct frozen candidate and tests
        shell: bash
        run: |
          set -euo pipefail
          bash "$ROOT/reconstruct.sh"

      - name: Enforce isolation and freeze manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import import Path

          root = Path('data_science_dominance/dab_fresh_usaspending_v1')
          freeze = json.loads((root / 'FREEZE.json').read_text())
          source_path = root / 'usaspending_fresh_engine.py'
          tests_path = root / 'test_usaspending_fresh_engine.py'
          source = source_path.read_text()
          assert hashlib.sha256(source_path.read_bytes()).hexdigest() == freeze['candidate']['sha256']
          assert hashlib.sha256(tests_path.read_bytes()).hexdigest() == freeze['tests']['sha256']
          assert freeze['held_out_scope'] == [
              'query_usaspending/query2',
              'query_usaspending/query3',
              'query_usaspending/query4',
          ]
          lowered = source.lower()
          for forbidden in (
              'query2/query.json', 'query3/query.json', 'query4/query.json',
              'ground_truth.csv', 'validate.py', 'compute_ground_truth.py',
              'requests', 'httpx', 'urllib', 'socket', 'subprocess',
          ):
              assert forbidden not in lowered, forbidden
          tree = ast.parse(source)
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split('.')[0])
          assert not imports.intersection({'requests', 'httpx', 'urllib', 'socket', 'subprocess'})
          PY

      - name: Run synthetic battery
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python -m unittest -v test_usaspending_fresh_engine.py 2>&1 | tee ../../fresh-usaspending-synthetic.log

      - name: Seal synthetic receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path('data_science_dominance/dab_fresh_usaspending_v1')
          log = Path('fresh-usaspending-synthetic.log')
          text = log.read_text() if log.exists() else ''
          passed = '\nOK\n' in ('\n' + text + '\n') and 'Ran 14 tests' in text
          receipt = {
              'schema': 'data-science-dominance/fresh-usaspending-synthetic-receipt/1',
              'verdict': 'PASS' if passed else 'FAIL',
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'github_sha': os.environ['GITHUB_SHA'],
              'held_out_query_content_accessed': False,
              'held_out_validators_executed': False,
              'held_out_ground_truth_accessed': False,
              'official_dataset_values_accessed': False,
              'hashes': {
                  'candidate_sha256': hashlib.sha256((root / 'usaspending_fresh_engine.py').read_bytes()).hexdigest(),
                  'tests_sha256': hashlib.sha256((root / 'test_usaspending_fresh_engine.py').read_bytes()).hexdigest(),
                  'freeze_sha256': hashlib.sha256((root / 'FREEZE.json').read_bytes()).hexdigest(),
                  'test_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest() if log.exists() else None,
              },
          }
          payload = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          Path('fresh-usaspending-synthetic-receipt.json').write_text(payload)
          Path('fresh-usaspending-synthetic-receipt.sha256').write_text(
              hashlib.sha256(payload.encode()).hexdigest() + '  fresh-usaspending-synthetic-receipt.json\n'
          )
          print(payload)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fresh-usaspending-synthetic-v1
          retention-days: 90
          path: |
            data_science_dominance/dab_fresh_usaspending_v1/**
            fresh-usaspending-synthetic.log
            fresh-usaspending-synthetic-receipt.json
            fresh-usaspending-synthetic-receipt.sha256

      - name: Enforce synthetic gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('fresh-usaspending-synthetic-receipt.json').read_text())
          if receipt['verdict'] != 'PASS':
              raise SystemExit('fresh USAspending synthetic gate failed')
          print('fresh USAspending synthetic gate: PASS')
          PY
