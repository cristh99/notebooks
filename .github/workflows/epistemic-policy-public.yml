name: Epistemic policy compiler — public independent verification

on:
  push:
    branches:
      - agent/inference-power-compiler-v2-public-ci
    paths:
      - 'inference_power_compiler_v2/verify_epistemic_policy_public.py'
      - 'FiniteEpistemicPlanningPublic.lean'
      - '.github/workflows/epistemic-policy-public.yml'
  pull_request:
    paths:
      - 'inference_power_compiler_v2/verify_epistemic_policy_public.py'
      - 'FiniteEpistemicPlanningPublic.lean'
      - '.github/workflows/epistemic-policy-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-epistemic-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Execute independent epistemic policy replay
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            inference_power_compiler_v2/verify_epistemic_policy_public.py
          python inference_power_compiler_v2/verify_epistemic_policy_public.py \
            | tee epistemic-policy-public.log
          test -s inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_REPORT.json
          test -s inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_CERTIFICATE.json
          sha256sum \
            inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_REPORT.json \
            inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_CERTIFICATE.json \
            > /tmp/epistemic-public-before.sha256
          python inference_power_compiler_v2/verify_epistemic_policy_public.py \
            > /tmp/epistemic-public-rebuild.log
          sha256sum \
            inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_REPORT.json \
            inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_CERTIFICATE.json \
            > /tmp/epistemic-public-after.sha256
          cmp /tmp/epistemic-public-before.sha256 /tmp/epistemic-public-after.sha256

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile public epistemic planning boundary
        shell: bash
        run: |
          set -euo pipefail
          elan run leanprover/lean4:v4.33.0-rc1 lean \
            -o FiniteEpistemicPlanningPublic.olean \
            FiniteEpistemicPlanningPublic.lean \
            2>&1 | tee finite-epistemic-planning-public-lean.log
          test -s FiniteEpistemicPlanningPublic.olean
          if grep -q 'sorryAx' finite-epistemic-planning-public-lean.log; then
            echo 'Unexpected sorryAx' >&2
            exit 1
          fi

      - name: Build public verification receipt
        shell: bash
        env:
          PUBLIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report = Path('inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_REPORT.json')
          certificate = Path('inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_CERTIFICATE.json')
          lean = Path('FiniteEpistemicPlanningPublic.lean')
          verifier = Path('inference_power_compiler_v2/verify_epistemic_policy_public.py')
          receipt = {
              'schema': 'epistemic-policy-public-verification-receipt/1',
              'repository': 'cristh99/notebooks',
              'head': os.environ['PUBLIC_HEAD_SHA'],
              'event_sha': os.environ['PUBLIC_EVENT_SHA'],
              'private_repository': 'cristh99/my_first_repository',
              'private_pull_request': 68,
              'private_head': '96d080cf37b66f32ed6cf14c5c72692fb06ddddc',
              'private_blobs': {
                  'planner': '359490ad24e9421489b7fa0def2e5d6ee0ff3c54',
                  'runner': 'd0d6257c2da39b843d71bd7b0f02fdc9499d6b0f',
                  'lean': 'c7bdb8e632c59389c56edb58a92348d62f1682c1',
                  'workflow': '3dcf232dd7d057ccca621b92893fe73d92d1fd1c',
              },
              'report_sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
              'certificate_sha256': hashlib.sha256(certificate.read_bytes()).hexdigest(),
              'lean_source_sha256': hashlib.sha256(lean.read_bytes()).hexdigest(),
              'verifier_sha256': hashlib.sha256(verifier.read_bytes()).hexdigest(),
              'complete_model_enumeration': 'PASS',
              'complete_finite_policy_search': 'PASS',
              'budget_feasibility': 'PASS',
              'sharp_leaf_intervals': 'PASS',
              'pareto_frontier': 'PASS',
              'selected_policy_replay': 'PASS',
              'policy_tamper_rejection': 'PASS',
              'certificate_tamper_rejection': 'PASS',
              'semantic_forgery_rejection': 'PASS',
              'single_world_obstruction': 'PASS',
              'monotonicity_closure': 'PASS',
              'deterministic_rebuild': 'PASS',
              'lean': 'PASS',
              'sorryAx': 'ABSENT',
          }
          path = Path('inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_RECEIPT.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_RECEIPT.sha256').write_text(
              f'{digest}  EPISTEMIC_POLICY_PUBLIC_RECEIPT.json\n'
          )
          print(path.read_text())
          print(digest)
          PY

      - name: Upload public epistemic policy evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epistemic-policy-public-evidence
          path: |
            inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_*.json
            inference_power_compiler_v2/EPISTEMIC_POLICY_PUBLIC_RECEIPT.sha256
            inference_power_compiler_v2/verify_epistemic_policy_public.py
            FiniteEpistemicPlanningPublic.lean
            FiniteEpistemicPlanningPublic.olean
            epistemic-policy-public.log
            finite-epistemic-planning-public-lean.log
          if-no-files-found: error
          retention-days: 90
