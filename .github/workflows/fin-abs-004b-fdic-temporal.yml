name: FIN-ABS-004B — FDIC temporal distress benchmark

on:
  pull_request:
    branches:
      - agent/fin-abs-004-fdic-distress
    paths:
      - 'fin_abs_004b_fdic/**'
      - 'README_FIN_ABS_004B_FDIC_TEMPORAL.md'
      - '.github/workflows/fin-abs-004b-fdic-temporal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin-abs-004b-fdic-temporal
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen capsule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore immutable FDIC acquisition cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .cache/fin_abs_004_fdic
          key: fdic-panel-v1-${{ runner.os }}-20260803

      - name: Install deterministic modeling dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.3.2 pandas==2.3.1 scikit-learn==1.7.1 PyYAML==6.0.2

      - name: Compile and test temporal contracts
        run: |
          python -m compileall -q fin_abs_004_fdic fin_abs_004b_fdic
          python -m unittest -v fin_abs_004_fdic.test_audit
          python -m unittest -v fin_abs_004_fdic.test_panel
          python -m unittest -v fin_abs_004_fdic.test_model
          python -m unittest -v fin_abs_004_fdic.test_serialization
          python -m unittest -v fin_abs_004b_fdic.test_preflight

      - name: Acquire official quarterly panel and construct labels
        run: |
          rm -rf reports/fin_abs_004b_fdic_temporal
          mkdir -p .cache/fin_abs_004_fdic reports/fin_abs_004b_fdic_temporal/panel
          python -m fin_abs_004_fdic.panel_cli \
            --cache .cache/fin_abs_004_fdic \
            --output-dir reports/fin_abs_004b_fdic_temporal/panel

      - name: Verify temporal deployment contract before sealed test
        id: preflight
        shell: bash
        run: |
          set +e
          python -m fin_abs_004b_fdic.preflight \
            --panel reports/fin_abs_004b_fdic_temporal/panel/panel_features.csv \
            --panel-report reports/fin_abs_004b_fdic_temporal/panel/panel_report.json \
            --output reports/fin_abs_004b_fdic_temporal/panel/temporal_preflight.json
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'passed=true' >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo 'passed=false' >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Independent Node temporal preflight replay
        if: steps.preflight.outputs.passed == 'true'
        run: |
          node fin_abs_004b_fdic/verify_preflight.mjs \
            reports/fin_abs_004b_fdic_temporal/panel/temporal_preflight.json \
            reports/fin_abs_004b_fdic_temporal/panel/panel_features.csv \
            reports/fin_abs_004b_fdic_temporal/panel/panel_report.json \
            reports/fin_abs_004b_fdic_temporal/panel/node_temporal_preflight_receipt.json

      - name: Execute validation selection and sealed test once
        if: steps.preflight.outputs.passed == 'true'
        run: |
          python -m fin_abs_004_fdic.benchmark \
            --panel reports/fin_abs_004b_fdic_temporal/panel/panel_features.csv \
            --panel-report reports/fin_abs_004b_fdic_temporal/panel/panel_report.json \
            --output-dir reports/fin_abs_004b_fdic_temporal/result

      - name: Independent Node metric replay
        if: steps.preflight.outputs.passed == 'true'
        run: |
          node fin_abs_004_fdic/verify_benchmark.mjs \
            reports/fin_abs_004b_fdic_temporal/result/report.json \
            reports/fin_abs_004b_fdic_temporal/result/node_metric_receipt.json

      - name: Reject preflight, score and metric forgeries
        if: steps.preflight.outputs.passed == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, hashlib, json
          from pathlib import Path

          preflight = json.loads(Path('reports/fin_abs_004b_fdic_temporal/panel/temporal_preflight.json').read_text())
          forged_preflight = copy.deepcopy(preflight)
          forged_preflight['payload']['absolute_score']['after'] = 1000
          forged_preflight['payload']['absolute_score']['delta'] = 577
          canonical = json.dumps(forged_preflight['payload'], sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          forged_preflight['payload_canonical'] = canonical
          forged_preflight['sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('/tmp/forged_preflight.json').write_text(json.dumps(forged_preflight, indent=2, sort_keys=True) + '\n')

          source = json.loads(Path('reports/fin_abs_004b_fdic_temporal/result/report.json').read_text())
          score = copy.deepcopy(source)
          score['payload']['absolute_score']['after'] = 1000
          score['payload']['absolute_score']['delta'] = 577
          canonical = json.dumps(score['payload'], sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          score['payload_canonical'] = canonical
          score['sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('/tmp/forged_score.json').write_text(json.dumps(score, indent=2, sort_keys=True) + '\n')

          metric = copy.deepcopy(source)
          selected = metric['payload']['validation']['selected_challenger']
          metric['payload']['validation']['metrics'][selected]['average_precision'] = 1.0
          canonical = json.dumps(metric['payload'], sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          metric['payload_canonical'] = canonical
          metric['sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('/tmp/forged_metric.json').write_text(json.dumps(metric, indent=2, sort_keys=True) + '\n')
          PY

          if node fin_abs_004b_fdic/verify_preflight.mjs \
              /tmp/forged_preflight.json \
              reports/fin_abs_004b_fdic_temporal/panel/panel_features.csv \
              reports/fin_abs_004b_fdic_temporal/panel/panel_report.json \
              /tmp/forged_preflight_receipt.json; then
            echo 'forged temporal preflight accepted' >&2
            exit 1
          fi

          for forged in /tmp/forged_score.json /tmp/forged_metric.json; do
            if node fin_abs_004_fdic/verify_benchmark.mjs \
                "$forged" /tmp/forged_metric_receipt.json; then
              echo "forged temporal benchmark accepted: $forged" >&2
              exit 1
            fi
          done

      - name: Build evidence manifest
        if: always()
        run: |
          find reports/fin_abs_004b_fdic_temporal -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > reports/fin_abs_004b_fdic_temporal/manifest.sha256

      - name: Upload bounded temporal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-abs-004b-fdic-temporal-benchmark
          path: reports/fin_abs_004b_fdic_temporal/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce temporal preflight
        if: steps.preflight.outputs.passed != 'true'
        run: |
          echo 'FIN-ABS-004B temporal preflight blocked; sealed test was not opened.' >&2
          exit 2
