name: OCR isolated-crop artifact replay v1

on:
  pull_request:
    paths:
      - 'ocr_real_risk_v1/isolated_crop.py'
      - 'ocr_real_risk_v1/replay_isolated_crop.py'
      - 'ocr_real_risk_v1/test_isolated_crop.py'
      - '.github/workflows/ocr-real-risk-isolated-crop-replay-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ocr-isolated-crop-replay-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-retained-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIOR_ARTIFACT_ID: '8908498916'
      PRIOR_ARTIFACT_SHA256: '5e36d6ebbc07b12e6c4c7687ba579a97551e37fc199c1b1ce0fc42b8fff255de'
      PRIOR_REPORT_SHA256: 'd2453903591794a25216c0eba4eb52407f412f8dcbae4be10f8de7e8b2bfa37e'
      OMP_THREAD_LIMIT: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Install frozen free CPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 pytesseract==0.3.13 \
            numpy==2.2.6 opencv-python-headless==4.10.0.84
      - name: Geometry tests
        run: |
          python -m unittest -v ocr_real_risk_v1.test_isolated_crop
          python -m compileall -q ocr_real_risk_v1
      - name: Recover and verify the retained all-page-index artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior isolated-replay
          curl --fail --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRIOR_ARTIFACT_ID}/zip" \
            --output prior.zip
          echo "${PRIOR_ARTIFACT_SHA256}  prior.zip" | sha256sum --check --strict
          unzip -q prior.zip -d prior
          test "$(sha256sum prior/reports/real_numeric_risk_holdout.json | cut -d' ' -f1)" = \
            "${PRIOR_REPORT_SHA256}"
          (cd prior && sha256sum --check --strict SHA256SUMS.txt)
      - name: Replay every retained observation with isolated word geometry
        env:
          PYTHONPATH: ${{ github.workspace }}/ocr_real_risk_v1:${{ github.workspace }}
        run: |
          python -m ocr_real_risk_v1.replay_isolated_crop \
            prior \
            --output-dir isolated-replay \
            | tee isolated-replay/stdout.json
      - name: Independent outcome checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('isolated-replay/isolated_crop_replay.json').read_text())
          assert data['source']['observations_replayed'] == 16
          assert data['source']['selection_changed'] is False
          assert data['source']['truth_changed'] is False
          assert data['source']['only_crop_geometry_changed'] is True
          assert data['old'] == {
              'baseline_predictions': 16,
              'baseline_errors': 3,
              'verifier_false_accepts': 1,
          }
          assert data['isolated']['baseline_predictions'] == 16
          assert data['isolated']['baseline_errors'] == 0
          assert data['isolated']['verifier_false_accepts'] == 0
          assert data['isolated']['counterfactual_false_accepts'] == 0
          assert len(data['rows']) == 16
          assert {row['crop_id'] for row in data['rows']} == {
              path.stem for path in Path('prior/evidence/crops').glob('*.png')
          }
          print(json.dumps({
              'old': data['old'],
              'isolated': data['isolated'],
              'environment': data['environment'],
          }, indent=2, sort_keys=True))
          PY
          (cd isolated-replay && sha256sum --check --strict SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ocr-real-risk-isolated-crop-replay-v1
          path: isolated-replay
          if-no-files-found: error
          retention-days: 30
