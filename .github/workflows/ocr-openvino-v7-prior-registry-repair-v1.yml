name: OpenVINO v7 prior-registry repair — reuse 11 shards

on:
  push:
    branches:
      - agent/openvino-v7-smoke-16-stacked-v2
    paths:
      - ".openvino-prior-registry-repair-trigger-v1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: openvino-v7-prior-registry-repair-v1
  cancel-in-progress: false

env:
  OLD_RUN_ID: "31166514017"
  OLD_HEAD_SHA: "5f614a0c1d62e596b1c44851f810c2b78c137a63"
  PYTHONHASHSEED: "0"
  OMP_THREAD_LIMIT: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    name: Corrected identities and 38,601 denominator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            Pillow==12.2.0 pyarrow==18.1.0
      - name: Replay corrected fail-closed tests
        run: |
          set -euo pipefail
          python -m unittest -v \
            ocr_real_risk_v1.test_openvino_prior_registry_v7 \
            ocr_real_risk_v1.test_openvino_full_gate_v7
          python - <<'PY'
          from ocr_real_risk_v1.openvino_prior_registry_entry_v7 import (
              EXPECTED_TOTAL_ROWS,
              SOURCE_SPECS,
          )
          assert EXPECTED_TOTAL_ROWS == 38601
          assert sum(int(row['rows']) for row in SOURCE_SPECS.values()) == 38601
          assert SOURCE_SPECS['sroie-train']['artifact_sha256'] == 'ada46e3e9a5ac2d0a29c7f2af20ee493959e4114e299f94cfc00218e8076badd'
          assert SOURCE_SPECS['sroie-test']['artifact_sha256'] == '0dc86b73e14029fd45867ed7bbd2b83e3f6d1f22a0791a0a75371ecd3a841f90'
          PY

  wait-and-reuse:
    name: Reuse eleven successful immutable source bundles
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Wait for exact original run to finish without relaunching its work
        run: |
          set -euo pipefail
          observed_head="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${OLD_RUN_ID}" --jq .head_sha)"
          test "$observed_head" = "$OLD_HEAD_SHA"
          status=""
          for attempt in $(seq 1 240); do
            status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${OLD_RUN_ID}" --jq .status)"
            if [[ "$status" == "completed" ]]; then
              break
            fi
            sleep 20
          done
          test "$status" = completed
      - name: Download only completed source artifacts from original run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: openvino-prior-source-v3-*-${{ env.OLD_HEAD_SHA }}
          path: reused-old
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.OLD_RUN_ID }}
      - name: Verify exactly eleven reusable non-SROIE bundles
        run: |
          set -euo pipefail
          mapfile -t roots < <(find reused-old -mindepth 1 -maxdepth 1 -type d | sort)
          test "${#roots[@]}" = 11
          ! find reused-old -mindepth 1 -maxdepth 1 -type d \
            \( -name '*sroie-train*' -o -name '*sroie-test*' \) | grep -q .
          for root in "${roots[@]}"; do
            (cd "$root" && sha256sum --check --strict SHA256SUMS.txt)
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openvino-prior-reused-11-${{ github.sha }}
          path: reused-old/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  repair-sroie:
    name: Recompute ${{ matrix.source_id }} only
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source_id: [sroie-train, sroie-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            Pillow==12.2.0 pyarrow==18.1.0
      - name: Verify corrected artifact digest and fingerprint full SROIE split
        run: |
          set -euo pipefail
          bash scripts/openvino_prior_source_job_v7.sh "${{ matrix.source_id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openvino-prior-repair-${{ matrix.source_id }}-${{ github.sha }}
          path: source-fingerprint-${{ matrix.source_id }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  aggregate:
    name: Aggregate reused eleven plus repaired two
    needs: [wait-and-reuse, repair-sroie]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      registry_stable: ${{ steps.summary.outputs.registry_stable }}
      population_rows: ${{ steps.summary.outputs.population_rows }}
      unique_encoded: ${{ steps.summary.outputs.unique_encoded }}
      unique_pixels: ${{ steps.summary.outputs.unique_pixels }}
      cross_corpus_groups: ${{ steps.summary.outputs.cross_corpus_groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: openvino-prior-reused-11-${{ github.sha }}
          path: prior-source-bundles
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: openvino-prior-repair-*-${{ github.sha }}
          path: prior-source-bundles
          merge-multiple: false
      - name: Build and independently replay complete registry
        id: summary
        run: |
          set -euo pipefail
          mapfile -t roots < <(find prior-source-bundles -mindepth 1 -maxdepth 1 -type d | sort)
          test "${#roots[@]}" = 13
          bash scripts/openvino_prior_aggregate_job_v7.sh \
            prior-source-bundles prior-registry \
            | tee aggregate-summary.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          summary = json.load(open('aggregate-summary.json'))
          assert summary['population_rows'] == 38601
          for key, value in summary.items():
              print(f'{key}={value}')
          PY
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openvino-v7-prior-registry-repaired-${{ github.sha }}
          path: prior-registry/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  terminal-replay:
    name: Terminal replay and zero-OpenVINO-outcome receipt
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.11"
      - name: Recover registry by exact artifact ID and digest
        env:
          ARTIFACT_ID: ${{ needs.aggregate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.aggregate.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > registry.zip
          echo "${ARTIFACT_DIGEST#sha256:}  registry.zip" | sha256sum --check --strict
          mkdir -p registry
          unzip -q registry.zip -d registry
          (cd registry && sha256sum --check --strict SHA256SUMS.txt)
          python -m ocr_real_risk_v1.openvino_prior_registry_entry_v7 \
            verify registry > replay.json
      - name: Seal terminal receipt
        env:
          ARTIFACT_ID: ${{ needs.aggregate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.aggregate.outputs.artifact_digest }}
          REGISTRY_STABLE: ${{ needs.aggregate.outputs.registry_stable }}
          POPULATION_ROWS: ${{ needs.aggregate.outputs.population_rows }}
          UNIQUE_ENCODED: ${{ needs.aggregate.outputs.unique_encoded }}
          UNIQUE_PIXELS: ${{ needs.aggregate.outputs.unique_pixels }}
          CROSS_CORPUS_GROUPS: ${{ needs.aggregate.outputs.cross_corpus_groups }}
        run: |
          set -euo pipefail
          mkdir -p terminal-evidence
          cp replay.json terminal-evidence/
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          replay = json.load(open('replay.json'))
          assert replay['complete'] is True
          assert replay['population_rows'] == 38601
          assert replay['openvino_scientific_images_opened'] == 0
          receipt = {
              'schema': 'eaat.openvino_v7_prior_registry_terminal/repair-1',
              'status': 'PASS_FULL_PRIOR_CORPUS_PHYSICAL_REGISTRY',
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_sha': os.environ['GITHUB_SHA'],
              'reused_source_bundles': 11,
              'recomputed_source_bundles': 2,
              'artifact_id': int(os.environ['ARTIFACT_ID']),
              'artifact_digest': os.environ['ARTIFACT_DIGEST'],
              'registry_stable_payload_sha256': os.environ['REGISTRY_STABLE'],
              'population_rows': int(os.environ['POPULATION_ROWS']),
              'unique_encoded_sha256': int(os.environ['UNIQUE_ENCODED']),
              'unique_pixel_sha256': int(os.environ['UNIQUE_PIXELS']),
              'cross_corpus_duplicate_groups': int(os.environ['CROSS_CORPUS_GROUPS']),
              'full_source_hashes_verified': True,
              'full_populations_fingerprinted': True,
              'annotation_columns_read': False,
              'ocr_runs': 0,
              'candidate_inference_runs': 0,
              'openvino_scientific_images_opened': 0,
              'external_spend_usd': 0,
              'full_openvino_execution_authorized': False,
              'next_gate': 'ATOMIC_GITHUB_LEDGER_WORKFLOW_AND_FINAL_CHANGE_REVIEW',
          }
          raw = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['stable_payload_sha256'] = hashlib.sha256(raw).hexdigest()
          Path('terminal-evidence/terminal-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY
          (cd terminal-evidence && \
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum \
              | sed 's#  \./#  #' > SHA256SUMS.txt)
          (cd terminal-evidence && sha256sum --check --strict SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openvino-v7-prior-registry-repair-terminal-${{ github.sha }}
          path: terminal-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
