name: Data Science God-Level — ResNet bit-flip transfer development

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer-development-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install task-pinned numerical environment
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            'numpy==1.26.4' 'torch==2.2.0' 'torchvision==0.17.0'

      - name: Reconstruct original hash-bound Logic Power v10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _logic_power_v10
          cat \
            logic_power_v10_capsule/parts/part_00.b64 \
            logic_power_v10_capsule/parts/part_01.b64 \
            logic_power_v10_capsule/parts/part_02.b64 \
            logic_power_v10_capsule/parts/part_03.b64 \
            logic_power_v10_capsule/parts/part_04.b64 \
            logic_power_v10_capsule/parts/part_05_00.b64 \
            logic_power_v10_capsule/parts/part_05_01.b64 \
            logic_power_v10_capsule/parts/part_05_02.b64 \
            > /tmp/logic-power-v10-source.b64
          echo '3548f31fcaa9696eabb063023c905fbb04a2b3db73c96df9f9ee8bc8e0c64fc1  /tmp/logic-power-v10-source.b64' | sha256sum -c -
          base64 -d /tmp/logic-power-v10-source.b64 > /tmp/logic-power-v10-source.tar.gz
          echo 'ad2c363afb3fe20aa093565f278c690d423611e8270e9ad9b1491dbbdf218c31  /tmp/logic-power-v10-source.tar.gz' | sha256sum -c -
          tar xzf /tmp/logic-power-v10-source.tar.gz -C _logic_power_v10
          cd _logic_power_v10
          sha256sum -c SOURCE_SHA256SUMS
          test "$(cat PRIVATE_HEAD_SHA.txt)" = 'ba10d0edc7eb20d499d0481fda2537e782b6efb2'

      - name: Let original Logic Power v10 select the model-analysis gate
        working-directory: data_science_god_level/resnet_bitflip
        env:
          PYTHONPATH: ${{ github.workspace }}/_logic_power_v10
        run: python logic_plan.py

      - name: Fetch pinned AutoLab ResNet task
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p task public-logs
          sudo mkdir -p /app /data/cifar10 /logs/verifier
          sudo chown -R "$USER":"$USER" /app /data /logs
          root='https://raw.githubusercontent.com/autolabhq/autolab/7aff5fe71dfbe152fb0b8e8ac8087210b4bc27d5/tasks/resnet_bit_flip'
          curl -fsSLo task/model.py "$root/environment/model.py"
          curl -fsSLo task/train_model.py "$root/environment/train_model.py"
          curl -fsSLo task/main.py "$root/environment/main.py"
          curl -fsSLo task/task.toml "$root/task.toml"
          test "$(git hash-object task/model.py)" = 'a2a7da1c370580b97d8cbc889d76770505200947'
          test "$(git hash-object task/train_model.py)" = 'efcfb73f3d89f1c7d02fd12b2231e23eb2288a7f'
          test "$(git hash-object task/main.py)" = 'e001341f3a530b20c08f49389262c77bc71b774b'
          test "$(git hash-object task/task.toml)" = '7b0b8e8ce474b0fcaec1f533f4f0e935fc7c09a1'
          cp task/model.py task/train_model.py task/main.py /app/
          cp data_science_god_level/resnet_bitflip/solve.py /app/solve.py

      - name: Audit candidate before any model evaluation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          path = Path('/app/solve.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          imports = set()
          forbidden_calls = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.level == 0:
                  imports.add((node.module or '').split('.')[0])
              elif isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                  if node.func.id in {'open', 'eval', 'exec', 'compile', '__import__'}:
                      forbidden_calls.append(node.func.id)
          if not imports <= {'numpy', 'torch', 'math', 'struct'}:
              raise SystemExit(f'forbidden imports: {sorted(imports)}')
          if forbidden_calls:
              raise SystemExit(f'forbidden calls: {forbidden_calls}')
          receipt = {
              'solve_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'imports': sorted(imports),
              'forbidden_calls': forbidden_calls,
          }
          Path('public-logs/static-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Train and evaluate two predeclared transfer models
        shell: bash
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          set -euo pipefail
          for seed in 43 314159; do
            python - "$seed" <<'PY'
          import sys
          from pathlib import Path
          seed = int(sys.argv[1])
          source = Path('/app/train_model.py').read_text(encoding='utf-8')
          source = source.replace('SEED = 42', f'SEED = {seed}', 1)
          Path('/app/train_model_dev.py').write_text(source, encoding='utf-8')
          PY
            python /app/train_model_dev.py | tee "public-logs/train-${seed}.txt"
            python /app/main.py --benchmark | tee "public-logs/eval-${seed}.txt"
          done

      - name: Adjudicate and freeze public transfer candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          rows = []
          for seed in (43, 314159):
              text = Path(f'public-logs/eval-{seed}.txt').read_text()
              match = re.search(
                  r'^result=(\w+) accuracy=([0-9.]+) bits_flipped=([0-9]+) '
                  r'gate=(\w+) solve_time=([0-9.]+)',
                  text,
                  re.MULTILINE,
              )
              if not match:
                  raise SystemExit(f'unparseable evaluation for seed {seed}: {text}')
              row = {
                  'seed': seed,
                  'result': match.group(1),
                  'accuracy': float(match.group(2)),
                  'bits_flipped': int(match.group(3)),
                  'gate': match.group(4),
                  'solve_time': float(match.group(5)),
              }
              rows.append(row)
              if row['result'] != 'ok' or row['gate'] != 'pass':
                  raise SystemExit(f'transfer gate failed: {row}')
              if row['accuracy'] >= 0.12 or row['bits_flipped'] > 40:
                  raise SystemExit(f'did not meet reference gate: {row}')

          solve = Path('/app/solve.py')
          plan = Path(
              'data_science_god_level/resnet_bitflip/logic-plan-receipt.json'
          )
          receipt = {
              'schema': 'data-science-god-level/resnet-bitflip-public/1',
              'autolab_commit': '7aff5fe71dfbe152fb0b8e8ac8087210b4bc27d5',
              'development_seeds': [43, 314159],
              'official_seed_used': False,
              'reference_bits': 40,
              'solve_sha256': hashlib.sha256(solve.read_bytes()).hexdigest(),
              'logic_plan_sha256': hashlib.sha256(plan.read_bytes()).hexdigest(),
              'rows': rows,
              'all_passed': True,
          }
          Path('public-logs/public-gate-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload transfer-development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-god-level-resnet-bitflip-public
          retention-days: 90
          path: |
            data_science_god_level/resnet_bitflip/solve.py
            data_science_god_level/resnet_bitflip/logic-plan-receipt.json
            public-logs/static-receipt.json
            public-logs/public-gate-receipt.json
            public-logs/train-43.txt
            public-logs/eval-43.txt
            public-logs/train-314159.txt
            public-logs/eval-314159.txt
