name: Public progressive anytime cross-fit verification

on:
  push:
    branches:
      - agent/inference-power-compiler-v2-public-ci
    paths:
      - 'inference_power_compiler_v2/verify_anytime_crossfit_public.py'
      - 'AnytimeCrossFitPublic.lean'
      - '.github/workflows/anytime-crossfit-public.yml'
  pull_request:
    paths:
      - 'inference_power_compiler_v2/verify_anytime_crossfit_public.py'
      - 'AnytimeCrossFitPublic.lean'
      - '.github/workflows/anytime-crossfit-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-anytime-crossfit-public:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind private sources and compile independent verifier
        shell: bash
        run: |
          set -euo pipefail
          verifier=inference_power_compiler_v2/verify_anytime_crossfit_public.py
          for digest in \
            e1dee787fd7b497456dab233fa016def5b75cd1d \
            80831b1d9d3d554474928082ebfae7c1c204e371 \
            4d81eb613d3373514361be4e19b93aece45eb8f3 \
            aebd02a033024804efcb47e572834aa98bd588e9 \
            1fc9221dade3779c7e5d16362e1f0f58459d9375 \
            bbb21ac88c1aa5242d6d7ae2bab8c59cc64031bb \
            11f59404860db7f2570c4b766d27e814622188ce \
            10cb158eea5770389e1f64446c1c3c60feed5414
          do
            test "$(grep -c "$digest" "$verifier")" = "1"
          done
          python -m py_compile "$verifier"

      - name: Execute independent anytime cross-fit replay
        shell: bash
        run: |
          set -euo pipefail
          python inference_power_compiler_v2/verify_anytime_crossfit_public.py \
            | tee anytime-crossfit-public.log
          test -s inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_REPORT.json
          test -s inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_CERTIFICATE.json
          sha256sum \
            inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_REPORT.json \
            inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_CERTIFICATE.json \
            > /tmp/anytime-crossfit-public-before.sha256
          python inference_power_compiler_v2/verify_anytime_crossfit_public.py \
            > /tmp/anytime-crossfit-public-rebuild.log
          sha256sum \
            inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_REPORT.json \
            inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_CERTIFICATE.json \
            > /tmp/anytime-crossfit-public-after.sha256
          cmp \
            /tmp/anytime-crossfit-public-before.sha256 \
            /tmp/anytime-crossfit-public-after.sha256

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile public anytime cross-fit boundary without axioms
        shell: bash
        run: |
          set -euo pipefail
          elan run leanprover/lean4:v4.33.0-rc1 lean \
            -o AnytimeCrossFitPublic.olean \
            AnytimeCrossFitPublic.lean \
            2>&1 | tee anytime-crossfit-public-lean.log
          test -s AnytimeCrossFitPublic.olean
          if grep -q 'sorryAx' anytime-crossfit-public-lean.log; then
            echo 'Unexpected sorryAx' >&2
            exit 1
          fi
          if grep -q 'depends on axioms:' anytime-crossfit-public-lean.log; then
            echo 'Unexpected Lean axiom dependency' >&2
            exit 1
          fi

      - name: Build public verification receipt
        shell: bash
        env:
          PUBLIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = {
              'report': Path('inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_REPORT.json'),
              'certificate': Path('inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_CERTIFICATE.json'),
              'verifier': Path('inference_power_compiler_v2/verify_anytime_crossfit_public.py'),
              'lean': Path('AnytimeCrossFitPublic.lean'),
          }
          receipt = {
              'schema': 'anytime-crossfit-public-verification-receipt/1',
              'repository': 'cristh99/notebooks',
              'head': os.environ['PUBLIC_HEAD_SHA'],
              'event_sha': os.environ['PUBLIC_EVENT_SHA'],
              'private_repository': 'cristh99/my_first_repository',
              'private_pull_request': 68,
              'private_head': 'e1dee787fd7b497456dab233fa016def5b75cd1d',
              'private_blobs': {
                  'compiler': '80831b1d9d3d554474928082ebfae7c1c204e371',
                  'runner': '4d81eb613d3373514361be4e19b93aece45eb8f3',
                  'tests': 'aebd02a033024804efcb47e572834aa98bd588e9',
                  'lean': '1fc9221dade3779c7e5d16362e1f0f58459d9375',
                  'workflow': 'bbb21ac88c1aa5242d6d7ae2bab8c59cc64031bb',
                  'crossfit_base': '11f59404860db7f2570c4b766d27e814622188ce',
                  'continuous_cs_base': '10cb158eea5770389e1f64446c1c3c60feed5414',
              },
              'sha256': {
                  name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for name, path in files.items()
              },
              'progressive_training': 'PASS',
              'held_out_scoring': 'PASS',
              'positivity': 'PASS',
              'bounded_scores': 'PASS',
              'zero_remainder': 'PASS',
              'product_rate_packet': 'PASS',
              'predictable_betting': 'PASS',
              'continuous_root_inversion': 'PASS',
              'truth_anytime_inclusion': 'PASS',
              'negative_controls': 'PASS',
              'semantic_replay': 'PASS',
              'deterministic_rebuild': 'PASS',
              'certificate_tamper_rejection': 'PASS',
              'semantic_forgery_rejection': 'PASS',
              'lean': 'PASS',
              'sorryAx': 'ABSENT',
              'axiom_dependencies': 'ABSENT',
          }
          path = Path('inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_RECEIPT.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_RECEIPT.sha256').write_text(
              f'{digest}  ANYTIME_CROSSFIT_PUBLIC_RECEIPT.json\n'
          )
          print(path.read_text())
          print(digest)
          PY

      - name: Upload public anytime cross-fit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytime-crossfit-public-evidence
          path: |
            inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_*.json
            inference_power_compiler_v2/ANYTIME_CROSSFIT_PUBLIC_RECEIPT.sha256
            inference_power_compiler_v2/verify_anytime_crossfit_public.py
            AnytimeCrossFitPublic.lean
            AnytimeCrossFitPublic.olean
            anytime-crossfit-public.log
            anytime-crossfit-public-lean.log
          if-no-files-found: error
          retention-days: 90
