name: Data Science dominance — one-shot TabArena V3

on:
  push:
    branches: [agent/data-science-dominance-tabarena-v3]
    paths: ['.github/workflows/data-science-dominance-tabarena-v3.yml']

permissions:
  contents: read

jobs:
  v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Prove workflow-only activation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$(git rev-parse HEAD^)" = '0b9bb659bcfe30701cbe5764c7ae75499be63efb'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/data-science-dominance-tabarena-v3.yml'
          echo "DOMINANCE_V3_ACTIVATION_PARENT_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CPU competitors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dominance-v3-logs
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'scipy==1.14.1' 'pandas==2.2.3' \
            'scikit-learn==1.5.2' 'openml==0.15.1' \
            'catboost==1.2.8' 'lightgbm==4.6.0' 'xgboost==3.1.3'
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --disable-pip-version-check \
            'einops>=0.7' 'psutil' 'tqdm>=4.64' 'huggingface-hub'
          python -m pip install --disable-pip-version-check --no-deps \
            'git+https://github.com/soda-inria/tabicl.git@46b91961db4f8873dd049ec09990698a435e1e29'
          python -m pip freeze | sort > dominance-v3-logs/pip-freeze.txt
      - name: Reconstruct and execute frozen V3 protocol
        shell: bash
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set +e
          root='data_science_dominance/tabarena_portfolio_v3'
          echo '3ea2e65cda7d2c74c6b555a8da72041492d5be0a32edca4ffbfdec9a632c94d5  data_science_dominance/tabarena_portfolio_v3/TRANSPORT_MANIFEST_V3.json' | sha256sum -c -
          echo '012f32fc0eea68789c35d9826a7b0675dce99752b7a73b8b6d36974f43e7bb19  data_science_dominance/tabarena_portfolio_v3/transport/part_00.b64' | sha256sum -c -
          echo '5cfd443d5c61dec3b090f20dc0b6c8ea3987cb43b5eb96b0f6a36fce1c3a5709  data_science_dominance/tabarena_portfolio_v3/transport/part_01.b64' | sha256sum -c -
          echo 'b0da5f566dc7436345f4c0f2ecb43037389a8d13c65c917d7e99e8256dcf5587  data_science_dominance/tabarena_portfolio_v3/transport/part_02.b64' | sha256sum -c -
          echo 'ffd7ae312219e40288fabe7552c15fb0d09464941b497b004acca9d9473339d8  data_science_dominance/tabarena_portfolio_v3/transport/part_03.b64' | sha256sum -c -
          echo 'c5d300c58df1140cf8ae77b42be8cbc0dd53b4c11eb4ad0a48ee3b45d8240e59  data_science_dominance/tabarena_portfolio_v3/transport/part_04.b64' | sha256sum -c -
          echo 'ecafdc8b8f0fc4a38af3fc232ad1575984d305064544b7f9c2facff08bab42f2  data_science_dominance/tabarena_portfolio_v3/transport/part_05.b64' | sha256sum -c -
          echo 'f3de8e19ebda80917052406451cb7fade1e1be30b74efce2a3fd5cd4362deb88  data_science_dominance/tabarena_portfolio_v3/transport/part_06.b64' | sha256sum -c -
          echo '2ff6a71c34bce0ef1d2ca30c9f31a10fd28d04e2572198cac891a09784492f44  data_science_dominance/tabarena_portfolio_v3/transport/part_07.b64' | sha256sum -c -
          cat "$root"/transport/part_*.b64 > /tmp/v3.b64
          echo '86b7be1c4b91c4fa22674968753d0febbab169f24a1f33f15c51a18702e07482  /tmp/v3.b64' | sha256sum -c -
          base64 -d /tmp/v3.b64 > /tmp/v3.tar.gz
          echo 'a9f76d0d1ab1473979bf998c81a035f11ccebd1a92f33fad42415153ef71c68d  /tmp/v3.tar.gz' | sha256sum -c -
          tar xzf /tmp/v3.tar.gz -C .
          bash "$root/run_ci_v3.sh"
          status=$?
          echo "$status" > dominance-v3-logs/ci-exit-status.txt
          exit 0
      - name: Upload complete immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-dominance-tabarena-fresh12-v3
          retention-days: 90
          path: |
            data_science_dominance/tabarena_portfolio_v3/**
            data_science_god_level/tabular_transfer/estimator.py
            dominance-v3-logs/**
      - name: Enforce one-shot V3 verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('dominance-v3-logs/freeze-receipt.json')
          if not path.exists():
              raise SystemExit('V3 receipt missing; evidence preserved')
          receipt = json.loads(path.read_text())
          if receipt['actual_external_evaluation_count'] != 1:
              raise SystemExit('V3 evaluation invalid or incomplete; evidence preserved')
          if receipt['verdict'] != 'PASS':
              raise SystemExit(f"V3 gate: {receipt['verdict']}; no retuning")
          print(f"V3 PASS; canonical score {receipt['score_after']}/1000")
          PY
