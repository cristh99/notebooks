name: Data Science dominance — DAB entity-resolution detail extract

on:
  push:
    branches:
      - agent/data-science-dominance-dab-slice
    paths:
      - '.github/workflows/data-science-dominance-dab-detail-extract-v2.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DAB_SHA: 9a55e34271a2500a41cbc009e239edd94599e374
      PGPASSWORD: postgres
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Prove workflow-only activation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test "$(git rev-parse HEAD^)" = '75fa11ca8f0546e224fc251d9a48675032a6275f'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/data-science-dominance-dab-detail-extract-v2.yml'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client git-lfs
          python -m pip install --disable-pip-version-check 'huggingface-hub==1.2.1' 'psycopg2-binary==2.9.9'
      - name: Acquire exact visible sources
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --filter=blob:none --no-checkout https://github.com/ucbepic/DataAgentBench.git dab
          cd dab
          git sparse-checkout init --no-cone
          cat > .git/info/sparse-checkout <<'EOF'
          /dataset_manifest.tsv
          /query_usaspending/query_dataset/contracts.sql
          /query_usaspending/query_dataset/recipients.db
          /query_stockindex/query_dataset/indexInfo_query.db
          /query_stockindex/query_dataset/indextrade_query.db
          EOF
          git -c advice.detachedHead=false checkout "$DAB_SHA"
          cd ..
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from huggingface_hub import hf_hub_download
          root=Path('dab')
          selected=[
            'query_usaspending/query_dataset/contracts.sql',
            'query_usaspending/query_dataset/recipients.db',
            'query_stockindex/query_dataset/indexInfo_query.db',
            'query_stockindex/query_dataset/indextrade_query.db',
          ]
          manifest={}
          for line in (root/'dataset_manifest.tsv').read_text().splitlines():
            if line and not line.startswith('#'):
              p,h,s=line.split('\t'); manifest[p]=(h,int(s))
          def digest(p):
            h=hashlib.sha256()
            with Path(p).open('rb') as f:
              for c in iter(lambda:f.read(1<<20),b''): h.update(c)
            return h.hexdigest()
          for rel in selected:
            p=root/rel; exp=manifest[rel]
            if not (p.is_file() and p.stat().st_size==exp[1] and digest(p)==exp[0]):
              hf_hub_download(repo_id='ruiyingm/DataAgentBench-data',repo_type='dataset',filename=rel,local_dir=str(root),force_download=True)
            assert (digest(p),p.stat().st_size)==exp
          PY
      - name: Import contracts
        shell: bash
        run: |
          dropdb --if-exists -h 127.0.0.1 -U postgres usaspending_contracts
          createdb -h 127.0.0.1 -U postgres usaspending_contracts
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d usaspending_contracts -f dab/query_usaspending/query_dataset/contracts.sql > postgres-import.log
      - name: Export entity-resolution surfaces and stock symbols
        shell: bash
        run: |
          mkdir -p entity-evidence
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          import duckdb, psycopg2
          conn=psycopg2.connect(host='127.0.0.1',port=5432,user='postgres',password='postgres',dbname='usaspending_contracts')
          try:
            with conn.cursor() as cur:
              cur.execute('SELECT award_id, recipient_uei, awarding_agency FROM contracts')
              contracts=[{'award_id':str(a),'recipient_uei':str(u),'awarding_agency':str(g)} for a,u,g in cur.fetchall()]
          finally: conn.close()
          Path('entity-evidence/contracts-entity-surfaces.json').write_text(json.dumps(contracts,indent=2,sort_keys=True)+'\n')
          s=sqlite3.connect('dab/query_usaspending/query_dataset/recipients.db')
          try:
            recipients=[{'uei':str(u),'name':str(n),'state':str(st)} for u,n,st in s.execute('SELECT uei,name,state FROM recipients')]
          finally:s.close()
          Path('entity-evidence/recipients-surfaces.json').write_text(json.dumps(recipients,indent=2,sort_keys=True)+'\n')
          s=sqlite3.connect('dab/query_stockindex/query_dataset/indexInfo_query.db')
          try:
            cols=[r[1] for r in s.execute('PRAGMA table_info(index_info)')]
            info=[dict(zip(cols,row)) for row in s.execute('SELECT * FROM index_info')]
          finally:s.close()
          d=duckdb.connect('dab/query_stockindex/query_dataset/indextrade_query.db',read_only=True)
          try:
            symbols=[r[0] for r in d.execute('SELECT DISTINCT "Index" FROM index_trade ORDER BY 1').fetchall()]
          finally:d.close()
          Path('entity-evidence/stock-index-info.json').write_text(json.dumps(info,indent=2,sort_keys=True,default=str)+'\n')
          Path('entity-evidence/stock-symbols.json').write_text(json.dumps(symbols,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps({'contracts':len(contracts),'recipients':len(recipients),'index_info_rows':len(info),'stock_symbols':len(symbols)},indent=2,sort_keys=True))
          PY
      - name: Upload detail evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-dominance-dab-entity-detail
          retention-days: 14
          if-no-files-found: error
          path: |
            entity-evidence/**
            postgres-import.log
