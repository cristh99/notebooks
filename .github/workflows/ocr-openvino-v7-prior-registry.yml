name: OpenVINO v7 runtime and terminal contract tests

on:
  push:
    branches:
      - agent/openvino-v7-smoke-16-stacked-v2
    paths:
      - "ocr_real_risk_v1/openvino_runtime_lock_v7.py"
      - "ocr_real_risk_v1/openvino_preexecution_gate_v7.py"
      - "ocr_real_risk_v1/openvino_terminal_ledger_v7.py"
      - "ocr_real_risk_v1/test_openvino_runtime_terminal_v7.py"
      - ".github/workflows/ocr-openvino-v7-prior-registry.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: openvino-v7-runtime-terminal-contract
  cancel-in-progress: false

env:
  RUNTIME_ARTIFACT_ID: "8992594936"
  RUNTIME_ARTIFACT_SHA256: "b75a52b7b7d4105e623a90a98243dd0db815d057c42bb700282df12c6ceaf190"
  GH_TOKEN: ${{ github.token }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.11.15"

      - name: Install test dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.2.0

      - name: Recover exact immutable runtime lock
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUNTIME_ARTIFACT_ID}/zip" \
            > runtime-lock.zip
          echo "${RUNTIME_ARTIFACT_SHA256}  runtime-lock.zip" | sha256sum --check --strict
          mkdir runtime-lock
          unzip -q runtime-lock.zip -d runtime-lock
          (cd runtime-lock && sha256sum --check --strict SHA256SUMS.txt)
          echo "OPENVINO_TEST_RUNTIME_LOCK_ROOT=${GITHUB_WORKSPACE}/runtime-lock" >> "$GITHUB_ENV"

      - name: Run runtime and terminal adversarial contracts
        run: |
          set -euo pipefail
          mkdir contract-evidence
          python -m unittest -v \
            ocr_real_risk_v1.test_openvino_runtime_terminal_v7 \
            2>&1 | tee contract-evidence/unittest.log
          python -m compileall -q \
            ocr_real_risk_v1/openvino_runtime_lock_v7.py \
            ocr_real_risk_v1/openvino_preexecution_gate_v7.py \
            ocr_real_risk_v1/openvino_terminal_ledger_v7.py \
            ocr_real_risk_v1/test_openvino_runtime_terminal_v7.py
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          log = Path('contract-evidence/unittest.log').read_text()
          match = re.search(r'Ran (\d+) tests?', log)
          assert match and int(match.group(1)) == 6
          assert log.rstrip().endswith('OK')
          receipt = {
              'schema': 'eaat.openvino_v7_runtime_terminal_contract/1',
              'status': 'PASS_RUNTIME_AND_TERMINAL_FAIL_CLOSED_CONTRACTS',
              'tests_passed': 6,
              'exact_runtime_artifact_replayed': True,
              'runtime_substitution_rejected': True,
              'missing_preexecution_environment_rejected': True,
              'terminal_source_substitution_rejected': True,
              'valid_pass_terminalized_once': True,
              'second_terminalization_rejected': True,
              'aggregate_substitution_rejected': True,
              'claim_git_identity_substitution_rejected': True,
              'scientific_execution_authorized': False,
              'openvino_scientific_images_opened': 0,
              'ocr_runs': 0,
              'candidate_inference_runs': 0,
          }
          Path('contract-evidence/contract-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY
          (cd contract-evidence && \
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum \
              | sed 's#  \./#  #' > SHA256SUMS.txt)
          (cd contract-evidence && sha256sum --check --strict SHA256SUMS.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openvino-v7-runtime-terminal-contract-${{ github.sha }}
          path: contract-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
