name: Apply WildReceipt physical-unit invariance v1

on:
  push:
    branches:
      - agent/ocr-consensus-detector-v4
    paths:
      - '.github/workflows/apply-wildreceipt-physical-invariance-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-wildreceipt-physical-invariance-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Move to latest isolated branch head
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - name: Apply physical-unit invariance hardening
        run: python .github/scripts/apply_wildreceipt_physical_invariance_v1.py
      - name: Install pinned test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 \
            numpy==2.2.6 \
            opencv-python-headless==4.10.0.84 \
            scikit-learn==1.8.0 \
            joblib==1.5.3 \
            pyarrow==18.1.0 \
            pytesseract==0.3.13
      - name: Prove duplicate-association invariance
        run: |
          python -m unittest -v \
            ocr_real_risk_v1.test_wildreceipt_adapter \
            ocr_real_risk_v1.test_wildreceipt_external \
            ocr_real_risk_v1.test_numeric_consensus_candidate_v4_wildreceipt
          python -m compileall -q ocr_real_risk_v1
          python - <<'PY'
          from ocr_real_risk_v1.numeric_consensus_candidate_v4_wildreceipt import (
              CANDIDATE_ID,
              CANDIDATE_SCHEMA,
              external_protocol,
          )
          from ocr_real_risk_v1.wildreceipt_adapter import selection_rank
          from ocr_real_risk_v1.wildreceipt_external import physical_counterfactual

          first = selection_rank(
              image_sha256='a' * 64,
              bbox=[1, 2, 30, 40],
              truth='12345',
          )
          second = selection_rank(
              image_sha256='a' * 64,
              bbox=(1, 2, 30, 40),
              truth='12345',
          )
          assert first == second
          evidence = 'b' * 64
          assert physical_counterfactual('12345', evidence) == \
              physical_counterfactual('12345', evidence)
          protocol = external_protocol()
          assert CANDIDATE_SCHEMA.endswith('/6')
          assert CANDIDATE_ID.endswith('schema-v3')
          assert protocol['selection']['physical_association_invariant'] is True
          assert protocol['counterfactual']['physical_association_invariant'] is True
          assert protocol['power_plan'][
              'minimum_selected_for_projected_400_accepts'
          ] == 1246
          print({
              'candidate_id': CANDIDATE_ID,
              'candidate_schema': CANDIDATE_SCHEMA,
              'protocol_id': protocol['protocol_id'],
              'selection_rank': first,
              'counterfactual': physical_counterfactual('12345', evidence),
          })
          PY
      - name: Commit physical-unit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ocr_real_risk_v1/wildreceipt_adapter.py \
            ocr_real_risk_v1/numeric_consensus_candidate_v4_wildreceipt.py \
            ocr_real_risk_v1/wildreceipt_external.py \
            ocr_real_risk_v1/test_wildreceipt_adapter.py \
            ocr_real_risk_v1/test_numeric_consensus_candidate_v4_wildreceipt.py \
            ocr_real_risk_v1/test_wildreceipt_external.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Make WildReceipt risk units invariant to shard association'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
