name: OpenVINO v7 exact quality-runtime freeze v1

on:
  push:
    branches:
      - agent/openvino-v7-smoke-16-stacked-v2
    paths:
      - ".github/workflows/ocr-openvino-v7-prior-registry-v2.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: openvino-v7-runtime-freeze-v1
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  OMP_THREAD_LIMIT: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  freeze:
    name: Build and hash exact CPU quality runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.11.15"

      - name: Build exact Tesseract 5.3.4 source commit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config g++ make git ca-certificates \
            libleptonica-dev libpng-dev libjpeg-dev libtiff-dev zlib1g-dev \
            libwebp-dev libopenjp2-7-dev libarchive-dev libcurl4-openssl-dev \
            libicu-dev libpango1.0-dev libcairo2-dev tesseract-ocr-eng
          git clone --filter=blob:none --no-checkout \
            https://github.com/tesseract-ocr/tesseract.git /tmp/tesseract-5.3.4
          git -C /tmp/tesseract-5.3.4 fetch --depth 1 origin \
            8ee020e14cf5be4e3f0e9beb09b6b050a1871854
          git -C /tmp/tesseract-5.3.4 checkout --detach \
            8ee020e14cf5be4e3f0e9beb09b6b050a1871854
          test "$(git -C /tmp/tesseract-5.3.4 rev-parse HEAD)" = \
            "8ee020e14cf5be4e3f0e9beb09b6b050a1871854"
          cd /tmp/tesseract-5.3.4
          ./autogen.sh
          ./configure --disable-doc
          make -j2
          sudo make install
          sudo ldconfig
          ENG_TRAINEDDATA="$(dpkg -L tesseract-ocr-eng | grep '/eng.traineddata$' | head -1)"
          test -f "$ENG_TRAINEDDATA"
          sudo mkdir -p /usr/local/share/tessdata
          sudo cp "$ENG_TRAINEDDATA" /usr/local/share/tessdata/eng.traineddata
          echo "TESSDATA_PREFIX=/usr/local/share/tessdata" >> "$GITHUB_ENV"
          /usr/local/bin/tesseract --version | tee /tmp/tesseract-version.txt
          test "$(head -1 /tmp/tesseract-version.txt)" = "tesseract 5.3.4"

      - name: Install complete pinned Python dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            Pillow==12.2.0 \
            numpy==2.2.6 \
            opencv-python-headless==4.10.0.84 \
            scikit-learn==1.8.0 \
            scipy==1.17.1 \
            threadpoolctl==3.6.0 \
            joblib==1.5.3 \
            pyarrow==18.1.0 \
            pytesseract==0.3.13 \
            duckdb==1.5.5 \
            packaging==26.3

      - name: Capture complete file-level runtime identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime-lock
          mkdir runtime-lock
          python -m pip freeze --all | LC_ALL=C sort > runtime-lock/python-freeze.txt
          python -m pip debug --verbose > runtime-lock/pip-debug.txt
          dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' \
            | LC_ALL=C sort > runtime-lock/dpkg-packages.txt
          cp /tmp/tesseract-version.txt runtime-lock/tesseract-version.txt
          uname -a > runtime-lock/uname.txt
          lscpu > runtime-lock/lscpu.txt
          locale > runtime-lock/locale.txt
          cp /etc/os-release runtime-lock/os-release.txt

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path('runtime-lock')
          distributions = (
              'Pillow', 'numpy', 'opencv-python-headless', 'scikit-learn',
              'scipy', 'threadpoolctl', 'joblib', 'pyarrow', 'pytesseract',
              'duckdb', 'packaging',
          )

          def sha(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          package_rows: list[str] = []
          native_candidates: set[Path] = {
              Path(sys.executable).resolve(),
              Path('/usr/local/bin/tesseract').resolve(),
          }
          package_versions: dict[str, str] = {}
          for name in distributions:
              dist = importlib.metadata.distribution(name)
              package_versions[name] = dist.version
              for item in dist.files or ():
                  path = Path(dist.locate_file(item))
                  if not path.is_file():
                      continue
                  resolved = path.resolve()
                  package_rows.append(
                      f'{name}\t{item.as_posix()}\t{sha(resolved)}\t{resolved.stat().st_size}'
                  )
                  if resolved.suffix == '.so' or '.so.' in resolved.name:
                      native_candidates.add(resolved)
          package_rows.sort()
          package_manifest = root / 'python-files.sha256'
          package_manifest.write_text('\n'.join(package_rows) + '\n')

          native_paths: set[Path] = set()
          ldd_pattern = re.compile(r'(?:=>\s+)?(/[^\s]+)')
          for candidate in sorted(native_candidates):
              if not candidate.is_file():
                  raise RuntimeError(f'missing native candidate: {candidate}')
              native_paths.add(candidate)
              result = subprocess.run(
                  ['ldd', str(candidate)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
              )
              if result.returncode not in {0, 1}:
                  raise RuntimeError(f'ldd failed for {candidate}: {result.stdout}')
              for match in ldd_pattern.finditer(result.stdout):
                  path = Path(match.group(1))
                  if path.is_file():
                      native_paths.add(path.resolve())
          native_rows = [
              f'{path}\t{sha(path)}\t{path.stat().st_size}'
              for path in sorted(native_paths)
          ]
          native_manifest = root / 'native-files.sha256'
          native_manifest.write_text('\n'.join(native_rows) + '\n')

          traineddata = Path('/usr/local/share/tessdata/eng.traineddata')
          python_executable = Path(sys.executable).resolve()
          tesseract_binary = Path('/usr/local/bin/tesseract').resolve()
          first = subprocess.check_output(
              [str(tesseract_binary), '--version'], text=True
          ).splitlines()[0]
          if first != 'tesseract 5.3.4':
              raise RuntimeError(first)
          runner = {
              'runner_os': os.environ.get('RUNNER_OS'),
              'runner_arch': os.environ.get('RUNNER_ARCH'),
              'image_os': os.environ.get('ImageOS'),
              'image_version': os.environ.get('ImageVersion'),
          }
          (root / 'runner-metadata.json').write_text(
              json.dumps(runner, indent=2, sort_keys=True) + '\n'
          )
          lock = {
              'schema': 'eaat.openvino_v7_quality_runtime_lock/1',
              'status': 'FROZEN_QUALITY_RUNTIME_NO_SPEED_CLAIM',
              'repository_commit': os.environ['GITHUB_SHA'],
              'runner': runner,
              'platform': {
                  'python': platform.python_version(),
                  'implementation': platform.python_implementation(),
                  'machine': platform.machine(),
                  'system': platform.system(),
                  'release': platform.release(),
              },
              'python': {
                  'version': platform.python_version(),
                  'executable': str(python_executable),
                  'executable_sha256': sha(python_executable),
                  'package_versions': package_versions,
                  'freeze_sha256': sha(root / 'python-freeze.txt'),
                  'package_files_manifest_sha256': sha(package_manifest),
                  'pip_debug_sha256': sha(root / 'pip-debug.txt'),
              },
              'tesseract': {
                  'version': '5.3.4',
                  'source_commit': '8ee020e14cf5be4e3f0e9beb09b6b050a1871854',
                  'binary': str(tesseract_binary),
                  'binary_sha256': sha(tesseract_binary),
                  'eng_traineddata': str(traineddata),
                  'eng_traineddata_sha256': sha(traineddata),
                  'version_report_sha256': sha(root / 'tesseract-version.txt'),
              },
              'system': {
                  'os_release_sha256': sha(root / 'os-release.txt'),
                  'dpkg_manifest_sha256': sha(root / 'dpkg-packages.txt'),
                  'native_files_manifest_sha256': sha(native_manifest),
                  'uname_sha256': sha(root / 'uname.txt'),
                  'lscpu_sha256': sha(root / 'lscpu.txt'),
                  'locale_sha256': sha(root / 'locale.txt'),
              },
              'execution': {
                  'pythonhashseed': '0',
                  'omp_thread_limit': '1',
                  'omp_num_threads': '1',
                  'openblas_num_threads': '1',
                  'mkl_num_threads': '1',
                  'numexpr_num_threads': '1',
                  'quality_claim_authorized': True,
                  'speed_claim_authorized': False,
                  'scientific_execution_authorized': False,
                  'openvino_scientific_images_opened': 0,
                  'ocr_runs': 0,
                  'candidate_inference_runs': 0,
                  'external_spend_usd': 0,
              },
          }
          unsigned = json.dumps(
              lock, sort_keys=True, separators=(',', ':'), ensure_ascii=False
          ).encode()
          lock['stable_payload_sha256'] = hashlib.sha256(unsigned).hexdigest()
          (root / 'runtime-lock.json').write_text(
              json.dumps(lock, indent=2, sort_keys=True) + '\n'
          )
          PY

          (cd runtime-lock && \
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum \
              | sed 's#  \./#  #' > SHA256SUMS.txt)
          (cd runtime-lock && sha256sum --check --strict SHA256SUMS.txt)

      - name: Independently replay all declared file identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def sha(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          root = Path('runtime-lock')
          payload = json.loads((root / 'runtime-lock.json').read_text())
          observed = payload.pop('stable_payload_sha256')
          raw = json.dumps(
              payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False
          ).encode()
          assert observed == hashlib.sha256(raw).hexdigest()
          assert payload['status'] == 'FROZEN_QUALITY_RUNTIME_NO_SPEED_CLAIM'
          assert payload['platform']['python'] == '3.11.15'
          assert payload['tesseract']['version'] == '5.3.4'
          assert payload['tesseract']['source_commit'] == \
              '8ee020e14cf5be4e3f0e9beb09b6b050a1871854'
          assert payload['python']['executable_sha256'] == sha(
              Path(payload['python']['executable'])
          )
          assert payload['tesseract']['binary_sha256'] == sha(
              Path(payload['tesseract']['binary'])
          )
          assert payload['tesseract']['eng_traineddata_sha256'] == sha(
              Path(payload['tesseract']['eng_traineddata'])
          )
          assert payload['python']['freeze_sha256'] == sha(
              root / 'python-freeze.txt'
          )
          assert payload['python']['package_files_manifest_sha256'] == sha(
              root / 'python-files.sha256'
          )
          assert payload['system']['native_files_manifest_sha256'] == sha(
              root / 'native-files.sha256'
          )
          assert payload['system']['dpkg_manifest_sha256'] == sha(
              root / 'dpkg-packages.txt'
          )
          assert payload['execution']['speed_claim_authorized'] is False
          assert payload['execution']['scientific_execution_authorized'] is False
          assert payload['execution']['openvino_scientific_images_opened'] == 0
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openvino-v7-quality-runtime-lock-${{ github.sha }}
          path: runtime-lock/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
