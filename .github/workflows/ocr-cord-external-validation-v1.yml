      - name: Independent aggregate certificate gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ocr_real_risk_v1.cord_aggregate import (
              AGGREGATE_SCHEMA,
          )
          from ocr_real_risk_v1.cord_natural_holdout import (
              verify_hash_manifest,
          )
          from ocr_real_risk_v1.sroie_natural_holdout import (
              verify_stable_payload,
          )

          root = Path('cord-aggregate-v1')
          verify_hash_manifest(root)
          report = json.loads(
              (root / 'cord_natural_holdout_aggregate.json').read_text()
          )
          assert report['schema'] == AGGREGATE_SCHEMA
          assert verify_stable_payload(
              report, 'stable_payload_sha256'
          )
          assert report['dataset']['published_rows'] == 1000
          assert report['candidate_binding']['artifact_id'] == 8917522937
          assert report['candidate_binding']['model_sha256'] == \
              '53229915331c2bbea2454f9e7cb5768a26e9edb30de750747f4397f1ff4cf92c'
          assert report['execution']['published_rows'] == 1000
          assert report['execution'][
              'receipt_associated_selected_locations'
          ] >= report['execution']['unique_physical_locations']
          assert report['decision'][
              'external_natural_scan_validation_complete'
          ] is True
          assert report['decision']['candidate_bound_before_ocr'] is True
          assert report['decision']['automatic_production_change'] is False
          assert report['decision'][
              'honduras_production_readiness_claimed'
          ] is False
          if report['decision']['pass_statistical_10x']:
              assert report['candidate']['accepted'] >= \
                  report['protocol']['minimum_accepted']
              assert report['candidate'][
                  'simultaneous_95pct_coverage_lower'
              ] >= report['protocol']['minimum_coverage_lower']
              assert report['candidate'][
                  'certified_error_reduction_lower'
              ] >= report['protocol']['target_error_reduction']
              assert report['counterfactual'][
                  'simultaneous_95pct_upper'
              ] <= report['protocol']['counterfactual_maximum_upper']
              assert report['stability']['pass'] is True
          print(json.dumps({
              'execution': report['execution'],
              'baseline': report['baseline'],
              'candidate': report['candidate'],
              'counterfactual': report['counterfactual'],
              'stability': {
                  key: value
                  for key, value in report['stability'].items()
                  if key != 'folds'
              },
              'decision': report['decision'],
              'stable_payload_sha256':
                  report['stable_payload_sha256'],
          }, indent=2, sort_keys=True))
