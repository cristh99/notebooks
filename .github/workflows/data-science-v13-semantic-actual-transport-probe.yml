name: Data Science v13 - semantic internal-hash probe

on:
  push:
    branches: [agent/data-science-v13-semantic-real-probe-v1]
    paths:
      - '.github/workflows/data-science-v13-semantic-actual-transport-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-science-v13-semantic-internal-hash-probe
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Decode transport and verify frozen internal files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = cristh99/notebooks
          test "$GITHUB_REF" = refs/heads/agent/data-science-v13-semantic-real-probe-v1
          root=data_science_pipeline_v13_semantic_snapshot
          archive="$RUNNER_TEMP/semantic-actual.zip"
          out=semantic-v13-internal-probe-evidence
          mkdir -p "$out"
          cat "$root"/transport/part_*.b64 | base64 --decode > "$archive"
          sha256sum "$archive" | tee "$out/actual-zip.sha256"
          python3 - "$archive" . "$out" <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib, json, sys
          archive=Path(sys.argv[1]); repo=Path(sys.argv[2]).resolve(); out=Path(sys.argv[3])
          prefix=PurePosixPath('data_science_pipeline_v13_semantic_snapshot')
          expected={
            str(prefix)+'/', str(prefix/'FREEZE.json'), str(prefix/'LOCAL_RESULT.json'),
            str(prefix/'README.md'), str(prefix/'SEMANTIC_CONTRACT.json'),
            str(prefix/'SYNTHETIC_RESOLVED_EVENTS.jsonl'), str(prefix/'SYNTHETIC_SEMANTIC_SNAPSHOT.json'),
            str(prefix/'VERIFY_OUTPUT.json'), str(prefix/'semantic.py'), str(prefix/'test_semantic.py'), str(prefix/'verify.py')
          }
          with ZipFile(archive) as z:
            names=z.namelist()
            if len(names)!=len(set(names)) or set(names)!=expected:
              raise SystemExit(f'unexpected members: {sorted(set(names)^expected)}')
            for name in names:
              p=PurePosixPath(name)
              if p.is_absolute() or '..' in p.parts:
                raise SystemExit(f'unsafe member: {name}')
            z.extractall(repo)
          root=repo/str(prefix)
          freeze=json.loads((root/'FREEZE.json').read_text())
          mapping={
            'contract':'SEMANTIC_CONTRACT.json','input':'SYNTHETIC_RESOLVED_EVENTS.jsonl',
            'readme':'README.md','snapshot':'SYNTHETIC_SEMANTIC_SNAPSHOT.json',
            'source':'semantic.py','tests':'test_semantic.py','verifier':'verify.py'
          }
          checks={key:hashlib.sha256((root/name).read_bytes()).hexdigest()==freeze['file_sha256'][key] for key,name in mapping.items()}
          if not all(checks.values()): raise SystemExit(checks)
          payload={
            'schema':'data-science-pipeline/semantic-internal-transport-probe/1',
            'actual_zip_bytes':archive.stat().st_size,
            'actual_zip_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
            'actual_zip_git_blob_sha1':hashlib.sha1(f'blob {archive.stat().st_size}\0'.encode()+archive.read_bytes()).hexdigest(),
            'declared_zip_sha256':'dcd591d430012ea713acc81c1b65cf6b6c6c599a77552a432b35c6cbde188408',
            'declared_zip_matches':False,
            'internal_file_checks':checks,
            'external_cost_usd':0.0,'production_modified':False,'scientific_promotion_credit':0,
            'real_data_evaluations':0,'stage09_unblocked':False
          }
          (out/'PROBE_RESULT.json').write_text(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n')
          PY
          (
            cd "$root"
            python3 -m unittest -v test_semantic.py |& tee "$GITHUB_WORKSPACE/$out/tests.log"
            python3 verify.py | tee "$GITHUB_WORKSPACE/$out/verify.stdout"
          )
          cp "$root"/{FREEZE.json,LOCAL_RESULT.json,README.md,SEMANTIC_CONTRACT.json,SYNTHETIC_RESOLVED_EVENTS.jsonl,SYNTHETIC_SEMANTIC_SNAPSHOT.json,VERIFY_OUTPUT.json,semantic.py,test_semantic.py,verify.py} "$out/"
          (
            cd "$out"
            sha256sum * > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-v13-internal-probe-evidence
          path: semantic-v13-internal-probe-evidence
          if-no-files-found: error
          retention-days: 30
