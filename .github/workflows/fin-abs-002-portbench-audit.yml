name: FIN-ABS-002 — PortBench data audit

on:
  pull_request:
    branches:
      - agent/finance-absolute-423-public-replay
    paths:
      - 'fin_abs_002_portbench/**'
      - 'README_FIN_ABS_002_PORTBENCH.md'
      - '.github/workflows/fin-abs-002-portbench-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin-abs-002-portbench-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout frozen capsule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic audit dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.3.2 pandas==2.3.1

      - name: Compile and test audit invariants
        run: |
          python -m compileall -q fin_abs_002_portbench
          python -m unittest -v fin_abs_002_portbench.test_audit

      - name: Download frozen PortBench market file
        run: |
          set -euo pipefail
          mkdir -p .cache/fin_abs_002_portbench reports/fin_abs_002_portbench
          curl --location --fail --show-error --silent \
            --retry 5 --retry-all-errors --connect-timeout 30 --max-time 900 \
            'https://huggingface.co/datasets/AgenticFinLab/PortBench-Market/resolve/main/market-base-dataset.csv?download=true' \
            --output .cache/fin_abs_002_portbench/market-base-dataset.csv
          echo '495659fb40690d48748dcbcbd8c8c2add5371fac9d5be535270959ae8f519221  .cache/fin_abs_002_portbench/market-base-dataset.csv' \
            | sha256sum -c -

      - name: Audit external dataset before portfolio construction
        run: |
          python -m fin_abs_002_portbench.audit \
            --input .cache/fin_abs_002_portbench/market-base-dataset.csv \
            --output reports/fin_abs_002_portbench/data_audit.json

      - name: Independent Node replay
        run: |
          node fin_abs_002_portbench/verify_audit.mjs \
            reports/fin_abs_002_portbench/data_audit.json \
            .cache/fin_abs_002_portbench/market-base-dataset.csv \
            reports/fin_abs_002_portbench/node_audit_receipt.json

      - name: Build evidence manifest
        run: |
          sha256sum \
            reports/fin_abs_002_portbench/data_audit.json \
            reports/fin_abs_002_portbench/node_audit_receipt.json \
            > reports/fin_abs_002_portbench/manifest.sha256

      - name: Upload bounded audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-abs-002-portbench-data-audit
          path: reports/fin_abs_002_portbench/
          if-no-files-found: error
          retention-days: 90
