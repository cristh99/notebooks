name: Apply WildReceipt finite-population power plan v3

on:
  push:
    branches:
      - agent/ocr-consensus-detector-v4
    paths:
      - '.github/workflows/apply-wildreceipt-power-plan-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-wildreceipt-power-plan-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Move to latest isolated branch head
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - name: Apply deterministic finite-population correction
        run: python .github/scripts/apply_wildreceipt_power_plan_v2.py
      - name: Install pinned test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 \
            numpy==2.2.6 \
            opencv-python-headless==4.10.0.84 \
            scikit-learn==1.8.0 \
            joblib==1.5.3 \
            pyarrow==18.1.0 \
            pytesseract==0.3.13
      - name: Prove finite-population consistency
        run: |
          python -m unittest -v \
            ocr_real_risk_v1.test_wildreceipt_adapter \
            ocr_real_risk_v1.test_wildreceipt_external \
            ocr_real_risk_v1.test_numeric_consensus_candidate_v4_wildreceipt
          python -m compileall -q ocr_real_risk_v1
          python - <<'PY'
          import math
          from ocr_real_risk_v1.numeric_consensus_candidate_v4_wildreceipt import external_protocol
          power = external_protocol()['power_plan']
          expected = math.ceil(400 / (319 / 993))
          assert expected == 1246
          assert power['minimum_selection_yield_required'] == 1200 / 1739
          assert power['minimum_selected_for_projected_400_accepts'] == expected
          assert power['minimum_selection_yield_for_projected_400_accepts'] == expected / 1739
          assert expected <= power['maximum_possible_selected_unique_receipts']
          assert power['finite_population_feasibility'] is True
          print(power)
          PY
      - name: Commit corrected power plan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ocr_real_risk_v1/numeric_consensus_candidate_v4_wildreceipt.py \
            ocr_real_risk_v1/test_numeric_consensus_candidate_v4_wildreceipt.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Correct WildReceipt finite-population power plan'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
