name: FIN-ABS-001A — external FinVerBench slice

on:
  pull_request:
    branches:
      - main
    paths:
      - 'fin_abs_001_finver/**'
      - 'README_FIN_ABS_001_FINVER.md'
      - '.github/workflows/fin-abs-001-finver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout capsule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: capsule

      - name: Checkout pinned FinVerBench
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SiluPanda/finverification-bench
          ref: 8aef2f48befdab5c57cc383a521711fe11c2df98
          path: upstream

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Unit and counterexample tests
        working-directory: capsule
        run: |
          python -m compileall -q fin_abs_001_finver
          python -m unittest discover -v -s fin_abs_001_finver -p 'test_*.py'

      - name: Audit upstream contract and adapt committed SEC-XBRL corpus
        working-directory: capsule
        run: |
          set -euo pipefail
          rm -rf reports/fin_abs_001_finver
          mkdir -p reports/fin_abs_001_finver
          python -m fin_abs_001_finver.adapter_v3 \
            ../upstream/data/processed \
            reports/fin_abs_001_finver/adapted \
            --audit-output reports/fin_abs_001_finver/upstream_schema_audit.json

      - name: Build pinned error-injection benchmark
        working-directory: capsule
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream/src:${{ github.workspace }}/capsule
        run: |
          python -m fin_abs_001_finver.build_benchmark \
            reports/fin_abs_001_finver/adapted \
            reports/fin_abs_001_finver/benchmark \
            ../upstream/src

      - name: Evaluate exact and rounded variants
        working-directory: capsule
        run: |
          python -m fin_abs_001_finver.evaluate \
            reports/fin_abs_001_finver/benchmark/benchmark.json \
            reports/fin_abs_001_finver/benchmark/build_manifest.json \
            reports/fin_abs_001_finver/adapted/adapter_manifest.json \
            reports/fin_abs_001_finver/upstream_schema_audit.json \
            --output-dir reports/fin_abs_001_finver/evaluation

      - name: Independent Node replay
        working-directory: capsule
        run: |
          node fin_abs_001_finver/verify_report.mjs \
            reports/fin_abs_001_finver/evaluation/report.json \
            reports/fin_abs_001_finver/evaluation/predictions_exact.jsonl \
            reports/fin_abs_001_finver/evaluation/predictions_rounded.jsonl \
            reports/fin_abs_001_finver/evaluation/node_receipt.json

      - name: Reject forged score and predictions
        working-directory: capsule
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/fin_abs_001_finver/evaluation/report.json').read_text())
          report['payload']['absolute_score_readout']['after'] = 500
          Path('/tmp/forged_report.json').write_text(json.dumps(report))
          rows = Path('reports/fin_abs_001_finver/evaluation/predictions_exact.jsonl').read_text().splitlines()
          row = json.loads(rows[0])
          row['decision'] = 'ERROR' if row['decision'] != 'ERROR' else 'CLEAN'
          rows[0] = json.dumps(row, sort_keys=True)
          Path('/tmp/forged_predictions.jsonl').write_text('\n'.join(rows) + '\n')
          PY
          if node fin_abs_001_finver/verify_report.mjs \
              /tmp/forged_report.json \
              reports/fin_abs_001_finver/evaluation/predictions_exact.jsonl \
              reports/fin_abs_001_finver/evaluation/predictions_rounded.jsonl \
              /tmp/forged_score_receipt.json; then
            echo 'forged score accepted' >&2
            exit 1
          fi
          if node fin_abs_001_finver/verify_report.mjs \
              reports/fin_abs_001_finver/evaluation/report.json \
              /tmp/forged_predictions.jsonl \
              reports/fin_abs_001_finver/evaluation/predictions_rounded.jsonl \
              /tmp/forged_prediction_receipt.json; then
            echo 'forged prediction accepted' >&2
            exit 1
          fi

      - name: Build evidence manifest
        working-directory: capsule
        run: |
          sha256sum \
            reports/fin_abs_001_finver/upstream_schema_audit.json \
            reports/fin_abs_001_finver/adapted/adapter_manifest.json \
            reports/fin_abs_001_finver/benchmark/benchmark.json \
            reports/fin_abs_001_finver/benchmark/build_manifest.json \
            reports/fin_abs_001_finver/evaluation/report.json \
            reports/fin_abs_001_finver/evaluation/predictions_exact.jsonl \
            reports/fin_abs_001_finver/evaluation/predictions_rounded.jsonl \
            reports/fin_abs_001_finver/evaluation/node_receipt.json \
            > reports/fin_abs_001_finver/manifest.sha256

      - name: Upload bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-abs-001a-finverbench-external-slice
          path: capsule/reports/fin_abs_001_finver/
          if-no-files-found: error
          retention-days: 90
