name: Data Science v2 acquisition DNS pinning

on:
  push:
    branches:
      - agent/data-science-v2-acquisition-dns-pin
    paths:
      - '.github/workflows/data-science-v2-acquisition-dns-pin.yml'
      - 'data_science_pipeline_v2_acquisition/apply_overlay.sh'
      - 'data_science_pipeline_v2_acquisition/dns_pin.patch'
  pull_request:
    paths:
      - '.github/workflows/data-science-v2-acquisition-dns-pin.yml'
      - 'data_science_pipeline_v2_acquisition/apply_overlay.sh'
      - 'data_science_pipeline_v2_acquisition/dns_pin.patch'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reconstruct patched acquisition pipeline
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canonical-pipeline-v1"
          pipeline="$root/canonical_data_science_pipeline_v1"
          bash data_science_pipeline_v1/reconstruct.sh "$root"
          bash data_science_pipeline_v2_acquisition/apply_overlay.sh "$pipeline"
          bash data_science_pipeline_v2_acquisition/apply_browser_capture_overlay.sh "$pipeline"
          printf '%s\n' "$pipeline" > "$RUNNER_TEMP/pipeline-root.txt"

      - name: Run complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          pipeline="$(cat "$RUNNER_TEMP/pipeline-root.txt")"
          cd "$pipeline"
          PYTHONPATH=src python -m unittest discover -s tests -v \
            2>&1 | tee "$GITHUB_WORKSPACE/tests.log"
          grep -q 'Ran 41 tests' "$GITHUB_WORKSPACE/tests.log"
          grep -q '^OK$' "$GITHUB_WORKSPACE/tests.log"
          PYTHONPATH=src python -m compileall -q src tests

      - name: Build independent DNS pinning receipt
        shell: bash
        run: |
          set -euo pipefail
          pipeline="$(cat "$RUNNER_TEMP/pipeline-root.txt")"
          PIPELINE="$pipeline" python - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path

          root = Path(os.environ['PIPELINE'])
          source_path = root / 'src/god_pipeline/acquisition.py'
          tests_path = root / 'tests/test_acquisition.py'
          source = source_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')
          ast.parse(source)
          ast.parse(tests)

          checks = {
              'source_hash_exact': hashlib.sha256(source_path.read_bytes()).hexdigest() == '761e89f99031d2bc305259d55b6dd8e35cadce94ae16e71b056b73a977ba024c',
              'tests_hash_exact': hashlib.sha256(tests_path.read_bytes()).hexdigest() == '33619abe33a4b3908281c6ffad47e30abd6775bca159e6c8448c1415fd7deec7',
              'public_resolution_function': 'def _resolve_public_addresses' in source,
              'mixed_private_answer_rejected': 'test_dns_resolution_rejects_any_non_public_answer' in tests,
              'connects_to_pinned_address': 'socket.create_connection(' in source and '(address, self.port)' in source,
              'tls_hostname_preserved': 'server_hostname=self.host' in source,
              'environment_proxies_disabled': 'ProxyHandler({})' in source,
              'redirects_reenter_pinned_handler': 'validate_url(newurl, self.request_contract.allowed_hosts, resolve_dns=False)' in source,
              'hostname_not_used_for_socket_connect': 'socket.create_connection((self.host' not in source,
              'no_network_executed_by_gate': True,
              'no_production_modification': True,
              'external_cost_zero': True,
          }
          receipt = {
              'schema': 'data-science-v2-acquisition-dns-pin/2',
              'verdict': 'PASS' if all(checks.values()) else 'FAIL',
              'checks': checks,
              'tests_passed': 41,
              'security_issue': 'DNS rebinding / validation-connect TOCTOU',
              'resolution': 'connect only to prevalidated public IPs while preserving TLS SNI and Host semantics',
              'scientific_credit': 0,
              'external_cost_usd': 0.0,
              'network_executed': False,
              'production_modified': False,
          }
          Path('dns-pin-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload bounded security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-v2-acquisition-dns-pin
          path: |
            dns-pin-receipt.json
            tests.log
          if-no-files-found: error
          retention-days: 90

      - name: Enforce receipt after evidence preservation
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('dns-pin-receipt.json').read_text())
          if receipt['verdict'] != 'PASS':
              raise SystemExit([key for key, value in receipt['checks'].items() if not value])
          print('PASS: 41 tests; DNS rebinding window closed; TLS hostname preserved')
          PY
