name: OCR CORU untouched Receipt source seal v1

on:
  push:
    branches:
      - agent/ocr-consensus-detector-v4
    paths:
      - 'ocr_real_risk_v1/coru_source_seal.py'
      - 'ocr_real_risk_v1/test_coru_source_seal.py'
      - '.github/workflows/ocr-coru-source-seal-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocr-coru-source-seal-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Unit tests and compilation before metadata access
        run: |
          python -m unittest -v ocr_real_risk_v1.test_coru_source_seal
          python -m compileall -q \
            ocr_real_risk_v1/coru_source_seal.py \
            ocr_real_risk_v1/test_coru_source_seal.py
      - name: Seal repository metadata without opening CORU outcomes
        run: |
          rm -rf coru-source-seal
          mkdir -p coru-source-seal
          python -m ocr_real_risk_v1.coru_source_seal \
            --output coru-source-seal/coru_receipt_source_seal_v1.json \
            | tee coru-source-seal/stdout.json
      - name: Independent fail-closed replay
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from ocr_real_risk_v1.coru_source_seal import (
              ARCHIVE_FILES,
              DATASET_ID,
              EXPECTED_FILES,
              MINIMUM_ARCHIVE_BYTES,
              verify,
          )

          root = Path('coru-source-seal')
          path = root / 'coru_receipt_source_seal_v1.json'
          payload = json.loads(path.read_text())
          assert verify(payload)
          assert payload['dataset_id'] == DATASET_ID
          assert payload['component'] == 'Receipt'
          assert len(payload['resolved_revision']) == 40
          assert payload['license'] == 'mit'
          assert payload['repository_metadata_only'] is True
          assert payload['archives_downloaded'] == 0
          assert payload['annotation_bytes_read'] == 0
          assert payload['labels_read'] == 0
          assert payload['dataset_rows_read'] == 0
          assert payload['images_opened'] == 0
          assert payload['ocr_executed'] is False
          assert payload['outcomes_opened'] is False
          assert payload['object_count'] == len(EXPECTED_FILES)
          assert {row['path'] for row in payload['objects']} == set(EXPECTED_FILES)
          assert payload['total_archive_bytes'] >= MINIMUM_ARCHIVE_BYTES
          for row in payload['objects']:
              identity = row['identity']
              assert identity['algorithm'] in {'sha256', 'git-sha1'}
              expected_length = 64 if identity['algorithm'] == 'sha256' else 40
              assert len(identity['digest']) == expected_length
              assert row['size_bytes'] > 0
              assert payload['resolved_revision'] in row['download_url']
              if row['path'] in ARCHIVE_FILES:
                  assert identity['algorithm'] == 'sha256'
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256SUMS.txt').write_text(
              f'{digest}  coru_receipt_source_seal_v1.json\n'
          )
          (root / 'ATTRIBUTION.md').write_text(
              '# Attribution\n\n'
              '`abdoelsayed/CORU` Receipt component, MIT license. '
              'This source-seal stage reads repository metadata only; '
              'no archive, annotation, label, image, row, or OCR outcome '
              'was opened.\n'
          )
          print(json.dumps({
              'resolved_revision': payload['resolved_revision'],
              'object_count': payload['object_count'],
              'total_source_bytes': payload['total_source_bytes'],
              'total_archive_bytes': payload['total_archive_bytes'],
              'stable_payload_sha256': payload['stable_payload_sha256'],
              'manifest_file_sha256': digest,
              'outcomes_opened': False,
          }, indent=2, sort_keys=True))
          PY
          (
            cd coru-source-seal
            sha256sum --check --strict SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocr-coru-receipt-source-seal-v1
          path: coru-source-seal
          if-no-files-found: error
          retention-days: 90
      - name: Record immutable source seal on isolated branch
        run: |
          mkdir -p ocr_real_risk_v1/source_seals
          cp coru-source-seal/coru_receipt_source_seal_v1.json \
            ocr_real_risk_v1/source_seals/coru_receipt_source_seal_v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ocr_real_risk_v1/source_seals/coru_receipt_source_seal_v1.json
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Record untouched CORU Receipt source seal'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
