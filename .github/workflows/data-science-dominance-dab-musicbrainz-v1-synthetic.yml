name: Data Science dominance — MusicBrainz V1 synthetic freeze gate

on:
  push:
    branches:
      - agent/data-science-dominance-dab-musicbrainz-v1
    paths:
      - .github/workflows/data-science-dominance-dab-musicbrainz-v1-synthetic.yml

permissions:
  contents: read

env:
  ROOT: data_science_dominance/dab_musicbrainz_v1

jobs:
  synthetic-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove workflow-only activation after freeze
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$(git rev-parse HEAD^)" = 8b6fd2a0a4d86baf0c21dae0da48a994efb6ea75
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/data-science-dominance-dab-musicbrainz-v1-synthetic.yml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact frozen source and isolation
        shell: bash
        run: |
          set -euo pipefail
          echo '8fa98c1f7d4c92e511fdf8cb2c233ad544b1307f079655ee59c7457e50a95ae1  data_science_dominance/dab_musicbrainz_v1/musicbrainz_engine.py' | sha256sum -c -
          echo 'd57c9091fb9d714e4082d478e2d60ff1de6b469ffa846fa1371939685013fc58  data_science_dominance/dab_musicbrainz_v1/test_musicbrainz_engine.py' | sha256sum -c -
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          root=Path('data_science_dominance/dab_musicbrainz_v1')
          freeze=json.loads((root/'FREEZE.json').read_text())
          source=(root/'musicbrainz_engine.py').read_text()
          assert freeze['candidate']['sha256']=='8fa98c1f7d4c92e511fdf8cb2c233ad544b1307f079655ee59c7457e50a95ae1'
          assert freeze['pre_data_evidence']['tests_sha256']=='d57c9091fb9d714e4082d478e2d60ff1de6b469ffa846fa1371939685013fc58'
          assert freeze['held_out_scope']==[
              'query_music_brainz_20k/query2',
              'query_music_brainz_20k/query3',
          ]
          lowered=source.lower()
          for token in ('query2','query3','ground_truth','validate.py'):
              assert token not in lowered, token
          tree=ast.parse(source)
          imports=set()
          for node in ast.walk(tree):
              if isinstance(node,ast.Import): imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node,ast.ImportFrom) and node.module: imports.add(node.module.split('.')[0])
          assert not imports.intersection({'requests','httpx','urllib','socket','subprocess'})
          audit={
              'schema':'data-science-dominance/musicbrainz-v1-static-audit/1',
              'candidate_sha256':hashlib.sha256((root/'musicbrainz_engine.py').read_bytes()).hexdigest(),
              'tests_sha256':hashlib.sha256((root/'test_musicbrainz_engine.py').read_bytes()).hexdigest(),
              'held_out_query_content_accessed':False,
              'validators_executed':False,
              'ground_truth_accessed':False,
              'official_dataset_values_accessed':False,
              'candidate_network_access':False,
          }
          Path('musicbrainz-static-audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps(audit,indent=2,sort_keys=True))
          PY

      - name: Run 34 relational and entity-resolution tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python -m unittest -v test_musicbrainz_engine.py 2>&1 | tee "${GITHUB_WORKSPACE}/musicbrainz-synthetic-tests.log"

      - name: Run 18,500-row false-merge and performance stress
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python - <<'PY' 2>&1 | tee "${GITHUB_WORKSPACE}/musicbrainz-stress.log"
          import json,time
          import musicbrainz_engine as engine
          tracks=[]
          track_id=1
          groups=6000
          for group in range(groups):
              base=f'Signal Song {group:05d}'
              artist=f'Artist {group % 800:04d}'
              album=f'Album {group % 1200:04d}'
              variants=4 if group < 500 else 3
              for variant in range(variants):
                  tracks.append(engine.Track(
                      track_id=track_id,
                      source_id=variant,
                      source_track_id=f'{group}-{variant}',
                      title=base if variant==0 else f'{base} (Remastered {2018+variant})',
                      artist=artist if variant<2 else artist.replace(' ','  '),
                      album=album if variant!=1 else album.replace(' ','-'),
                      year=2000+group%24,
                      length_seconds=180+group%120,
                      language='English',
                  ))
                  track_id+=1
          started=time.perf_counter()
          entities,mapping=engine.resolve_entities(tracks)
          elapsed=time.perf_counter()-started
          assert len(tracks)==18500
          assert len(entities)==groups
          for group in range(groups):
              first=group*3+1 if group>=500 else group*4+1
              width=3 if group>=500 else 4
              # The first 500 groups have four records, later groups three.
              if group>=500:
                  first=500*4+(group-500)*3+1
              ids=range(first,first+width)
              assert len({mapping[item] for item in ids})==1
          receipt={
              'schema':'data-science-dominance/musicbrainz-v1-entity-stress/1',
              'rows':len(tracks),
              'expected_entities':groups,
              'actual_entities':len(entities),
              'false_merges':0,
              'split_duplicate_groups':0,
              'runtime_seconds':elapsed,
          }
          open('../../musicbrainz-stress-receipt.json','w').write(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Seal synthetic receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('data_science_dominance/dab_musicbrainz_v1')
          test_log=Path('musicbrainz-synthetic-tests.log')
          stress=Path('musicbrainz-stress-receipt.json')
          text=test_log.read_text() if test_log.exists() else ''
          stress_payload=json.loads(stress.read_text()) if stress.exists() else {}
          passed=(
              'Ran 34 tests' in text
              and '\nOK\n' in ('\n'+text+'\n')
              and stress_payload.get('rows')==18500
              and stress_payload.get('actual_entities')==6000
              and stress_payload.get('false_merges')==0
          )
          receipt={
              'schema':'data-science-dominance/musicbrainz-v1-synthetic-receipt/1',
              'verdict':'PASS' if passed else 'FAIL',
              'github_run_id':int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'github_sha':os.environ['GITHUB_SHA'],
              'candidate_sha256':hashlib.sha256((root/'musicbrainz_engine.py').read_bytes()).hexdigest(),
              'tests_sha256':hashlib.sha256((root/'test_musicbrainz_engine.py').read_bytes()).hexdigest(),
              'functional_tests':34,
              'entity_stress_rows':stress_payload.get('rows'),
              'entity_stress_entities':stress_payload.get('actual_entities'),
              'held_out_query_content_accessed':False,
              'validators_executed':False,
              'ground_truth_accessed':False,
              'official_dataset_values_accessed':False,
              'post_hoc_retuning_permitted':False,
          }
          payload=json.dumps(receipt,indent=2,sort_keys=True)+'\n'
          Path('musicbrainz-synthetic-receipt.json').write_text(payload)
          Path('musicbrainz-synthetic-receipt.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'  musicbrainz-synthetic-receipt.json\n')
          print(payload)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: musicbrainz-v1-synthetic
          retention-days: 90
          if-no-files-found: error
          path: |
            data_science_dominance/dab_musicbrainz_v1/**
            musicbrainz-static-audit.json
            musicbrainz-synthetic-tests.log
            musicbrainz-stress.log
            musicbrainz-stress-receipt.json
            musicbrainz-synthetic-receipt.json
            musicbrainz-synthetic-receipt.sha256

      - name: Enforce synthetic gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('musicbrainz-synthetic-receipt.json').read_text())
          if receipt['verdict']!='PASS': raise SystemExit('MusicBrainz V1 synthetic gate failed')
          print('MusicBrainz V1 synthetic gate: PASS')
          PY
