name: OCR dual-source truth anchors v1

on:
  pull_request:
    paths:
      - 'ocr_real_risk_v1/truth_anchor.py'
      - 'ocr_real_risk_v1/test_truth_anchor.py'
      - '.github/workflows/ocr-real-risk-truth-anchor-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocr-real-risk-truth-anchor-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  truth-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Dual-source anchor tests
        run: python -m unittest -v ocr_real_risk_v1.test_truth_anchor
