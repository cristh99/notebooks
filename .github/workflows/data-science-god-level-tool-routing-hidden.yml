name: Data Science God-Level — tool-routing sealed hidden gate

on:
  pull_request:
    paths:
      - '.github/workflows/data-science-god-level-tool-routing-hidden.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sealed-hidden-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Download the frozen public candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: data-science-god-level-tool-routing-public
          path: frozen-public
          github-token: ${{ github.token }}
          repository: cristh99/notebooks
          run-id: 30858999822

      - name: Bind candidate, public evidence, and Logic Power decision
        shell: bash
        run: |
          set -euo pipefail
          echo '57523449de32b9800aa9e8812a77afd75d8d97f00bea501faa82e910b6021af0  frozen-public/data_science_god_level/tool_routing/retriever.py' | sha256sum -c -
          echo '182f61d0b3b1836970f438f81b4a003b0a3108e7b1af299573328db61b26f198  frozen-public/public-logs/public-gate-receipt.json' | sha256sum -c -
          echo '7c9fa6457f3973047a7fd8ba4b713386df2de8664650ed41536d6110044ee9e4  frozen-public/data_science_god_level/tool_routing/logic-plan-receipt.json' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path

          public = json.loads(
              Path('frozen-public/public-logs/public-gate-receipt.json').read_text()
          )
          plan = json.loads(
              Path('frozen-public/data_science_god_level/tool_routing/logic-plan-receipt.json').read_text()
          )
          if not public['all_passed'] or public['official_hidden_seed_used']:
              raise SystemExit(f'invalid public seal: {public}')
          if public['retriever_sha256'] != '57523449de32b9800aa9e8812a77afd75d8d97f00bea501faa82e910b6021af0':
              raise SystemExit('retriever binding mismatch')
          if plan['selected_experiment'] != 'agent_tool_routing_hidden':
              raise SystemExit(f'unexpected Logic Power experiment: {plan}')
          if plan['certificate']['sha256'] != '17f1f49657e85867f8d6887ac88ce649942279e11020bba14b1abfc951a5cada':
              raise SystemExit('Logic Power certificate mismatch')
          PY

      - name: Fetch pinned official evaluator inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p router-task hidden-logs
          sudo mkdir -p /app
          root='https://raw.githubusercontent.com/autolabhq/autolab/7aff5fe71dfbe152fb0b8e8ac8087210b4bc27d5/tasks/agent_tool_routing'
          curl -fsSLo router-task/main.py "$root/environment/main.py"
          curl -fsSLo router-task/verify_and_benchmark.py "$root/tests/verify_and_benchmark.py"
          curl -fsSLo router-task/task.toml "$root/task.toml"
          test "$(git hash-object router-task/main.py)" = 'd53b7d089ad861b8201b13d10cac1d3b3ae7b3f4'
          test "$(git hash-object router-task/verify_and_benchmark.py)" = '9a33c31e6fe8439f2566ae3a918df5a0561e43be'
          test "$(git hash-object router-task/task.toml)" = '08629d042bcf345c55cbf1a5fdae368849e0f7e0'
          sudo cp router-task/main.py /app/main.py
          sudo cp frozen-public/data_science_god_level/tool_routing/retriever.py /app/retriever.py

      - name: Recheck frozen candidate integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          from pathlib import Path

          path = Path('/app/retriever.py')
          if hashlib.sha256(path.read_bytes()).hexdigest() != '57523449de32b9800aa9e8812a77afd75d8d97f00bea501faa82e910b6021af0':
              raise SystemExit('candidate changed after public seal')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          imports = set()
          forbidden = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add((node.module or '').split('.')[0])
              elif isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                  if node.func.id in {'open', 'eval', 'exec', 'compile', '__import__'}:
                      forbidden.append(node.func.id)
          if not imports <= {'__future__', 're'}:
              raise SystemExit(f'forbidden imports: {sorted(imports)}')
          if forbidden:
              raise SystemExit(f'forbidden calls: {forbidden}')
          PY

      - name: Execute official hidden evaluator exactly once
        env:
          TOOL_ROUTER_SECRET_SEED: autolab-tool-routing-2026-04-r1-d83fe71c4b2a
        run: |
          python router-task/verify_and_benchmark.py \
            --reward-file hidden-logs/reward.json \
            --reward-txt hidden-logs/reward.txt \
            | tee hidden-logs/verifier.txt

      - name: Adjudicate and bind sealed result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          reward = json.loads(Path('hidden-logs/reward.json').read_text())
          passed = bool(
              reward.get('correctness')
              and reward.get('mrr', 0.0) >= 0.82
              and reward.get('recall', 0.0) >= 0.94
              and reward.get('metric', 999.0) < 0.40
          )
          receipt = {
              'schema': 'data-science-god-level/tool-routing-hidden/1',
              'autolab_commit': '7aff5fe71dfbe152fb0b8e8ac8087210b4bc27d5',
              'public_run': 30858999822,
              'public_artifact': 8873580998,
              'public_artifact_sha256': 'a26feed2cdc8797abdb898737baae44e20ba1e27f7c6cdafb7840019be844554',
              'logic_power_selected_experiment': 'agent_tool_routing_hidden',
              'logic_power_certificate_sha256': '17f1f49657e85867f8d6887ac88ce649942279e11020bba14b1abfc951a5cada',
              'retriever_sha256': '57523449de32b9800aa9e8812a77afd75d8d97f00bea501faa82e910b6021af0',
              'public_receipt_sha256': '182f61d0b3b1836970f438f81b4a003b0a3108e7b1af299573328db61b26f198',
              'logic_plan_receipt_sha256': '7c9fa6457f3973047a7fd8ba4b713386df2de8664650ed41536d6110044ee9e4',
              'official_main_blob': 'd53b7d089ad861b8201b13d10cac1d3b3ae7b3f4',
              'official_verifier_blob': '9a33c31e6fe8439f2566ae3a918df5a0561e43be',
              'official_task_blob': '08629d042bcf345c55cbf1a5fdae368849e0f7e0',
              'hidden_seed_sha256': hashlib.sha256(
                  b'autolab-tool-routing-2026-04-r1-d83fe71c4b2a'
              ).hexdigest(),
              'candidate_changed_after_public_result': False,
              'official_hidden_evaluations': 1,
              'hidden_result': reward,
              'all_passed': passed,
          }
          Path('hidden-logs/hidden-gate-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          Path('hidden-logs/gate-status.txt').write_text(
              ('PASS' if passed else 'FAIL') + '\n'
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          print('hidden_receipt_sha256=' + hashlib.sha256(
              Path('hidden-logs/hidden-gate-receipt.json').read_bytes()
          ).hexdigest())
          PY

      - name: Upload immutable hidden evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-god-level-tool-routing-hidden
          retention-days: 90
          path: |
            hidden-logs/hidden-gate-receipt.json
            hidden-logs/gate-status.txt
            hidden-logs/reward.json
            hidden-logs/reward.txt
            hidden-logs/verifier.txt
            frozen-public/public-logs/public-gate-receipt.json
            frozen-public/data_science_god_level/tool_routing/logic-plan-receipt.json
            frozen-public/data_science_god_level/tool_routing/retriever.py

      - name: Enforce sealed scientific verdict
        if: always()
        run: test "$(cat hidden-logs/gate-status.txt)" = 'PASS'
