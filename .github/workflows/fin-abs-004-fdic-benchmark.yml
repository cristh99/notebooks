name: FIN-ABS-004 — FDIC sealed distress benchmark

on:
  pull_request:
    branches:
      - agent/finance-absolute-423-public-replay
    paths:
      - 'fin_abs_004_fdic/**'
      - 'README_FIN_ABS_004_FDIC.md'
      - '.github/workflows/fin-abs-004-fdic-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin-abs-004-fdic-benchmark
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen capsule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install deterministic modeling dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.3.2 pandas==2.3.1 scikit-learn==1.7.1 PyYAML==6.0.2

      - name: Compile and test point-in-time contracts
        run: |
          python -m compileall -q fin_abs_004_fdic
          python -m unittest -v fin_abs_004_fdic.test_audit
          python -m unittest -v fin_abs_004_fdic.test_panel
          python -m unittest -v fin_abs_004_fdic.test_model

      - name: Acquire official quarterly panel and construct labels
        run: |
          rm -rf .cache/fin_abs_004_fdic reports/fin_abs_004_fdic_benchmark
          mkdir -p .cache/fin_abs_004_fdic reports/fin_abs_004_fdic_benchmark/panel
          python -m fin_abs_004_fdic.panel \
            --cache .cache/fin_abs_004_fdic \
            --output-dir reports/fin_abs_004_fdic_benchmark/panel

      - name: Execute validation selection and sealed test once
        run: |
          python -m fin_abs_004_fdic.benchmark \
            --panel reports/fin_abs_004_fdic_benchmark/panel/panel_features.csv \
            --panel-report reports/fin_abs_004_fdic_benchmark/panel/panel_report.json \
            --output-dir reports/fin_abs_004_fdic_benchmark/result

      - name: Independent Node metric replay
        run: |
          node fin_abs_004_fdic/verify_benchmark.mjs \
            reports/fin_abs_004_fdic_benchmark/result/report.json \
            reports/fin_abs_004_fdic_benchmark/result/node_metric_receipt.json

      - name: Reject score and metric forgeries
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, hashlib, json
          from pathlib import Path

          source = json.loads(Path('reports/fin_abs_004_fdic_benchmark/result/report.json').read_text())

          score = copy.deepcopy(source)
          score['payload']['absolute_score']['after'] = 1000
          score['payload']['absolute_score']['delta'] = 577
          canonical = json.dumps(score['payload'], sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          score['payload_canonical'] = canonical
          score['sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('/tmp/forged_score.json').write_text(json.dumps(score, indent=2, sort_keys=True) + '\n')

          metric = copy.deepcopy(source)
          selected = metric['payload']['validation']['selected_challenger']
          metric['payload']['validation']['metrics'][selected]['average_precision'] = 1.0
          canonical = json.dumps(metric['payload'], sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          metric['payload_canonical'] = canonical
          metric['sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('/tmp/forged_metric.json').write_text(json.dumps(metric, indent=2, sort_keys=True) + '\n')
          PY

          for forged in /tmp/forged_score.json /tmp/forged_metric.json; do
            if node fin_abs_004_fdic/verify_benchmark.mjs \
                "$forged" /tmp/forged_receipt.json; then
              echo "forged FDIC benchmark accepted: $forged" >&2
              exit 1
            fi
          done

      - name: Build evidence manifest
        run: |
          find reports/fin_abs_004_fdic_benchmark -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > reports/fin_abs_004_fdic_benchmark/manifest.sha256

      - name: Upload bounded benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-abs-004-fdic-sealed-benchmark
          path: reports/fin_abs_004_fdic_benchmark/
          if-no-files-found: error
          retention-days: 90
