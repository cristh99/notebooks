name: FIN-ABS-004 — V4FinBench public-data audit

on:
  push:
    branches:
      - agent/fin-abs-004-v4-credit-risk
    paths:
      - 'fin_abs_004_v4_credit/**'
      - 'README_FIN_ABS_004_V4_CREDIT.md'
      - '.github/workflows/fin-abs-004-v4-credit-audit.yml'
  pull_request:
    branches:
      - agent/fin-abs-003-clrd-reserving
    paths:
      - 'fin_abs_004_v4_credit/**'
      - 'README_FIN_ABS_004_V4_CREDIT.md'
      - '.github/workflows/fin-abs-004-v4-credit-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLEHUB_CACHE: ${{ runner.temp }}/kagglehub

    steps:
      - name: Checkout frozen capsule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned audit runtime
        run: |
          python -m pip install --disable-pip-version-check \
            kagglehub==1.0.2 \
            pyarrow==25.0.0

      - name: Unit and counterexample tests
        run: |
          python -m compileall -q fin_abs_004_v4_credit
          python -m unittest -v fin_abs_004_v4_credit.test_audit
          node --check fin_abs_004_v4_credit/verify_audit.mjs

      - name: Acquire and audit canonical public dataset
        run: |
          set -euo pipefail
          rm -rf reports/fin_abs_004_v4_credit_audit
          python -m fin_abs_004_v4_credit.audit \
            --output-dir reports/fin_abs_004_v4_credit_audit

      - name: Independent Node replay
        run: |
          node fin_abs_004_v4_credit/verify_audit.mjs \
            reports/fin_abs_004_v4_credit_audit/audit.json \
            reports/fin_abs_004_v4_credit_audit/node_receipt.json

      - name: Reject rehashed score and status forgeries
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def digest(value):
              encoded = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(',', ':'),
                  ensure_ascii=False,
              ).encode('utf-8')
              return hashlib.sha256(encoded).hexdigest()

          source = Path('reports/fin_abs_004_v4_credit_audit/audit.json')
          report = json.loads(source.read_text())

          score = json.loads(json.dumps(report))
          score['payload']['absolute_score']['after'] = 431
          score['payload']['absolute_score']['delta'] = 8
          score['sha256'] = digest(score['payload'])
          Path('/tmp/fin_abs_004_forged_score.json').write_text(json.dumps(score))

          status = json.loads(json.dumps(report))
          status['payload']['status'] = 'PASS_DATA_AUDIT'
          status['sha256'] = digest(status['payload'])
          Path('/tmp/fin_abs_004_forged_status.json').write_text(json.dumps(status))
          PY

          if node fin_abs_004_v4_credit/verify_audit.mjs \
              /tmp/fin_abs_004_forged_score.json \
              /tmp/fin_abs_004_forged_score_receipt.json; then
            echo 'rehashed score forgery accepted' >&2
            exit 1
          fi

          if node fin_abs_004_v4_credit/verify_audit.mjs \
              /tmp/fin_abs_004_forged_status.json \
              /tmp/fin_abs_004_forged_status_receipt.json; then
            echo 'rehashed status forgery accepted' >&2
            exit 1
          fi

      - name: Build bounded evidence manifest
        run: |
          sha256sum \
            reports/fin_abs_004_v4_credit_audit/audit.json \
            reports/fin_abs_004_v4_credit_audit/audit.md \
            reports/fin_abs_004_v4_credit_audit/node_receipt.json \
            > reports/fin_abs_004_v4_credit_audit/manifest.sha256

      - name: Upload audit evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-abs-004-v4finbench-data-audit
          path: reports/fin_abs_004_v4_credit_audit/
          if-no-files-found: error
          retention-days: 90
