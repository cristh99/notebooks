name: Trigger refined public unsupervised anomaly gate

on:
  push:
    branches:
      - agent/data-science-god-level-unsupervised-anomaly
    paths:
      - '.github/workflows/trigger-unsupervised-anomaly-public-v2.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-refined-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the frozen public gate at current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/data-science-god-level-unsupervised-anomaly-public.yml/dispatches" \
            -d '{"ref":"agent/data-science-god-level-unsupervised-anomaly"}'
