name: Bounded-mean confidence sequence — public independent verification

on:
  push:
    branches:
      - agent/inference-power-compiler-v2-public-ci
    paths:
      - 'inference_power_compiler_v2/verify_confidence_sequence_independent.py'
      - 'ConfidenceSequencePublic.lean'
      - '.github/workflows/confidence-sequence-public.yml'
  pull_request:
    paths:
      - 'inference_power_compiler_v2/verify_confidence_sequence_independent.py'
      - 'ConfidenceSequencePublic.lean'
      - '.github/workflows/confidence-sequence-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind private sources and compile verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'cd4f7c83b5683862dee04c3377c409f9a731157f' inference_power_compiler_v2/verify_confidence_sequence_independent.py)" = "1"
          test "$(grep -c '8f1996984f51a6d7ff795af41291757477f43529' inference_power_compiler_v2/verify_confidence_sequence_independent.py)" = "1"
          test "$(grep -c '7de66ffec5feaeaa206df9af7fec342948f492b8' inference_power_compiler_v2/verify_confidence_sequence_independent.py)" = "1"
          python -m py_compile inference_power_compiler_v2/verify_confidence_sequence_independent.py

      - name: Execute independent anytime-valid grid inversion
        shell: bash
        run: |
          set -euo pipefail
          python inference_power_compiler_v2/verify_confidence_sequence_independent.py \
            | tee confidence-sequence-public.log
          test -s inference_power_compiler_v2/CONFIDENCE_SEQUENCE_PUBLIC_RECEIPT.json
          sha256sum inference_power_compiler_v2/CONFIDENCE_SEQUENCE_PUBLIC_RECEIPT.json \
            > /tmp/confidence-sequence-before.sha256
          python inference_power_compiler_v2/verify_confidence_sequence_independent.py \
            > /tmp/confidence-sequence-rebuild.log
          sha256sum inference_power_compiler_v2/CONFIDENCE_SEQUENCE_PUBLIC_RECEIPT.json \
            > /tmp/confidence-sequence-after.sha256
          cmp /tmp/confidence-sequence-before.sha256 /tmp/confidence-sequence-after.sha256

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile formal inversion boundary without axioms
        shell: bash
        run: |
          set -euo pipefail
          elan run leanprover/lean4:v4.33.0-rc1 lean \
            -o ConfidenceSequencePublic.olean ConfidenceSequencePublic.lean \
            2>&1 | tee confidence-sequence-public-lean.log
          test -s ConfidenceSequencePublic.olean
          if grep -q 'sorryAx' confidence-sequence-public-lean.log; then
            echo 'Lean output contains sorryAx' >&2
            exit 1
          fi
          if grep -q 'depends on axioms:' confidence-sequence-public-lean.log; then
            echo 'Lean output contains an axiom dependency' >&2
            exit 1
          fi

      - name: Upload proof-carrying confidence-sequence evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-mean-confidence-sequence-public-evidence
          path: |
            inference_power_compiler_v2/CONFIDENCE_SEQUENCE_PUBLIC_RECEIPT.json
            inference_power_compiler_v2/verify_confidence_sequence_independent.py
            ConfidenceSequencePublic.lean
            ConfidenceSequencePublic.olean
            confidence-sequence-public.log
            confidence-sequence-public-lean.log
          if-no-files-found: error
          retention-days: 90
