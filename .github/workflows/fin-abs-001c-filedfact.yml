name: FIN-ABS-001C — FiledFact passage breadth

on:
  pull_request:
    branches:
      - agent/fin-abs-001-finverbench
    paths:
      - 'fin_abs_001c_filedfact/**'
      - 'README_FIN_ABS_001C_FILEDFACT.md'
      - '.github/workflows/fin-abs-001c-filedfact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout frozen capsule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned public-data dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'huggingface_hub==0.34.4' \
            'hf_xet==1.1.7' \
            'pyarrow==21.0.0'

      - name: Unit and counterexample tests
        run: |
          python -m compileall -q fin_abs_001c_filedfact
          python -m unittest -v fin_abs_001c_filedfact.test_filedfact

      - name: Resolve immutable Hub revision and execute frozen benchmark
        run: |
          rm -rf reports/fin_abs_001c_filedfact
          python -m fin_abs_001c_filedfact.run \
            --output-dir reports/fin_abs_001c_filedfact

      - name: Independent Node reimplementation
        run: |
          node fin_abs_001c_filedfact/verify.mjs \
            reports/fin_abs_001c_filedfact/report.json \
            reports/fin_abs_001c_filedfact/source.json \
            reports/fin_abs_001c_filedfact/relations.json \
            reports/fin_abs_001c_filedfact/instances.json \
            reports/fin_abs_001c_filedfact/predictions_exact.jsonl \
            reports/fin_abs_001c_filedfact/predictions_rounded.jsonl \
            reports/fin_abs_001c_filedfact/node_receipt.json

      - name: Reject score, source, relation, and prediction forgeries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('reports/fin_abs_001c_filedfact')

          report = json.loads((root / 'report.json').read_text())
          report['payload']['absolute_score']['after'] = 1000
          Path('/tmp/forged_report.json').write_text(json.dumps(report))

          source = json.loads((root / 'source.json').read_text())
          source['revision'] = '0' * 40
          Path('/tmp/forged_source.json').write_text(json.dumps(source))

          relations = json.loads((root / 'relations.json').read_text())
          relations[0]['passage']['source_url'] = 'https://example.invalid/'
          Path('/tmp/forged_relations.json').write_text(json.dumps(relations))

          rows = (root / 'predictions_exact.jsonl').read_text().splitlines()
          row = json.loads(rows[0])
          row['decision'] = 'ERROR' if row['decision'] != 'ERROR' else 'CLEAN'
          rows[0] = json.dumps(row, sort_keys=True)
          Path('/tmp/forged_predictions.jsonl').write_text('\n'.join(rows) + '\n')
          PY

          base=(
            reports/fin_abs_001c_filedfact/report.json
            reports/fin_abs_001c_filedfact/source.json
            reports/fin_abs_001c_filedfact/relations.json
            reports/fin_abs_001c_filedfact/instances.json
            reports/fin_abs_001c_filedfact/predictions_exact.jsonl
            reports/fin_abs_001c_filedfact/predictions_rounded.jsonl
          )

          if node fin_abs_001c_filedfact/verify.mjs \
              /tmp/forged_report.json "${base[1]}" "${base[2]}" "${base[3]}" \
              "${base[4]}" "${base[5]}" /tmp/forged_report_receipt.json; then
            echo 'forged score accepted' >&2
            exit 1
          fi

          if node fin_abs_001c_filedfact/verify.mjs \
              "${base[0]}" /tmp/forged_source.json "${base[2]}" "${base[3]}" \
              "${base[4]}" "${base[5]}" /tmp/forged_source_receipt.json; then
            echo 'forged source accepted' >&2
            exit 1
          fi

          if node fin_abs_001c_filedfact/verify.mjs \
              "${base[0]}" "${base[1]}" /tmp/forged_relations.json "${base[3]}" \
              "${base[4]}" "${base[5]}" /tmp/forged_relation_receipt.json; then
            echo 'forged relation accepted' >&2
            exit 1
          fi

          if node fin_abs_001c_filedfact/verify.mjs \
              "${base[0]}" "${base[1]}" "${base[2]}" "${base[3]}" \
              /tmp/forged_predictions.jsonl "${base[5]}" \
              /tmp/forged_prediction_receipt.json; then
            echo 'forged prediction accepted' >&2
            exit 1
          fi

      - name: Build evidence manifest
        run: |
          sha256sum \
            reports/fin_abs_001c_filedfact/source.json \
            reports/fin_abs_001c_filedfact/relations.json \
            reports/fin_abs_001c_filedfact/instances.json \
            reports/fin_abs_001c_filedfact/predictions_exact.jsonl \
            reports/fin_abs_001c_filedfact/predictions_rounded.jsonl \
            reports/fin_abs_001c_filedfact/report.json \
            reports/fin_abs_001c_filedfact/node_receipt.json \
            > reports/fin_abs_001c_filedfact/manifest.sha256

      - name: Upload bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-abs-001c-filedfact-passage-breadth
          path: |
            reports/fin_abs_001c_filedfact/
            !reports/fin_abs_001c_filedfact/hf-cache/**
          if-no-files-found: error
          retention-days: 90
