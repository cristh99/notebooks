name: Public cross-fit remainder-calibrated anytime verification

on:
  push:
    branches:
      - agent/inference-power-compiler-v2-public-ci
    paths:
      - 'inference_power_compiler_v2/verify_crossfit_anytime_public.py'
      - 'FiniteCrossFitAnytimePublic.lean'
      - '.github/workflows/crossfit-anytime-public.yml'
  pull_request:
    paths:
      - 'inference_power_compiler_v2/verify_crossfit_anytime_public.py'
      - 'FiniteCrossFitAnytimePublic.lean'
      - '.github/workflows/crossfit-anytime-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-crossfit-anytime-public:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Compile and replay independent cross-fit verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            inference_power_compiler_v2/verify_crossfit_anytime_public.py
          python inference_power_compiler_v2/verify_crossfit_anytime_public.py \
            | tee crossfit-anytime-public.log
          test -s inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_REPORT.json
          test -s inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_CERTIFICATE.json
          sha256sum \
            inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_REPORT.json \
            inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_CERTIFICATE.json \
            > /tmp/crossfit-anytime-public-before.sha256
          python inference_power_compiler_v2/verify_crossfit_anytime_public.py \
            > /tmp/crossfit-anytime-public-rebuild.log
          sha256sum \
            inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_REPORT.json \
            inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_CERTIFICATE.json \
            > /tmp/crossfit-anytime-public-after.sha256
          cmp \
            /tmp/crossfit-anytime-public-before.sha256 \
            /tmp/crossfit-anytime-public-after.sha256

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile public cross-fit boundary without axioms
        shell: bash
        run: |
          set -euo pipefail
          elan run leanprover/lean4:v4.33.0-rc1 lean \
            -o FiniteCrossFitAnytimePublic.olean \
            FiniteCrossFitAnytimePublic.lean \
            2>&1 | tee finite-crossfit-anytime-public-lean.log
          test -s FiniteCrossFitAnytimePublic.olean
          if grep -q 'sorryAx' finite-crossfit-anytime-public-lean.log; then
            echo 'Unexpected sorryAx' >&2
            exit 1
          fi
          if grep -q 'depends on axioms:' finite-crossfit-anytime-public-lean.log; then
            echo 'Unexpected Lean axiom dependency' >&2
            exit 1
          fi

      - name: Build public verification receipt
        shell: bash
        env:
          PUBLIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report = Path('inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_REPORT.json')
          certificate = Path('inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_CERTIFICATE.json')
          verifier = Path('inference_power_compiler_v2/verify_crossfit_anytime_public.py')
          lean = Path('FiniteCrossFitAnytimePublic.lean')
          receipt = {
              'schema': 'crossfit-anytime-public-verification-receipt/1',
              'repository': 'cristh99/notebooks',
              'head': os.environ['PUBLIC_HEAD_SHA'],
              'event_sha': os.environ['PUBLIC_EVENT_SHA'],
              'private_repository': 'cristh99/my_first_repository',
              'private_pull_request': 68,
              'report_sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
              'certificate_sha256': hashlib.sha256(certificate.read_bytes()).hexdigest(),
              'verifier_sha256': hashlib.sha256(verifier.read_bytes()).hexdigest(),
              'lean_source_sha256': hashlib.sha256(lean.read_bytes()).hexdigest(),
              'outer_split_integrity': 'PASS',
              'nuisance_provenance': 'PASS',
              'remainder_bound': 'PASS',
              'factor_nonnegativity': 'PASS',
              'predictability': 'PASS',
              'conditional_supermartingale': 'PASS',
              'bounded_optional_stopping': 'PASS',
              'ville_bound': 'PASS',
              'competitive_envelope': 'PASS',
              'naive_remainder_inflation_rejected': 'PASS',
              'leakage_rejection': 'PASS',
              'understated_remainder_rejection': 'PASS',
              'missing_remainder_abstention': 'PASS',
              'deterministic_rebuild': 'PASS',
              'certificate_tamper_rejection': 'PASS',
              'semantic_forgery_rejection': 'PASS',
              'lean': 'PASS',
              'sorryAx': 'ABSENT',
              'axiom_dependencies': 'ABSENT',
          }
          path = Path('inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_RECEIPT.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_RECEIPT.sha256').write_text(
              f'{digest}  CROSSFIT_ANYTIME_PUBLIC_RECEIPT.json\n'
          )
          print(path.read_text())
          print(digest)
          PY

      - name: Upload public cross-fit anytime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crossfit-anytime-public-evidence
          path: |
            inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_*.json
            inference_power_compiler_v2/CROSSFIT_ANYTIME_PUBLIC_RECEIPT.sha256
            inference_power_compiler_v2/verify_crossfit_anytime_public.py
            FiniteCrossFitAnytimePublic.lean
            FiniteCrossFitAnytimePublic.olean
            crossfit-anytime-public.log
            finite-crossfit-anytime-public-lean.log
          if-no-files-found: error
          retention-days: 90
