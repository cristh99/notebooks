name: Data Science dominance — DAB slice synthetic freeze gate

on:
  push:
    branches:
      - agent/data-science-dominance-dab-slice
    paths:
      - '.github/workflows/data-science-dominance-dab-slice-synthetic.yml'

permissions:
  contents: read

jobs:
  synthetic-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove workflow-only activation after final pre-data freeze
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = 'push'
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test "$(git rev-parse HEAD^)" = 'b83063440e14d5384479b2de06f7b9494496060d'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/data-science-dominance-dab-slice-synthetic.yml'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact DAB database dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'duckdb==1.3.1' 'psycopg2-binary==2.9.9' 'pymongo==4.13.2'
          python -m pip freeze | sort > dab-slice-pip-freeze.txt

      - name: Reconstruct candidate and tests from frozen transports
        shell: bash
        run: |
          set -euo pipefail
          root='data_science_dominance/dab_slice'
          bash "$root/reconstruct_dab_slice.sh"
          echo '4098a2397025955b9c23b09fb6f9c5e404bc71a5db2602b230c4a70c6fd9229b  '"$root"'/test_dab_slice_agent.py.gz.b64' | sha256sum -c -
          base64 -d "$root/test_dab_slice_agent.py.gz.b64" | gzip -dc > "$root/test_dab_slice_agent.py"
          echo '511b053ed8f72a9f43ba9451a5a8e6b2228bae3374b80f339004e7b0234d93be  '"$root"'/test_dab_slice_agent.py' | sha256sum -c -
          python -m py_compile "$root/dab_slice_agent.py" "$root/test_dab_slice_agent.py"

      - name: Enforce candidate isolation before any official data
        run: |
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          root = Path('data_science_dominance/dab_slice')
          candidate = root / 'dab_slice_agent.py'
          source = candidate.read_text()
          tree = ast.parse(source)
          forbidden_imports = {'requests', 'urllib', 'httpx', 'socket', 'subprocess', 'selenium', 'playwright'}
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split('.')[0])
          violations = sorted(imports & forbidden_imports)
          lowered = source.lower()
          forbidden_strings = [token for token in ('ground_truth', 'validate.py', 'query1/validate', 'query1\\validate') if token in lowered]
          receipt = {
              'schema': 'data-science-dominance/dab-slice-static-audit/1',
              'candidate_sha256': hashlib.sha256(candidate.read_bytes()).hexdigest(),
              'forbidden_imports': violations,
              'forbidden_strings': forbidden_strings,
              'candidate_network_access': False,
              'candidate_validator_access': False,
              'candidate_ground_truth_access': False,
          }
          Path('dab-slice-static-audit.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if violations or forbidden_strings:
              raise SystemExit('candidate isolation audit failed')
          if receipt['candidate_sha256'] != '0796f1d66d944e832181034f6e8e8800461b60d71e66716d5b19fe3fd1957dec':
              raise SystemExit('candidate hash mismatch')
          PY

      - name: Run synthetic multi-database test battery
        shell: bash
        run: |
          set -euo pipefail
          cd data_science_dominance/dab_slice
          python -m unittest -v test_dab_slice_agent.py 2>&1 | tee ../../dab-slice-synthetic-tests.log

      - name: Seal synthetic gate receipt
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('data_science_dominance/dab_slice')
          log = Path('dab-slice-synthetic-tests.log')
          passed = log.exists() and '\nOK\n' in ('\n' + log.read_text() + '\n')
          receipt = {
              'schema': 'data-science-dominance/dab-slice-synthetic-gate/2',
              'verdict': 'PASS' if passed else 'FAIL',
              'official_dataset_values_accessed': False,
              'ground_truth_accessed': False,
              'validators_executed': False,
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_sha': os.environ['GITHUB_SHA'],
              'prior_synthetic_failure_run_id': 30989775767,
              'hashes': {
                  'candidate_sha256': hashlib.sha256((root / 'dab_slice_agent.py').read_bytes()).hexdigest(),
                  'patch_git_blob_sha': '25a235b016939c0f0d6343533fe90ce14e308f95',
                  'tests_sha256': hashlib.sha256((root / 'test_dab_slice_agent.py').read_bytes()).hexdigest(),
                  'freeze_sha256': hashlib.sha256((root / 'DAB_SLICE_FREEZE.json').read_bytes()).hexdigest(),
                  'test_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest() if log.exists() else None,
              },
          }
          payload = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          Path('dab-slice-synthetic-receipt.json').write_text(payload)
          Path('dab-slice-synthetic-receipt.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest() + '  dab-slice-synthetic-receipt.json\n')
          print(payload)
          PY

      - name: Upload immutable synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-dominance-dab-slice-synthetic-v2
          retention-days: 90
          path: |
            data_science_dominance/dab_slice/dab_slice_agent.py
            data_science_dominance/dab_slice/apply_dab_slice_patch_v3.py
            data_science_dominance/dab_slice/test_dab_slice_agent.py
            data_science_dominance/dab_slice/DAB_SLICE_FREEZE.json
            dab-slice-static-audit.json
            dab-slice-synthetic-tests.log
            dab-slice-synthetic-receipt.json
            dab-slice-synthetic-receipt.sha256
            dab-slice-pip-freeze.txt

      - name: Enforce synthetic gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('dab-slice-synthetic-receipt.json')
          if not path.exists():
              raise SystemExit('synthetic receipt missing')
          receipt = json.loads(path.read_text())
          if receipt['verdict'] != 'PASS':
              raise SystemExit('DAB slice synthetic gate failed')
          print('DAB slice synthetic gate: PASS')
          PY
