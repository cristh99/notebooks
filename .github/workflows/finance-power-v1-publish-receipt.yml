name: Finance Power v1 — publish verified receipt

on:
  workflow_run:
    workflows:
      - Finance Power v1 — public Logic Power v10 capsule
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch ==
      'agent/finance-power-v1-public-ci-capsule'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the exact verified head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: finance-power-v1-public-receipt
          path: _verified_artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable receipt marker
        env:
          VERIFIED_HEAD: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN: ${{ github.event.workflow_run.id }}
          VERIFIED_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          mkdir -p ci_receipts
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          receipt_path = Path("_verified_artifact/public_receipt.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          marker = {
              "schema": "finance-power-v1/published-pass/1",
              "verified_head": os.environ["VERIFIED_HEAD"],
              "verified_run": int(os.environ["VERIFIED_RUN"]),
              "verified_url": os.environ["VERIFIED_URL"],
              "receipt": receipt,
          }
          output = Path(
              "ci_receipts/finance-power-v1-public-pass.json"
          )
          output.write_text(
              json.dumps(marker, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_receipts/finance-power-v1-public-pass.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: publish verified Finance Power v1 receipt"
          git push origin HEAD:agent/finance-power-v1-public-ci-capsule
