name: OCR reading order Honduras router v1

on:
  pull_request:
    paths:
      - 'ocr_reading_order_real_v1/**'
      - 'ocr_reading_order_honduras_v1/prepare_holdout.py'
      - 'ocr_reading_order_honduras_router_v1/manifest.json'
      - 'ocr_reading_order_honduras_router_v1/router.py'
      - 'ocr_reading_order_honduras_router_v1/prepare_holdout.py'
      - 'ocr_reading_order_honduras_router_v1/test_router.py'
      - 'ocr_reading_order_honduras_router_v1/verify_preparation.py'
      - 'ocr_reading_order_honduras_router_v1/requirements.txt'
      - 'ocr_god_10x_quality_v1/**'
      - 'ocr_numeric_proof_10x_v1/**'
      - '.github/workflows/ocr-reading-order-honduras-router-v1.yml'
  workflow_dispatch:

concurrency:
  group: ocr-reading-order-honduras-router-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  prepare-independent-router-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ocr_reading_order_honduras_router_v1/requirements.txt
      - name: Install free local document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
      - name: Install minimal Python dependencies
        run: python -m pip install --disable-pip-version-check -r ocr_reading_order_honduras_router_v1/requirements.txt
      - name: Router unit and adversarial tests
        run: python -m unittest -v ocr_reading_order_honduras_router_v1.test_router
      - name: Acquire frozen first/last pages and route
        run: python -m ocr_reading_order_honduras_router_v1.prepare_holdout --output-dir ocr_reading_order_honduras_router_v1/run
      - name: Verify hashes, denominators, permutations and router replay
        run: |
          python -m ocr_reading_order_honduras_router_v1.verify_preparation \
            ocr_reading_order_honduras_router_v1/run/reports/preparation.json \
            ocr_reading_order_honduras_router_v1/manifest.json \
            ocr_reading_order_honduras_router_v1/run/reports/annotation_template.json
      - name: Environment and hashes
        if: always()
        run: |
          mkdir -p ocr_reading_order_honduras_router_v1/run/reports
          python -m pip freeze | LC_ALL=C sort > ocr_reading_order_honduras_router_v1/run/reports/pip-freeze.txt
          tesseract --version > ocr_reading_order_honduras_router_v1/run/reports/tesseract-version.txt
          pdftoppm -v 2> ocr_reading_order_honduras_router_v1/run/reports/pdftoppm-version.txt || true
          sha256sum ocr_reading_order_honduras_router_v1/run/reports/* > ocr_reading_order_honduras_router_v1/run/reports/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ocr-reading-order-honduras-router-v1-preparation
          path: |
            ocr_reading_order_honduras_router_v1/run/reports
            ocr_reading_order_honduras_router_v1/run/pages
            ocr_reading_order_honduras_router_v1/run/overlays
          retention-days: 30

  full-content-quality-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      STAGE1_ARTIFACT_ID: '8875749570'
      STAGE1_ARTIFACT_SHA256: 'f9164ebf8fda6d50f67cae29b8f6e6352c47bcfa555b72573c78cddfa378e1b6'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Install minimal retrieval dependency
        run: python -m pip install --disable-pip-version-check huggingface-hub==1.26.0
      - name: Unit and adversarial tests
        run: python -m unittest -v ocr_god_10x_quality_v1.test_full_content
      - name: Download exact frozen Stage 1 evidence
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${STAGE1_ARTIFACT_ID}/zip" > stage1.zip
          echo "${STAGE1_ARTIFACT_SHA256}  stage1.zip" | sha256sum --check --strict
          mkdir stage1
          unzip -q stage1.zip -d stage1
          test -f stage1/real_benchmark.json
      - name: Materialize pinned OmniDocBench annotation
        run: |
          python - <<'PY' > annotation_path.txt
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              'opendatalab/OmniDocBench',
              'OmniDocBench.json',
              repo_type='dataset',
              revision='aa1ee96d106dbe53d0ae59474d75c6e6d9b53fec',
          ))
          PY
          test -f "$(cat annotation_path.txt)"
      - name: Execute repaired full-content quality audit
        run: |
          ANNOTATION="$(cat annotation_path.txt)"
          python -m ocr_god_10x_quality_v1.full_content_quality \
            --stage1-report stage1/real_benchmark.json \
            --annotation "${ANNOTATION}" \
            --artifact-sha256 "${STAGE1_ARTIFACT_SHA256}" \
            --output-dir ocr_god_10x_quality_v1/run
      - name: Independent semantic replay
        run: |
          ANNOTATION="$(cat annotation_path.txt)"
          python -m ocr_god_10x_quality_v1.verify_full_content \
            ocr_god_10x_quality_v1/run/full_content_quality.json \
            --stage1-report stage1/real_benchmark.json \
            --annotation "${ANNOTATION}" \
            --artifact-sha256 "${STAGE1_ARTIFACT_SHA256}"
      - name: Hash evidence
        if: always()
        run: |
          mkdir -p ocr_god_10x_quality_v1/run
          cp annotation_path.txt ocr_god_10x_quality_v1/run/annotation_path.txt || true
          python -m pip freeze | LC_ALL=C sort > ocr_god_10x_quality_v1/run/pip-freeze.txt
          find ocr_god_10x_quality_v1/run -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > ocr_god_10x_quality_v1/run/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ocr-god-10x-full-content-quality
          path: ocr_god_10x_quality_v1/run
          if-no-files-found: error
          retention-days: 30

  numeric-proof-policy:
    needs: full-content-quality-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QUALITY_ARTIFACT_ID: '8876470754'
      QUALITY_ARTIFACT_SHA256: '18d74ddb48536cb645e3a5fd90e3aa6ddeed081b4671b07fdd03898bba0e9ce0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Unit and adversarial tests
        run: python -m unittest -v ocr_numeric_proof_10x_v1.test_policy
      - name: Download exact repaired-quality artifact
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${QUALITY_ARTIFACT_ID}/zip" > quality.zip
          echo "${QUALITY_ARTIFACT_SHA256}  quality.zip" | sha256sum --check --strict
          mkdir quality
          unzip -q quality.zip -d quality
          test -f quality/full_content_quality.json
      - name: Execute frozen numeric proof policy
        run: |
          python -m ocr_numeric_proof_10x_v1.policy \
            --quality-report quality/full_content_quality.json \
            --artifact-sha256 "${QUALITY_ARTIFACT_SHA256}" \
            --output-dir ocr_numeric_proof_10x_v1/run
      - name: Independent semantic replay
        run: |
          python -m ocr_numeric_proof_10x_v1.verify \
            ocr_numeric_proof_10x_v1/run/numeric_proof_policy.json \
            --quality-report quality/full_content_quality.json \
            --artifact-sha256 "${QUALITY_ARTIFACT_SHA256}"
      - name: Hash evidence
        if: always()
        run: |
          mkdir -p ocr_numeric_proof_10x_v1/run
          python -m pip freeze | LC_ALL=C sort > ocr_numeric_proof_10x_v1/run/pip-freeze.txt
          find ocr_numeric_proof_10x_v1/run -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > ocr_numeric_proof_10x_v1/run/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ocr-numeric-proof-10x-v1
          path: ocr_numeric_proof_10x_v1/run
          if-no-files-found: error
          retention-days: 30
