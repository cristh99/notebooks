name: Apply CORD annotation edge clipping v1

on:
  push:
    branches:
      - agent/ocr-cord-external-validation-v1
    paths:
      - '.github/patches/cord-annotation-edge-clip-v1.patch'
      - '.github/workflows/apply-cord-annotation-edge-clip-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-cord-annotation-edge-clip-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Verify and apply the outcome-blind geometry patch
        run: |
          patch=.github/patches/cord-annotation-edge-clip-v1.patch
          git apply --check "${patch}"
          git apply "${patch}"
          python -m py_compile \
            ocr_real_risk_v1/cord_natural_holdout.py \
            ocr_real_risk_v1/test_cord_natural_holdout.py
          test "$(git diff --name-only | sort)" = \
            $'ocr_real_risk_v1/cord_natural_holdout.py\nocr_real_risk_v1/test_cord_natural_holdout.py'
          grep -q 'numeric_annotations_clipped_to_image' \
            ocr_real_risk_v1/cord_natural_holdout.py
          grep -q 'test_annotation_bbox_is_clipped_before_selection' \
            ocr_real_risk_v1/test_cord_natural_holdout.py

      - name: Commit the mechanical pre-OCR correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ocr_real_risk_v1/cord_natural_holdout.py \
            ocr_real_risk_v1/test_cord_natural_holdout.py
          git commit -m 'Clip CORD annotation edge coordinates before selection'
          git push origin "HEAD:${GITHUB_REF_NAME}"
