name: OpenVINO v7 real Git Data CAS proof

on:
  push:
    branches:
      - agent/openvino-v7-smoke-16-stacked-v2
    paths:
      - '.github/workflows/apply-cord-annotation-edge-clip-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: openvino-v7-real-cas-proof
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PROOF_BRANCH: openvino-v7-cas-proof-${{ github.run_id }}

jobs:
  real-cas-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Execute real fast-forward compare-and-swap proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cas-evidence
          ledger_path='openvino-v7/cas-proof-ledger.json'
          full_ref="refs/heads/${PROOF_BRANCH}"
          api_ref="heads/${PROOF_BRANCH}"
          base_commit="${GITHUB_SHA}"
          base_tree="$(gh api "/repos/${GITHUB_REPOSITORY}/git/commits/${base_commit}" --jq .tree.sha)"

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          payload = {
              'schema': 'eaat.openvino_v7_real_cas_proof_ledger/1',
              'status': 'APPROVED_NOT_CLAIMED',
              'execution_id': f"openvino-v7-cas-proof-{os.environ['GITHUB_RUN_ID']}",
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'scientific_execution_authorized': False,
              'openvino_scientific_images_opened': 0,
              'ocr_runs': 0,
              'claim_count': 0,
          }
          raw = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['stable_payload_sha256'] = hashlib.sha256(raw).hexdigest()
          Path('initial-ledger.json').write_text(
              json.dumps(payload, sort_keys=True, separators=(',', ':')) + '\n'
          )
          PY

          initial_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' initial-ledger.json | \
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/blobs" \
              --input - --jq .sha)"
          jq -n --arg base "$base_tree" --arg blob "$initial_blob" \
            --arg path "$ledger_path" \
            '{base_tree:$base,tree:[{path:$path,mode:"100644",type:"blob",sha:$blob}]}' \
            > initial-tree-request.json
          initial_tree="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/trees" \
            --input initial-tree-request.json --jq .sha)"
          jq -n --arg tree "$initial_tree" --arg parent "$base_commit" \
            '{message:"Initialize OpenVINO v7 CAS proof ledger",tree:$tree,parents:[$parent]}' \
            > initial-commit-request.json
          initial_commit="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/commits" \
            --input initial-commit-request.json --jq .sha)"
          jq -n --arg ref "$full_ref" --arg sha "$initial_commit" \
            '{ref:$ref,sha:$sha}' > create-ref-request.json
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
            --input create-ref-request.json > cas-evidence/create-ref-response.json
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/${api_ref}" --jq .object.sha)" \
            = "$initial_commit"
          initial_observed_tree="$(gh api "/repos/${GITHUB_REPOSITORY}/git/commits/${initial_commit}" --jq .tree.sha)"
          initial_observed_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/git/trees/${initial_observed_tree}" \
            --jq ".tree[] | select(.path == \"${ledger_path}\") | .sha")"
          test "$initial_observed_blob" = "$initial_blob"

          export INITIAL_COMMIT="$initial_commit" INITIAL_BLOB="$initial_blob"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          previous = json.loads(Path('initial-ledger.json').read_text())
          payload = {
              **{k: v for k, v in previous.items() if k != 'stable_payload_sha256'},
              'status': 'CLAIMED_FULL_EXTERNAL_GATE_ONCE',
              'claim_count': 1,
              'claim': {
                  'cas_strategy': 'github_git_data_fast_forward_ref_cas',
                  'ledger_parent_commit_sha': os.environ['INITIAL_COMMIT'],
                  'ledger_blob_sha_before': os.environ['INITIAL_BLOB'],
                  'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                  'scientific_execution_authorized': False,
              },
          }
          raw = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['stable_payload_sha256'] = hashlib.sha256(raw).hexdigest()
          Path('claimed-ledger.json').write_text(
              json.dumps(payload, sort_keys=True, separators=(',', ':')) + '\n'
          )
          PY

          claimed_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' claimed-ledger.json | \
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/blobs" \
              --input - --jq .sha)"
          jq -n --arg base "$initial_tree" --arg blob "$claimed_blob" \
            --arg path "$ledger_path" \
            '{base_tree:$base,tree:[{path:$path,mode:"100644",type:"blob",sha:$blob}]}' \
            > claimed-tree-request.json
          claimed_tree="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/trees" \
            --input claimed-tree-request.json --jq .sha)"
          jq -n --arg tree "$claimed_tree" --arg parent "$initial_commit" \
            '{message:"Claim OpenVINO v7 CAS proof ledger once",tree:$tree,parents:[$parent]}' \
            > claimed-commit-request.json
          claimed_commit="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/commits" \
            --input claimed-commit-request.json --jq .sha)"
          jq -n --arg sha "$claimed_commit" '{sha:$sha,force:false}' > update-ref-request.json
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/git/refs/${api_ref}" \
            --input update-ref-request.json > cas-evidence/claim-ref-response.json

          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/${api_ref}" --jq .object.sha)" \
            = "$claimed_commit"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/commits/${claimed_commit}" --jq .parents[0].sha)" \
            = "$initial_commit"
          claimed_observed_tree="$(gh api "/repos/${GITHUB_REPOSITORY}/git/commits/${claimed_commit}" --jq .tree.sha)"
          claimed_observed_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/git/trees/${claimed_observed_tree}" \
            --jq ".tree[] | select(.path == \"${ledger_path}\") | .sha")"
          test "$claimed_observed_blob" = "$claimed_blob"
          gh api "/repos/${GITHUB_REPOSITORY}/git/blobs/${claimed_blob}" --jq .content \
            | tr -d '\n' | base64 -d > cas-evidence/claimed-roundtrip.json
          cmp claimed-ledger.json cas-evidence/claimed-roundtrip.json

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          payload = {
              'schema': 'eaat.openvino_v7_real_cas_proof_ledger/1',
              'status': 'STALE_SECOND_WRITER',
              'scientific_execution_authorized': False,
          }
          raw = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['stable_payload_sha256'] = hashlib.sha256(raw).hexdigest()
          Path('stale-ledger.json').write_text(
              json.dumps(payload, sort_keys=True, separators=(',', ':')) + '\n'
          )
          PY
          stale_blob="$(jq -Rs '{content: ., encoding: "utf-8"}' stale-ledger.json | \
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/blobs" \
              --input - --jq .sha)"
          jq -n --arg base "$initial_tree" --arg blob "$stale_blob" \
            --arg path "$ledger_path" \
            '{base_tree:$base,tree:[{path:$path,mode:"100644",type:"blob",sha:$blob}]}' \
            > stale-tree-request.json
          stale_tree="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/trees" \
            --input stale-tree-request.json --jq .sha)"
          jq -n --arg tree "$stale_tree" --arg parent "$initial_commit" \
            '{message:"Stale OpenVINO CAS writer must fail",tree:$tree,parents:[$parent]}' \
            > stale-commit-request.json
          stale_commit="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/commits" \
            --input stale-commit-request.json --jq .sha)"
          jq -n --arg sha "$stale_commit" '{sha:$sha,force:false}' > stale-update-request.json
          if gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/git/refs/${api_ref}" \
              --input stale-update-request.json \
              > cas-evidence/stale-update.stdout 2> cas-evidence/stale-update.stderr; then
            echo 'stale non-fast-forward update unexpectedly succeeded' >&2
            exit 1
          fi
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/${api_ref}" --jq .object.sha)" \
            = "$claimed_commit"

          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/${api_ref}"
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/${api_ref}" >/dev/null 2>&1; then
            echo 'temporary proof ref still exists' >&2
            exit 1
          fi

          export BASE_COMMIT="$base_commit" INITIAL_TREE="$initial_tree"
          export CLAIMED_COMMIT="$claimed_commit" CLAIMED_BLOB="$claimed_blob"
          export STALE_COMMIT="$stale_commit" STALE_BLOB="$stale_blob"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          receipt = {
              'schema': 'eaat.openvino_v7_real_github_cas_proof/1',
              'status': 'PASS_REAL_GITHUB_FAST_FORWARD_CAS',
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_sha': os.environ['GITHUB_SHA'],
              'temporary_branch': os.environ['PROOF_BRANCH'],
              'base_commit_sha': os.environ['BASE_COMMIT'],
              'initial_commit_sha': os.environ['INITIAL_COMMIT'],
              'initial_tree_sha': os.environ['INITIAL_TREE'],
              'initial_blob_sha': os.environ['INITIAL_BLOB'],
              'claimed_commit_sha': os.environ['CLAIMED_COMMIT'],
              'claimed_blob_sha': os.environ['CLAIMED_BLOB'],
              'stale_commit_sha': os.environ['STALE_COMMIT'],
              'stale_blob_sha': os.environ['STALE_BLOB'],
              'cas_strategy': 'github_git_data_fast_forward_ref_cas',
              'initial_ref_created': True,
              'claim_fast_forward_succeeded': True,
              'claim_parent_verified': True,
              'claim_blob_roundtrip_verified': True,
              'stale_sibling_update_rejected': True,
              'ref_unchanged_after_stale_attempt': True,
              'temporary_ref_deleted': True,
              'main_branch_modified': False,
              'scientific_execution_authorized': False,
              'openvino_scientific_images_opened': 0,
              'ocr_runs': 0,
              'candidate_inference_runs': 0,
              'external_spend_usd': 0,
          }
          raw = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['stable_payload_sha256'] = hashlib.sha256(raw).hexdigest()
          Path('cas-evidence/cas-proof-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          PY
          cp initial-ledger.json claimed-ledger.json stale-ledger.json cas-evidence/
          (cd cas-evidence && \
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum \
              | sed 's#  \./#  #' > SHA256SUMS.txt)
          (cd cas-evidence && sha256sum --check --strict SHA256SUMS.txt)

      - name: Ensure temporary proof ref is absent
        if: always()
        shell: bash
        run: |
          gh api --method DELETE \
            "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${PROOF_BRANCH}" \
            >/dev/null 2>&1 || true

      - name: Upload immutable CAS proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openvino-v7-real-cas-proof-${{ github.sha }}
          path: cas-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
