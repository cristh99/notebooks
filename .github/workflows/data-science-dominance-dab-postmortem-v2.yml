name: Data Science dominance — DAB root-cause postmortem v2

on:
  push:
    branches:
      - agent/data-science-dominance-dab-slice
    paths:
      - '.github/workflows/data-science-dominance-dab-postmortem-v2.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DAB_SHA: 9a55e34271a2500a41cbc009e239edd94599e374
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove workflow-only activation after unchanged diagnostic script
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test "$(git rev-parse HEAD^)" = 'e7fb038491193192cd410387a6ea47261b05a918'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/data-science-dominance-dab-postmortem-v2.yml'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install bounded diagnostic environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client git-lfs
          python -m pip install --disable-pip-version-check \
            'duckdb==1.3.1' 'psycopg2-binary==2.9.9' 'pymongo==4.13.2' \
            'huggingface-hub==1.2.1' 'rapidfuzz==3.14.1'

      - name: Reconstruct exact failed candidate and compile diagnostic
        shell: bash
        run: |
          set -euo pipefail
          bash data_science_dominance/dab_slice/reconstruct_dab_slice.sh
          echo '0796f1d66d944e832181034f6e8e8800461b60d71e66716d5b19fe3fd1957dec  data_science_dominance/dab_slice/dab_slice_agent.py' | sha256sum -c -
          python -m py_compile data_science_dominance/dab_slice/postmortem_v2.py

      - name: Acquire only Civic and USAspending public datasets
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --filter=blob:none --no-checkout https://github.com/ucbepic/DataAgentBench.git dab
          cd dab
          git sparse-checkout init --no-cone
          cat > .git/info/sparse-checkout <<'EOF'
          /dataset_manifest.tsv
          /query_civic_unstructured/query_dataset/**
          /query_usaspending/query_dataset/**
          EOF
          git -c advice.detachedHead=false checkout "$DAB_SHA"
          test "$(git rev-parse HEAD)" = "$DAB_SHA"
          cd ..
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          root = Path('dab')
          selected = [
              'query_civic_unstructured/query_dataset/civic_docs_dump/civic_db/civic_docs.bson',
              'query_civic_unstructured/query_dataset/funding.db',
              'query_usaspending/query_dataset/agencies.duckdb',
              'query_usaspending/query_dataset/contracts.sql',
          ]
          manifest = {}
          for line in (root / 'dataset_manifest.tsv').read_text().splitlines():
              if line and not line.startswith('#'):
                  path, sha256, size = line.split('\t')
                  manifest[path] = (sha256, int(size))
          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b''):
                      h.update(chunk)
              return h.hexdigest()
          for relative in selected:
              path = root / relative
              expected = manifest.get(relative)
              valid = bool(expected and path.is_file() and path.stat().st_size == expected[1] and digest(path) == expected[0])
              if expected and not valid:
                  hf_hub_download(
                      repo_id='ruiyingm/DataAgentBench-data', repo_type='dataset',
                      filename=relative, local_dir=str(root), force_download=True,
                  )
              if expected:
                  assert (digest(path), path.stat().st_size) == expected
              else:
                  assert path.is_file() and path.stat().st_size > 1024
          PY

      - name: Import USAspending PostgreSQL source
        shell: bash
        run: |
          set -euo pipefail
          dropdb --if-exists -h 127.0.0.1 -U postgres usaspending_contracts
          createdb -h 127.0.0.1 -U postgres usaspending_contracts
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d usaspending_contracts \
            -f dab/query_usaspending/query_dataset/contracts.sql > postgres-import.log

      - name: Diagnose both deterministic failures
        shell: bash
        run: |
          set -euo pipefail
          python data_science_dominance/dab_slice/postmortem_v2.py \
            --dab-root "$PWD/dab" \
            --candidate "$PWD/data_science_dominance/dab_slice/dab_slice_agent.py" \
            --evidence "$PWD/postmortem-evidence" \
            2>&1 | tee postmortem-output.log

      - name: Upload bounded postmortem evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-dominance-dab-postmortem-v2
          retention-days: 30
          if-no-files-found: error
          path: |
            postmortem-evidence/**
            postmortem-output.log
            postgres-import.log
            data_science_dominance/dab_slice/postmortem_v2.py
            data_science_dominance/dab_slice/dab_slice_agent.py
