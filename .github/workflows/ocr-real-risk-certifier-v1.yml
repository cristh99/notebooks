name: OCR exact numeric risk certifier v1

on:
  pull_request:
    paths:
      - 'ocr_real_risk_v1/risk_certificate.py'
      - 'ocr_real_risk_v1/sample_size_plan.py'
      - 'ocr_real_risk_v1/test_risk_certificate.py'
      - 'ocr_real_risk_v1/test_sample_size_plan.py'
      - '.github/workflows/ocr-real-risk-certifier-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocr-real-risk-certifier-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-certifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Exact and adversarial tests
        run: |
          python -m unittest -v \
            ocr_real_risk_v1.test_risk_certificate \
            ocr_real_risk_v1.test_sample_size_plan
      - name: Build predeclared sample-size frontier
        run: |
          python -m ocr_real_risk_v1.sample_size_plan \
            --output ocr_real_risk_v1/run/sample_size_plan.json
      - name: Hash evidence
        run: |
          sha256sum ocr_real_risk_v1/run/sample_size_plan.json \
            > ocr_real_risk_v1/run/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocr-real-risk-certifier-v1
          path: ocr_real_risk_v1/run
          if-no-files-found: error
          retention-days: 30
