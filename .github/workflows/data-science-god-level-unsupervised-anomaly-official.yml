name: Data Science God-Level — official unsupervised anomaly gate

on:
  push:
    branches:
      - agent/data-science-god-level-unsupervised-anomaly-official
    paths:
      - '.github/workflows/data-science-god-level-unsupervised-anomaly-official.yml'

permissions:
  contents: read
  actions: read

jobs:
  official-unsupervised-anomaly:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned CPU environment
        run: |
          mkdir -p official-data official-logs public-proof
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'scipy==1.14.1' 'scikit-learn==1.5.2'
          python -m pip freeze | sort > official-logs/pip-freeze.txt

      - name: Require immutable public PASS before official data access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/cristh99/notebooks/actions/artifacts/8879204104/zip' \
            -o /tmp/public-proof.zip
          echo '58179b8316b00be74ec40dd443b138037cdd3d5c37676132edadd8b926d13c09  /tmp/public-proof.zip' | sha256sum -c -
          unzip -q /tmp/public-proof.zip -d public-proof
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          receipt = json.loads(Path('public-proof/public-logs/public-freeze-receipt.json').read_text())
          assert receipt['verdict'] == 'PASS'
          assert receipt['candidate_label_access'] is False
          assert receipt['official_suite_accessed'] is False
          assert receipt['post_hoc_retuning_permitted_after_official_evaluation'] is False
          expected = {
              'estimator_sha256': 'c0f199186db9ed355befafddc7b0fbd74d7819ae56d21f98b275c4d3d2eb2713',
              'benchmark_sha256': 'fb48b19ef88db447ddffb0b7e9dfbb10dd404c0d4b7ce76ac63ac03117715fc7',
              'test_sha256': '897810b84c4e683e9a30e1512cf60af42b2cb8caf47292c99b7af45a4cc1cd9a',
              'logic_plan_source_sha256': '7a26c9f4c48a77fb51188a20ad028f14cbdc900aeab08319c2e31a98a2e25a3a',
              'logic_plan_receipt_sha256': '9b64a528b6c5a078ef07d11818b33aa59c07db46cc604cf9cba557ec725b1035',
              'report_sha256': '994088b3b80f891c11331450ff6819f374e32785a076b24d0a8e6d363e4588e1',
          }
          for key, value in expected.items():
              assert receipt['hashes'][key] == value
          assert receipt['summary']['dataset_count'] == 6
          assert receipt['summary']['wins_vs_best'] == 3
          assert abs(receipt['summary']['candidate_mean_roc_auc'] - 0.7923457691160481) < 1e-15
          assert abs(receipt['summary']['mean_advantage_vs_best'] - 0.002543555014227386) < 1e-15

          root = Path('data_science_god_level/unsupervised_anomaly')
          branch_hashes = {
              'estimator_sha256': hashlib.sha256((root / 'estimator.py').read_bytes()).hexdigest(),
              'benchmark_sha256': hashlib.sha256((root / 'benchmark.py').read_bytes()).hexdigest(),
              'test_sha256': hashlib.sha256((root / 'test_estimator.py').read_bytes()).hexdigest(),
              'logic_plan_source_sha256': hashlib.sha256((root / 'logic_plan.py').read_bytes()).hexdigest(),
          }
          assert branch_hashes == {key: expected[key] for key in branch_hashes}
          logic_receipt = Path('public-proof/data_science_god_level/unsupervised_anomaly/logic-plan-receipt.json')
          assert hashlib.sha256(logic_receipt.read_bytes()).hexdigest() == expected['logic_plan_receipt_sha256']

          proof = {
              'schema': 'data-science-god-level/unsupervised-anomaly-official-prerequisites/1',
              'public_run_id': 30874963136,
              'public_artifact_id': 8879204104,
              'public_artifact_sha256': hashlib.sha256(Path('/tmp/public-proof.zip').read_bytes()).hexdigest(),
              'public_verdict': receipt['verdict'],
              'frozen_hashes': expected,
              'official_suite_access_before_freeze': False,
              'candidate_label_access': False,
          }
          Path('official-logs/prerequisites.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY

      - name: Re-audit exact frozen candidate before official truth access
        run: |
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path

          root = Path('data_science_god_level/unsupervised_anomaly')
          expected = {
              'estimator.py': 'c0f199186db9ed355befafddc7b0fbd74d7819ae56d21f98b275c4d3d2eb2713',
              'benchmark.py': 'fb48b19ef88db447ddffb0b7e9dfbb10dd404c0d4b7ce76ac63ac03117715fc7',
              'test_estimator.py': '897810b84c4e683e9a30e1512cf60af42b2cb8caf47292c99b7af45a4cc1cd9a',
              'logic_plan.py': '7a26c9f4c48a77fb51188a20ad028f14cbdc900aeab08319c2e31a98a2e25a3a',
          }
          actual = {
              name: hashlib.sha256((root / name).read_bytes()).hexdigest()
              for name in expected
          }
          assert actual == expected

          tree = ast.parse((root / 'estimator.py').read_text(encoding='utf-8'))
          imports, symbols, calls = set(), set(), []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.level == 0:
                  imports.add((node.module or '').split('.')[0])
              elif isinstance(node, ast.Name):
                  symbols.add(node.id)
              elif isinstance(node, ast.Attribute):
                  symbols.add(node.attr)
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.append(node.func.id)
                  elif isinstance(node.func, ast.Attribute):
                      calls.append(node.func.attr)
          assert not (imports - {'__future__','dataclasses','typing','numpy','scipy','sklearn'})
          assert not (set(calls) & {'open','eval','exec','compile','__import__','system','popen','run','urlopen','request','read_csv','load'})
          assert not (symbols & {'Path','dataset_name','filename','labels','y','requests','socket','subprocess','pandas'})

          audit = {
              'schema': 'data-science-god-level/unsupervised-anomaly-official-static-audit/1',
              'hashes': actual,
              'candidate_label_access': False,
              'candidate_dataset_identifier_access': False,
              'candidate_filesystem_network_process_access': False,
          }
          Path('official-logs/static-audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n'
          )
          PY
          (cd data_science_god_level/unsupervised_anomaly && python -m unittest -v test_estimator.py)

      - name: Download the predeclared official ADBench suite exactly once
        shell: bash
        run: |
          set -euo pipefail
          ref='3dac8221081e190f157d78e93bfa8867f90d0965'
          base="https://raw.githubusercontent.com/Minqi824/ADBench/${ref}/adbench/datasets/Classical"
          fetch_data() {
            local source_name="$1"
            local role="$2"
            curl -fsSL --retry 4 --retry-all-errors \
              "$base/$source_name" -o "official-data/$role.npz"
          }
          fetch_data 2_annthyroid.npz o01
          fetch_data 12_fault.npz o02
          fetch_data 17_InternetAds.npz o03
          fetch_data 25_musk.npz o04
          fetch_data 31_satimage-2.npz o05
          fetch_data 38_thyroid.npz o06
          test "$(find official-data -type f -name '*.npz' | wc -l)" -eq 6
          test "$(find official-data -type f ! -name '*.npz' | wc -l)" -eq 0
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          for path in sorted(Path('official-data').glob('*.npz')):
              data = np.load(path, allow_pickle=True)
              assert set(data.files) >= {'X', 'y'}
              assert len(data['X']) == len(data['y'])
              print(path.name, data['X'].shape)
          PY

      - name: Seal official data and benchmark manifest before scoring
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('official-data').resolve()
          source = {
              'o01': '2_annthyroid.npz',
              'o02': '12_fault.npz',
              'o03': '17_InternetAds.npz',
              'o04': '25_musk.npz',
              'o05': '31_satimage-2.npz',
              'o06': '38_thyroid.npz',
          }
          seed = {'o01':251,'o02':257,'o03':263,'o04':269,'o05':271,'o06':277}
          files, datasets = [], []
          for role in sorted(source):
              path = root / f'{role}.npz'
              files.append({
                  'role': role,
                  'source_file': source[role],
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
              datasets.append({'role': role, 'seed': seed[role], 'path': str(path)})
          data_manifest = {
              'schema': 'data-science-god-level/unsupervised-anomaly-official-data/1',
              'source_repository': 'Minqi824/ADBench',
              'source_commit': '3dac8221081e190f157d78e93bfa8867f90d0965',
              'official_files': files,
              'actual_evaluation_count_authorized': 1,
          }
          benchmark_manifest = {
              'schema': 'data-science-god-level/unsupervised-anomaly-manifest/1',
              'suite': 'official-transfer',
              'datasets': datasets,
              'candidate_label_access': False,
              'actual_evaluation_count_authorized': 1,
          }
          Path('official-logs/data-manifest.json').write_text(
              json.dumps(data_manifest, indent=2, sort_keys=True) + '\n'
          )
          Path('official-logs/benchmark-manifest.json').write_text(
              json.dumps(benchmark_manifest, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(data_manifest, indent=2, sort_keys=True))
          PY

      - name: Run the first and only official anomaly evaluation
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
        run: |
          cd data_science_god_level/unsupervised_anomaly
          python benchmark.py \
            --manifest "${GITHUB_WORKSPACE}/official-logs/benchmark-manifest.json" \
            --output "${GITHUB_WORKSPACE}/official-logs/official-report.json" \
            2>&1 | tee "${GITHUB_WORKSPACE}/official-logs/evaluation-output.txt"

      - name: Adjudicate predeclared absolute and comparative gates
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          report_path = Path('official-logs/official-report.json')
          report = json.loads(report_path.read_text()) if report_path.exists() else None
          thresholds = {
              'dataset_count': 6,
              'candidate_mean_roc_auc_min': 0.72,
              'candidate_min_roc_auc_min': 0.50,
              'candidate_mean_ap_skill_min': 0.15,
              'candidate_mean_combined_skill_min': 0.30,
              'mean_advantage_vs_best_min': 0.0,
              'wins_vs_best_min': 4,
              'worst_advantage_vs_best_min': -0.10,
          }
          if report:
              summary = report['summary']
              roles = sorted(row['role'] for row in report['datasets'])
              checks = {
                  'dataset_count': summary['dataset_count'] == thresholds['dataset_count'],
                  'official_roles_only': roles == ['o01','o02','o03','o04','o05','o06'],
                  'finite_all': bool(summary['finite_all']),
                  'candidate_mean_roc_auc': summary['candidate_mean_roc_auc'] >= thresholds['candidate_mean_roc_auc_min'],
                  'candidate_min_roc_auc': summary['candidate_min_roc_auc'] >= thresholds['candidate_min_roc_auc_min'],
                  'candidate_mean_ap_skill': summary['candidate_mean_ap_skill'] >= thresholds['candidate_mean_ap_skill_min'],
                  'candidate_mean_combined_skill': summary['candidate_mean_combined_skill'] >= thresholds['candidate_mean_combined_skill_min'],
                  'mean_advantage_vs_best': summary['mean_advantage_vs_best'] >= thresholds['mean_advantage_vs_best_min'],
                  'wins_vs_best': summary['wins_vs_best'] >= thresholds['wins_vs_best_min'],
                  'worst_advantage_vs_best': summary['worst_advantage_vs_best'] >= thresholds['worst_advantage_vs_best_min'],
              }
              metrics = summary
              verdict = 'PASS' if all(checks.values()) else 'FAIL'
          else:
              checks = {'report_exists': False}
              metrics = None
              verdict = 'INVALID_RUN'

          def digest(path):
              path = Path(path)
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None

          receipt = {
              'schema': 'data-science-god-level/unsupervised-anomaly-official-freeze/1',
              'verdict': verdict,
              'actual_official_evaluation_count': 1 if report else 0,
              'candidate_frozen_before_official_truth': True,
              'candidate_label_access': False,
              'post_hoc_retuning_permitted': False,
              'public_run_id': 30874963136,
              'public_artifact_id': 8879204104,
              'official_roles': ['o01','o02','o03','o04','o05','o06'],
              'thresholds': thresholds,
              'metrics': metrics,
              'checks': checks,
              'hashes': {
                  'estimator_sha256': 'c0f199186db9ed355befafddc7b0fbd74d7819ae56d21f98b275c4d3d2eb2713',
                  'benchmark_sha256': 'fb48b19ef88db447ddffb0b7e9dfbb10dd404c0d4b7ce76ac63ac03117715fc7',
                  'test_sha256': '897810b84c4e683e9a30e1512cf60af42b2cb8caf47292c99b7af45a4cc1cd9a',
                  'logic_plan_receipt_sha256': '9b64a528b6c5a078ef07d11818b33aa59c07db46cc604cf9cba557ec725b1035',
                  'prerequisites_sha256': digest('official-logs/prerequisites.json'),
                  'static_audit_sha256': digest('official-logs/static-audit.json'),
                  'official_data_manifest_sha256': digest('official-logs/data-manifest.json'),
                  'official_report_sha256': digest(report_path),
              },
          }
          payload = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          Path('official-logs/official-freeze-receipt.json').write_text(payload)
          Path('official-logs/official-freeze-receipt.sha256').write_text(
              hashlib.sha256(payload.encode()).hexdigest() + '  official-freeze-receipt.json\n'
          )
          print(payload)
          PY

      - name: Upload immutable official evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-god-level-unsupervised-anomaly-official
          retention-days: 90
          path: |
            data_science_god_level/unsupervised_anomaly/estimator.py
            data_science_god_level/unsupervised_anomaly/benchmark.py
            data_science_god_level/unsupervised_anomaly/test_estimator.py
            public-proof/data_science_god_level/unsupervised_anomaly/logic-plan-receipt.json
            official-logs/**

      - name: Enforce one-shot official verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('official-logs/official-freeze-receipt.json')
          if not path.exists():
              raise SystemExit('official receipt missing')
          receipt = json.loads(path.read_text())
          if receipt['actual_official_evaluation_count'] != 1:
              raise SystemExit('actual official evaluation was not completed')
          if receipt['verdict'] != 'PASS':
              raise SystemExit(f"official unsupervised anomaly gate: {receipt['verdict']}; evidence preserved; no retuning")
          print('official unsupervised anomaly gate: PASS; no retuning permitted')
          PY
