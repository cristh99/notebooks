name: OCR reading order Tesseract v1

on:
  pull_request:
    paths:
      - 'ocr_reading_order_real_v1/**'
      - 'ocr_reading_order_tesseract_v1/**'
      - '.github/workflows/ocr-reading-order-tesseract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-xycut-on-tesseract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ocr_reading_order_tesseract_v1/requirements.txt
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install minimal Python dependencies
        run: python -m pip install --disable-pip-version-check -r ocr_reading_order_tesseract_v1/requirements.txt
      - name: Unit tests
        run: python -m unittest -v ocr_reading_order_tesseract_v1.test_canary
      - name: Execute frozen 50-page real canary
        run: python -m ocr_reading_order_tesseract_v1.run_fast --output-dir ocr_reading_order_tesseract_v1/run
      - name: Replay metrics from frozen observations
        run: python -m ocr_reading_order_tesseract_v1.verify_fast ocr_reading_order_tesseract_v1/run/reports/tesseract_order.json
      - name: Environment and hashes
        if: always()
        run: |
          mkdir -p ocr_reading_order_tesseract_v1/run/reports
          python -m pip freeze | LC_ALL=C sort > ocr_reading_order_tesseract_v1/run/reports/pip-freeze.txt
          tesseract --version > ocr_reading_order_tesseract_v1/run/reports/tesseract-version.txt
          sha256sum ocr_reading_order_tesseract_v1/run/reports/* > ocr_reading_order_tesseract_v1/run/reports/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ocr-reading-order-tesseract-v1
          path: ocr_reading_order_tesseract_v1/run/reports
          retention-days: 30
