name: OCR reading order real v1

on:
  pull_request:
    paths:
      - 'ocr_reading_order_real_v1/**'
      - '.github/workflows/ocr-reading-order-real-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-only-reading-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ocr_reading_order_real_v1/requirements.txt
      - name: Install minimal pinned dependency
        run: python -m pip install --disable-pip-version-check -r ocr_reading_order_real_v1/requirements.txt
      - name: Unit and adversarial tests
        run: python -m unittest -v ocr_reading_order_real_v1.test_reading_order
      - name: Execute sealed annotation-only benchmark
        run: python -m ocr_reading_order_real_v1.run_benchmark --output-dir ocr_reading_order_real_v1/run
      - name: Full semantic replay verification
        run: python -m ocr_reading_order_real_v1.verify_report ocr_reading_order_real_v1/run/reports/reading_order.json
      - name: Environment and hashes
        run: |
          python -m pip freeze | LC_ALL=C sort > ocr_reading_order_real_v1/run/reports/pip-freeze.txt
          sha256sum ocr_reading_order_real_v1/run/reports/* > ocr_reading_order_real_v1/run/reports/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocr-reading-order-real-v1
          path: ocr_reading_order_real_v1/run/reports
          retention-days: 30
