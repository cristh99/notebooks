name: Apply WildReceipt evaluator freeze patch

on:
  push:
    branches:
      - agent/ocr-consensus-detector-v4
    paths:
      - '.github/patches/include-wildreceipt-external-in-candidate.patch'
      - '.github/workflows/apply-wildreceipt-evaluator-freeze-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-wildreceipt-evaluator-freeze-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Apply and verify candidate-source inclusion
        run: |
          patch=.github/patches/include-wildreceipt-external-in-candidate.patch
          git apply --check "${patch}"
          git apply "${patch}"
          python -m py_compile \
            ocr_real_risk_v1/numeric_consensus_candidate_v4_wildreceipt.py \
            ocr_real_risk_v1/test_numeric_consensus_candidate_v4_wildreceipt.py \
            ocr_real_risk_v1/wildreceipt_external.py
          grep -q '"ocr_real_risk_v1/wildreceipt_external.py"' \
            ocr_real_risk_v1/numeric_consensus_candidate_v4_wildreceipt.py
      - name: Commit the pre-outcome evaluator binding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ocr_real_risk_v1/numeric_consensus_candidate_v4_wildreceipt.py \
            ocr_real_risk_v1/test_numeric_consensus_candidate_v4_wildreceipt.py
          git commit -m 'Bind WildReceipt evaluator into frozen candidate'
          git push origin "HEAD:${GITHUB_REF_NAME}"
