name: Public missingness-selection verification

on:
  push:
    branches:
      - agent/inference-power-compiler-v2-public-ci
    paths:
      - 'inference_power_compiler_v2/verify_missingness_selection_public.py'
      - 'FiniteMissingnessSelectionPublic.lean'
      - '.github/workflows/missingness-selection-public.yml'
  pull_request:
    paths:
      - 'inference_power_compiler_v2/verify_missingness_selection_public.py'
      - 'FiniteMissingnessSelectionPublic.lean'
      - '.github/workflows/missingness-selection-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-missingness-selection-public:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Compile and replay independent verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            inference_power_compiler_v2/verify_missingness_selection_public.py
          python inference_power_compiler_v2/verify_missingness_selection_public.py \
            | tee missingness-selection-public.log
          test -s inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_REPORT.json
          test -s inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_CERTIFICATE.json
          sha256sum \
            inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_REPORT.json \
            inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_CERTIFICATE.json \
            > /tmp/missingness-selection-public-before.sha256
          python inference_power_compiler_v2/verify_missingness_selection_public.py \
            > /tmp/missingness-selection-public-rebuild.log
          sha256sum \
            inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_REPORT.json \
            inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_CERTIFICATE.json \
            > /tmp/missingness-selection-public-after.sha256
          cmp \
            /tmp/missingness-selection-public-before.sha256 \
            /tmp/missingness-selection-public-after.sha256

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile public formal boundary
        shell: bash
        run: |
          set -euo pipefail
          elan run leanprover/lean4:v4.33.0-rc1 lean \
            -o FiniteMissingnessSelectionPublic.olean \
            FiniteMissingnessSelectionPublic.lean \
            2>&1 | tee finite-missingness-selection-public-lean.log
          test -s FiniteMissingnessSelectionPublic.olean
          if grep -q 'sorryAx' finite-missingness-selection-public-lean.log; then
            echo 'Unexpected sorryAx' >&2
            exit 1
          fi

      - name: Build verification receipt
        shell: bash
        env:
          PUBLIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report = Path('inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_REPORT.json')
          certificate = Path('inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_CERTIFICATE.json')
          verifier = Path('inference_power_compiler_v2/verify_missingness_selection_public.py')
          lean = Path('FiniteMissingnessSelectionPublic.lean')
          receipt = {
              'schema': 'missingness-selection-public-verification-receipt/1',
              'repository': 'cristh99/notebooks',
              'head': os.environ['PUBLIC_HEAD_SHA'],
              'event_sha': os.environ['PUBLIC_EVENT_SHA'],
              'private_repository': 'cristh99/my_first_repository',
              'private_pull_request': 68,
              'private_head': '0de4c5c7c68fc23a2cf5238d8177a76d009bc61f',
              'private_blobs': {
                  'compiler': '1f6a513a3360ad93fe3337ae3cfd205a9743cc5a',
                  'runner': 'db6509ae959c7b209c4811802823f7c663812218',
                  'tests': 'ae77fdc9de8530c3f0c676e732d41b4ecc3d00d4',
                  'lean': '4807c5dfe41bd8b21b80944b97a5494a54066ec3',
                  'workflow': 'b100620d4719405482819eb2f543f61cb83b3e4b',
              },
              'report_sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
              'certificate_sha256': hashlib.sha256(certificate.read_bytes()).hexdigest(),
              'verifier_sha256': hashlib.sha256(verifier.read_bytes()).hexdigest(),
              'lean_source_sha256': hashlib.sha256(lean.read_bytes()).hexdigest(),
              'complete_world_enumeration': 'PASS',
              'kernel_normalization': 'PASS',
              'exact_bayesian_updates': 'PASS',
              'sharp_support_intervals': 'PASS',
              'complete_finite_policy_search': 'PASS',
              'budget_feasibility': 'PASS',
              'pareto_frontier': 'PASS',
              'selected_policy_replay': 'PASS',
              'policy_tamper_rejection': 'PASS',
              'certificate_tamper_rejection': 'PASS',
              'semantic_forgery_rejection': 'PASS',
              'overlap_obstruction': 'PASS',
              'deterministic_rebuild': 'PASS',
              'lean': 'PASS',
              'sorryAx': 'ABSENT',
          }
          path = Path('inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_RECEIPT.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_RECEIPT.sha256').write_text(
              f'{digest}  MISSINGNESS_SELECTION_PUBLIC_RECEIPT.json\n'
          )
          print(path.read_text())
          print(digest)
          PY

      - name: Upload public missingness-selection evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: missingness-selection-public-evidence
          path: |
            inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_*.json
            inference_power_compiler_v2/MISSINGNESS_SELECTION_PUBLIC_RECEIPT.sha256
            inference_power_compiler_v2/verify_missingness_selection_public.py
            FiniteMissingnessSelectionPublic.lean
            FiniteMissingnessSelectionPublic.olean
            missingness-selection-public.log
            finite-missingness-selection-public-lean.log
          if-no-files-found: error
          retention-days: 90
