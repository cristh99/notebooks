name: Data Science God-Level — ACIC16 causal official sealed gate

on:
  pull_request:
    paths:
      - '.github/workflows/data-science-god-level-causal-acic16-official.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  official-causal-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pinned causal benchmark environment
        run: |
          mkdir -p official-logs frozen /tmp/acic16-candidate
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' \
            'pandas==2.2.3' \
            'scipy==1.14.1' \
            'scikit-learn==1.5.2' \
            'causallib==0.10.0'
          python -m pip freeze | sort > official-logs/pip-freeze.txt

      - name: Download and verify the exact frozen public PASS artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8876726334/zip" \
            -o /tmp/acic16-public-pass.zip
          echo 'e6fa7bd434fbbf9e0de85e0ef013d8fc8b7e6051d78700d886ee67eb2a13d12d  /tmp/acic16-public-pass.zip' | sha256sum -c -
          unzip -q /tmp/acic16-public-pass.zip -d frozen
          cat > /tmp/acic16-public-sha256 <<'EOF'
          159fed18dce6a1dafe6f4906b1673d19b791dac28af73275d3d83b5385960f33  frozen/data_science_god_level/causal_acic16/estimator.py
          a72837fcabe8b4df5fef1a79222c82d6deb0adfb56feaf9b61ec7065cdff8a35  frozen/data_science_god_level/causal_acic16/benchmark.py
          6b09fd8fad0db443ba930a6c8c730a8eff527c1e2ed0999e9e7201993ee616c9  frozen/data_science_god_level/causal_acic16/logic-plan-receipt.json
          f5de9b0366f97980f51cf9b737a41c470538d70f1a609e1cc7838c6c1b855ea7  frozen/public-logs/public-freeze-receipt.json
          396d9d4aea4accc3bd9d54e38df37894efb257df66bd1e80a3dad7d26efe2ff3  frozen/public-logs/public-report.json
          cf1f71a6f38e479b0988d56b0580b6046df67abcfec7a3949b3491e4fd275017  frozen/public-logs/public-data-manifest.json
          ca6b099be786190e1fdd84992991f59699713a76afc01348bd5f5fd03c58d5e6  frozen/public-logs/static-audit.json
          EOF
          sha256sum -c /tmp/acic16-public-sha256
          cp frozen/data_science_god_level/causal_acic16/estimator.py /tmp/acic16-candidate/
          cp frozen/data_science_god_level/causal_acic16/benchmark.py /tmp/acic16-candidate/

      - name: Verify public PASS and freeze official contract before hidden truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          public_receipt = json.loads(
              Path('frozen/public-logs/public-freeze-receipt.json').read_text()
          )
          public_report = json.loads(
              Path('frozen/public-logs/public-report.json').read_text()
          )
          static_audit = json.loads(
              Path('frozen/public-logs/static-audit.json').read_text()
          )
          assert public_receipt['verdict'] == 'PASS'
          assert public_receipt['official_truth_accessed'] is False
          assert public_receipt['public_instances'] == [1, 2, 3, 4, 5, 6]
          assert public_receipt['official_instances'] == [7, 8, 9, 10]
          assert public_report['summary']['verdict'] == 'PASS'
          assert public_report['candidate_ground_truth_access'] is False
          assert static_audit['candidate_ground_truth_access'] is False
          assert static_audit['candidate_dataset_identifier_access'] is False
          assert public_receipt['estimator_sha256'] == (
              '159fed18dce6a1dafe6f4906b1673d19b791dac28af73275d3d83b5385960f33'
          )
          assert public_receipt['benchmark_sha256'] == (
              'a72837fcabe8b4df5fef1a79222c82d6deb0adfb56feaf9b61ec7065cdff8a35'
          )

          contract = {
              'schema': 'data-science-god-level/acic16-official-contract/1',
              'frozen_at_utc': datetime.now(timezone.utc).isoformat(),
              'official_instances': [7, 8, 9, 10],
              'official_evaluations_allowed': 1,
              'candidate': {
                  'public_run_id': 30867660577,
                  'public_artifact_id': 8876726334,
                  'public_artifact_sha256': (
                      'e6fa7bd434fbbf9e0de85e0ef013d8fc8b7e6051d78700d886ee67eb2a13d12d'
                  ),
                  'public_head_sha': (
                      'e37044a1d8b7b6b1b49c07d67a6b69b603e09788'
                  ),
                  'estimator_sha256': public_receipt['estimator_sha256'],
                  'benchmark_sha256': public_receipt['benchmark_sha256'],
                  'logic_plan_sha256': public_receipt['logic_plan_sha256'],
                  'public_receipt_sha256': (
                      'f5de9b0366f97980f51cf9b737a41c470538d70f1a609e1cc7838c6c1b855ea7'
                  ),
                  'public_report_sha256': public_receipt['report_sha256'],
              },
              'required_checks': {
                  'finite_all': True,
                  'ate_rmse_below_naive': True,
                  'ate_rmse_below_ridge_t_learner': True,
                  'att_rmse_below_naive': True,
                  'att_rmse_below_ridge_t_learner': True,
                  'mean_pehe_below_ridge_t_learner': True,
                  'ate_interval_coverage_at_least': 0.5,
                  'ate_wins_vs_naive_at_least': 3,
                  'att_wins_vs_naive_at_least': 3,
                  'ate_wins_vs_ridge_at_least': 2,
                  'att_wins_vs_ridge_at_least': 2,
                  'pehe_wins_vs_ridge_at_least': 2,
              },
              'post_hoc_retuning_permitted': False,
              'negative_result_must_be_preserved': True,
          }
          contract_payload = json.dumps(contract, indent=2, sort_keys=True) + '\n'
          contract_path = Path('official-logs/official-contract.json')
          contract_path.write_text(contract_payload)
          contract_sha = hashlib.sha256(contract_payload.encode()).hexdigest()
          Path('official-logs/official-contract.sha256').write_text(
              f'{contract_sha}  official-contract.json\n'
          )

          freeze = {
              'schema': 'data-science-god-level/acic16-official-freeze/1',
              'frozen_at_utc': datetime.now(timezone.utc).isoformat(),
              'official_truth_accessed_before_freeze': False,
              'official_evaluation_count_before_freeze': 0,
              'contract_sha256': contract_sha,
              'estimator_sha256': contract['candidate']['estimator_sha256'],
              'benchmark_sha256': contract['candidate']['benchmark_sha256'],
              'candidate_modified_after_public_freeze': False,
              'post_hoc_retuning_permitted': False,
          }
          freeze_payload = json.dumps(freeze, indent=2, sort_keys=True) + '\n'
          Path('official-logs/freeze-receipt.json').write_text(freeze_payload)
          Path('official-logs/freeze-receipt.sha256').write_text(
              hashlib.sha256(freeze_payload.encode()).hexdigest()
              + '  freeze-receipt.json\n'
          )
          print(contract_payload)
          print(freeze_payload)
          PY

      - name: Reconstruct and replay original hash-bound Logic Power v10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _logic_power_v10
          cat \
            logic_power_v10_capsule/parts/part_00.b64 \
            logic_power_v10_capsule/parts/part_01.b64 \
            logic_power_v10_capsule/parts/part_02.b64 \
            logic_power_v10_capsule/parts/part_03.b64 \
            logic_power_v10_capsule/parts/part_04.b64 \
            logic_power_v10_capsule/parts/part_05_00.b64 \
            logic_power_v10_capsule/parts/part_05_01.b64 \
            logic_power_v10_capsule/parts/part_05_02.b64 \
            > /tmp/logic-power-v10-source.b64
          echo '3548f31fcaa9696eabb063023c905fbb04a2b3db73c96df9f9ee8bc8e0c64fc1  /tmp/logic-power-v10-source.b64' | sha256sum -c -
          base64 -d /tmp/logic-power-v10-source.b64 > /tmp/logic-power-v10-source.tar.gz
          echo 'ad2c363afb3fe20aa093565f278c690d423611e8270e9ad9b1491dbbdf218c31  /tmp/logic-power-v10-source.tar.gz' | sha256sum -c -
          tar xzf /tmp/logic-power-v10-source.tar.gz -C _logic_power_v10
          cd _logic_power_v10
          sha256sum -c SOURCE_SHA256SUMS
          test "$(cat PRIVATE_HEAD_SHA.txt)" = 'ba10d0edc7eb20d499d0481fda2537e782b6efb2'
          cd ../data_science_god_level/causal_acic16
          PYTHONPATH="${GITHUB_WORKSPACE}/_logic_power_v10" python logic_plan.py
          echo '6b09fd8fad0db443ba930a6c8c730a8eff527c1e2ed0999e9e7201993ee616c9  logic-plan-receipt.json' | sha256sum -c -

      - name: Reaudit frozen estimator isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          path = Path('/tmp/acic16-candidate/estimator.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          imports = set()
          names = set()
          calls = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.level == 0:
                  imports.add((node.module or '').split('.')[0])
              elif isinstance(node, ast.Name):
                  names.add(node.id)
              elif isinstance(node, ast.Attribute):
                  names.add(node.attr)
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.append(node.func.id)
                  elif isinstance(node.func, ast.Attribute):
                      calls.append(node.func.attr)

          allowed_imports = {
              '__future__', 'dataclasses', 'math', 'typing', 'numpy', 'sklearn'
          }
          forbidden_imports = imports - allowed_imports
          forbidden_calls = sorted(
              set(calls)
              & {
                  'open', 'eval', 'exec', 'compile', '__import__', 'system',
                  'popen', 'run', 'check_output', 'urlopen', 'request'
              }
          )
          forbidden_names = sorted(
              names
              & {
                  'load_acic16', 'po', 'mu0', 'mu1', 'zymu', 'instance',
                  'Path', 'socket', 'requests', 'subprocess'
              }
          )
          if forbidden_imports or forbidden_calls or forbidden_names:
              raise SystemExit(
                  f'isolation failure: imports={sorted(forbidden_imports)}, '
                  f'calls={forbidden_calls}, names={forbidden_names}'
              )
          receipt = {
              'schema': 'data-science-god-level/acic16-official-static-audit/1',
              'estimator_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'imports': sorted(imports),
              'forbidden_calls': forbidden_calls,
              'forbidden_names': forbidden_names,
              'candidate_ground_truth_access': False,
              'candidate_dataset_identifier_access': False,
          }
          payload = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          Path('official-logs/static-audit.json').write_text(payload)
          print(payload)
          PY

      - name: Mark hidden-truth access and hash official DGP files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          marker = {
              'schema': 'data-science-god-level/acic16-truth-access/1',
              'started_at_utc': datetime.now(timezone.utc).isoformat(),
              'candidate_already_frozen': True,
              'official_evaluation_count': 0,
              'official_instances': [7, 8, 9, 10],
          }
          Path('official-logs/truth-access-started.json').write_text(
              json.dumps(marker, indent=2, sort_keys=True) + '\n'
          )

          import causallib.datasets.data_loader as loader

          root = Path(loader.__file__).resolve().parent / 'data' / 'acic_challenge_2016'
          files = [root / 'x.csv'] + [root / f'zymu_{i}.csv' for i in range(7, 11)]
          manifest = {
              'schema': 'data-science-god-level/acic16-official-data-manifest/1',
              'causallib_version': '0.10.0',
              'official_instances': [7, 8, 9, 10],
              'files': [
                  {
                      'name': path.name,
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in files
              ],
          }
          payload = json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          Path('official-logs/official-data-manifest.json').write_text(payload)
          print(payload)
          PY

      - name: Evaluate the frozen candidate exactly once on hidden DGPs
        shell: bash
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          marker = {
              'schema': 'data-science-god-level/acic16-evaluation-start/1',
              'started_at_utc': datetime.now(timezone.utc).isoformat(),
              'official_instances': [7, 8, 9, 10],
              'evaluation_ordinal': 1,
              'estimator_sha256': hashlib.sha256(
                  Path('/tmp/acic16-candidate/estimator.py').read_bytes()
              ).hexdigest(),
              'benchmark_sha256': hashlib.sha256(
                  Path('/tmp/acic16-candidate/benchmark.py').read_bytes()
              ).hexdigest(),
          }
          Path('official-logs/evaluation-started.json').write_text(
              json.dumps(marker, indent=2, sort_keys=True) + '\n'
          )
          PY
          set +e
          cd /tmp/acic16-candidate
          python benchmark.py \
            --instances 7 8 9 10 \
            --output "${GITHUB_WORKSPACE}/official-logs/official-report.json" \
            2>&1 | tee "${GITHUB_WORKSPACE}/official-logs/evaluation-output.txt"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "${GITHUB_WORKSPACE}/official-logs/evaluation-exit-status.txt"
          exit 0

      - name: Adjudicate against the predeclared stronger hidden contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def digest(path: Path):
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None

          report_path = Path('official-logs/official-report.json')
          start_path = Path('official-logs/evaluation-started.json')
          exit_path = Path('official-logs/evaluation-exit-status.txt')
          evaluation_started = start_path.exists()
          exit_status = int(exit_path.read_text().strip()) if exit_path.exists() else None
          report = json.loads(report_path.read_text()) if report_path.exists() else None

          checks = {}
          ridge_wins = {'ate': 0, 'att': 0, 'pehe': 0}
          if report is not None:
              summary = report['summary']
              rows = report['instances']
              ridge_wins = {
                  'ate': sum(
                      row['candidate']['ate_abs_error']
                      < row['ridge_t_learner']['ate_abs_error']
                      for row in rows
                  ),
                  'att': sum(
                      row['candidate']['att_abs_error']
                      < row['ridge_t_learner']['att_abs_error']
                      for row in rows
                  ),
                  'pehe': sum(
                      row['candidate']['pehe'] < row['ridge_t_learner']['pehe']
                      for row in rows
                  ),
              }
              checks = {
                  'finite_all': summary['candidate']['finite_all'],
                  'ate_rmse_below_naive': (
                      summary['candidate']['ate_rmse'] < summary['naive']['ate_rmse']
                  ),
                  'ate_rmse_below_ridge_t_learner': (
                      summary['candidate']['ate_rmse']
                      < summary['ridge_t_learner']['ate_rmse']
                  ),
                  'att_rmse_below_naive': (
                      summary['candidate']['att_rmse'] < summary['naive']['att_rmse']
                  ),
                  'att_rmse_below_ridge_t_learner': (
                      summary['candidate']['att_rmse']
                      < summary['ridge_t_learner']['att_rmse']
                  ),
                  'mean_pehe_below_ridge_t_learner': (
                      summary['candidate']['mean_pehe']
                      < summary['ridge_t_learner']['mean_pehe']
                  ),
                  'ate_interval_coverage_at_least_half': (
                      summary['candidate']['ate_ci_coverage'] >= 0.5
                  ),
                  'ate_wins_vs_naive_at_least_3': (
                      summary['wins']['ate_vs_naive'] >= 3
                  ),
                  'att_wins_vs_naive_at_least_3': (
                      summary['wins']['att_vs_naive'] >= 3
                  ),
                  'ate_wins_vs_ridge_at_least_2': ridge_wins['ate'] >= 2,
                  'att_wins_vs_ridge_at_least_2': ridge_wins['att'] >= 2,
                  'pehe_wins_vs_ridge_at_least_2': ridge_wins['pehe'] >= 2,
                  'benchmark_exit_status_zero': exit_status == 0,
                  'candidate_ground_truth_access_false': (
                      report['candidate_ground_truth_access'] is False
                  ),
              }

          if not evaluation_started:
              verdict = 'NOT_RUN'
          elif report is None:
              verdict = 'INVALID_RUN'
          elif all(checks.values()):
              verdict = 'PASS'
          else:
              verdict = 'FAIL'

          receipt = {
              'schema': 'data-science-god-level/acic16-official-receipt/1',
              'adjudicated_at_utc': datetime.now(timezone.utc).isoformat(),
              'verdict': verdict,
              'official_instances': [7, 8, 9, 10],
              'official_evaluation_count': 1 if evaluation_started else 0,
              'evaluation_started': evaluation_started,
              'evaluation_exit_status': exit_status,
              'checks': checks,
              'ridge_wins': ridge_wins,
              'summary': report['summary'] if report is not None else None,
              'candidate': {
                  'public_run_id': 30867660577,
                  'public_artifact_id': 8876726334,
                  'public_artifact_sha256': (
                      'e6fa7bd434fbbf9e0de85e0ef013d8fc8b7e6051d78700d886ee67eb2a13d12d'
                  ),
                  'estimator_sha256': (
                      '159fed18dce6a1dafe6f4906b1673d19b791dac28af73275d3d83b5385960f33'
                  ),
                  'benchmark_sha256': (
                      'a72837fcabe8b4df5fef1a79222c82d6deb0adfb56feaf9b61ec7065cdff8a35'
                  ),
                  'candidate_modified_after_public_freeze': False,
                  'post_hoc_retuning_permitted': False,
              },
              'evidence_sha256': {
                  'official_contract': digest(Path('official-logs/official-contract.json')),
                  'freeze_receipt': digest(Path('official-logs/freeze-receipt.json')),
                  'static_audit': digest(Path('official-logs/static-audit.json')),
                  'truth_access_marker': digest(
                      Path('official-logs/truth-access-started.json')
                  ),
                  'official_data_manifest': digest(
                      Path('official-logs/official-data-manifest.json')
                  ),
                  'evaluation_start_marker': digest(start_path),
                  'evaluation_output': digest(
                      Path('official-logs/evaluation-output.txt')
                  ),
                  'official_report': digest(report_path),
                  'pip_freeze': digest(Path('official-logs/pip-freeze.txt')),
              },
          }
          payload = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          output = Path('official-logs/official-receipt.json')
          output.write_text(payload)
          receipt_sha = hashlib.sha256(payload.encode()).hexdigest()
          Path('official-logs/official-receipt.sha256').write_text(
              f'{receipt_sha}  official-receipt.json\n'
          )
          print(payload)
          print(f'official_receipt_sha256={receipt_sha}')
          PY

      - name: Upload immutable official evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-god-level-acic16-causal-official
          retention-days: 90
          path: |
            official-logs/**
            frozen/data_science_god_level/causal_acic16/estimator.py
            frozen/data_science_god_level/causal_acic16/benchmark.py
            frozen/data_science_god_level/causal_acic16/logic-plan-receipt.json
            frozen/public-logs/public-freeze-receipt.json
            frozen/public-logs/public-report.json
            frozen/public-logs/public-data-manifest.json
            frozen/public-logs/static-audit.json

      - name: Enforce official verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('official-logs/official-receipt.json')
          if not path.exists():
              raise SystemExit('official causal receipt missing')
          verdict = json.loads(path.read_text())['verdict']
          if verdict == 'PASS':
              print('ACIC16 official hidden gate: PASS')
          elif verdict == 'FAIL':
              raise SystemExit(
                  'ACIC16 official hidden gate: FAIL; frozen negative result preserved'
              )
          else:
              raise SystemExit(
                  f'ACIC16 official hidden gate: {verdict}; infrastructure result, '
                  'not a candidate verdict'
              )
          PY
