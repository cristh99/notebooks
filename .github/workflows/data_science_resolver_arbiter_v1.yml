name: Data Science resolver arbiter v1

on:
  pull_request:
    paths:
      - "data_science_pipeline_v11_resolver_arbiter/**"
      - ".github/workflows/data_science_resolver_arbiter_v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-science-resolver-arbiter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact branch bytes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q data_science_pipeline_v11_resolver_arbiter
      - name: Verify frozen arbitration contract
        run: python data_science_pipeline_v11_resolver_arbiter/verify.py
      - name: Upload hash-bound receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-science-resolver-arbiter-v1-receipt
          path: data_science_pipeline_v11_resolver_arbiter/verification_receipt.json
          if-no-files-found: error
          retention-days: 30
