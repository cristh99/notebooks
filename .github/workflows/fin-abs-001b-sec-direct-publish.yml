name: FIN-ABS-001B — publish verified compact result

on:
  push:
    branches:
      - agent/fin-abs-001b-sec-direct
    paths:
      - 'fin_abs_001_sec_direct/**'
      - 'README_FIN_ABS_001B_SEC_DIRECT.md'
      - '.github/workflows/fin-abs-001b-sec-direct-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: cristh99 finance-research 87334928+cristh99@users.noreply.github.com
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/fin-abs-001b-sec-direct
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Execute frozen experiment
        run: |
          set -euo pipefail
          python -m compileall -q fin_abs_001_sec_direct
          python -m fin_abs_001_sec_direct.run --self-test
          rm -rf reports/fin_abs_001b_sec_direct
          python -m fin_abs_001_sec_direct.run \
            --cache-dir "$RUNNER_TEMP/fin-abs-001b-sec-cache" \
            --output-dir reports/fin_abs_001b_sec_direct
          node fin_abs_001_sec_direct/verify_report.mjs \
            reports/fin_abs_001b_sec_direct/report.json \
            reports/fin_abs_001b_sec_direct/benchmark.jsonl \
            reports/fin_abs_001b_sec_direct/predictions_exact.jsonl \
            reports/fin_abs_001b_sec_direct/predictions_rounded.jsonl \
            reports/fin_abs_001b_sec_direct/node_receipt.json
          sha256sum reports/fin_abs_001b_sec_direct/node_receipt.json \
            >> reports/fin_abs_001b_sec_direct/manifest.sha256
          sort -k2 reports/fin_abs_001b_sec_direct/manifest.sha256 \
            -o reports/fin_abs_001b_sec_direct/manifest.sha256

      - name: Reject score forgery
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reports/fin_abs_001b_sec_direct/report.json')
          value = json.loads(p.read_text())
          value['payload']['score']['after'] = 1000
          Path('/tmp/forged.json').write_text(json.dumps(value))
          PY
          if node fin_abs_001_sec_direct/verify_report.mjs \
              /tmp/forged.json \
              reports/fin_abs_001b_sec_direct/benchmark.jsonl \
              reports/fin_abs_001b_sec_direct/predictions_exact.jsonl \
              reports/fin_abs_001b_sec_direct/predictions_rounded.jsonl \
              /tmp/forged_receipt.json; then
            echo 'forged score accepted' >&2
            exit 1
          fi

      - name: Commit compact verified result
        run: |
          set -euo pipefail
          target=results/fin_abs_001b_sec_direct
          rm -rf "$target"
          mkdir -p "$target"
          cp reports/fin_abs_001b_sec_direct/report.json "$target/"
          cp reports/fin_abs_001b_sec_direct/report.md "$target/"
          cp reports/fin_abs_001b_sec_direct/node_receipt.json "$target/"
          cp reports/fin_abs_001b_sec_direct/acquisition.json "$target/"
          cp reports/fin_abs_001b_sec_direct/manifest.sha256 "$target/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified FIN-ABS-001B compact result'
            git push origin HEAD:agent/fin-abs-001b-sec-direct
          fi

      - name: Upload full evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-abs-001b-sec-direct-full-evidence
          path: reports/fin_abs_001b_sec_direct/
          if-no-files-found: error
          retention-days: 90
