name: Fano compiler public independent verification

on:
  push:
    branches:
      - agent/inference-power-compiler-v2-public-ci
    paths:
      - 'inference_power_compiler_v2/fano_compiler.py'
      - 'inference_power_compiler_v2/verify_fano_compiler_independent.py'
      - 'FanoFinite.lean'
      - '.github/workflows/fano-compiler-public.yml'
  pull_request:
    paths:
      - 'inference_power_compiler_v2/fano_compiler.py'
      - 'inference_power_compiler_v2/verify_fano_compiler_independent.py'
      - 'FanoFinite.lean'
      - '.github/workflows/fano-compiler-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind public reimplementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object inference_power_compiler_v2/fano_compiler.py)" = "4c6f6922db3b3a8160de16e4e0780c061b35aabf"
          test "$(grep -c 'e9a82e75db96d8dba317962312cd8e8286dd8683' inference_power_compiler_v2/verify_fano_compiler_independent.py)" = "1"
      - name: Compile Python sources
        run: >-
          python -m py_compile
          inference_power_compiler_v2/fano_compiler.py
          inference_power_compiler_v2/verify_fano_compiler_independent.py
      - name: Run independent exact and high-precision verifier
        shell: bash
        run: |
          set -euo pipefail
          cd inference_power_compiler_v2
          python verify_fano_compiler_independent.py | tee ../fano-public.log
          test -s FANO_PUBLIC_RECEIPT.json
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile Lean boundary without sorryAx
        shell: bash
        run: |
          set -euo pipefail
          elan run leanprover/lean4:v4.33.0-rc1 lean -o FanoFinite.olean FanoFinite.lean 2>&1 | tee fano-public-lean.log
          test -s FanoFinite.olean
          if grep -q 'sorryAx' fano-public-lean.log; then
            echo 'Lean output contains sorryAx' >&2
            exit 1
          fi
      - name: Upload proof-carrying evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fano-compiler-public-evidence
          path: |
            inference_power_compiler_v2/FANO_PUBLIC_RECEIPT.json
            inference_power_compiler_v2/fano_compiler.py
            inference_power_compiler_v2/verify_fano_compiler_independent.py
            FanoFinite.lean
            FanoFinite.olean
            fano-public.log
            fano-public-lean.log
          if-no-files-found: error
          retention-days: 30
