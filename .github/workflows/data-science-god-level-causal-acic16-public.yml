name: Data Science God-Level — ACIC16 causal public gate

on:
  pull_request:
    paths:
      - 'data_science_god_level/causal_acic16/**'
      - '.github/workflows/data-science-god-level-causal-acic16-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-causal-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pinned causal benchmark environment
        run: |
          mkdir -p public-logs
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' \
            'pandas==2.2.3' \
            'scipy==1.14.1' \
            'scikit-learn==1.5.2' \
            'causallib==0.10.0'
          python -m pip freeze | sort > public-logs/pip-freeze.txt

      - name: Reconstruct original hash-bound Logic Power v10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _logic_power_v10
          cat \
            logic_power_v10_capsule/parts/part_00.b64 \
            logic_power_v10_capsule/parts/part_01.b64 \
            logic_power_v10_capsule/parts/part_02.b64 \
            logic_power_v10_capsule/parts/part_03.b64 \
            logic_power_v10_capsule/parts/part_04.b64 \
            logic_power_v10_capsule/parts/part_05_00.b64 \
            logic_power_v10_capsule/parts/part_05_01.b64 \
            logic_power_v10_capsule/parts/part_05_02.b64 \
            > /tmp/logic-power-v10-source.b64
          echo '3548f31fcaa9696eabb063023c905fbb04a2b3db73c96df9f9ee8bc8e0c64fc1  /tmp/logic-power-v10-source.b64' | sha256sum -c -
          base64 -d /tmp/logic-power-v10-source.b64 > /tmp/logic-power-v10-source.tar.gz
          echo 'ad2c363afb3fe20aa093565f278c690d423611e8270e9ad9b1491dbbdf218c31  /tmp/logic-power-v10-source.tar.gz' | sha256sum -c -
          tar xzf /tmp/logic-power-v10-source.tar.gz -C _logic_power_v10
          cd _logic_power_v10
          sha256sum -c SOURCE_SHA256SUMS
          test "$(cat PRIVATE_HEAD_SHA.txt)" = 'ba10d0edc7eb20d499d0481fda2537e782b6efb2'

      - name: Let original Logic Power v10 select the causal gate
        working-directory: data_science_god_level/causal_acic16
        env:
          PYTHONPATH: ${{ github.workspace }}/_logic_power_v10
        run: python logic_plan.py

      - name: Audit candidate isolation before ground-truth evaluation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          path = Path('data_science_god_level/causal_acic16/estimator.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          imports = set()
          names = set()
          calls = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.level == 0:
                  imports.add((node.module or '').split('.')[0])
              elif isinstance(node, ast.Name):
                  names.add(node.id)
              elif isinstance(node, ast.Attribute):
                  names.add(node.attr)
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.append(node.func.id)
                  elif isinstance(node.func, ast.Attribute):
                      calls.append(node.func.attr)

          allowed_imports = {
              '__future__', 'dataclasses', 'math', 'typing', 'numpy', 'sklearn'
          }
          forbidden_imports = imports - allowed_imports
          forbidden_calls = sorted(
              set(calls)
              & {
                  'open', 'eval', 'exec', 'compile', '__import__', 'system',
                  'popen', 'run', 'check_output', 'urlopen', 'request'
              }
          )
          forbidden_names = sorted(
              names
              & {
                  'load_acic16', 'po', 'mu0', 'mu1', 'zymu', 'instance',
                  'Path', 'socket', 'requests', 'subprocess'
              }
          )
          if forbidden_imports:
              raise SystemExit(f'forbidden imports: {sorted(forbidden_imports)}')
          if forbidden_calls:
              raise SystemExit(f'forbidden calls: {forbidden_calls}')
          if forbidden_names:
              raise SystemExit(f'ground-truth or identifier access: {forbidden_names}')

          receipt = {
              'schema': 'data-science-god-level/acic16-static-audit/2',
              'estimator_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'imports': sorted(imports),
              'forbidden_calls': forbidden_calls,
              'forbidden_names': forbidden_names,
              'candidate_ground_truth_access': False,
              'candidate_dataset_identifier_access': False,
          }
          output = Path('public-logs/static-audit.json')
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Unit and adversarial synthetic tests
        working-directory: data_science_god_level/causal_acic16
        run: python -m unittest -v test_estimator.py

      - name: Record public-only ACIC data manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import causallib.datasets.data_loader as loader

          root = Path(loader.__file__).resolve().parent / 'data' / 'acic_challenge_2016'
          files = [root / 'x.csv'] + [root / f'zymu_{i}.csv' for i in range(1, 7)]
          manifest = {
              'schema': 'data-science-god-level/acic16-public-data-manifest/1',
              'causallib_version': '0.10.0',
              'public_instances': [1, 2, 3, 4, 5, 6],
              'official_instances_read': [],
              'files': [
                  {
                      'name': path.name,
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in files
              ],
          }
          output = Path('public-logs/public-data-manifest.json')
          output.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Run public ACIC instances 1 through 6
        working-directory: data_science_god_level/causal_acic16
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
        run: |
          python benchmark.py \
            --instances 1 2 3 4 5 6 \
            --output ../../../public-logs/public-report.json

      - name: Freeze and adjudicate public candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def digest(path: Path):
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None

          root = Path('data_science_god_level/causal_acic16')
          report_path = Path('public-logs/public-report.json')
          static_path = Path('public-logs/static-audit.json')
          manifest_path = Path('public-logs/public-data-manifest.json')
          logic_path = root / 'logic-plan-receipt.json'
          if report_path.exists():
              report = json.loads(report_path.read_text())
              verdict = report['summary']['verdict']
              summary = report['summary']
              failure_stage = None
          elif not static_path.exists():
              verdict = 'INVALID_PRECHECK'
              summary = None
              failure_stage = 'static_audit'
          elif not manifest_path.exists():
              verdict = 'NOT_RUN'
              summary = None
              failure_stage = 'before_public_data_manifest'
          else:
              verdict = 'INVALID_RUN'
              summary = None
              failure_stage = 'public_benchmark'

          receipt = {
              'schema': 'data-science-god-level/acic16-public-freeze/2',
              'verdict': verdict,
              'failure_stage': failure_stage,
              'estimator_sha256': digest(root / 'estimator.py'),
              'benchmark_sha256': digest(root / 'benchmark.py'),
              'logic_plan_sha256': digest(logic_path),
              'static_audit_sha256': digest(static_path),
              'data_manifest_sha256': digest(manifest_path),
              'report_sha256': digest(report_path),
              'public_instances': [1, 2, 3, 4, 5, 6],
              'official_instances': [7, 8, 9, 10],
              'official_truth_accessed': False,
              'post_hoc_retuning_permitted_after_official_evaluation': False,
              'summary': summary,
          }
          output = Path('public-logs/public-freeze-receipt.json')
          payload = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          output.write_text(payload)
          Path('public-logs/public-freeze-receipt.sha256').write_text(
              hashlib.sha256(payload.encode()).hexdigest()
              + '  public-freeze-receipt.json\n'
          )
          print(payload)
          PY

      - name: Upload immutable public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-god-level-acic16-causal-public
          retention-days: 90
          path: |
            data_science_god_level/causal_acic16/estimator.py
            data_science_god_level/causal_acic16/benchmark.py
            data_science_god_level/causal_acic16/logic-plan-receipt.json
            public-logs/**

      - name: Enforce public verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('public-logs/public-freeze-receipt.json')
          if not path.exists():
              raise SystemExit('ACIC16 public receipt missing')
          receipt = json.loads(path.read_text())
          if receipt['verdict'] != 'PASS':
              raise SystemExit(
                  f"ACIC16 public gate: {receipt['verdict']}; evidence preserved"
              )
          print('ACIC16 public gate: PASS; candidate frozen')
          PY
