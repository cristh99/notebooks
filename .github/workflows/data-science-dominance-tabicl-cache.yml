name: Data Science dominance — freeze TabICLv2 checkpoint cache

on:
  push:
    branches:
      - agent/data-science-dominance-tabarena-v3-sharded
    paths:
      - '.github/workflows/data-science-dominance-tabicl-cache.yml'

permissions:
  contents: read

jobs:
  cache-frontier-checkpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove workflow-only cache activation
        run: |
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test "$(git rev-parse HEAD^)" = 'e57a95102f2f2a782ee297b2e30b5932ac05876d'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/data-science-dominance-tabicl-cache.yml'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact TabICLv2 CPU environment
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'scipy==1.14.1' 'pandas==2.2.3' \
            'scikit-learn==1.5.2'
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install --disable-pip-version-check \
            'einops>=0.7' 'psutil' 'tqdm>=4.64' 'huggingface-hub'
          python -m pip install --disable-pip-version-check --no-deps \
            'git+https://github.com/soda-inria/tabicl.git@46b91961db4f8873dd049ec09990698a435e1e29'

      - name: Download and verify both frontier checkpoints on synthetic data
        env:
          HF_HOME: ${{ github.workspace }}/tabicl-cache
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          mkdir -p checkpoint-evidence
          python - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          import numpy as np
          from tabicl import TabICLClassifier, TabICLRegressor

          rng = np.random.default_rng(20260805)
          X = rng.normal(size=(96, 6)).astype('float32')
          y_cls = (X[:, 0] + X[:, 1] > 0).astype(int)
          y_reg = X[:, 0] - 2 * X[:, 1] + 0.1 * rng.normal(size=len(X))
          started = time.perf_counter()
          clf = TabICLClassifier(n_estimators=1, batch_size=1, device='cpu', n_jobs=4, random_state=7, verbose=False)
          clf.fit(X[:72], y_cls[:72])
          cls = clf.predict_proba(X[72:])
          reg = TabICLRegressor(n_estimators=1, batch_size=1, device='cpu', n_jobs=4, random_state=7, verbose=False)
          reg.fit(X[:72], y_reg[:72])
          pred = reg.predict(X[72:])
          assert cls.shape == (24, 2) and np.all(np.isfinite(cls))
          assert pred.shape == (24,) and np.all(np.isfinite(pred))

          cache = Path(os.environ['HF_HOME'])
          files = []
          for path in sorted(p for p in cache.rglob('*') if p.is_file() and not p.is_symlink()):
              files.append({
                  'path': str(path.relative_to(cache)),
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          assert any('tabicl-classifier-v2-20260212.ckpt' in row['path'] for row in files)
          assert any('tabicl-regressor-v2-20260212.ckpt' in row['path'] for row in files)
          receipt = {
              'schema': 'data-science-dominance/tabiclv2-cache/1',
              'source_commit': '46b91961db4f8873dd049ec09990698a435e1e29',
              'classification_checkpoint': 'tabicl-classifier-v2-20260212.ckpt',
              'regression_checkpoint': 'tabicl-regressor-v2-20260212.ckpt',
              'external_task_values_accessed': False,
              'synthetic_smoke_passed': True,
              'runtime_seconds': time.perf_counter() - started,
              'files': files,
          }
          payload = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          Path('checkpoint-evidence/cache-receipt.json').write_text(payload)
          Path('checkpoint-evidence/cache-receipt.sha256').write_text(
              hashlib.sha256(payload.encode()).hexdigest() + '  cache-receipt.json\n'
          )
          print(payload)
          PY

      - name: Upload immutable offline cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-tabiclv2-checkpoints
          retention-days: 90
          include-hidden-files: true
          path: |
            tabicl-cache/**
            checkpoint-evidence/**
