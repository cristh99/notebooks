name: OCR digit-forest candidate freeze v3

on:
  push:
    branches:
      - agent/ocr-digit-forest-candidate-v3
    paths:
      - 'ocr_real_risk_v1/numeric_digit_forest.py'
      - 'ocr_real_risk_v1/test_numeric_digit_forest.py'
      - '.github/workflows/ocr-digit-forest-freeze-v3.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ocr-digit-forest-freeze-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  TRAIN_ARTIFACT_ID: '8915849860'
  TRAIN_ARTIFACT_DIGEST: 'ada46e3e9a5ac2d0a29c7f2af20ee493959e4114e299f94cfc00218e8076badd'
  TEST_ARTIFACT_ID: '8915766909'
  TEST_ARTIFACT_DIGEST: '0dc86b73e14029fd45867ed7bbd2b83e3f6d1f22a0791a0a75371ecd3a841f90'
  PIXEL_VERIFIER_BLOB: '34180d164f3f5b05542217fd750ca26cbdd08e62'
  GITHUB_TOKEN: ${{ github.token }}
  OMP_THREAD_LIMIT: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  freeze-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Install frozen free CPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core fonts-lato
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 \
            numpy==2.2.6 \
            opencv-python-headless==4.10.0.84 \
            scikit-learn==1.8.0 \
            joblib==1.5.3
          test "$(git hash-object ocr_real_risk_v1/pixel_digit_alignment.py)" = \
            "${PIXEL_VERIFIER_BLOB}"
      - name: Unit tests and compilation
        run: |
          python -m unittest -v \
            ocr_real_risk_v1.test_numeric_digit_forest \
            ocr_real_risk_v1.test_sroie_candidate_lab \
            ocr_real_risk_v1.test_sroie_natural_holdout
          python -m compileall -q ocr_real_risk_v1
      - name: Recover and verify the terminal SROIE development artifacts
        run: |
          mkdir -p split-roots/train split-roots/test
          for split in train test; do
            upper=$(echo "${split}" | tr '[:lower:]' '[:upper:]')
            eval artifact_id="\${${upper}_ARTIFACT_ID}"
            eval digest="\${${upper}_ARTIFACT_DIGEST}"
            curl --fail --location --retry 5 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "${split}.zip"
            echo "${digest}  ${split}.zip" | sha256sum --check --strict
            unzip -q "${split}.zip" -d "split-roots/${split}"
            (cd "split-roots/${split}" && sha256sum --check --strict SHA256SUMS.txt)
          done
      - name: Train, evaluate and freeze the candidate before CORD
        run: |
          rm -rf frozen-digit-forest-v3 freeze-stdout.json
          python -m ocr_real_risk_v1.numeric_digit_forest \
            split-roots/train split-roots/test \
            --output-dir frozen-digit-forest-v3 \
            | tee freeze-stdout.json
      - name: Independent development and model gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from ocr_real_risk_v1.numeric_digit_forest import (
              CANDIDATE_SCHEMA,
              FEATURE_SCHEMA,
              THRESHOLD,
              load_frozen_candidate,
          )
          from ocr_real_risk_v1.sroie_natural_holdout import verify_stable_payload

          root = Path('frozen-digit-forest-v3')
          report = json.loads((root / 'development_report.json').read_text())
          candidate = json.loads((root / 'frozen_candidate.json').read_text())
          assert verify_stable_payload(report, 'stable_payload_sha256')
          assert verify_stable_payload(candidate, 'stable_payload_sha256')
          assert report['source']['selected_locations'] == 845
          assert report['source']['eligible_claims'] == 571
          assert report['baseline']['false_predictions'] == 63
          train = report['development']['train_company_disjoint_oof']
          test = report['development']['test_trained_on_train_only']
          combined = report['development']['combined_out_of_sample_predictions']
          assert train['eligible_claims'] == 355
          assert train['accepted'] == 222
          assert train['natural_false_accepts'] == 0
          assert train['counterfactual_false_accepts'] == 0
          assert test['eligible_claims'] == 216
          assert test['accepted'] == 141
          assert test['natural_false_accepts'] == 0
          assert test['counterfactual_false_accepts'] == 0
          assert combined['selected_locations'] == 845
          assert combined['eligible_claims'] == 571
          assert combined['accepted'] == 363
          assert combined['natural_false_accepts'] == 0
          assert combined['counterfactual_false_accepts'] == 0
          assert combined['simultaneous_95pct_selected_coverage_lower'] > 0.39
          assert combined['simultaneous_95pct_counterfactual_upper'] < 0.01
          reduction = report['development'][
              'certified_error_reduction_lower_if_treated_as_validation'
          ]
          assert 6.8 < reduction < 7.0
          assert report['decision'][
              'candidate_frozen_for_external_validation'
          ] is True
          assert report['decision']['pass_statistical_10x_claimed'] is False
          assert report['decision']['automatic_production_change'] is False
          assert candidate['schema'] == CANDIDATE_SCHEMA
          assert candidate['inference']['feature_schema'] == FEATURE_SCHEMA
          assert candidate['inference']['threshold'] == THRESHOLD
          assert candidate['model']['tree_count'] == 500
          assert candidate['model']['classes'] == list(range(10))
          assert candidate['decision']['untouched_external_validation_required'] is True
          assert candidate['decision']['production_ready'] is False
          loaded_candidate, model = load_frozen_candidate(root)
          assert loaded_candidate['stable_payload_sha256'] == candidate['stable_payload_sha256']
          assert len(model.estimators_) == 500
          assert report['constraints'] == {
              'external_spend_usd': 0,
              'gcloud_used': False,
              'gpu_used': False,
              'paid_api_used': False,
              'production_modified': False,
          }
          print(json.dumps({
              'candidate': {
                  'candidate_id': candidate['candidate_id'],
                  'model_sha256': candidate['model']['sha256'],
                  'stable_payload_sha256': candidate['stable_payload_sha256'],
                  'threshold': candidate['inference']['threshold'],
              },
              'baseline': report['baseline'],
              'development': report['development'],
              'decision': report['decision'],
          }, indent=2, sort_keys=True))
          PY
          (cd frozen-digit-forest-v3 && sha256sum --check --strict SHA256SUMS.txt)
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocr-digit-forest-candidate-v3
          path: |
            frozen-digit-forest-v3
            freeze-stdout.json
          if-no-files-found: error
          retention-days: 90
      - name: Record the frozen candidate on the isolated branch
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path('frozen-digit-forest-v3')
          candidate_path = root / 'frozen_candidate.json'
          report_path = root / 'development_report.json'
          candidate = json.loads(candidate_path.read_text())
          report = json.loads(report_path.read_text())
          record = {
              'schema': 'ocr-frozen-candidate-run-record/1',
              'workflow': 'OCR digit-forest candidate freeze v3',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'job': os.environ['GITHUB_JOB'],
              'commit_sha': os.environ['GITHUB_SHA'],
              'artifact_id': int(os.environ['ARTIFACT_ID']),
              'artifact_digest': os.environ['ARTIFACT_DIGEST'],
              'candidate_file_sha256': hashlib.sha256(candidate_path.read_bytes()).hexdigest(),
              'development_report_file_sha256': hashlib.sha256(report_path.read_bytes()).hexdigest(),
              'candidate_stable_payload_sha256': candidate['stable_payload_sha256'],
              'model_sha256': candidate['model']['sha256'],
              'candidate_id': candidate['candidate_id'],
              'threshold': candidate['inference']['threshold'],
              'development': report['development'],
              'verdict': report['decision']['verdict'],
              'untouched_external_validation_required': True,
              'production_ready': False,
              'automatic_production_change': False,
          }
          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          token = os.environ['GITHUB_TOKEN']
          path = 'ocr_real_risk_v1/run_records/digit_forest_candidate_v3.json'
          body = {
              'message': '[skip ci] Record frozen digit-forest candidate v3',
              'content': base64.b64encode(
                  (json.dumps(record, indent=2, sort_keys=True) + '\n').encode()
              ).decode(),
              'branch': branch,
          }
          url = f'https://api.github.com/repos/{repository}/contents/{path}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          try:
              query = f'{url}?ref={urllib.parse.quote(branch, safe="")}'
              with urllib.request.urlopen(
                  urllib.request.Request(query, headers=headers), timeout=60
              ) as response:
                  existing = json.load(response)
              body['sha'] = existing['sha']
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          request = urllib.request.Request(
              url,
              data=json.dumps(body).encode(),
              headers={**headers, 'Content-Type': 'application/json'},
              method='PUT',
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          print(json.dumps({'record': record, 'commit': result['commit']['sha']}, indent=2))
          PY
