name: FIN-RVI-002 Stage 3 — sealed label acquisition

on:
  pull_request:
    branches:
      - agent/fin-rvi-002-stage1-public-data
      - main
    paths:
      - 'fin_rvi_002_stage3/**'
      - 'README_FIN_RVI_002_STAGE3.md'
      - '.github/workflows/fin-rvi-002-stage3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin-rvi-002-stage3-label-acquisition
  cancel-in-progress: true

jobs:
  acquire-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Ensure PDF text extractor
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          pdftotext -v
      - name: Unit and adversarial tests
        run: |
          python -m compileall -q fin_rvi_002_stage1 fin_rvi_002_stage3
          python -m unittest -v fin_rvi_002_stage3.test_stage3
      - name: Reconstruct official data and freeze 120-row cohort
        run: |
          rm -rf reports/fin_rvi_002_stage3 .cache/fin_rvi_002_stage3
          python -m fin_rvi_002_stage3.run_stage3_parallel \
            --output reports/fin_rvi_002_stage3 \
            --cache .cache/fin_rvi_002_stage3 \
            --years 2023 2024 2025 \
            --amount-tolerance 0.05 \
            --max-days 366 \
            --holdout-size 120
      - name: Verify Python evidence package
        run: |
          set -euo pipefail
          test -s reports/fin_rvi_002_stage3/report.json
          test -s reports/fin_rvi_002_stage3/stage3_compact_rows.jsonl
          test -f reports/fin_rvi_002_stage3/stage3_confirmed_labels.jsonl
          test -s reports/fin_rvi_002_stage3/stage3_report.md
          cd reports/fin_rvi_002_stage3
          sha256sum -c report.sha256
          gzip -9 -f candidates.jsonl
      - name: Independent Node semantic replay
        run: |
          node fin_rvi_002_stage3/verify_stage3.mjs \
            reports/fin_rvi_002_stage3/report.json
      - name: Reject gate forgery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('reports/fin_rvi_002_stage3/report.json')
          report = json.loads(source.read_text())
          current = report['payload']['stage3']['gate_status']
          forged = (
              'OPEN_POLICY_DID_NOT_DOMINATE_STRONG_BASELINE'
              if current == 'PASS_CANDIDATE_PENDING_CLEAN_RECONSTRUCTION'
              else 'PASS_CANDIDATE_PENDING_CLEAN_RECONSTRUCTION'
          )
          report['payload']['stage3']['gate_status'] = forged
          report['payload']['gate_readout']['G07'] = forged
          Path('/tmp/forged-stage3.json').write_text(json.dumps(report))
          PY
          if node fin_rvi_002_stage3/verify_stage3.mjs /tmp/forged-stage3.json; then
            echo 'forged Stage 3 gate accepted'; exit 1
          fi
      - name: Upload bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-rvi-002-stage3-label-acquisition
          path: |
            reports/fin_rvi_002_stage3/report.json
            reports/fin_rvi_002_stage3/report.sha256
            reports/fin_rvi_002_stage3/stage3_report.md
            reports/fin_rvi_002_stage3/stage3_compact_rows.jsonl
            reports/fin_rvi_002_stage3/stage3_confirmed_labels.jsonl
            reports/fin_rvi_002_stage3/holdout_decisions.jsonl
          if-no-files-found: error
          retention-days: 90
