name: Data Science v17 - Lane E canonical subject OIDC signature

on:
  push:
    branches: [agent/data-science-v17-lane-e-oidc-signature-v1]
    paths:
      - .github/workflows/data-science-v17-lane-e-canonical-oidc.yml
      - data_science_pipeline_v17_lane_e_canonical_oidc/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: data-science-v17-lane-e-canonical-oidc-v1
  cancel-in-progress: true

env:
  COMPONENT: data_science_pipeline_v17_lane_e_canonical_oidc
  SUBJECT: data_science_pipeline_v17_lane_e_canonical_oidc/LANE_E_CANONICAL_SUBJECT.json
  EVIDENCE: data-science-v17-lane-e-canonical-oidc-evidence
  COSIGN_VERSION: 3.0.6
  COSIGN_SHA256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
  SUBJECT_SHA256: 53b5112447a795fb7a902976cd9854c9ca2c6c46be16d05684e1975ed6b8f6b6
  README_SHA256: 083fb916523a606bc3a241635dfbc1cd48f18299291598ed5fd72efddb5bc2d3
  VERIFIER_SHA256: 6f038138b29f2648ec8fe7c9ca33dc2de12f2e8f5f9f8c86605060a2d762a91c
  TESTS_SHA256: ae1ad3e573cf314627ad02d1bbed13cdfdd143a52f98daed7657fca26dae7461
  FREEZE_SHA256: 9b4f85d58d4ce57b675b3f989fcc4108721452207f80cc5ed92ea3d543d7f321
  LOCAL_RECEIPT_SHA256: cbdb1087472e99777d6b11eecae40941c1734b108368bbde02bb51234434539e
  CERT_ID: https://github.com/cristh99/notebooks/.github/workflows/data-science-v17-lane-e-canonical-oidc.yml@refs/heads/agent/data-science-v17-lane-e-oidc-signature-v1
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  sign-canonical-lane-e-subject:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact canonical Lane E subject
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = cristh99/notebooks
          test "$GITHUB_REF" = refs/heads/agent/data-science-v17-lane-e-oidc-signature-v1
          case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1 ;; esac
          mkdir -p "$EVIDENCE"
          printf '%s  %s\n' "$SUBJECT_SHA256" "$SUBJECT" | sha256sum -c -
          printf '%s  %s\n' "$README_SHA256" "$COMPONENT/README.md" | sha256sum -c -
          printf '%s  %s\n' "$VERIFIER_SHA256" "$COMPONENT/verify_canonical_subject.py" | sha256sum -c -
          printf '%s  %s\n' "$TESTS_SHA256" "$COMPONENT/test_canonical_subject.py" | sha256sum -c -
          printf '%s  %s\n' "$FREEZE_SHA256" "$COMPONENT/FREEZE_CANONICAL.json" | sha256sum -c -
          printf '%s  %s\n' "$LOCAL_RECEIPT_SHA256" "$COMPONENT/LOCAL_CANONICAL_RESULT.json" | sha256sum -c -
          (
            cd "$COMPONENT"
            python3 -m unittest -v test_canonical_subject.py
          ) |& tee "$EVIDENCE/tests.log"
          python3 "$COMPONENT/verify_canonical_subject.py" --output "$EVIDENCE/local-receipt.json" | tee "$EVIDENCE/local-verification.log"
          printf '%s  %s\n' "$LOCAL_RECEIPT_SHA256" "$EVIDENCE/local-receipt.json" | sha256sum -c -
          cmp "$COMPONENT/LOCAL_CANONICAL_RESULT.json" "$EVIDENCE/local-receipt.json"
          sha256sum "$SUBJECT" "$COMPONENT/README.md" "$COMPONENT/verify_canonical_subject.py" "$COMPONENT/test_canonical_subject.py" "$COMPONENT/FREEZE_CANONICAL.json" "$COMPONENT/LOCAL_CANONICAL_RESULT.json" > "$EVIDENCE/source-sha256.txt"

      - name: Install pinned Cosign
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o "$RUNNER_TEMP/cosign"
          printf '%s  %s\n' "$COSIGN_SHA256" "$RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"
          "$RUNNER_TEMP/cosign" version > "$EVIDENCE/cosign-version.txt"

      - name: Sign exact canonical Lane E subject
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$token"
          "$RUNNER_TEMP/cosign" sign-blob --yes --identity-token "$token" --bundle "$EVIDENCE/lane-e-canonical.sigstore.json" "$SUBJECT" > "$EVIDENCE/sign.log" 2>&1
          unset token response
          "$RUNNER_TEMP/cosign" verify-blob "$SUBJECT" --bundle "$EVIDENCE/lane-e-canonical.sigstore.json" --certificate-identity "$CERT_ID" --certificate-oidc-issuer "$OIDC_ISSUER" --certificate-github-workflow-repository "$GITHUB_REPOSITORY" --certificate-github-workflow-sha "$GITHUB_SHA" --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME" > "$EVIDENCE/verify.log" 2>&1
          grep -Fq 'Verified OK' "$EVIDENCE/verify.log"

      - name: Finalize canonical Lane E external receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["EVIDENCE"]); subject_path=Path(os.environ["SUBJECT"])
          local_path=root/"local-receipt.json"; bundle_path=root/"lane-e-canonical.sigstore.json"; verify_path=root/"verify.log"
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          subject=json.loads(subject_path.read_text()); local=json.loads(local_path.read_text()); bundle=json.loads(bundle_path.read_text())
          media_type=str(bundle.get("mediaType","")); material=bundle.get("verificationMaterial",{}); entries=material.get("tlogEntries",[])
          checks={
            "bundle_media_type":media_type.startswith("application/vnd.dev.sigstore.bundle.") and media_type.endswith("+json"),
            "verification_material":bool(material),
            "transparency_log":isinstance(entries,list) and len(entries)>=1,
            "signed_content":bool(bundle.get("messageSignature") or bundle.get("dsseEnvelope")),
            "cosign_verified":"Verified OK" in verify_path.read_text(),
            "subject_hash":sha(subject_path)==os.environ["SUBJECT_SHA256"],
            "local_receipt_hash":sha(local_path)==os.environ["LOCAL_RECEIPT_SHA256"],
            "local_verdict":local.get("verdict")=="PASS_LANE_E_CANONICAL_SUBJECT_SOFTWARE_ONLY",
            "canonical_lane_e":subject.get("lane")=="E",
            "canonical_receipt_binding":subject["receipt_binding"]["canonical_receipt_self_hash_sha256"]=="c002dc08d8536b9ba2109543a668d46d30397da7fe0968e7f850087d42c55f5b",
            "relationship_not_promoted":subject["semantic_guards"]["relationship_state"]=="CANDIDATE_REVIEW",
            "exact_operational_bytes_not_claimed":local["exact_operational_receipt_bytes_present"] is False,
            "stage08_blocked":subject["governance"]["stage08_unblocked"] is False,
            "production_unmodified":subject["governance"]["production_modified"] is False,
          }
          if not all(checks.values()): raise SystemExit(checks)
          receipt={
            "schema":"data-science-pipeline/lane-e-canonical-subject-oidc-external-receipt/1",
            "verdict":"PASS_LANE_E_CANONICAL_SUBJECT_OIDC_SIGSTORE",
            "github_run_id":int(os.environ["GITHUB_RUN_ID"]),"github_run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"github_sha":os.environ["GITHUB_SHA"],"github_ref":os.environ["GITHUB_REF"],"repository":os.environ["GITHUB_REPOSITORY"],
            "subject_sha256":sha(subject_path),"local_receipt_sha256":sha(local_path),"sigstore_bundle_sha256":sha(bundle_path),"cosign_verify_log_sha256":sha(verify_path),"cryptographic_checks":checks,
            "receipt_binding":subject["receipt_binding"],"identity_commitments":subject["identity_commitments"],"source_commitments":subject["source_commitments"],"operational_context":subject["operational_context"],"semantic_guards":subject["semantic_guards"],"signature_scope":subject["claim_boundary"],
            "exact_canonical_subject_bytes_present":True,"exact_operational_receipt_bytes_present":False,"independent_lane_e_signature_created":True,"independent_lane_m_signature_present":False,
            "external_cost_usd":0.0,"production_modified":False,"scientific_promotion_credit":0,"stage08_unblocked":False,
            "next_gate":"attach_exact_operational_receipt_bytes_and_obtain_independent_lane_m_signature",
          }
          payload=json.dumps(receipt,ensure_ascii=False,sort_keys=True,separators=(",",":"))+"\n"
          (root/"external-receipt.json").write_text(payload)
          (root/"external-receipt.sha256").write_text(hashlib.sha256(payload.encode()).hexdigest()+"  external-receipt.json\n")
          PY

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-v17-lane-e-canonical-oidc
          path: data-science-v17-lane-e-canonical-oidc-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Enforce canonical Lane E terminal receipt
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path("data-science-v17-lane-e-canonical-oidc-evidence/external-receipt.json")
          if not path.exists(): raise SystemExit("external receipt missing")
          receipt=json.loads(path.read_text())
          assert receipt["verdict"]=="PASS_LANE_E_CANONICAL_SUBJECT_OIDC_SIGSTORE"
          assert all(receipt["cryptographic_checks"].values())
          assert receipt["exact_canonical_subject_bytes_present"] is True
          assert receipt["exact_operational_receipt_bytes_present"] is False
          assert receipt["independent_lane_e_signature_created"] is True
          assert receipt["independent_lane_m_signature_present"] is False
          assert receipt["stage08_unblocked"] is False
          print(receipt["verdict"])
          PY
