name: Continuous confidence sequence — public independent verification

on:
  push:
    branches:
      - agent/inference-power-compiler-v2-public-ci
    paths:
      - 'inference_power_compiler_v2/verify_continuous_confidence_sequence_independent.py'
      - 'ContinuousConfidenceSequencePublic.lean'
      - '.github/workflows/continuous-confidence-sequence-public.yml'
  pull_request:
    paths:
      - 'inference_power_compiler_v2/verify_continuous_confidence_sequence_independent.py'
      - 'ContinuousConfidenceSequencePublic.lean'
      - '.github/workflows/continuous-confidence-sequence-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Bind private sources and compile verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '10cb158eea5770389e1f64446c1c3c60feed5414' inference_power_compiler_v2/verify_continuous_confidence_sequence_independent.py)" = "1"
          test "$(grep -c 'b1f11d35299fdab8fe4a48cfc98d176b65dbe422' inference_power_compiler_v2/verify_continuous_confidence_sequence_independent.py)" = "1"
          test "$(grep -c 'c31235cd9b2917c065e55870893976958116992b' inference_power_compiler_v2/verify_continuous_confidence_sequence_independent.py)" = "1"
          python -m py_compile inference_power_compiler_v2/verify_continuous_confidence_sequence_independent.py

      - name: Execute independent continuous root inversion
        shell: bash
        run: |
          set -euo pipefail
          python inference_power_compiler_v2/verify_continuous_confidence_sequence_independent.py \
            | tee continuous-confidence-sequence-public.log
          test -s inference_power_compiler_v2/CONTINUOUS_CONFIDENCE_SEQUENCE_PUBLIC_RECEIPT.json
          sha256sum inference_power_compiler_v2/CONTINUOUS_CONFIDENCE_SEQUENCE_PUBLIC_RECEIPT.json \
            > /tmp/continuous-cs-before.sha256
          python inference_power_compiler_v2/verify_continuous_confidence_sequence_independent.py \
            > /tmp/continuous-cs-rebuild.log
          sha256sum inference_power_compiler_v2/CONTINUOUS_CONFIDENCE_SEQUENCE_PUBLIC_RECEIPT.json \
            > /tmp/continuous-cs-after.sha256
          cmp /tmp/continuous-cs-before.sha256 /tmp/continuous-cs-after.sha256

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0-rc1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile formal continuous inversion boundary without axioms
        shell: bash
        run: |
          set -euo pipefail
          elan run leanprover/lean4:v4.33.0-rc1 lean \
            -o ContinuousConfidenceSequencePublic.olean \
            ContinuousConfidenceSequencePublic.lean \
            2>&1 | tee continuous-confidence-sequence-public-lean.log
          test -s ContinuousConfidenceSequencePublic.olean
          if grep -q 'sorryAx' continuous-confidence-sequence-public-lean.log; then
            echo 'Lean output contains sorryAx' >&2
            exit 1
          fi
          if grep -q 'depends on axioms:' continuous-confidence-sequence-public-lean.log; then
            echo 'Lean output contains an axiom dependency' >&2
            exit 1
          fi

      - name: Upload proof-carrying continuous confidence-sequence evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuous-confidence-sequence-public-evidence
          path: |
            inference_power_compiler_v2/CONTINUOUS_CONFIDENCE_SEQUENCE_PUBLIC_RECEIPT.json
            inference_power_compiler_v2/verify_continuous_confidence_sequence_independent.py
            ContinuousConfidenceSequencePublic.lean
            ContinuousConfidenceSequencePublic.olean
            continuous-confidence-sequence-public.log
            continuous-confidence-sequence-public-lean.log
          if-no-files-found: error
          retention-days: 90
