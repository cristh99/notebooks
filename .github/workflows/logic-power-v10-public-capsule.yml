name: Logic Power v10 — public proof-carrying verification

on:
  push:
    branches:
      - agent/logic-power-v10-public-ci-capsule
      - agent/inference-power-compiler-v2-public-ci
  pull_request:
    paths:
      - '.github/workflows/logic-power-v10-public-capsule.yml'
      - 'logic_power_v10_capsule/**'
      - 'inference_power_compiler_v2/**'
      - 'FiniteLowerBounds.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct the hash-bound private source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _logic_power_v10
          echo 'fbee850593592f701a39c4f6491c8f9a3bcfb586c1910357bdcd48f48967d5ce  logic_power_v10_capsule/parts/part_00.b64' | sha256sum -c -
          echo '7303cffc0012f655af430d9125f6258afe3a370c69abf02afacfa8bd93709979  logic_power_v10_capsule/parts/part_01.b64' | sha256sum -c -
          echo '9c0ebf32b4fa12be52d7c72fe879d76e542bd6f223febcdaf4fda10083a669da  logic_power_v10_capsule/parts/part_02.b64' | sha256sum -c -
          echo '2b5b23d38a64a4cc98f2bb376a38f20fe7dda9bd36539c2446f822d98ac9296a  logic_power_v10_capsule/parts/part_03.b64' | sha256sum -c -
          echo 'f83c70b1800617313c14f6241dc1f144f993900c5701f500c48f82485ecc58a5  logic_power_v10_capsule/parts/part_04.b64' | sha256sum -c -
          echo 'fb8a7c4e1ae79848f5114d9ce189d570860432714ca564adfb6655d63a868718  logic_power_v10_capsule/parts/part_05_00.b64' | sha256sum -c -
          echo '0585c5b94628c10dfc3921c472e903badd10f395f6d119fc4434d2ea7290cc86  logic_power_v10_capsule/parts/part_05_01.b64' | sha256sum -c -
          echo '897986739715627049a30f43ecb2abcfd50aecbfa7f4f8520428ada29f98b028  logic_power_v10_capsule/parts/part_05_02.b64' | sha256sum -c -
          cat \
            logic_power_v10_capsule/parts/part_00.b64 \
            logic_power_v10_capsule/parts/part_01.b64 \
            logic_power_v10_capsule/parts/part_02.b64 \
            logic_power_v10_capsule/parts/part_03.b64 \
            logic_power_v10_capsule/parts/part_04.b64 \
            logic_power_v10_capsule/parts/part_05_00.b64 \
            logic_power_v10_capsule/parts/part_05_01.b64 \
            logic_power_v10_capsule/parts/part_05_02.b64 \
            > /tmp/logic-power-v10-source.b64
          echo '3548f31fcaa9696eabb063023c905fbb04a2b3db73c96df9f9ee8bc8e0c64fc1  /tmp/logic-power-v10-source.b64' | sha256sum -c -
          base64 -d /tmp/logic-power-v10-source.b64 > /tmp/logic-power-v10-source.tar.gz
          echo 'ad2c363afb3fe20aa093565f278c690d423611e8270e9ad9b1491dbbdf218c31  /tmp/logic-power-v10-source.tar.gz' | sha256sum -c -
          tar xzf /tmp/logic-power-v10-source.tar.gz -C _logic_power_v10
          cd _logic_power_v10
          sha256sum -c SOURCE_SHA256SUMS
          test "$(cat PRIVATE_HEAD_SHA.txt)" = 'ba10d0edc7eb20d499d0481fda2537e782b6efb2'
          test "$(git hash-object ../logic_power_v10_capsule/overlay/logic_power_v10/ci_v10.sh)" = '0042baf4f79f208670a9a5e8cfcf5cb81c15aecb'
          test "$(git hash-object ../logic_power_v10_capsule/overlay/README_v10.md)" = 'c4e13c32962d79ad8a31d313b7ac034e63af0e43'
          test "$(git hash-object ../logic_power_v10_capsule/overlay/.github/workflows/logic-power-v10.yml)" = 'e0e2f0e5367923159c72f93c219780e4b97e1697'
          cp ../logic_power_v10_capsule/overlay/logic_power_v10/ci_v10.sh logic_power_v10/ci_v10.sh
          cp ../logic_power_v10_capsule/overlay/README_v10.md README_v10.md
          mkdir -p .github/workflows
          cp ../logic_power_v10_capsule/overlay/.github/workflows/logic-power-v10.yml .github/workflows/logic-power-v10.yml
          printf '%s\n' 'leanprover/lean4:v4.33.0-rc1' > lean-toolchain
          test "$(git hash-object lean-toolchain)" = 'fd85b262bf1c734663aa8292b0101f672168788f'

      - name: Execute the exact private v10 pipeline
        shell: bash
        working-directory: _logic_power_v10
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.33.0-rc1
          bash logic_power_v10/ci_v10.sh

      - name: Execute the statistical compiler extensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _logic_power_v10/inference_power_compiler_v2
          cp inference_power_compiler_v2/structural_experiment_design.py _logic_power_v10/inference_power_compiler_v2/
          cp inference_power_compiler_v2/run_structural_experiment_design.py _logic_power_v10/inference_power_compiler_v2/
          cp inference_power_compiler_v2/STRUCTURAL_EXPERIMENT_DESIGN_REPORT.json _logic_power_v10/inference_power_compiler_v2/
          cp inference_power_compiler_v2/finite_sample_design.py _logic_power_v10/inference_power_compiler_v2/
          cp inference_power_compiler_v2/run_finite_sample_design.py _logic_power_v10/inference_power_compiler_v2/
          cp inference_power_compiler_v2/run_finite_sample_benchmark.py _logic_power_v10/inference_power_compiler_v2/
          cp inference_power_compiler_v2/run_robust_contamination.py _logic_power_v10/inference_power_compiler_v2/
          cp inference_power_compiler_v2/lower_bound_compiler.py _logic_power_v10/inference_power_compiler_v2/
          cp inference_power_compiler_v2/run_lower_bound_compiler.py _logic_power_v10/inference_power_compiler_v2/
          cp inference_power_compiler_v2/FINITE_SAMPLE_MINIMAX_REPORT.json _logic_power_v10/inference_power_compiler_v2/FINITE_SAMPLE_MINIMAX_REPORT.pinned.json
          cp inference_power_compiler_v2/FINITE_SAMPLE_BENCHMARK_REPORT.json _logic_power_v10/inference_power_compiler_v2/FINITE_SAMPLE_BENCHMARK_REPORT.pinned.json
          cp inference_power_compiler_v2/ROBUST_CONTAMINATION_REPORT.json _logic_power_v10/inference_power_compiler_v2/ROBUST_CONTAMINATION_REPORT.pinned.json
          cp FiniteLowerBounds.lean _logic_power_v10/
          cd _logic_power_v10
          python -m py_compile \
            inference_power_compiler_v2/structural_experiment_design.py \
            inference_power_compiler_v2/run_structural_experiment_design.py \
            inference_power_compiler_v2/finite_sample_design.py \
            inference_power_compiler_v2/run_finite_sample_design.py \
            inference_power_compiler_v2/run_finite_sample_benchmark.py \
            inference_power_compiler_v2/run_robust_contamination.py \
            inference_power_compiler_v2/lower_bound_compiler.py \
            inference_power_compiler_v2/run_lower_bound_compiler.py
          PYTHONPATH=. python inference_power_compiler_v2/run_structural_experiment_design.py | tee structural-experiment-design.log
          cmp inference_power_compiler_v2/STRUCTURAL_EXPERIMENT_DESIGN_REPORT.json ../inference_power_compiler_v2/STRUCTURAL_EXPERIMENT_DESIGN_REPORT.json
          PYTHONPATH=. python inference_power_compiler_v2/run_finite_sample_design.py | tee finite-sample-minimax.log
          PYTHONPATH=. python inference_power_compiler_v2/run_finite_sample_benchmark.py | tee finite-sample-benchmark.log
          PYTHONPATH=. python inference_power_compiler_v2/run_robust_contamination.py | tee robust-contamination.log
          PYTHONPATH=. python inference_power_compiler_v2/run_lower_bound_compiler.py | tee lower-bound-compiler.log
          sha256sum \
            inference_power_compiler_v2/LOWER_BOUND_COMPILER_REPORT.json \
            inference_power_compiler_v2/LE_CAM_CERTIFICATE.json \
            inference_power_compiler_v2/ASSOUAD_CERTIFICATE.json \
            inference_power_compiler_v2/LOWER_BOUND_GATE_CERTIFICATE.json \
            > /tmp/lower-bound-before.sha256
          PYTHONPATH=. python inference_power_compiler_v2/run_lower_bound_compiler.py > /tmp/lower-bound-rebuild.log
          sha256sum \
            inference_power_compiler_v2/LOWER_BOUND_COMPILER_REPORT.json \
            inference_power_compiler_v2/LE_CAM_CERTIFICATE.json \
            inference_power_compiler_v2/ASSOUAD_CERTIFICATE.json \
            inference_power_compiler_v2/LOWER_BOUND_GATE_CERTIFICATE.json \
            > /tmp/lower-bound-after.sha256
          cmp /tmp/lower-bound-before.sha256 /tmp/lower-bound-after.sha256
          export PATH="$HOME/.elan/bin:$PATH"
          lean -o FiniteLowerBounds.olean FiniteLowerBounds.lean 2>&1 | tee finite-lower-bounds-lean.log
          test -s FiniteLowerBounds.olean
          if grep -q 'sorryAx' finite-lower-bounds-lean.log; then
            echo 'Unexpected sorryAx in finite lower-bound boundary'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          pairs = [
              ('FINITE_SAMPLE_MINIMAX_REPORT.json', 'FINITE_SAMPLE_MINIMAX_REPORT.pinned.json'),
              ('FINITE_SAMPLE_BENCHMARK_REPORT.json', 'FINITE_SAMPLE_BENCHMARK_REPORT.pinned.json'),
              ('ROBUST_CONTAMINATION_REPORT.json', 'ROBUST_CONTAMINATION_REPORT.pinned.json'),
          ]
          for generated_name, pinned_name in pairs:
              generated = json.loads(Path('inference_power_compiler_v2', generated_name).read_text())
              pinned = json.loads(Path('inference_power_compiler_v2', pinned_name).read_text())
              if generated != pinned:
                  raise SystemExit(f'{generated_name} pinned report mismatch')
          PY

      - name: Bind the public receipt to both repositories
        shell: bash
        working-directory: _logic_power_v10
        env:
          PUBLIC_EVENT_SHA: ${{ github.sha }}
          PUBLIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          audit = json.loads(Path('reports/audit_v10.json').read_text())
          structural = json.loads(Path('inference_power_compiler_v2/STRUCTURAL_EXPERIMENT_DESIGN_REPORT.json').read_text())
          finite_sample = json.loads(Path('inference_power_compiler_v2/FINITE_SAMPLE_MINIMAX_REPORT.json').read_text())
          benchmark = json.loads(Path('inference_power_compiler_v2/FINITE_SAMPLE_BENCHMARK_REPORT.json').read_text())
          robust = json.loads(Path('inference_power_compiler_v2/ROBUST_CONTAMINATION_REPORT.json').read_text())
          lower_bound = json.loads(Path('inference_power_compiler_v2/LOWER_BOUND_COMPILER_REPORT.json').read_text())
          receipt = {
              **audit,
              'schema': 'logic-power-v10/public-verification-receipt/6',
              'private_source_repository': 'cristh99/my_first_repository',
              'private_source_head': Path('PRIVATE_HEAD_SHA.txt').read_text().strip(),
              'public_capsule_repository': 'cristh99/notebooks',
              'public_capsule_head': os.environ['PUBLIC_HEAD_SHA'],
              'public_event_sha': os.environ['PUBLIC_EVENT_SHA'],
              'source_archive_sha256': 'ad2c363afb3fe20aa093565f278c690d423611e8270e9ad9b1491dbbdf218c31',
              'transport_sha256': '3548f31fcaa9696eabb063023c905fbb04a2b3db73c96df9f9ee8bc8e0c64fc1',
              'private_ci_blob_sha': '0042baf4f79f208670a9a5e8cfcf5cb81c15aecb',
              'private_readme_blob_sha': 'c4e13c32962d79ad8a31d313b7ac034e63af0e43',
              'private_workflow_blob_sha': 'e0e2f0e5367923159c72f93c219780e4b97e1697',
              'private_lean_toolchain_blob_sha': 'fd85b262bf1c734663aa8292b0101f672168788f',
              'structural_experiment_design': structural,
              'finite_sample_minimax_design': finite_sample,
              'finite_sample_benchmark': benchmark,
              'robust_contamination_phase_transition': robust,
              'proof_carrying_lower_bounds': lower_bound,
          }
          path = Path('reports/public-verification-receipt-v10.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('reports/public-verification-receipt-v10.sha256').write_text(
              f'{digest}  public-verification-receipt-v10.json\n'
          )
          print(path.read_text())
          print(digest)
          PY

      - name: Upload public verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logic-power-v10-statistical-design-evidence
          path: |
            _logic_power_v10/reports/
            _logic_power_v10/certificates/
            _logic_power_v10/inference_power_compiler_v2/
            _logic_power_v10/FiniteLowerBounds.lean
            _logic_power_v10/FiniteLowerBounds.olean
            _logic_power_v10/finite-lower-bounds-lean.log
            _logic_power_v10/structural-experiment-design.log
            _logic_power_v10/finite-sample-minimax.log
            _logic_power_v10/finite-sample-benchmark.log
            _logic_power_v10/robust-contamination.log
            _logic_power_v10/lower-bound-compiler.log
            _logic_power_v10/SOURCE_SHA256SUMS
            _logic_power_v10/PRIVATE_HEAD_SHA.txt
