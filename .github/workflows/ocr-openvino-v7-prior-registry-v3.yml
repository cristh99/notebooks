name: Apply preregistered OpenVINO macrofold semantics v1

on:
  push:
    branches:
      - agent/openvino-v7-smoke-16-stacked-v2
    paths:
      - "scripts/apply_openvino_macrofold_semantics_v1.py"
      - ".github/workflows/ocr-openvino-v7-prior-registry-v3.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-openvino-macrofold-semantics-v1
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.11.15"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.2.0
      - name: Apply exact preregistered fold replacement
        run: |
          set -euo pipefail
          python scripts/apply_openvino_macrofold_semantics_v1.py
          python -m compileall -q \
            ocr_real_risk_v1/openvino_full_gate_aggregate_v7.py \
            ocr_real_risk_v1/test_openvino_macrofold_semantics_v7.py
          git diff --check
      - name: Prove three-of-four semantics and existing aggregate contracts
        run: |
          set -euo pipefail
          python -m unittest -v \
            ocr_real_risk_v1.test_openvino_macrofold_semantics_v7 \
            ocr_real_risk_v1.test_openvino_aggregate_registry_binding_v7 \
            ocr_real_risk_v1.test_openvino_full_gate_v7
      - name: Commit only tested scientific implementation
        run: |
          set -euo pipefail
          git rm -f scripts/apply_openvino_macrofold_semantics_v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ocr_real_risk_v1/openvino_full_gate_aggregate_v7.py
          git diff --cached --check
          git commit -m 'Evaluate each preregistered OpenVINO macrofold directly'
          git push origin "HEAD:${GITHUB_REF_NAME}"
