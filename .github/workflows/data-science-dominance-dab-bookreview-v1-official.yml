name: Data Science dominance — BookReview V1 query2-3 blind gate

on:
  push:
    branches:
      - agent/data-science-dominance-dab-bookreview-v1
    paths:
      - .github/workflows/data-science-dominance-dab-bookreview-v1-official.yml

permissions:
  contents: read
  actions: read

env:
  ROOT: data_science_dominance/dab_bookreview_v1
  DAB_SHA: 9a55e34271a2500a41cbc009e239edd94599e374
  PGPASSWORD: postgres
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: postgres
  PGDATABASE: bookreview_db

jobs:
  solve-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove one-shot workflow-only activation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$(git rev-parse HEAD^)" = c4c8be627c09d6192b68946d196bd30548adfbdd
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/data-science-dominance-dab-bookreview-v1-official.yml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact runtime and acquisition dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client git-lfs
          python -m pip install --disable-pip-version-check \
            'psycopg2-binary==2.9.9' 'huggingface-hub==1.2.1'
          python -m pip freeze | sort > bookreview-runtime-pip-freeze.txt

      - name: Verify pre-data synthetic PASS
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: cristh99/notebooks
          run-id: 31026287948
          name: bookreview-v1-synthetic
          path: synthetic-proof

      - name: Reconstruct and verify frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(find synthetic-proof -name bookreview-synthetic-receipt.json -type f | head -1)"
          test -n "$receipt"
          python - "$receipt" <<'PY'
          import json,sys
          receipt=json.load(open(sys.argv[1],encoding='utf-8'))
          assert receipt['verdict']=='PASS'
          assert receipt['candidate_sha256']=='f539ea1d8e7434ade8b8333054ba40d10a69f6e4c430e784ea321ccafde06414'
          assert receipt['held_out_query_content_accessed'] is False
          assert receipt['validators_executed'] is False
          assert receipt['ground_truth_accessed'] is False
          assert receipt['official_dataset_values_accessed'] is False
          PY
          bash "$ROOT/reconstruct.sh"
          echo 'f539ea1d8e7434ade8b8333054ba40d10a69f6e4c430e784ea321ccafde06414  '"$ROOT"'/bookreview_engine.py' | sha256sum -c -

      - name: Acquire only BookReview datasets and held-out query texts
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --filter=blob:none --no-checkout https://github.com/ucbepic/DataAgentBench.git dab
          cd dab
          git sparse-checkout init --no-cone
          cat > .git/info/sparse-checkout <<'EOF'
          /dataset_manifest.tsv
          /query_bookreview/query_dataset/**
          /query_bookreview/query2/query.json
          /query_bookreview/query3/query.json
          EOF
          git -c advice.detachedHead=false checkout "$DAB_SHA"
          test "$(git rev-parse HEAD)" = "$DAB_SHA"
          test -z "$(find . -type f \( -name ground_truth.csv -o -name validate.py \) -print -quit)"
          cd ..
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          root=Path('dab')
          expected={
            'query_bookreview/query_dataset/books_info.sql':('80acb3ece574f26b634107c9c553dc5ab0c95ca11f6b226c9602dff9465393d9',649048),
            'query_bookreview/query_dataset/review_query.db':('01f07a5894f058613374694a8f46d19341bf1fa316367494d019191e772b3e2c',1093632),
          }
          files=[]
          for rel,(digest,size) in expected.items():
              target=root/rel
              data=target.read_bytes() if target.is_file() else b''
              valid=len(data)==size and hashlib.sha256(data).hexdigest()==digest
              if not valid:
                  downloaded=Path(hf_hub_download(repo_id='ruiyingm/DataAgentBench-data',repo_type='dataset',filename=rel,local_dir=str(root),force_download=True))
                  if downloaded.resolve()!=target.resolve():
                      target.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(downloaded,target)
                  data=target.read_bytes()
              assert len(data)==size and hashlib.sha256(data).hexdigest()==digest, rel
              files.append({'path':rel,'bytes':size,'sha256':digest})
          queries=[]
          for n in (2,3):
              p=root/f'query_bookreview/query{n}/query.json'
              assert p.is_file()
              queries.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest={'schema':'data-science-dominance/bookreview-v1-official-data/1','dab_commit':'9a55e34271a2500a41cbc009e239edd94599e374','dataset_files':files,'held_out_query_files':queries,'validators_present':False,'ground_truth_present':False}
          Path('bookreview-data-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - name: Build exact PostgreSQL books database
        shell: bash
        run: |
          set -euo pipefail
          dropdb --if-exists -h 127.0.0.1 -U postgres bookreview_db
          createdb -h 127.0.0.1 -U postgres bookreview_db
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d bookreview_db \
            -f dab/query_bookreview/query_dataset/books_info.sql > bookreview-import.log
          python - <<'PY'
          import json,psycopg2
          conn=psycopg2.connect(host='127.0.0.1',port=5432,user='postgres',password='postgres',dbname='bookreview_db')
          try:
              with conn.cursor() as cur:
                  cur.execute('SELECT COUNT(*) FROM books_info')
                  count=int(cur.fetchone()[0])
                  assert count>0
          finally: conn.close()
          open('bookreview-postgres-integrity.json','w').write(json.dumps({'books_info':count},indent=2)+'\n')
          print({'books_info':count})
          PY

      - name: Solve both fresh queries in one frozen process and seal answers
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find dab -type f \( -name ground_truth.csv -o -name validate.py \) -print -quit)"
          python - <<'PY' 2>&1 | tee bookreview-solve.log
          import hashlib,importlib.util,json,os,sys
          from pathlib import Path
          root=Path('data_science_dominance/dab_bookreview_v1')
          engine_path=root/'bookreview_engine.py'
          assert hashlib.sha256(engine_path.read_bytes()).hexdigest()=='f539ea1d8e7434ade8b8333054ba40d10a69f6e4c430e784ea321ccafde06414'
          spec=importlib.util.spec_from_file_location('frozen_bookreview_v1',engine_path)
          module=importlib.util.module_from_spec(spec); sys.modules[spec.name]=module; spec.loader.exec_module(module)
          books,reviews,joined=module.load_domain(Path('dab').resolve())
          out=Path('sealed-answers'); out.mkdir()
          answers={}
          for n in (2,3):
              query=module.read_query(Path(f'dab/query_bookreview/query{n}/query.json'))
              plan=module.plan_query(query,books)
              answer=module.evaluate(plan,joined)
              module.write_outputs(out,f'bookreview_{n}',query,plan,answer)
              answers[f'bookreview_{n}']=module.render_answer(answer)
              print(json.dumps({'query_id':f'bookreview_{n}','answer':answers[f'bookreview_{n}']},sort_keys=True),flush=True)
          (out/'answers.json').write_text(json.dumps(answers,indent=2,sort_keys=True)+'\n')
          files=[]
          for p in sorted(x for x in out.rglob('*') if x.is_file()):
              files.append({'path':str(p.relative_to(out)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest={
              'schema':'data-science-dominance/bookreview-v1-sealed-answers/1',
              'github_run_id':int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'github_sha':os.environ['GITHUB_SHA'],
              'dab_commit':'9a55e34271a2500a41cbc009e239edd94599e374',
              'candidate_sha256':'f539ea1d8e7434ade8b8333054ba40d10a69f6e4c430e784ea321ccafde06414',
              'synthetic_pass_run_id':31026287948,
              'validator_files_present_when_solved':False,
              'ground_truth_files_present_when_solved':False,
              'domain_loaded_once':True,
              'candidate_process_count':1,
              'post_hoc_retuning_permitted':False,
              'files':files,
              'data_manifest_sha256':hashlib.sha256(Path('bookreview-data-manifest.json').read_bytes()).hexdigest(),
              'postgres_integrity_sha256':hashlib.sha256(Path('bookreview-postgres-integrity.json').read_bytes()).hexdigest(),
          }
          payload=json.dumps(manifest,indent=2,sort_keys=True)+'\n'
          Path('bookreview-answer-manifest.json').write_text(payload)
          Path('bookreview-answer-manifest.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'  bookreview-answer-manifest.json\n')
          PY
          for n in 2 3; do test -s "sealed-answers/bookreview_${n}.txt"; done

      - name: Upload immutable answers before validator checkout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bookreview-v1-sealed-answers
          retention-days: 90
          if-no-files-found: error
          path: |
            sealed-answers/**
            bookreview-answer-manifest.json
            bookreview-answer-manifest.sha256
            bookreview-data-manifest.json
            bookreview-postgres-integrity.json
            bookreview-solve.log
            bookreview-import.log
            bookreview-runtime-pip-freeze.txt
            data_science_dominance/dab_bookreview_v1/FREEZE.json

  validate-sealed-answers:
    needs: solve-and-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bookreview-v1-sealed-answers
          path: sealed-bundle

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Acquire validators and ground truth only after answer sealing
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ucbepic/DataAgentBench.git dab-validation
          cd dab-validation
          git sparse-checkout init --no-cone
          cat > .git/info/sparse-checkout <<'EOF'
          /query_bookreview/query2/**
          /query_bookreview/query3/**
          EOF
          git -c advice.detachedHead=false checkout "$DAB_SHA"
          test "$(git rev-parse HEAD)" = "$DAB_SHA"
          test "$(find . -name ground_truth.csv -type f | wc -l)" -eq 2
          test "$(find . -name validate.py -type f | wc -l)" -eq 2

      - name: Run each official validator exactly once and seal verdict
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee bookreview-validator.log
          import hashlib,importlib.util,json,os,sys,traceback
          from pathlib import Path
          bundle=Path('sealed-bundle')
          manifest_path=next(bundle.rglob('bookreview-answer-manifest.json'))
          manifest=json.loads(manifest_path.read_text())
          answer_dir=next(bundle.rglob('answers.json')).parent
          assert manifest['candidate_sha256']=='f539ea1d8e7434ade8b8333054ba40d10a69f6e4c430e784ea321ccafde06414'
          assert manifest['validator_files_present_when_solved'] is False
          assert manifest['ground_truth_files_present_when_solved'] is False
          results=[]
          for n in (2,3):
              answer_path=answer_dir/f'bookreview_{n}.txt'
              validator_path=Path(f'dab-validation/query_bookreview/query{n}/validate.py')
              ground_path=Path(f'dab-validation/query_bookreview/query{n}/ground_truth.csv')
              spec=importlib.util.spec_from_file_location(f'bookreview_validator_{n}',validator_path)
              module=importlib.util.module_from_spec(spec); sys.modules[spec.name]=module; spec.loader.exec_module(module)
              answer=answer_path.read_text().strip()
              try:
                  raw=module.validate(answer)
                  if isinstance(raw,tuple): passed,reason=bool(raw[0]),str(raw[1] if len(raw)>1 else '')
                  elif isinstance(raw,dict): passed,reason=bool(raw.get('is_valid')),str(raw.get('reason',''))
                  else: passed,reason=bool(raw),''
                  trace=''
              except Exception as exc:
                  passed=False; reason=f'{type(exc).__name__}: {exc}'; trace=traceback.format_exc()
              row={'query_number':n,'answer':answer,'passed':passed,'reason':reason,'traceback':trace,'answer_sha256':hashlib.sha256(answer_path.read_bytes()).hexdigest(),'validator_sha256':hashlib.sha256(validator_path.read_bytes()).hexdigest(),'ground_truth_sha256':hashlib.sha256(ground_path.read_bytes()).hexdigest()}
              results.append(row); print(json.dumps(row,sort_keys=True),flush=True)
          pass_count=sum(int(r['passed']) for r in results)
          points=25 if pass_count==2 else 0
          verdict='PASS_2_OF_2' if pass_count==2 else 'FAIL'
          report={'schema':'data-science-dominance/bookreview-v1-official-validation/1','verdict':verdict,'pass_count':pass_count,'query_count':2,'promotion_points':points,'score_before':465,'score_after':465+points,'candidate_sha256':manifest['candidate_sha256'],'answers_sealed_before_ground_truth_access':True,'validators_executed_once_each':True,'post_hoc_retuning_permitted':False,'results':results}
          Path('bookreview-validation-evidence').mkdir()
          report_text=json.dumps(report,indent=2,sort_keys=True)+'\n'
          Path('bookreview-validation-evidence/official-validation.json').write_text(report_text)
          receipt={'schema':'data-science-dominance/bookreview-v1-external-receipt/1','verdict':verdict,'pass_count':pass_count,'query_count':2,'promotion_points':points,'score_before':465,'score_after':465+points,'candidate_sha256':manifest['candidate_sha256'],'github_run_id':int(os.environ['GITHUB_RUN_ID']),'github_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'github_sha':os.environ['GITHUB_SHA'],'synthetic_pass_run_id':31026287948,'answers_sealed_before_ground_truth_access':True,'validators_executed_once_each':True,'post_hoc_retuning_permitted':False,'merge_permitted':False,'hashes':{'answer_manifest_sha256':hashlib.sha256(manifest_path.read_bytes()).hexdigest(),'validation_report_sha256':hashlib.sha256(report_text.encode()).hexdigest()}}
          receipt_text=json.dumps(receipt,indent=2,sort_keys=True)+'\n'
          Path('bookreview-validation-evidence/external-receipt.json').write_text(receipt_text)
          Path('bookreview-validation-evidence/external-receipt.sha256').write_text(hashlib.sha256(receipt_text.encode()).hexdigest()+'  external-receipt.json\n')
          PY
          status=${PIPESTATUS[0]}
          echo "$status" > bookreview-validator.status
          exit 0

      - name: Upload complete official evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bookreview-v1-official
          retention-days: 90
          if-no-files-found: error
          path: |
            sealed-bundle/**
            bookreview-validation-evidence/**
            bookreview-validator.log
            bookreview-validator.status
            data_science_dominance/dab_bookreview_v1/FREEZE.json

      - name: Enforce preregistered promotion gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('bookreview-validation-evidence/external-receipt.json').read_text())
          if receipt['pass_count']!=2:
              raise SystemExit(f"BookReview V1: {receipt['pass_count']}/2; evidence preserved; no retuning")
          print('BookReview V1: 2/2; +25 points')
          PY
