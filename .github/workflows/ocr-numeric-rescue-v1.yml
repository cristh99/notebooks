name: OCR numeric rescue v1

on:
  pull_request:
    paths:
      - 'ocr_numeric_rescue_v1/**'
      - '.github/workflows/ocr-numeric-rescue-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numeric-crop-rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PADDLE_PDX_MODEL_SOURCE: HUGGINGFACE
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ocr_sota_real_canary_v2/requirements.txt
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng libgl1
      - name: Install pinned OCR stack
        run: python -m pip install --disable-pip-version-check -r ocr_sota_real_canary_v2/requirements.txt
      - name: Unit and semantic-forgery tests
        run: python -m unittest -v ocr_numeric_rescue_v1.test_rescue
      - name: Execute frozen-page numeric rescue
        run: python -m ocr_numeric_rescue_v1.run_canary --output-dir ocr_numeric_rescue_v1/run
      - name: Independent semantic verification
        run: python -m ocr_numeric_rescue_v1.verify_report ocr_numeric_rescue_v1/run/reports/numeric_rescue.json
      - name: Environment manifest
        run: |
          python -m pip freeze | LC_ALL=C sort > ocr_numeric_rescue_v1/run/reports/pip-freeze.txt
          tesseract --version > ocr_numeric_rescue_v1/run/reports/tesseract-version.txt
          sha256sum ocr_numeric_rescue_v1/run/reports/* > ocr_numeric_rescue_v1/run/reports/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocr-numeric-rescue-v1
          path: ocr_numeric_rescue_v1/run/reports
          retention-days: 30
