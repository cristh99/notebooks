name: Data Science dominance — USAspending V3 synthetic freeze gate v2

on:
  push:
    branches:
      - agent/data-science-dominance-dab-fresh-usaspending-v3
    paths:
      - .github/workflows/data-science-dominance-dab-fresh-usaspending-v3-synthetic-v2.yml

permissions:
  contents: read

env:
  V2_ROOT: data_science_dominance/dab_fresh_usaspending_v2
  V3_ROOT: data_science_dominance/dab_fresh_usaspending_v3

jobs:
  synthetic-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove workflow-only activation after repaired freeze
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$(git rev-parse HEAD^)" = 8fd556fdcfa3c8bc1ce71c174cda555b4dad5c6c
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/data-science-dominance-dab-fresh-usaspending-v3-synthetic-v2.yml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reconstruct exact frozen V2 base
        shell: bash
        run: |
          set -euo pipefail
          bash "$V2_ROOT/reconstruct.sh"
          cp "$V2_ROOT/usaspending_fresh_engine.py" "$V3_ROOT/usaspending_v2_engine.py"
          echo '76d240d4f4bb1ed5a87f32c18ae92e7629b971f761577eb16d2b5deccf57ef8f  '"$V3_ROOT"'/usaspending_v2_engine.py' | sha256sum -c -
          python -m py_compile "$V3_ROOT/usaspending_v2_engine.py" "$V3_ROOT/usaspending_v3_engine.py" "$V3_ROOT/test_usaspending_v3_engine.py"

      - name: Enforce isolation and run tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('data_science_dominance/dab_fresh_usaspending_v3/usaspending_v3_engine.py').read_text().lower()
          for forbidden in ('query8','query9','query10','ground_truth','validate.py'):
              assert forbidden not in source, forbidden
          tree = ast.parse(source)
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import): imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module: imports.add(node.module.split('.')[0])
          assert not imports.intersection({'requests','httpx','urllib','socket','subprocess'})
          PY
          cd "$V3_ROOT"
          python -m unittest -v test_usaspending_v3_engine.py 2>&1 | tee "${GITHUB_WORKSPACE}/v3-synthetic-tests-v2.log"

      - name: Seal repaired synthetic receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('data_science_dominance/dab_fresh_usaspending_v3')
          log = Path('v3-synthetic-tests-v2.log')
          text = log.read_text() if log.exists() else ''
          passed = '\nOK\n' in ('\n'+text+'\n') and 'Ran 7 tests' in text
          receipt = {
              'schema': 'data-science-dominance/fresh-usaspending-v3-synthetic-receipt/2',
              'verdict': 'PASS' if passed else 'FAIL',
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'github_sha': os.environ['GITHUB_SHA'],
              'candidate_sha256': hashlib.sha256((root/'usaspending_v3_engine.py').read_bytes()).hexdigest(),
              'tests_sha256': hashlib.sha256((root/'test_usaspending_v3_engine.py').read_bytes()).hexdigest(),
              'base_v2_sha256': hashlib.sha256((root/'usaspending_v2_engine.py').read_bytes()).hexdigest(),
              'freeze_sha256': hashlib.sha256((root/'FREEZE.json').read_bytes()).hexdigest(),
              'prior_failed_synthetic_run_id': 31022969193,
              'held_out_query_content_accessed': False,
              'validators_executed': False,
              'ground_truth_accessed': False,
              'official_dataset_values_accessed': False,
              'post_hoc_retuning_permitted': False,
          }
          payload = json.dumps(receipt, indent=2, sort_keys=True)+'\n'
          Path('v3-synthetic-receipt-v2.json').write_text(payload)
          Path('v3-synthetic-receipt-v2.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'  v3-synthetic-receipt-v2.json\n')
          print(payload)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fresh-usaspending-v3-synthetic-v2
          retention-days: 90
          if-no-files-found: error
          path: |
            data_science_dominance/dab_fresh_usaspending_v3/**
            v3-synthetic-tests-v2.log
            v3-synthetic-receipt-v2.json
            v3-synthetic-receipt-v2.sha256

      - name: Enforce repaired V3 synthetic gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('v3-synthetic-receipt-v2.json').read_text())
          if receipt['verdict'] != 'PASS': raise SystemExit('USAspending V3 repaired synthetic gate failed')
          print('USAspending V3 repaired synthetic gate: PASS')
          PY
