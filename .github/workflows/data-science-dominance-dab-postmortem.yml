name: Data Science dominance — DAB 4/6 root-cause postmortem

on:
  push:
    branches:
      - agent/data-science-dominance-dab-slice
    paths:
      - '.github/workflows/data-science-dominance-dab-postmortem.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DAB_SHA: 9a55e34271a2500a41cbc009e239edd94599e374
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove workflow-only diagnostic activation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test "$(git rev-parse HEAD^)" = 'd02814dd66ddcdd7e4158966605574f63cce60e6'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/data-science-dominance-dab-postmortem.yml'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install bounded diagnostic environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client git-lfs
          python -m pip install --disable-pip-version-check \
            'duckdb==1.3.1' 'psycopg2-binary==2.9.9' 'pymongo==4.13.2' \
            'huggingface-hub==1.2.1' 'rapidfuzz==3.14.1'

      - name: Reconstruct exact failed candidate
        shell: bash
        run: |
          set -euo pipefail
          bash data_science_dominance/dab_slice/reconstruct_dab_slice.sh
          echo '0796f1d66d944e832181034f6e8e8800461b60d71e66716d5b19fe3fd1957dec  data_science_dominance/dab_slice/dab_slice_agent.py' | sha256sum -c -

      - name: Acquire only Civic and USAspending public datasets
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --filter=blob:none --no-checkout https://github.com/ucbepic/DataAgentBench.git dab
          cd dab
          git sparse-checkout init --no-cone
          cat > .git/info/sparse-checkout <<'EOF'
          /dataset_manifest.tsv
          /query_civic_unstructured/query_dataset/**
          /query_usaspending/query_dataset/**
          EOF
          git -c advice.detachedHead=false checkout "$DAB_SHA"
          test "$(git rev-parse HEAD)" = "$DAB_SHA"
          cd ..
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          root = Path('dab')
          selected = [
              'query_civic_unstructured/query_dataset/civic_docs_dump/civic_db/civic_docs.bson',
              'query_civic_unstructured/query_dataset/funding.db',
              'query_usaspending/query_dataset/agencies.duckdb',
              'query_usaspending/query_dataset/contracts.sql',
          ]
          manifest = {}
          for line in (root / 'dataset_manifest.tsv').read_text().splitlines():
              if line and not line.startswith('#'):
                  path, sha256, size = line.split('\t')
                  manifest[path] = (sha256, int(size))
          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b''):
                      h.update(chunk)
              return h.hexdigest()
          for relative in selected:
              path = root / relative
              expected = manifest.get(relative)
              valid = bool(expected and path.is_file() and path.stat().st_size == expected[1] and digest(path) == expected[0])
              if expected and not valid:
                  hf_hub_download(
                      repo_id='ruiyingm/DataAgentBench-data', repo_type='dataset',
                      filename=relative, local_dir=str(root), force_download=True,
                  )
              if expected:
                  assert path.stat().st_size == expected[1]
                  assert digest(path) == expected[0]
              else:
                  assert path.is_file() and path.stat().st_size > 1024
          PY

      - name: Import USAspending PostgreSQL source
        shell: bash
        run: |
          set -euo pipefail
          dropdb --if-exists -h 127.0.0.1 -U postgres usaspending_contracts
          createdb -h 127.0.0.1 -U postgres usaspending_contracts
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d usaspending_contracts \
            -f dab/query_usaspending/query_dataset/contracts.sql > postgres-import.log

      - name: Instrument both deterministic failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p postmortem-evidence
          python - <<'PY'
          from __future__ import annotations
          import importlib.util
          import json
          import math
          import re
          import sqlite3
          from collections import Counter, defaultdict
          from pathlib import Path

          import duckdb
          import psycopg2
          from bson import decode_all
          from rapidfuzz import fuzz, process

          candidate_path = Path('data_science_dominance/dab_slice/dab_slice_agent.py')
          spec = importlib.util.spec_from_file_location('dab_candidate', candidate_path)
          agent = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(agent)

          evidence = Path('postmortem-evidence')
          root = Path('dab')

          # ---------------- Civic ----------------
          civic_root = root / 'query_civic_unstructured/query_dataset'
          docs = decode_all((civic_root / 'civic_docs_dump/civic_db/civic_docs.bson').read_bytes())
          gt_names = [
              '2022 Annual Street Maintenance',
              'Annual Street Maintenance',
              'Civic Center Water Treatment Facility Phase 2',
              'Marie Canyon Green Streets',
              'Michael Landon Center Roof Replacement Project',
              'PCH Median Improvements Project',
              'PCH Signal Synchronization System Improvements Project',
              'PCH at Trancas Canyon Road Right Turn Lane',
              'Permanent Skate Park',
              'Westward Beach Road Improvements Project',
              'Westward Beach Road Repair Project',
          ]
          decoded_docs = []
          parser_counts = []
          gt_hits = defaultdict(list)
          structural_lines = []
          for ordinal, doc in enumerate(docs):
              content = str(doc.get('report_content', ''))
              report_date, records = agent.parse_project_records(content, None)
              parser_counts.append({
                  'ordinal': ordinal,
                  'report_id': str(doc.get('report_id', '')),
                  'report_date': report_date.isoformat() if report_date else None,
                  'record_count': len(records),
                  'content_chars': len(content),
                  'line_count': len(content.splitlines()),
              })
              lines = content.splitlines()
              for line_index, line in enumerate(lines):
                  lower = line.casefold()
                  if any(token in lower for token in ('project', 'capital', 'design', 'status', 'phase', 'publication', 'report date')):
                      structural_lines.append({
                          'ordinal': ordinal,
                          'report_id': str(doc.get('report_id', '')),
                          'line_index': line_index,
                          'line': line[:500],
                      })
                  for name in gt_names:
                      if name.casefold() in lower:
                          lo = max(0, line_index - 3)
                          hi = min(len(lines), line_index + 4)
                          gt_hits[name].append({
                              'ordinal': ordinal,
                              'report_id': str(doc.get('report_id', '')),
                              'line_index': line_index,
                              'context': lines[lo:hi],
                          })
              decoded_docs.append({
                  'ordinal': ordinal,
                  'keys': sorted(str(key) for key in doc),
                  'report_id': str(doc.get('report_id', '')),
                  'other_fields': {str(k): str(v) for k, v in doc.items() if k != 'report_content'},
                  'report_content': content,
              })

          funding_conn = sqlite3.connect(civic_root / 'funding.db')
          try:
              funding_tables = [row[0] for row in funding_conn.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
              funding_schema = {
                  table: [row[1] for row in funding_conn.execute(f'PRAGMA table_info("{table}")')]
                  for table in funding_tables
              }
              funding_rows = [tuple(row) for row in funding_conn.execute('SELECT project_name, grant_time, amount FROM "Funding"')]
          finally:
              funding_conn.close()
          funding_by_name = defaultdict(float)
          for name, grant_time, amount in funding_rows:
              parsed = agent.parse_date(grant_time)
              if parsed and parsed <= agent.date(2023, 1, 1):
                  funding_by_name[str(name)] += float(amount)
          civic_report = {
              'schema': 'data-science-dominance/dab-civic-postmortem/1',
              'document_count': len(docs),
              'document_key_frequencies': dict(Counter(key for doc in docs for key in doc)),
              'parser_counts': parser_counts,
              'parser_total_records': sum(row['record_count'] for row in parser_counts),
              'ground_truth_name_hits': dict(gt_hits),
              'ground_truth_hit_count': sum(bool(value) for value in gt_hits.values()),
              'structural_lines': structural_lines[:500],
              'funding_tables': funding_tables,
              'funding_schema': funding_schema,
              'funding_row_count': len(funding_rows),
              'funding_totals_for_ground_truth': {
                  name: funding_by_name.get(name, 0.0) for name in gt_names
              },
              'candidate_output': agent.solve_civic(agent.Paths(root, evidence)),
          }
          (evidence / 'civic-postmortem.json').write_text(json.dumps(civic_report, indent=2, sort_keys=True, default=str) + '\n')
          (evidence / 'civic-docs-decoded.json').write_text(json.dumps(decoded_docs, indent=2, sort_keys=True, default=str) + '\n')

          # ---------------- USAspending ----------------
          usa_root = root / 'query_usaspending/query_dataset'
          conn = psycopg2.connect(host='127.0.0.1', port=5432, user='postgres', password='postgres', dbname='usaspending_contracts')
          try:
              with conn.cursor() as cur:
                  cur.execute('SELECT award_id, awarding_agency FROM contracts')
                  contracts = list(cur.fetchall())
                  cur.execute('SELECT award_id, amount_text FROM contract_amounts')
                  amounts = list(cur.fetchall())
          finally:
              conn.close()
          alias_conn = duckdb.connect(str(usa_root / 'agencies.duckdb'), read_only=True)
          try:
              aliases = alias_conn.execute('SELECT surface_form, canonical_name FROM agency_aliases').fetchall()
          finally:
              alias_conn.close()
          defense_aliases = {
              agent.normalize_key(surface)
              for surface, canonical in aliases
              if agent.normalize_key(canonical) == 'departmentofdefense'
          }
          defense_aliases.update({'departmentofdefense', 'dod', 'deptofdefense', 'defensedepartment'})
          dod_contracts = [(award_id, agency) for award_id, agency in contracts if agent.normalize_key(agency) in defense_aliases]

          def primary_signature(value):
              text = agent.normalize_space(value)
              text = re.sub(r'(?i)[\s_.-]*OLD$', '', text)
              body = agent._ID_PREFIX_RE.sub('', text, count=1)
              compact = re.sub(r'[^A-Za-z0-9]+', '', body)
              return compact.translate(agent._OCR_TO_DIGIT).lower()

          parse_stats = Counter()
          amount_entities = []
          amount_signature_entities = defaultdict(set)
          primary_entities = defaultdict(set)
          for entity_id, (award_id, amount_text) in enumerate(amounts):
              old = agent.is_superseded_identifier(award_id)
              parsed = agent.parse_money(amount_text)
              parse_stats['total'] += 1
              parse_stats['old'] += int(old)
              parse_stats['parsed'] += int(parsed is not None and math.isfinite(parsed))
              parse_stats['parsed_gt_1m'] += int(parsed is not None and math.isfinite(parsed) and parsed > 1_000_000 and not old)
              if old or parsed is None or not math.isfinite(parsed):
                  continue
              signatures = agent.identifier_signatures(award_id)
              primary = primary_signature(award_id)
              amount_entities.append({
                  'entity_id': entity_id,
                  'award_id': str(award_id),
                  'amount_text': str(amount_text),
                  'parsed_amount': float(parsed),
                  'signatures': sorted(signatures),
                  'primary_signature': primary,
              })
              for signature in signatures:
                  amount_signature_entities[signature].add(entity_id)
              primary_entities[primary].add(entity_id)

          unique_signature_map = {
              signature: next(iter(ids))
              for signature, ids in amount_signature_entities.items()
              if len(ids) == 1
          }
          unique_primary_map = {
              signature: next(iter(ids))
              for signature, ids in primary_entities.items()
              if len(ids) == 1
          }
          entity_by_id = {row['entity_id']: row for row in amount_entities}
          candidate_stage = Counter()
          unresolved = []
          exact_join_entities = set()
          primary_join_entities = set()
          candidate_qualifying = set()
          for award_id, agency in dod_contracts:
              signatures = agent.identifier_signatures(award_id)
              payloads = {unique_signature_map[sig] for sig in signatures if sig in unique_signature_map}
              if len(payloads) == 1:
                  candidate_stage['candidate_exact_unique'] += 1
                  entity_id = next(iter(payloads))
                  exact_join_entities.add(entity_id)
                  if entity_by_id[entity_id]['parsed_amount'] > 1_000_000:
                      candidate_qualifying.add(entity_id)
              elif len(payloads) > 1:
                  candidate_stage['candidate_exact_ambiguous'] += 1
              else:
                  candidate_stage['candidate_no_exact'] += 1

              primary = primary_signature(award_id)
              primary_ids = primary_entities.get(primary, set())
              if len(primary_ids) == 1:
                  candidate_stage['primary_exact_unique'] += 1
                  primary_join_entities.update(primary_ids)
              elif len(primary_ids) > 1:
                  candidate_stage['primary_exact_ambiguous'] += 1
              else:
                  candidate_stage['primary_no_exact'] += 1
                  unresolved.append({
                      'contract_award_id': str(award_id),
                      'agency': str(agency),
                      'candidate_signatures': sorted(signatures),
                      'primary_signature': primary,
                  })

          primary_choices = list(unique_primary_map)
          score_bands = Counter()
          for row in unresolved[:300]:
              match = process.extractOne(row['primary_signature'], primary_choices, scorer=fuzz.ratio, score_cutoff=0)
              if match:
                  key, score, _ = match
                  row['best_primary_match'] = key
                  row['best_primary_score'] = score
                  row['best_amount_entity'] = entity_by_id[unique_primary_map[key]]
                  score_bands[f'{int(score // 5) * 5:02d}-{int(score // 5) * 5 + 4:02d}'] += 1

          usa_report = {
              'schema': 'data-science-dominance/dab-usaspending-postmortem/1',
              'ground_truth_count': 898,
              'candidate_count': agent.solve_usaspending(agent.Paths(root, evidence)),
              'contract_rows': len(contracts),
              'distinct_contract_surface_ids': len({str(row[0]) for row in contracts}),
              'agency_surface_counts': dict(Counter(str(agency) for _, agency in contracts)),
              'defense_aliases': sorted(defense_aliases),
              'dod_contract_rows': len(dod_contracts),
              'dod_distinct_contract_surface_ids': len({str(row[0]) for row in dod_contracts}),
              'amount_rows': len(amounts),
              'amount_parse_stats': dict(parse_stats),
              'surviving_amount_entities': len(amount_entities),
              'signature_count': len(amount_signature_entities),
              'signature_collision_count': sum(len(ids) > 1 for ids in amount_signature_entities.values()),
              'primary_signature_count': len(primary_entities),
              'primary_collision_count': sum(len(ids) > 1 for ids in primary_entities.values()),
              'join_stage_counts': dict(candidate_stage),
              'candidate_exact_join_distinct_entities': len(exact_join_entities),
              'primary_exact_join_distinct_entities': len(primary_join_entities),
              'candidate_qualifying_from_exact_only': len(candidate_qualifying),
              'unresolved_primary_count': len(unresolved),
              'unresolved_best_score_bands_first_300': dict(score_bands),
              'unresolved_samples': unresolved[:300],
              'amount_samples': amount_entities[:100],
          }
          (evidence / 'usaspending-postmortem.json').write_text(json.dumps(usa_report, indent=2, sort_keys=True, default=str) + '\n')
          print(json.dumps({
              'civic_parser_total_records': civic_report['parser_total_records'],
              'civic_ground_truth_names_found_in_documents': civic_report['ground_truth_hit_count'],
              'usa_candidate_count': usa_report['candidate_count'],
              'usa_ground_truth_count': usa_report['ground_truth_count'],
              'usa_dod_contract_rows': usa_report['dod_contract_rows'],
              'usa_candidate_exact_join_distinct_entities': usa_report['candidate_exact_join_distinct_entities'],
              'usa_primary_exact_join_distinct_entities': usa_report['primary_exact_join_distinct_entities'],
              'usa_unresolved_primary_count': usa_report['unresolved_primary_count'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload bounded postmortem evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-dominance-dab-postmortem
          retention-days: 30
          if-no-files-found: error
          path: |
            postmortem-evidence/**
            postgres-import.log
            data_science_dominance/dab_slice/dab_slice_agent.py
            data_science_dominance/dab_slice/DAB_SLICE_FREEZE.json
