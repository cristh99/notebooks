name: FOR-ABS-001 F7 Public Verification

on:
  pull_request:
    paths:
      - ".github/workflows/for-abs-f7-public-verification.yml"
      - "for_abs_f7_public_capsule/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: for-abs-f7-public-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Check out public capsule
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Compile capsule
        run: python -m compileall -q for_abs_f7_public_capsule

      - name: Validate privacy and static contract
        run: python for_abs_f7_public_capsule/static_validate.py

      - name: Run independent receipt verifier
        run: python for_abs_f7_public_capsule/verify.py

      - name: Run adversarial tests
        run: python -m unittest discover -s for_abs_f7_public_capsule -p 'test_*.py' -v

      - name: Add workflow context and hashes
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("for_abs_f7_public_capsule/artifacts")
          root.mkdir(exist_ok=True)
          context = {
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "ref": os.environ.get("GITHUB_REF"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "sha": os.environ.get("GITHUB_SHA"),
              "network_calls_by_capsule": 0,
              "external_writes_by_capsule": 0,
              "external_spend_usd": 0,
          }
          (root / "workflow-context.json").write_text(
              json.dumps(context, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (cd for_abs_f7_public_capsule/artifacts && sha256sum *.json > SHA256SUMS)

      - name: Publish summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("for_abs_f7_public_capsule/artifacts")
          report = json.loads((root / "report.json").read_text())
          static = json.loads((root / "static-report.json").read_text())
          lines = [
              "# FOR-ABS-001 F7 — Public Verification",
              "",
              f"- Status: **{report['status']}**",
              f"- F7: **{report['f7_before']} → {report['f7_after']}**",
              f"- Total: **{report['score_before']} → {report['score_after']}**",
              f"- Executed negative attacks: **{report['executed_negative_attacks']}**",
              f"- Static findings: **{static['finding_count']}**",
              f"- Secret findings: **{static['secret_findings']}**",
              f"- Raw locator findings: **{static['raw_locator_findings']}**",
              f"- Holdout opens: **{report['holdout_open_count']}**",
              f"- Corruption claims: **{report['corruption_claims_created']}**",
              f"- Network calls: **{report['network_calls']}**",
              f"- External spend: **${report['external_spend_usd']}**",
              f"- Report digest: `{report['report_digest']}`",
              "",
              "Finite receipt verification only; no production authority or God Mode claim.",
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload deterministic evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: for-abs-f7-public-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: for_abs_f7_public_capsule/artifacts/
          retention-days: 30
          if-no-files-found: error
