name: OpenVINO v7 full-gate fail-closed contract

on:
  push:
    branches:
      - agent/openvino-v7-smoke-16-stacked-v2
    paths:
      - "ocr_real_risk_v1/openvino_full_gate_contract_v7.py"
      - "ocr_real_risk_v1/openvino_full_gate_prepare_v7.py"
      - "ocr_real_risk_v1/openvino_full_gate_registry_v7.py"
      - "ocr_real_risk_v1/openvino_full_gate_runner_v7.py"
      - "ocr_real_risk_v1/openvino_full_gate_aggregate_v7.py"
      - "ocr_real_risk_v1/openvino_full_gate_v7.py"
      - "ocr_real_risk_v1/test_openvino_full_gate_v7.py"
      - ".github/workflows/ocr-openvino-v7-full-gate-contract.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: openvino-v7-full-gate-contract-v1
  cancel-in-progress: false

env:
  MANIFEST_ARTIFACT_ID: "8983596179"
  MANIFEST_ARTIFACT_SHA256: "fda92bb57ba4088481b6cedded374366b6c6635951942cd3e4f42688292fe182"
  SCIENTIFIC_MANIFEST_SHA256: "3340183dca08229e3cd1d17472043316867381d8b4f70e6f2d74e3592cd89d4c"
  CANDIDATE_STABLE_SHA256: "160a3e79c6075a6741a1a6365b0c833115bfc6e156176cb4cb5744b1189119cd"
  PYTHONHASHSEED: "0"
  OMP_THREAD_LIMIT: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  contract:
    name: Manifest replay and adversarial contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact contract branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: "3.11"

      - name: Install test-only dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            Pillow==12.2.0

      - name: Recover exact metadata-only terminal manifest
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${MANIFEST_ARTIFACT_ID}/zip" \
            > manifest-artifact.zip
          echo "${MANIFEST_ARTIFACT_SHA256}  manifest-artifact.zip" \
            | sha256sum --check --strict
          mkdir -p terminal-manifest
          unzip -q manifest-artifact.zip -d terminal-manifest
          (cd terminal-manifest && sha256sum --check --strict SHA256SUMS.txt)

      - name: Run adversarial contract tests without scientific image access
        shell: bash
        env:
          OPENVINO_MANIFEST_ROOT: ${{ github.workspace }}/terminal-manifest
        run: |
          set -euo pipefail
          mkdir -p contract-evidence
          python -m unittest -v \
            ocr_real_risk_v1.test_openvino_full_gate_v7 \
            2>&1 | tee contract-evidence/unittest.log
          python -m compileall -q \
            ocr_real_risk_v1/openvino_full_gate_contract_v7.py \
            ocr_real_risk_v1/openvino_full_gate_prepare_v7.py \
            ocr_real_risk_v1/openvino_full_gate_registry_v7.py \
            ocr_real_risk_v1/openvino_full_gate_runner_v7.py \
            ocr_real_risk_v1/openvino_full_gate_aggregate_v7.py \
            ocr_real_risk_v1/openvino_full_gate_v7.py \
            ocr_real_risk_v1/test_openvino_full_gate_v7.py
          python -m ocr_real_risk_v1.openvino_full_gate_v7 \
            verify-manifest \
            --manifest-root terminal-manifest \
            > contract-evidence/manifest-replay.json

      - name: Seal zero-outcome preflight receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          evidence = Path("contract-evidence")
          replay = json.loads((evidence / "manifest-replay.json").read_text())
          assert replay["scientific_count"] == 20613
          assert replay["scientific_manifest_sha256"] == os.environ[
              "SCIENTIFIC_MANIFEST_SHA256"
          ]
          assert replay["full_gate_authorized"] is False
          log = (evidence / "unittest.log").read_text()
          assert "Ran 12 tests" in log
          assert log.rstrip().endswith("OK")
          receipt = {
              "schema": "eaat.openvino_v7_full_gate_contract_preflight/1",
              "status": "PASS_FAIL_CLOSED_CONTRACT_ONLY",
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_sha": os.environ["GITHUB_SHA"],
              "candidate_stable_payload_sha256": os.environ[
                  "CANDIDATE_STABLE_SHA256"
              ],
              "scientific_manifest_sha256": os.environ[
                  "SCIENTIFIC_MANIFEST_SHA256"
              ],
              "manifest_artifact_id": int(os.environ["MANIFEST_ARTIFACT_ID"]),
              "manifest_artifact_sha256": os.environ[
                  "MANIFEST_ARTIFACT_SHA256"
              ],
              "source_files": {
                  "contract_sha256": sha(
                      Path(
                          "ocr_real_risk_v1/"
                          "openvino_full_gate_contract_v7.py"
                      )
                  ),
                  "prepare_sha256": sha(
                      Path(
                          "ocr_real_risk_v1/"
                          "openvino_full_gate_prepare_v7.py"
                      )
                  ),
                  "registry_sha256": sha(
                      Path(
                          "ocr_real_risk_v1/"
                          "openvino_full_gate_registry_v7.py"
                      )
                  ),
                  "runner_sha256": sha(
                      Path(
                          "ocr_real_risk_v1/"
                          "openvino_full_gate_runner_v7.py"
                      )
                  ),
                  "aggregate_sha256": sha(
                      Path(
                          "ocr_real_risk_v1/"
                          "openvino_full_gate_aggregate_v7.py"
                      )
                  ),
                  "cli_sha256": sha(
                      Path("ocr_real_risk_v1/openvino_full_gate_v7.py")
                  ),
                  "tests_sha256": sha(
                      Path("ocr_real_risk_v1/test_openvino_full_gate_v7.py")
                  ),
                  "workflow_sha256": sha(
                      Path(
                          ".github/workflows/"
                          "ocr-openvino-v7-full-gate-contract.yml"
                      )
                  ),
              },
              "verification": {
                  "tests_passed": 12,
                  "terminal_manifest_replayed": True,
                  "physical_dedup_contract_tested": True,
                  "prior_overlap_exclusion_tested": True,
                  "internal_pixel_duplicate_exclusion_tested": True,
                  "missing_partition_rejected": True,
                  "duplicate_partition_rejected": True,
                  "outcome_quarantine_violation_abstains": True,
                  "detector_barrier_precedes_annotations": True,
                  "leave_one_macrofold_out_stability_tested": True,
                  "authorization_hash_and_scope_tested": True,
              },
              "side_effects": {
                  "scientific_images_opened": 0,
                  "ocr_runs": 0,
                  "candidate_inference_runs": 0,
                  "paid_compute_launched": False,
                  "production_modified": False,
              },
              "full_execution_authorized": False,
              "next_gate": (
                  "INDEPENDENT_CHANGE_REVIEW_AND_PRIOR_CORPUS_"
                  "FINGERPRINT_REGISTRY_FREEZE"
              ),
          }
          raw = json.dumps(
              receipt,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode()
          receipt["stable_payload_sha256"] = hashlib.sha256(raw).hexdigest()
          (evidence / "contract-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY
          (cd contract-evidence && \
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' > SHA256SUMS.txt)
          (cd contract-evidence && sha256sum --check --strict SHA256SUMS.txt)

      - name: Upload immutable preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openvino-v7-full-gate-contract-${{ github.sha }}
          path: contract-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
