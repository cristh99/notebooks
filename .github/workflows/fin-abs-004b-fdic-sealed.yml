name: FIN-ABS-004B — sealed FDIC Random Forest benchmark

on:
  pull_request:
    branches:
      - agent/fin-abs-004b-fdic-rf-untouched
    paths:
      - 'README_FIN_ABS_004B_FDIC_RF.md'
      - 'fin_abs_004b_fdic/**'
      - '.github/workflows/fin-abs-004b-fdic-sealed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin-abs-004b-fdic-sealed-benchmark
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen challenger capsule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore official FDIC acquisitions
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .cache/fin_abs_004_fdic
          key: fdic-panel-v2-${{ runner.os }}-20260804
          restore-keys: |
            fdic-panel-v1-${{ runner.os }}-20260803

      - name: Install frozen numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.3.2 pandas==2.3.1 scipy==1.16.1 scikit-learn==1.7.1

      - name: Compile and verify every pre-test contract
        run: |
          python -m compileall -q fin_abs_004_fdic fin_abs_004b_fdic
          python -m unittest -v fin_abs_004b_fdic.test_protocol
          python -m unittest -v fin_abs_004b_fdic.test_model
          python -m unittest -v fin_abs_004b_fdic.test_benchmark
          python -m unittest -v fin_abs_004_fdic.test_panel
          python -m unittest -v fin_abs_004_fdic.test_entity_split
          python -m unittest -v fin_abs_004_fdic.test_preflight
          node --check fin_abs_004b_fdic/verify_stage0.mjs
          node --check fin_abs_004b_fdic/verify_benchmark_v2.mjs
          node --check fin_abs_004b_fdic/verify_benchmark_v3.mjs

      - name: Reconstruct official untouched cohort
        run: |
          set -euo pipefail
          rm -rf reports/fin_abs_004b_fdic_sealed
          mkdir -p reports/fin_abs_004b_fdic_sealed/panel \
                   reports/fin_abs_004b_fdic_sealed/result
          python -m fin_abs_004b_fdic.panel_cli \
            --cache .cache/fin_abs_004_fdic \
            --output-dir reports/fin_abs_004b_fdic_sealed/panel
          python -m fin_abs_004b_fdic.entity_split_cli \
            --source-panel reports/fin_abs_004b_fdic_sealed/panel/panel_features.csv \
            --source-report reports/fin_abs_004b_fdic_sealed/panel/panel_report.json \
            --output-panel reports/fin_abs_004b_fdic_sealed/panel/panel_features_entity_disjoint.csv \
            --output-report reports/fin_abs_004b_fdic_sealed/panel/entity_panel_report.json
          python -m fin_abs_004_fdic.preflight \
            --panel reports/fin_abs_004b_fdic_sealed/panel/panel_features_entity_disjoint.csv \
            --panel-report reports/fin_abs_004b_fdic_sealed/panel/entity_panel_report.json \
            --output reports/fin_abs_004b_fdic_sealed/panel/preflight_report.json
          node fin_abs_004b_fdic/verify_stage0.mjs \
            reports/fin_abs_004b_fdic_sealed/panel/entity_panel_report.json \
            reports/fin_abs_004b_fdic_sealed/panel/preflight_report.json \
            reports/fin_abs_004b_fdic_sealed/panel/panel_features_entity_disjoint.csv \
            reports/fin_abs_004b_fdic_sealed/panel/node_stage0_receipt.json

      - name: Open sealed 2012-2014 test exactly once
        run: |
          python -m fin_abs_004b_fdic.benchmark \
            --panel reports/fin_abs_004b_fdic_sealed/panel/panel_features_entity_disjoint.csv \
            --panel-report reports/fin_abs_004b_fdic_sealed/panel/entity_panel_report.json \
            --preflight-report reports/fin_abs_004b_fdic_sealed/panel/preflight_report.json \
            --output-dir reports/fin_abs_004b_fdic_sealed/result \
            --rf-trees 600

      - name: Independent Node metric and 2014 replay
        run: |
          node fin_abs_004b_fdic/verify_benchmark_v3.mjs \
            reports/fin_abs_004b_fdic_sealed/result/report.json \
            reports/fin_abs_004b_fdic_sealed/result/node_metric_receipt.json

      - name: Reject score and metric forgeries
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, hashlib, json
          from pathlib import Path
          source = json.loads(Path('reports/fin_abs_004b_fdic_sealed/result/report.json').read_text())
          for name, mutate in {
              'score': lambda value: value['payload']['absolute_score'].update({'after':1000,'delta':577}),
              'metric': lambda value: value['payload']['sealed_test']['challenger']['metrics'].update({'average_precision':1.0}),
              'year': lambda value: value['payload']['python_gate_checks'].update({'year_2014_cost_improves':True}),
          }.items():
              forged = copy.deepcopy(source)
              mutate(forged)
              canonical = json.dumps(forged['payload'], sort_keys=True, separators=(',', ':'), ensure_ascii=False)
              forged['payload_canonical'] = canonical
              forged['sha256'] = hashlib.sha256(canonical.encode()).hexdigest()
              Path(f'/tmp/forged_{name}.json').write_text(json.dumps(forged, indent=2, sort_keys=True) + '\n')
          PY
          for forged in /tmp/forged_score.json /tmp/forged_metric.json /tmp/forged_year.json; do
            if node fin_abs_004b_fdic/verify_benchmark_v3.mjs \
                "$forged" /tmp/forged_receipt.json; then
              echo "forgery accepted: $forged" >&2
              exit 1
            fi
          done

      - name: Build bounded evidence package
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/fin_abs_004b_fdic_sealed')
          report = json.loads((root/'result/report.json').read_text())
          receipt = json.loads((root/'result/node_metric_receipt.json').read_text())
          failed = sorted(k for k, v in report['payload']['python_gate_checks'].items() if not v)
          summary = {
              'schema':'fin-abs-004b/fdic-sealed-summary/1',
              'report_sha256':report['sha256'],
              'status':report['payload']['status'],
              'candidate_pass':report['payload']['performance_candidate_pass'],
              'failed_python_gates':failed,
              'selected_baseline':report['payload']['selection']['selected_baseline'],
              'selected_challenger':report['payload']['selection']['selected_challenger'],
              'node_receipt_sha256':receipt['sha256'],
              'split_counts':report['payload']['split_counts'],
              'absolute_score':report['payload']['absolute_score'],
          }
          (root/'result/summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          PY
          sha256sum \
            reports/fin_abs_004b_fdic_sealed/panel/panel_report.json \
            reports/fin_abs_004b_fdic_sealed/panel/entity_panel_report.json \
            reports/fin_abs_004b_fdic_sealed/panel/preflight_report.json \
            reports/fin_abs_004b_fdic_sealed/panel/node_stage0_receipt.json \
            reports/fin_abs_004b_fdic_sealed/result/report.json \
            reports/fin_abs_004b_fdic_sealed/result/predictions.jsonl \
            reports/fin_abs_004b_fdic_sealed/result/preprocessing_and_calibration.json \
            reports/fin_abs_004b_fdic_sealed/result/validation_entity_assignments.csv \
            reports/fin_abs_004b_fdic_sealed/result/node_metric_receipt.json \
            reports/fin_abs_004b_fdic_sealed/result/summary.json \
            > reports/fin_abs_004b_fdic_sealed/manifest.sha256

      - name: Upload sealed evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-abs-004b-fdic-sealed-benchmark
          path: |
            reports/fin_abs_004b_fdic_sealed/panel/panel_report.json
            reports/fin_abs_004b_fdic_sealed/panel/entity_panel_report.json
            reports/fin_abs_004b_fdic_sealed/panel/preflight_report.json
            reports/fin_abs_004b_fdic_sealed/panel/node_stage0_receipt.json
            reports/fin_abs_004b_fdic_sealed/result/
            reports/fin_abs_004b_fdic_sealed/manifest.sha256
          if-no-files-found: error
          retention-days: 90
