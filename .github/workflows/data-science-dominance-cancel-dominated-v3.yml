name: Data Science dominance — cancel mathematically dominated V3 work

on:
  push:
    branches:
      - agent/data-science-dominance-tabarena-v3-sharded
    paths:
      - '.github/workflows/data-science-dominance-cancel-dominated-v3.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel-dominated-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Prove decisive-fail parent and workflow-only activation
        run: |
          test "$(git rev-parse HEAD^)" = '4240a436abac11a951aaea387dabc8d855999ee6'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/data-science-dominance-cancel-dominated-v3.yml'
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('data_science_dominance/tabarena_portfolio_v3/DECISIVE_REGRESSION_FAIL_V3.json').read_text())
          assert proof['verdict'] == 'FAIL'
          assert proof['logic']['global_pass_possible'] is False
          assert proof['logic']['classification_tasks_can_change_gate'] is False
          assert proof['scope']['remaining_unscored_classification_task_needed_for_verdict'] is False
          PY
      - name: Cancel only the dominated run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/cristh99/notebooks/actions/runs/30980244322/cancel')
          cat response.txt || true
          case "$status" in
            202) echo 'dominated run cancellation accepted' ;;
            409) echo 'run had already reached a terminal state' ;;
            *) echo "unexpected cancellation status: $status"; exit 1 ;;
          esac
