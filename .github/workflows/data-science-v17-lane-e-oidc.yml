jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen Lane E package
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = cristh99/notebooks
          test "$GITHUB_REF" = refs/heads/agent/data-science-v17-lane-e-oidc-signature-v1
          mkdir -p "$EVIDENCE"
          printf '%s  %s\n' "$SOFTWARE_SHA256" "$COMPONENT/software.zip" | sha256sum -c -
          printf '%s  %s\n' "$ENVELOPE_SHA256" "$SUBJECT" | sha256sum -c -
          printf '%s  %s\n' "$POINTER_SHA256" "$POINTER" | sha256sum -c -
          python3 - "$COMPONENT/software.zip" "$COMPONENT" <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import sys
          archive, out = Path(sys.argv[1]), Path(sys.argv[2])
          expected = {'verify.py','test_verify.py','README.md','FREEZE.json','LOCAL_RESULT.json'}
          with ZipFile(archive) as z:
              names = z.namelist()
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit(f'bad ZIP members: {names}')
              if any(PurePosixPath(n).is_absolute() or '..' in PurePosixPath(n).parts or len(PurePosixPath(n).parts) != 1 for n in names):
                  raise SystemExit('unsafe ZIP path')
              z.extractall(out)
          PY
          (cd "$COMPONENT" && python3 -m unittest -v test_verify.py) |& tee "$EVIDENCE/tests.log"
          python3 "$COMPONENT/verify.py" --output "$EVIDENCE/local-receipt.json" | tee "$EVIDENCE/local-verification.log"
          printf '%s  %s\n' "$LOCAL_RECEIPT_SHA256" "$EVIDENCE/local-receipt.json" | sha256sum -c -
          cmp "$COMPONENT/LOCAL_RESULT.json" "$EVIDENCE/local-receipt.json"
