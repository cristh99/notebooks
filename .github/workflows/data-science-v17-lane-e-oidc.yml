name: Data Science v17 - Lane E independent OIDC signature

on:
  push:
    branches: [agent/data-science-v17-lane-e-oidc-signature-v1]
    paths:
      - .github/workflows/data-science-v17-lane-e-oidc.yml
      - data_science_pipeline_v17_lane_e_oidc/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: data-science-v17-lane-e-oidc-signature-v1
  cancel-in-progress: true

env:
  COMPONENT: data_science_pipeline_v17_lane_e_oidc
  SUBJECT: data_science_pipeline_v17_lane_e_oidc/LANE_E_SIGNATURE_ENVELOPE.json
  POINTER: data_science_pipeline_v17_lane_e_oidc/INSPECTION_RECEIPT_POINTER.json
  EVIDENCE: data-science-v17-lane-e-oidc-evidence
  COSIGN_VERSION: 3.0.6
  COSIGN_SHA256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
  ENVELOPE_SHA256: 64d86ad06aa5bf962ae8fc8fbf9c5c0a5fbbaccd8a7d4d26cc3413a56ff14aaf
  POINTER_SHA256: c3c87cb347a7d4c1a8062204dda2fd7c7b272dce1cc54a5e2d1482d669e364b0
  SOFTWARE_SHA256: 8a9d6d25fbe644e57cf576ceb16a8c890de5f845ec3643b527036d54f1fde075
  LOCAL_RECEIPT_SHA256: b9f45f9ef61f291930e4d66041313ec668dd238df67ab1ec07d176f4daf2f652
  CERT_ID: https://github.com/cristh99/notebooks/.github/workflows/data-science-v17-lane-e-oidc.yml@refs/heads/agent/data-science-v17-lane-e-oidc-signature-v1
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen Lane E package
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = cristh99/notebooks
          test "$GITHUB_REF" = refs/heads/agent/data-science-v17-lane-e-oidc-signature-v1
          mkdir -p "$EVIDENCE"
          printf '%s  %s\n' "$SOFTWARE_SHA256" "$COMPONENT/software.zip" | sha256sum -c -
          printf '%s  %s\n' "$ENVELOPE_SHA256" "$SUBJECT" | sha256sum -c -
          printf '%s  %s\n' "$POINTER_SHA256" "$POINTER" | sha256sum -c -
          python3 - "$COMPONENT/software.zip" "$COMPONENT" <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import sys
          archive, out = Path(sys.argv[1]), Path(sys.argv[2])
          expected = {'verify.py','test_verify.py','README.md','FREEZE.json','LOCAL_RESULT.json'}
          with ZipFile(archive) as z:
              names = z.namelist()
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit(f'bad ZIP members: {names}')
              if any(PurePosixPath(n).is_absolute() or '..' in PurePosixPath(n).parts or len(PurePosixPath(n).parts) != 1 for n in names):
                  raise SystemExit('unsafe ZIP path')
              z.extractall(out)
          PY
          (cd "$COMPONENT" && python3 -m unittest -v test_verify.py) |& tee "$EVIDENCE/tests.log"
          python3 "$COMPONENT/verify.py" --output "$EVIDENCE/local-receipt.json" | tee "$EVIDENCE/local-verification.log"
          printf '%s  %s\n' "$LOCAL_RECEIPT_SHA256" "$EVIDENCE/local-receipt.json" | sha256sum -c -
          cmp "$COMPONENT/LOCAL_RESULT.json" "$EVIDENCE/local-receipt.json"
          sha256sum "$SUBJECT" "$POINTER" "$COMPONENT"/{FREEZE.json,LOCAL_RESULT.json,README.md,verify.py,test_verify.py} > "$EVIDENCE/source-sha256.txt"

      - name: Install pinned Cosign
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o "$RUNNER_TEMP/cosign"
          printf '%s  %s\n' "$COSIGN_SHA256" "$RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"
          "$RUNNER_TEMP/cosign" version > "$EVIDENCE/cosign-version.txt"

      - name: Sign and verify exact workflow identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$token"
          "$RUNNER_TEMP/cosign" sign-blob --yes --identity-token "$token" --bundle "$EVIDENCE/lane-e.sigstore.json" "$SUBJECT" > "$EVIDENCE/sign.log" 2>&1
          unset token response
          "$RUNNER_TEMP/cosign" verify-blob "$SUBJECT" \
            --bundle "$EVIDENCE/lane-e.sigstore.json" \
            --certificate-identity "$CERT_ID" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME" \
            > "$EVIDENCE/verify.log" 2>&1
          grep -Fq 'Verified OK' "$EVIDENCE/verify.log"

      - name: Finalize bounded external receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE'])
          subject = Path(os.environ['SUBJECT'])
          pointer = Path(os.environ['POINTER'])
          bundle_path = root / 'lane-e.sigstore.json'
          bundle = json.loads(bundle_path.read_text())
          envelope = json.loads(subject.read_text())
          local_path = root / 'local-receipt.json'
          local = json.loads(local_path.read_text())
          verify_path = root / 'verify.log'
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          material = bundle.get('verificationMaterial', {})
          entries = material.get('tlogEntries', [])
          checks = {
              'bundle_media_type': str(bundle.get('mediaType', '')).startswith('application/vnd.dev.sigstore.bundle'),
              'verification_material': bool(material),
              'transparency_log': isinstance(entries, list) and len(entries) >= 1,
              'signed_content': bool(bundle.get('messageSignature') or bundle.get('dsseEnvelope')),
              'cosign_verified': 'Verified OK' in verify_path.read_text(),
              'envelope_hash': sha(subject) == os.environ['ENVELOPE_SHA256'],
              'pointer_hash': sha(pointer) == os.environ['POINTER_SHA256'],
              'local_receipt_hash': sha(local_path) == os.environ['LOCAL_RECEIPT_SHA256'],
              'local_verdict': local.get('verdict') == 'PASS_LANE_E_HASH_BINDING_SOFTWARE_ONLY',
              'exclusive_lane_e': envelope['scope']['exclusive_scope'] is True and envelope['scope']['does_not_touch_lane_m'] is True,
              'exact_bytes_not_claimed': local['exact_receipt_bytes_present'] is False,
              'stage08_blocked': envelope['governance']['stage08_unblocked'] is False,
          }
          if not all(checks.values()):
              raise SystemExit(checks)
          receipt = {
              'schema': 'data-science-pipeline/lane-e-independent-oidc-external-receipt/1',
              'verdict': 'PASS_LANE_E_OIDC_SIGSTORE_HASH_BINDING',
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'github_sha': os.environ['GITHUB_SHA'],
              'github_ref': os.environ['GITHUB_REF'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'envelope_sha256': sha(subject),
              'inspection_pointer_sha256': sha(pointer),
              'local_receipt_sha256': sha(local_path),
              'sigstore_bundle_sha256': sha(bundle_path),
              'cosign_verify_log_sha256': sha(verify_path),
              'cryptographic_checks': checks,
              'bindings': envelope['bindings'],
              'exact_field_result': envelope['exact_field_result'],
              'signature_scope': envelope['claim_boundary'],
              'exact_receipt_bytes_present': False,
              'independent_lane_e_signature_created': True,
              'independent_lane_m_signature_present': False,
              'external_cost_usd': 0.0,
              'production_modified': False,
              'scientific_promotion_credit': 0,
              'stage08_unblocked': False,
              'next_gate': 'attach_exact_operational_receipt_bytes_and_obtain_independent_lane_m_signature',
          }
          payload = json.dumps(receipt, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n'
          (root / 'external-receipt.json').write_text(payload)
          (root / 'external-receipt.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest() + '  external-receipt.json\n')
          PY

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-v17-lane-e-oidc
          path: data-science-v17-lane-e-oidc-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Enforce terminal receipt
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data-science-v17-lane-e-oidc-evidence/external-receipt.json')
          if not p.exists():
              raise SystemExit('external receipt missing')
          r = json.loads(p.read_text())
          assert r['verdict'] == 'PASS_LANE_E_OIDC_SIGSTORE_HASH_BINDING'
          assert all(r['cryptographic_checks'].values())
          assert r['independent_lane_e_signature_created'] is True
          assert r['independent_lane_m_signature_present'] is False
          assert r['exact_receipt_bytes_present'] is False
          assert r['stage08_unblocked'] is False
          print(r['verdict'])
          PY
