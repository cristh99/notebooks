name: Apply WildReceipt frozen-runtime closure v1

on:
  push:
    branches:
      - agent/ocr-consensus-detector-v4
    paths:
      - '.github/workflows/apply-wildreceipt-runtime-closure-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-wildreceipt-runtime-closure-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 20
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
      - name: Move to latest isolated branch head
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - name: Apply deterministic import-closure repair
        run: python .github/scripts/apply_wildreceipt_runtime_closure_v1.py
      - name: Install pinned test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            Pillow==12.2.0 \
            numpy==2.2.6 \
            opencv-python-headless==4.10.0.84 \
            scikit-learn==1.8.0 \
            scipy==1.17.1 \
            threadpoolctl==3.6.0 \
            joblib==1.5.3 \
            pyarrow==18.1.0 \
            pytesseract==0.3.13 \
            packaging==26.3
      - name: Prove declared transitive source closure
        run: |
          python -m unittest -v \
            ocr_real_risk_v1.test_wildreceipt_adapter \
            ocr_real_risk_v1.test_wildreceipt_external \
            ocr_real_risk_v1.test_numeric_consensus_candidate_v4_wildreceipt
          python -m compileall -q ocr_real_risk_v1
          python - <<'PY'
          from pathlib import Path
          from ocr_real_risk_v1.numeric_consensus_candidate_v4_wildreceipt import (
              CANDIDATE_ID,
              CANDIDATE_SCHEMA,
              SOURCE_FILES,
              external_protocol,
          )
          required = {
              'ocr_real_risk_v1/cord_detector_crops_v4.py',
              'ocr_real_risk_v1/coru_source_seal.py',
              'ocr_real_risk_v1/numeric_consensus_candidate_v4.py',
              'ocr_real_risk_v1/wildreceipt_source_seal.py',
          }
          assert CANDIDATE_SCHEMA.endswith('/7')
          assert CANDIDATE_ID.endswith('schema-v4')
          assert required <= set(SOURCE_FILES)
          assert all(Path(path).is_file() for path in SOURCE_FILES)
          protocol = external_protocol()
          assert protocol['runtime']['self_contained_source_bundle'] is True
          assert protocol['runtime']['neutral_workdir_import_required'] is True
          print({
              'candidate_id': CANDIDATE_ID,
              'candidate_schema': CANDIDATE_SCHEMA,
              'source_file_count': len(SOURCE_FILES),
              'added_import_closure': sorted(required),
          })
          PY
      - name: Commit runtime closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ocr_real_risk_v1/numeric_consensus_candidate_v4_wildreceipt.py \
            ocr_real_risk_v1/test_numeric_consensus_candidate_v4_wildreceipt.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Make WildReceipt frozen runtime self-contained'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
