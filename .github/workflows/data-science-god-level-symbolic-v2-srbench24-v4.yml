name: Data Science God-Level — source-aligned one-shot SRBench-24 symbolic V2 gate

on:
  push:
    branches:
      - agent/data-science-god-level-symbolic-v2-srbench
    paths:
      - '.github/workflows/data-science-god-level-symbolic-v2-srbench24-v4.yml'

permissions:
  contents: read

jobs:
  srbench24-symbolic-v2-source-aligned:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Prove workflow-only activation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = 'push'
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test "$(git rev-parse HEAD^)" = 'cf83c408a6e3a3ecc4f9ad61f61953a2d4653eaa'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/data-science-god-level-symbolic-v2-srbench24-v4.yml'
          echo "SRBENCH24_ACTIVATION_PARENT_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CPU environment
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'scipy==1.14.1' 'pandas==2.2.3' 'scikit-learn==1.5.2'
      - name: Execute frozen acquisition, tests, and one-shot evaluation
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
        shell: bash
        run: |
          set +e
          bash data_science_god_level/symbolic_discovery_v2/run_srbench24_v4.sh
          status=$?
          mkdir -p srbench24-logs
          echo "$status" > srbench24-logs/runner-exit-status.txt
          exit 0
      - name: Finalize immutable custody and verdict
        if: always()
        run: |
          python data_science_god_level/symbolic_discovery_v2/srbench24_ci.py finalize \
            --code-root data_science_god_level/symbolic_discovery_v2 \
            --logs-dir srbench24-logs
      - name: Upload complete immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-god-level-symbolic-v2-srbench24-v4
          retention-days: 90
          path: |
            data_science_god_level/symbolic_discovery_v2/**
            srbench24-logs/**
      - name: Enforce the one-shot external verdict
        if: always()
        run: |
          python data_science_god_level/symbolic_discovery_v2/srbench24_ci.py enforce \
            --code-root data_science_god_level/symbolic_discovery_v2 \
            --logs-dir srbench24-logs
