name: Data Science God-Level — one-shot official symbolic discovery gate

on:
  push:
    branches:
      - agent/data-science-god-level-symbolic-discovery-official
    paths:
      - '.github/workflows/data-science-god-level-symbolic-official.yml'

permissions:
  contents: read
  actions: read

jobs:
  official-symbolic-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove this is the single workflow-only post-freeze commit
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = 'push'
          test "${GITHUB_RUN_ATTEMPT}" = '1'
          test "$(git rev-parse HEAD^)" = '7f7413891468a60adcf6681502d7688490d1e410'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/data-science-god-level-symbolic-official.yml'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install the pinned CPU environment
        run: |
          mkdir -p public-proof symbolic-official-logs _logic_power_v10
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'scikit-learn==1.5.2'
          python -m pip freeze | sort > symbolic-official-logs/pip-freeze.txt

      - name: Require the immutable public PASS before official equations exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/cristh99/notebooks/actions/artifacts/8882124145/zip' \
            -o /tmp/symbolic-public-proof.zip
          echo 'cefa62a18317f60268d2c8bc285161fb034d6d264b02fa7d51855fb124f3ee9f  /tmp/symbolic-public-proof.zip' | sha256sum -c -
          unzip -q /tmp/symbolic-public-proof.zip -d public-proof
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('public-proof')
          receipt_path = root / 'symbolic-public-logs/public-freeze-receipt.json'
          report_path = root / 'symbolic-public-logs/public-report.json'
          static_path = root / 'symbolic-public-logs/static-audit.json'
          suite_path = root / 'symbolic-public-logs/suite-manifest.json'
          source_manifest = root / 'data_science_god_level/symbolic_discovery/SOURCE_MANIFEST.json'

          expected_hashes = {
              receipt_path: 'd28700bb8c27d37ee575b202be54a2c9a3c36f03c1c9ad6bb371f92eaca77381',
              report_path: '9559f5d1c27faddadc62a202be0b67138bfe7f7af3e9090f9fc62024c9f8fa55',
              static_path: '82fd79696377a0bb9cc318c9c136bf52bebaeaab1ebb4f6a380b8e2675a1d8e5',
              suite_path: 'a545144a3a1f7e2b33ec8486e691ed080496561ef16dd61660396837f3e714c6',
              source_manifest: '679973d8f1a5de408901e01a9696ce92e5c52c5a4aa808745a38e333e0cdde58',
          }
          for path, expected in expected_hashes.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == expected, (path, actual, expected)

          receipt = json.loads(receipt_path.read_text())
          assert receipt['verdict'] == 'PASS'
          assert receipt['candidate_truth_access'] is False
          assert receipt['official_equations_exist_before_freeze'] is False
          assert receipt['official_suite_accessed'] is False
          assert receipt['post_hoc_retuning_permitted_after_official_evaluation'] is False
          assert all(receipt['checks'].values())
          summary = receipt['summary']
          assert summary['task_count'] == 8
          assert summary['semantic_recoveries'] == 8
          assert summary['exact_recoveries'] == 6
          assert summary['wins_vs_best'] == 8
          assert abs(summary['candidate_mean_variable_f1'] - 1.0) < 1e-15
          assert abs(summary['candidate_mean_out_nrmse'] - 0.00582664321848216) < 1e-15
          assert abs(summary['mean_advantage_vs_best'] - 0.18491048969054996) < 1e-15

          proof = {
              'schema': 'data-science-god-level/symbolic-discovery-official-prerequisites/1',
              'public_run_id': 30883355171,
              'public_artifact_id': 8882124145,
              'public_artifact_sha256': hashlib.sha256(Path('/tmp/symbolic-public-proof.zip').read_bytes()).hexdigest(),
              'public_receipt_sha256': expected_hashes[receipt_path],
              'public_report_sha256': expected_hashes[report_path],
              'public_verdict': receipt['verdict'],
              'candidate_frozen_before_official_equations': True,
              'official_equations_existed_before_freeze': False,
              'actual_official_evaluation_count_authorized': 1,
          }
          Path('symbolic-official-logs/prerequisites.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY

      - name: Reconstruct and re-audit the exact frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          root='data_science_god_level/symbolic_discovery'
          echo '679973d8f1a5de408901e01a9696ce92e5c52c5a4aa808745a38e333e0cdde58  data_science_god_level/symbolic_discovery/SOURCE_MANIFEST.json' | sha256sum -c -
          echo '6344ca2a918636817c4983207289e1515fecd1b851f4c4fede6cbbb9c9be0f4b  data_science_god_level/symbolic_discovery/symbolic_code.tar.gz.b64' | sha256sum -c -
          base64 -d "$root/symbolic_code.tar.gz.b64" > /tmp/symbolic_code.tar.gz
          echo '026919c635f6f04d082d3b2a74276fef150a331dcceeea461be1e3553ae9d027  /tmp/symbolic_code.tar.gz' | sha256sum -c -
          tar xzf /tmp/symbolic_code.tar.gz -C "$root"
          echo '97c9fd1a3f371ca30bd29b924ac0e6d1ea21d985e513df8b5de977f0a70be381  data_science_god_level/symbolic_discovery/estimator.py' | sha256sum -c -
          echo '6a0077eb961f2617182ed35cf1cf56e21999dfb5a93db24bec181b47af27d10d  data_science_god_level/symbolic_discovery/suite.py' | sha256sum -c -
          echo 'd070e71bd4900f9172a7432c14008a2de2aa88ea415d9d2b699cbad71eec3325  data_science_god_level/symbolic_discovery/benchmark.py' | sha256sum -c -
          echo 'e0b33d6a52145c9a6933d20fe320a12cc92660df982642743eaf1e8fed543e0a  data_science_god_level/symbolic_discovery/test_estimator.py' | sha256sum -c -
          echo '02b4f0ba2e847ae9f4837e2ae484f3049bb767834a729be69ff5a7d0e9557ae6  data_science_god_level/symbolic_discovery/logic_plan.py' | sha256sum -c -
          echo 'a4ea808ac30dcb5af55d9392be6b5cb4eaeb860bc620ad9b58751bb08a5629cc  data_science_god_level/symbolic_discovery/official_runner.py' | sha256sum -c -
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          root = Path('data_science_god_level/symbolic_discovery')
          tree = ast.parse((root / 'estimator.py').read_text(encoding='utf-8'))
          imports, calls, names = set(), set(), set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.level == 0:
                  imports.add((node.module or '').split('.')[0])
              elif isinstance(node, ast.Call):
                  if isinstance(node.func, ast.Name):
                      calls.add(node.func.id)
                  elif isinstance(node.func, ast.Attribute):
                      calls.add(node.func.attr)
              elif isinstance(node, ast.Name):
                  names.add(node.id)
              elif isinstance(node, ast.Attribute):
                  names.add(node.attr)
          assert not (imports - {'__future__', 'dataclasses', 'typing', 'numpy'})
          assert not (calls & {'open', 'eval', 'exec', 'compile', '__import__', 'system', 'popen', 'run', 'urlopen', 'request', 'read_csv', 'read_json', 'load'})
          assert not (names & {'Path', 'dataset_name', 'filename', 'truth', 'labels', 'requests', 'socket', 'subprocess', 'pandas'})

          public_root = Path('public-proof/data_science_god_level/symbolic_discovery')
          names_to_verify = ['estimator.py', 'suite.py', 'benchmark.py', 'test_estimator.py', 'logic_plan.py', 'official_runner.py']
          hashes = {}
          for name in names_to_verify:
              local_hash = hashlib.sha256((root / name).read_bytes()).hexdigest()
              public_hash = hashlib.sha256((public_root / name).read_bytes()).hexdigest()
              assert local_hash == public_hash
              hashes[name] = local_hash
          audit = {
              'schema': 'data-science-god-level/symbolic-discovery-official-static-audit/1',
              'hashes': hashes,
              'candidate_truth_access': False,
              'candidate_dataset_identifier_access': False,
              'candidate_filesystem_network_process_access': False,
              'candidate_frozen_before_official_equations': True,
              'official_equations_created_yet': False,
          }
          Path('symbolic-official-logs/static-audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY

      - name: Replay original Logic Power v10 and structural tests
        shell: bash
        run: |
          set -euo pipefail
          cat logic_power_v10_capsule/parts/part_00.b64 \
              logic_power_v10_capsule/parts/part_01.b64 \
              logic_power_v10_capsule/parts/part_02.b64 \
              logic_power_v10_capsule/parts/part_03.b64 \
              logic_power_v10_capsule/parts/part_04.b64 \
              logic_power_v10_capsule/parts/part_05_00.b64 \
              logic_power_v10_capsule/parts/part_05_01.b64 \
              logic_power_v10_capsule/parts/part_05_02.b64 > /tmp/lp.b64
          echo '3548f31fcaa9696eabb063023c905fbb04a2b3db73c96df9f9ee8bc8e0c64fc1  /tmp/lp.b64' | sha256sum -c -
          base64 -d /tmp/lp.b64 > /tmp/lp.tar.gz
          echo 'ad2c363afb3fe20aa093565f278c690d423611e8270e9ad9b1491dbbdf218c31  /tmp/lp.tar.gz' | sha256sum -c -
          tar xzf /tmp/lp.tar.gz -C _logic_power_v10
          (cd _logic_power_v10 && sha256sum -c SOURCE_SHA256SUMS && test "$(cat PRIVATE_HEAD_SHA.txt)" = 'ba10d0edc7eb20d499d0481fda2537e782b6efb2')
          (cd data_science_god_level/symbolic_discovery && PYTHONPATH="${GITHUB_WORKSPACE}/_logic_power_v10" python logic_plan.py)
          echo 'b03483478d5bb04f5006341eb5b789cf09e73633846a110859d925a968f6b043  data_science_god_level/symbolic_discovery/logic-plan-receipt.json' | sha256sum -c -
          (cd data_science_god_level/symbolic_discovery && python -m unittest -v test_estimator.py) \
            2>&1 | tee symbolic-official-logs/unit-tests.txt

      - name: Create the official equations and evaluate exactly once
        env:
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
        shell: bash
        run: |
          set +e
          test "${GITHUB_RUN_ATTEMPT}" = '1' || exit 99
          cd data_science_god_level/symbolic_discovery
          python official_runner.py \
            --public-artifact-sha256 'cefa62a18317f60268d2c8bc285161fb034d6d264b02fa7d51855fb124f3ee9f' \
            --public-run-id 30883355171 \
            --public-artifact-id 8882124145 \
            --code-root "${GITHUB_WORKSPACE}/data_science_god_level/symbolic_discovery" \
            --logs-dir "${GITHUB_WORKSPACE}/symbolic-official-logs" \
            2>&1 | tee "${GITHUB_WORKSPACE}/symbolic-official-logs/runner-output.txt"
          status=${PIPESTATUS[0]}
          echo "$status" > "${GITHUB_WORKSPACE}/symbolic-official-logs/runner-exit-status.txt"
          exit 0

      - name: Upload immutable official evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-science-god-level-symbolic-official
          retention-days: 90
          path: |
            data_science_god_level/symbolic_discovery/SOURCE_MANIFEST.json
            data_science_god_level/symbolic_discovery/symbolic_code.tar.gz.b64
            data_science_god_level/symbolic_discovery/estimator.py
            data_science_god_level/symbolic_discovery/suite.py
            data_science_god_level/symbolic_discovery/benchmark.py
            data_science_god_level/symbolic_discovery/test_estimator.py
            data_science_god_level/symbolic_discovery/logic_plan.py
            data_science_god_level/symbolic_discovery/logic-plan-receipt.json
            data_science_god_level/symbolic_discovery/official_runner.py
            public-proof/symbolic-public-logs/public-freeze-receipt.json
            public-proof/symbolic-public-logs/public-freeze-receipt.sha256
            public-proof/symbolic-public-logs/public-report.json
            public-proof/symbolic-public-logs/static-audit.json
            public-proof/symbolic-public-logs/suite-manifest.json
            symbolic-official-logs/**

      - name: Enforce the one-shot official verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          logs = Path('symbolic-official-logs')
          receipt_path = logs / 'official-freeze-receipt.json'
          status_path = logs / 'runner-exit-status.txt'
          if not receipt_path.exists() or not status_path.exists():
              raise SystemExit('official symbolic evaluation is invalid or incomplete')
          receipt = json.loads(receipt_path.read_text())
          status = int(status_path.read_text().strip())
          if receipt['actual_official_evaluation_count'] != 1:
              raise SystemExit('official evaluation count is not exactly one')
          if receipt['candidate_frozen_before_official_equations'] is not True:
              raise SystemExit('candidate was not frozen before official equations')
          if receipt['candidate_truth_access'] is not False:
              raise SystemExit('candidate accessed hidden truth')
          if receipt['post_hoc_retuning_permitted'] is not False:
              raise SystemExit('post-hoc retuning was not prohibited')
          if receipt['verdict'] == 'PASS' and status != 0:
              raise SystemExit('PASS receipt conflicts with runner status')
          if receipt['verdict'] == 'FAIL' and status == 0:
              raise SystemExit('FAIL receipt conflicts with runner status')
          if receipt['verdict'] != 'PASS':
              raise SystemExit(f"official symbolic gate: {receipt['verdict']}; evidence preserved; no retuning")
          print('official symbolic gate: PASS; equations recovered prospectively; no retuning permitted')
          PY
