name: Data Science dominance — BookReview V1 synthetic freeze gate

on:
  push:
    branches:
      - agent/data-science-dominance-dab-bookreview-v1
    paths:
      - .github/workflows/data-science-dominance-dab-bookreview-v1-synthetic.yml

permissions:
  contents: read

env:
  ROOT: data_science_dominance/dab_bookreview_v1

jobs:
  synthetic-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove workflow-only activation after frozen source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$(git rev-parse HEAD^)" = c48132bf0271775fa891b419d96ec24133627d16
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/data-science-dominance-dab-bookreview-v1-synthetic.yml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reconstruct exact transparent candidate
        shell: bash
        run: |
          set -euo pipefail
          bash "$ROOT/reconstruct.sh"

      - name: Enforce static isolation before held-out access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          root = Path('data_science_dominance/dab_bookreview_v1')
          source_path = root / 'bookreview_engine.py'
          test_path = root / 'test_bookreview_engine.py'
          source = source_path.read_text(encoding='utf-8')
          lowered = source.lower()
          for forbidden in ('query2','query3','ground_truth','validate.py'):
              assert forbidden not in lowered, forbidden
          tree = ast.parse(source)
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import): imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module: imports.add(node.module.split('.')[0])
          assert not imports.intersection({'requests','httpx','urllib','socket','subprocess'})
          audit = {
              'schema':'data-science-dominance/bookreview-v1-runtime-audit/1',
              'candidate_sha256':hashlib.sha256(source_path.read_bytes()).hexdigest(),
              'tests_sha256':hashlib.sha256(test_path.read_bytes()).hexdigest(),
              'held_out_query_content_accessed':False,
              'validators_executed':False,
              'ground_truth_accessed':False,
              'official_dataset_values_accessed':False,
          }
          Path('bookreview-runtime-audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps(audit,indent=2,sort_keys=True))
          PY

      - name: Run BookReview synthetic battery
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python -m unittest -v test_bookreview_engine.py 2>&1 | tee "${GITHUB_WORKSPACE}/bookreview-synthetic-tests.log"

      - name: Seal synthetic receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('data_science_dominance/dab_bookreview_v1')
          log=Path('bookreview-synthetic-tests.log')
          text=log.read_text() if log.exists() else ''
          passed='\nOK\n' in ('\n'+text+'\n') and 'Ran 12 tests' in text
          receipt={
              'schema':'data-science-dominance/bookreview-v1-synthetic-receipt/1',
              'verdict':'PASS' if passed else 'FAIL',
              'github_run_id':int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'github_sha':os.environ['GITHUB_SHA'],
              'candidate_sha256':hashlib.sha256((root/'bookreview_engine.py').read_bytes()).hexdigest(),
              'tests_sha256':hashlib.sha256((root/'test_bookreview_engine.py').read_bytes()).hexdigest(),
              'freeze_sha256':hashlib.sha256((root/'FREEZE.json').read_bytes()).hexdigest(),
              'held_out_query_content_accessed':False,
              'validators_executed':False,
              'ground_truth_accessed':False,
              'official_dataset_values_accessed':False,
              'post_hoc_retuning_permitted':False,
          }
          payload=json.dumps(receipt,indent=2,sort_keys=True)+'\n'
          Path('bookreview-synthetic-receipt.json').write_text(payload)
          Path('bookreview-synthetic-receipt.sha256').write_text(hashlib.sha256(payload.encode()).hexdigest()+'  bookreview-synthetic-receipt.json\n')
          print(payload)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bookreview-v1-synthetic
          retention-days: 90
          if-no-files-found: error
          path: |
            data_science_dominance/dab_bookreview_v1/**
            bookreview-runtime-audit.json
            bookreview-synthetic-tests.log
            bookreview-synthetic-receipt.json
            bookreview-synthetic-receipt.sha256

      - name: Enforce BookReview synthetic gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('bookreview-synthetic-receipt.json').read_text())
          if receipt['verdict']!='PASS': raise SystemExit('BookReview V1 synthetic gate failed')
          print('BookReview V1 synthetic gate: PASS')
          PY
